<script>
"use strict";
// ============================================================ Tank Tussle
// Two players, one iPad, held between you in landscape. Each end of the
// screen is a player's control strip: one thumb down drives, a tap with
// another finger fires. Shells bounce off steel, bricks break, power-ups
// drop in. First to five hits takes the round. A robot fills in for player
// two when nobody else is around. Sophia, Rory and Dylan Games, Inc.
document.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const cv=document.getElementById("c"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1;function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;layout()}
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967296}
const store={get(k,d){try{const v=localStorage.getItem("tanktussle."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("tanktussle."+k,JSON.stringify(v))}catch(e){}}};
// ---------------------------------------------------------------- audio
let AC=null,master=null;function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination)}catch(e){}}
function tone(f0,f1,dur,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02)}
function noise(dur,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*0.6+(Math.random()*2-1)*0.4;d[i]=l*(1-i/n)}const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start(t)}
const SFX={fire(){tone(400,120,0.12,"square",0.18);noise(0.08,0.2)},bounce(){tone(900,500,0.06,"square",0.1)},brick(){noise(0.12,0.25);tone(200,80,0.1,"triangle",0.2)},
 boom(){tone(160,40,0.4,"sawtooth",0.35);noise(0.35,0.4)},pick(){[880,1175,1568].forEach((f,i)=>tone(f,f,0.08,"triangle",0.15,i*0.06))},shield(){tone(600,1400,0.15,"sine",0.15)},
 mine(){tone(1200,1200,0.05,"square",0.1)},count(){tone(660,660,0.1,"square",0.15)},go(){tone(880,1320,0.25,"square",0.2)},
 win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f,0.16,"square",0.18,i*0.11))},click(){tone(1200,900,0.04,"square",0.08)},honk(){tone(300,300,0.2,"sawtooth",0.15)}};
// ---------------------------------------------------------------- layout
let strip=0,ar={x:0,y:0,w:0,h:0},C=13,R=19,cell=40;
function layout(){strip=Math.floor(W*0.25);const aw=W-strip*2-24,ah=H-28;cell=Math.floor(aw/C);let rows=Math.floor(ah/cell);if(rows%2===0)rows--;R=clamp(rows,11,23);cell=Math.min(cell,Math.floor(ah/R));ar.w=C*cell;ar.h=R*cell;ar.x=Math.floor((W-ar.w)/2);ar.y=Math.floor((H-ar.h)/2);}
window.addEventListener("resize",resize);
// ---------------------------------------------------------------- state
const COLS=[{main:"#e04040",dark:"#8a2020",light:"#ff8080",name:"RED"},{main:"#3070e0",dark:"#1a3a8a",light:"#80b0ff",name:"BLUE"}];
let scene="title",mode="2p",botLevel=1,grid=[],hp=[],tanks=[],shells=[],mines=[],pickups=[],parts=[],marks=[],round=1,wins=[0,0],roundT=0,countdown=0,banner="",bannerT=0,pickT=0,shake=0,frameT=0,tPrev=0,winner=-1,matchOver=false;
const TARGET=5,ROUND_LEN=90,ROUNDS_TO_WIN=2;
const PW={triple:{name:"TRIPLE",col:"#ffd040",dur:10},speed:{name:"SPEED",col:"#60ff80",dur:10},shield:{name:"SHIELD",col:"#60d0ff",dur:0},big:{name:"BIG SHOT",col:"#ff80ff",dur:0},mine:{name:"MINE",col:"#ff8040",dur:0}};
function newMap(){for(let tries=0;tries<50;tries++){grid=[];hp=[];for(let y=0;y<R;y++){grid.push([]);hp.push([]);for(let x=0;x<C;x++){let v=0;if(x===0||y===0||x===C-1||y===R-1)v=2;else{const mx=Math.min(x,C-1-x);const h=hash(mx*7+round*131,y*13+round*17+tries*3);if(h<0.13)v=1;else if(h<0.18)v=2;if(y===Math.floor(R/2)||x===Math.floor(C/2))v=h<0.06?1:0;}grid[y].push(v);hp[y].push(v===1?2:0);}}
  // Clear spawns and the middle lane a little.
  const sy=Math.floor(R/2);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){grid[sy+dy][1+dx]=grid[sy+dy][C-2+dx]=0;}
  grid[sy][Math.floor(C/2)]=0;
  if(reachable(1,sy,C-2,sy))return;}
}
function reachable(x0,y0,x1,y1){const seen=new Set([x0+","+y0]);const q=[[x0,y0]];while(q.length){const [x,y]=q.shift();if(x===x1&&y===y1)return true;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=C||ny>=R)continue;if(grid[ny][nx]===2)continue;const k=nx+","+ny;if(!seen.has(k)){seen.add(k);q.push([nx,ny])}}}return false}
function mkTank(i){const sy=Math.floor(R/2)+0.5;return {id:i,x:i===0?1.5:C-1.5,y:sy,a:i===0?0:Math.PI,aim:i===0?0:Math.PI,alive:true,respawn:0,shield:0,power:{},bigShots:0,mines:0,cool:0,score:0,track:0,stick:{x:0,y:0},fireReq:false,bot:false,botT:0,botDir:0,flash:0}}
function startMatch(m,lvl){mode=m;botLevel=lvl||1;wins=[0,0];round=1;matchOver=false;startRound();}
function startRound(){newMap();tanks=[mkTank(0),mkTank(1)];if(mode==="bot")tanks[1].bot=true;shells=[];mines=[];pickups=[];parts=[];marks=[];roundT=ROUND_LEN;countdown=3.2;pickT=4;scene="play";banner="";winner=-1;}
function respawn(t){const sy=Math.floor(R/2)+0.5;t.x=t.id===0?1.5:C-1.5;t.y=sy;t.a=t.aim=t.id===0?0:Math.PI;t.alive=true;t.shield=2.0;t.power={};t.bigShots=0;t.mines=0;
 // clear the spawn cell area in case bricks grew back (they don't) and shove the other tank away
 const o=tanks[1-t.id];if(o.alive&&Math.hypot(o.x-t.x,o.y-t.y)<1.5){o.x+=o.id===0?-1.5:1.5}}
// ---------------------------------------------------------------- input
const keys={};window.addEventListener("keydown",e=>{keys[e.code]=true;if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].includes(e.code))e.preventDefault();onKey(e.code)});window.addEventListener("keyup",e=>keys[e.code]=false);
const fingers={}; // id -> {p, sx,sy, isStick}
let buttons=[];
function btn(x,y,w,h,label,cb,opt){buttons.push({x,y,w,h,label,cb,opt:opt||{}})}
function uiTap(p){for(const b of buttons){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){SFX.click();b.cb();return true}}return false}
function sideOf(x){return x<W/2?0:1}
function tdown(id,x,y){audioInit();if(uiTap({x,y}))return;if(scene!=="play")return;const p=sideOf(x);if(mode==="bot"&&p===1)return;let hasStick=false;for(const k in fingers)if(fingers[k].p===p&&fingers[k].stick)hasStick=true;
 if(!hasStick){fingers[id]={p,stick:true,sx:x,sy:y,x,y};}else{fingers[id]={p,stick:false};tanks[p].fireReq=true;}}
function tmove(id,x,y){const f=fingers[id];if(f&&f.stick){f.x=x;f.y=y}}
function tup(id){delete fingers[id]}
cv.addEventListener("touchstart",e=>{for(const t of e.changedTouches)tdown(t.identifier,t.clientX,t.clientY)},{passive:false});
cv.addEventListener("touchmove",e=>{for(const t of e.changedTouches)tmove(t.identifier,t.clientX,t.clientY)},{passive:false});
cv.addEventListener("touchend",e=>{for(const t of e.changedTouches)tup(t.identifier)});cv.addEventListener("touchcancel",e=>{for(const t of e.changedTouches)tup(t.identifier)});
let mdown=false;cv.addEventListener("mousedown",e=>{mdown=true;tdown("m",e.clientX,e.clientY)});window.addEventListener("mousemove",e=>{if(mdown)tmove("m",e.clientX,e.clientY)});window.addEventListener("mouseup",()=>{mdown=false;tup("m")});
function readSticks(){for(const t of tanks){let x=0,y=0;if(t.id===0){if(keys.KeyA)x-=1;if(keys.KeyD)x+=1;if(keys.KeyW)y-=1;if(keys.KeyS)y+=1;if(keys.Space||keys.KeyF)t.fireReq=true;}else if(!t.bot){if(keys.ArrowLeft)x-=1;if(keys.ArrowRight)x+=1;if(keys.ArrowUp)y-=1;if(keys.ArrowDown)y+=1;if(keys.Enter||keys.ShiftRight||keys.Slash)t.fireReq=true;}
 for(const k in fingers){const f=fingers[k];if(f.p===t.id&&f.stick){const dx=f.x-f.sx,dy=f.y-f.sy,d=Math.hypot(dx,dy);if(d>8){const m=Math.min(d,56)/56;x=dx/d*m;y=dy/d*m}}}
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}t.stick.x=x;t.stick.y=y;}}
// ---------------------------------------------------------------- physics
function solid(cxp,cyp){if(cxp<0||cyp<0||cxp>=C||cyp>=R)return 2;return grid[cyp][cxp]}
function moveCircle(o,r,nx,ny){ // slide against wall cells
 o.x=nx;if(hitWall(o.x,o.y,r)){o.x=Math.round(o.x-Math.sign(nx-o.x)*0)  ;o.x=resolveX(o,r,nx)}
 o.y=ny;if(hitWall(o.x,o.y,r)){o.y=resolveY(o,r,ny)}}
function hitWall(x,y,r){const x0=Math.floor(x-r),x1=Math.floor(x+r),y0=Math.floor(y-r),y1=Math.floor(y+r);for(let cy=y0;cy<=y1;cy++)for(let cxp=x0;cxp<=x1;cxp++){if(solid(cxp,cy)){const px=clamp(x,cxp,cxp+1),py=clamp(y,cy,cy+1);if((x-px)**2+(y-py)**2<r*r)return true}}return false}
function resolveX(o,r,nx){const step=0.02;let x=nx;const dir=Math.sign(o.px-nx)||1;for(let i=0;i<60;i++){if(!hitWall(x,o.y,r))return x;x+=dir*step}return o.px}
function resolveY(o,r,ny){const step=0.02;let y=ny;const dir=Math.sign(o.py-ny)||1;for(let i=0;i<60;i++){if(!hitWall(o.x,y,r))return y;y+=dir*step}return o.py}
function fire(t){if(!t.alive||t.cool>0||countdown>0)return;t.cool=t.power.triple>0?0.32:0.45;const n=t.power.triple>0?3:1;const big=t.bigShots>0;if(big)t.bigShots--;
 for(let i=0;i<n;i++){const a=t.aim+(i-(n-1)/2)*0.22;const sp=big?7:9.5;shells.push({x:t.x+Math.cos(t.aim)*0.55,y:t.y+Math.sin(t.aim)*0.55,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:big?0.2:0.11,b:0,owner:t.id,life:4,big,trail:[]});}
 parts.push({k:"flash",x:t.x+Math.cos(t.aim)*0.6,y:t.y+Math.sin(t.aim)*0.6,life:0.08});SFX.fire();shake=Math.max(shake,0.15);}
function explodeAt(x,y,col){for(let i=0;i<26;i++)parts.push({k:"dot",x,y,vx:rnd(-6,6),vy:rnd(-6,6),life:rnd(0.3,0.8),col:i%3?col:"#ffd040",r:rnd(0.05,0.14)});parts.push({k:"ring",x,y,life:0.4});SFX.boom();shake=1;}
function killTank(t,by){if(!t.alive)return;if(t.shield>0){t.shield=0;SFX.shield();parts.push({k:"ring",x:t.x,y:t.y,life:0.3,col:"#60d0ff"});return}
 t.alive=false;t.respawn=1.6;explodeAt(t.x,t.y,COLS[t.id].main);if(by!==t.id){tanks[by].score++;}else{t.score=Math.max(0,t.score-1);banner="OWN GOAL!";bannerT=1.2;}
 if(tanks[by].score>=TARGET&&by!==t.id)endRound(by);}
function endRound(w){winner=w;wins[w]++;scene="roundover";SFX.win();bannerT=0;if(wins[w]>=ROUNDS_TO_WIN)matchOver=true;}
function update(dt){
 readSticks();
 if(countdown>0){const before=Math.ceil(countdown);countdown-=dt;const after=Math.ceil(countdown);if(after<before){if(countdown<=0)SFX.go();else SFX.count()}for(const t of tanks)t.fireReq=false;return}
 roundT-=dt;if(roundT<=0){const a=tanks[0].score,b=tanks[1].score;if(a!==b){endRound(a>b?0:1);return}else{roundT=15;banner="SUDDEN DEATH!";bannerT=2}}
 pickT-=dt;if(pickT<=0&&pickups.length<3){pickT=6;for(let tries=0;tries<40;tries++){const x=rint(1,C-2),y=rint(1,R-2);if(grid[y][x]===0&&!pickups.some(p=>p.x===x&&p.y===y)&&Math.abs(x-1)+Math.abs(y-Math.floor(R/2))>2&&Math.abs(x-(C-2))+Math.abs(y-Math.floor(R/2))>2){const keys2=Object.keys(PW);pickups.push({x,y,k:keys2[rint(0,keys2.length-1)],t:0});break}}}
 for(const t of tanks){
  if(!t.alive){t.respawn-=dt;if(t.respawn<=0)respawn(t);continue}
  if(t.bot)botThink(t,dt);
  t.cool=Math.max(0,t.cool-dt);t.shield=Math.max(0,t.shield-dt);for(const k in t.power)t.power[k]=Math.max(0,t.power[k]-dt);
  const sp=(t.power.speed>0?5.2:3.6);const sx=t.stick.x,sy=t.stick.y,l=Math.hypot(sx,sy);
  if(l>0.1){const want=Math.atan2(sy,sx);let d=want-t.a;d=Math.atan2(Math.sin(d),Math.cos(d));t.a+=clamp(d,-1,1)*Math.min(1,dt*9);t.aim=t.a;
   t.px=t.x;t.py=t.y;const nx=t.x+sx*sp*dt,ny=t.y+sy*sp*dt;moveCircle(t,0.36,nx,ny);t.track+=Math.hypot(t.x-t.px,t.y-t.py);
   if(Math.floor(t.track*3)!==Math.floor((t.track-0.05)*3))marks.push({x:t.x,y:t.y,a:t.a,life:3});}
  // tank vs tank
  const o=tanks[1-t.id];if(o.alive){const dx=o.x-t.x,dy=o.y-t.y,d=Math.hypot(dx,dy);if(d<0.74&&d>0){const push=(0.74-d)/2;t.x-=dx/d*push;t.y-=dy/d*push;o.x+=dx/d*push;o.y+=dy/d*push}}
  // pickups
  for(const p of pickups){if(!p.dead&&Math.hypot(p.x+0.5-t.x,p.y+0.5-t.y)<0.6){p.dead=true;SFX.pick();applyPower(t,p.k)}}
  if(t.fireReq){t.fireReq=false;if(t.mines>0&&t.power.mineMode){}fire(t);}
 }
 pickups=pickups.filter(p=>!p.dead);
 for(const s of shells){s.life-=dt;s.trail.push({x:s.x,y:s.y});if(s.trail.length>6)s.trail.shift();
  let nx=s.x+s.vx*dt,ny=s.y+s.vy*dt;
  // walls: check x then y
  const cxp=Math.floor(nx),cy0=Math.floor(s.y);if(solid(cxp,cy0)){if(shellWall(s,cxp,cy0)){s.vx=-s.vx;nx=s.x;}else{s.life=0}}
  const cxx=Math.floor(nx),cy=Math.floor(ny);if(s.life>0&&solid(cxx,cy)){if(shellWall(s,cxx,cy)){s.vy=-s.vy;ny=s.y;}else{s.life=0}}
  s.x=nx;s.y=ny;
  if(s.life<=0)continue;
  for(const t of tanks){if(!t.alive)continue;if(t.id===s.owner&&s.b===0&&s.life>3.7)continue;if(Math.hypot(t.x-s.x,t.y-s.y)<0.42+s.r){s.life=0;killTank(t,s.owner);break}}
  for(const m of mines){if(!m.dead&&Math.hypot(m.x-s.x,m.y-s.y)<0.4){m.dead=true;s.life=0;blowMine(m);}}
 }
 shells=shells.filter(s=>s.life>0);
 for(const m of mines){m.t+=dt;if(m.dead)continue;if(m.t>1){for(const t of tanks){if(t.alive&&Math.hypot(t.x-m.x,t.y-m.y)<0.55){m.dead=true;blowMine(m);break}}}}
 mines=mines.filter(m=>!m.dead);
 for(const p of parts){p.life-=dt;if(p.k==="dot"){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9}}parts=parts.filter(p=>p.life>0);
 for(const m of marks)m.life-=dt;marks=marks.filter(m=>m.life>0);if(marks.length>300)marks.splice(0,marks.length-300);
 shake=Math.max(0,shake-dt*3);bannerT=Math.max(0,bannerT-dt);
}
function shellWall(s,cxp,cy){ // returns true if it bounces (steel), false if absorbed
 const v=grid[cy][cxp];if(v===2){s.b++;if(s.b>3){s.life=0;return false}SFX.bounce();return true}
 if(v===1){hp[cy][cxp]-=s.big?2:1;parts.push({k:"dust",x:cxp+0.5,y:cy+0.5,life:0.3});if(hp[cy][cxp]<=0){grid[cy][cxp]=0;for(let i=0;i<8;i++)parts.push({k:"dot",x:cxp+0.5,y:cy+0.5,vx:rnd(-4,4),vy:rnd(-4,4),life:0.5,col:"#b0503a",r:0.08});}SFX.brick();if(s.big){s.big=false;return false}return false}
 return false}
function blowMine(m){explodeAt(m.x,m.y,"#ff8040");for(const t of tanks){if(t.alive&&Math.hypot(t.x-m.x,t.y-m.y)<1.3)killTank(t,m.owner);}for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const cxp=Math.floor(m.x)+dx,cy=Math.floor(m.y)+dy;if(cxp>0&&cy>0&&cxp<C-1&&cy<R-1&&grid[cy][cxp]===1)grid[cy][cxp]=0;}}
function applyPower(t,k){banner=COLS[t.id].name+": "+PW[k].name;bannerT=1.2;if(k==="shield")t.shield=99;else if(k==="big")t.bigShots=3;else if(k==="mine"){mines.push({x:t.x-Math.cos(t.a)*0.7,y:t.y-Math.sin(t.a)*0.7,t:0,owner:t.id});SFX.mine()}else t.power[k]=PW[k].dur;}
// ---------------------------------------------------------------- bot
function los(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*4);for(let i=1;i<n;i++){const t=i/n;if(solid(Math.floor(lerp(x0,x1,t)),Math.floor(lerp(y0,y1,t))))return false}return true}
function bfsPath(x0,y0,x1,y1){const key=(x,y)=>x+y*C;const prev=new Map();prev.set(key(x0,y0),-1);const q=[[x0,y0]];let found=false;while(q.length){const [x,y]=q.shift();if(x===x1&&y===y1){found=true;break}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=C||ny>=R)continue;if(grid[ny][nx]!==0)continue;const k=key(nx,ny);if(!prev.has(k)){prev.set(k,key(x,y));q.push([nx,ny])}}}
 if(!found)return null;const path=[];let k=key(x1,y1);while(k!==-1&&k!==key(x0,y0)){path.push([k%C,Math.floor(k/C)]);k=prev.get(k)}return path.reverse();}
function botThink(t,dt){const me=tanks[1];const p=tanks[0];t.botT-=dt;
 // dodge shells heading our way
 let dodge=null;for(const s of shells){if(s.owner===t.id&&s.b===0)continue;const dx=t.x-s.x,dy=t.y-s.y;const sv=Math.hypot(s.vx,s.vy);const along=(dx*s.vx+dy*s.vy)/sv;if(along>0&&along<3){const perp=Math.abs(dx*s.vy-dy*s.vx)/sv;if(perp<0.9){dodge={x:s.vy/sv,y:-s.vx/sv};if((dx*s.vy-dy*s.vx)<0){dodge.x=-dodge.x;dodge.y=-dodge.y}}}}
 if(t.botT<=0){t.botT=rnd(0.4,0.9);let tx,ty;let best=null,bd=1e9;for(const pk of pickups){const d=Math.hypot(pk.x+0.5-t.x,pk.y+0.5-t.y);if(d<bd){bd=d;best=pk}}

 // track marks
 for(const m of marks){cx.save();cx.translate(ax(m.x),ay(m.y));cx.rotate(m.a);cx.fillStyle="rgba(0,0,0,"+(m.life/3*0.25)+")";cx.fillRect(-cell*0.1,-cell*0.32,cell*0.2,cell*0.1);cx.fillRect(-cell*0.1,cell*0.22,cell*0.2,cell*0.1);cx.restore();}
 // mines

 // pickups
 for(const p of pickups){const d=PW[p.k];cx.save();cx.translate(ax(p.x+0.5),ay(p.y+0.5)+Math.sin(frameT*4+p.x)*3);cx.fillStyle=d.col;rr(-cell*0.36,-cell*0.36,cell*0.72,cell*0.72,6);cx.fill();cx.strokeStyle="#fff";cx.lineWidth=2;cx.stroke();text(p.k==="triple"?"3":p.k==="speed"?"»":p.k==="shield"?"◯":p.k==="big"?"●":"✱",0,1,cell*0.42,"#222");cx.restore();}
 // tanks
 for(const t of tanks){if(!t.alive)continue;const c=COLS[t.id];cx.save();cx.translate(ax(t.x),ay(t.y));

  cx.rotate(t.a);cx.fillStyle="#222";cx.fillRect(-cell*0.38,-cell*0.42,cell*0.76,cell*0.16);cx.fillRect(-cell*0.38,cell*0.26,cell*0.76,cell*0.16);
  cx.fillStyle="#555";for(let i=0;i<4;i++){const o=((t.track*3+i)%1)*cell*0.19-cell*0.38;cx.fillRect(-cell*0.38+((t.track*cell*0.5+i*cell*0.19)%(cell*0.76)),-cell*0.42,cell*0.06,cell*0.16);cx.fillRect(-cell*0.38+((t.track*cell*0.5+i*cell*0.19)%(cell*0.76)),cell*0.26,cell*0.06,cell*0.16);}
  cx.fillStyle=c.main;rr(-cell*0.34,-cell*0.28,cell*0.68,cell*0.56,cell*0.1);cx.fill();cx.fillStyle=c.light;rr(-cell*0.3,-cell*0.24,cell*0.3,cell*0.48,cell*0.08);cx.fill();
  cx.rotate(t.aim-t.a);cx.fillStyle=c.dark;cx.beginPath();cx.arc(0,0,cell*0.2,0,TAU);cx.fill();cx.fillRect(0,-cell*0.06,cell*0.5,cell*0.12);cx.fillStyle="#fff";cx.beginPath();cx.arc(-cell*0.04,-cell*0.05,cell*0.06,0,TAU);cx.arc(-cell*0.04,cell*0.05,cell*0.06,0,TAU);cx.fill();cx.fillStyle="#222";cx.beginPath();cx.arc(-cell*0.02,-cell*0.05,cell*0.03,0,TAU);cx.arc(-cell*0.02,cell*0.05,cell*0.03,0,TAU);cx.fill();

 // frame
 cx.strokeStyle="#0b0e14";cx.lineWidth=6;cx.strokeRect(ar.x-3,ar.y-3,ar.w+6,ar.h+6);

function drawStrips(){for(let i=0;i<2;i++){const t=tanks[i],c=COLS[i];const x0=i===0?0:W-strip;const rot=i===0?Math.PI/2:-Math.PI/2;

  const mid=x0+strip/2;text(t.score+"",mid,H/2,Math.min(150,strip*0.9),c.light,"center",rot);

  if(!t.alive){text("RESPAWNING",mid,H*0.82,18,"#ffb0b0","center",rot)}}

 text("TANK TUSSLE",W/2+4,H*0.17+4,Math.min(84,W/9),"#0b0e14");text("TANK TUSSLE",W/2,H*0.17,Math.min(84,W/9),"#ffd040");
