<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Agent Rory HQ</title>

<style>
  .hqfile { width: min(560px, 92vw); padding: 0; overflow: hidden; text-align: left; border-color: var(--accent); box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent); }
  .hqpic { height: min(26vh, 220px); background-size: cover; background-position: center 30%; position: relative; }
  .hqpic span { position: absolute; left: 12px; top: 10px; font: 800 12px ui-monospace, monospace; letter-spacing: .15em; color: var(--accent); background: rgba(5, 10, 24, .8); padding: 4px 8px; border: 1px solid var(--accent); border-radius: 6px; }
  .hqfile .kick { margin: 14px 20px 0; font-weight: 900; font-size: 12px; letter-spacing: .25em; color: var(--accent); }
  .hqfile .ttl { margin: 2px 20px; font-weight: 900; font-size: clamp(26px, 4vw, 34px); }
  .hqfile .blurb { margin: 4px 20px 10px; color: #b8c6de; font-weight: 600; line-height: 1.4; }
  .hqfile .meter { display: flex; align-items: center; gap: 10px; margin: 0 20px 14px; font-weight: 800; }
  .hqfile .meter .bar { flex: 1; height: 8px; border-radius: 8px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .hqfile .meter .bar i { display: block; height: 100%; background: var(--accent); }
  .hqfile .meter em { color: #ffd166; font-style: normal; }
  .hqfile .row { margin: 0 20px 18px; justify-content: flex-start; }
  .granted { font-weight: 900; font-size: clamp(34px, 7vw, 70px); letter-spacing: .1em; color: #7bed9f; text-shadow: 0 0 30px rgba(123, 237, 159, .7); text-align: center; animation: pop2 .3s; }
  .granted small { display: block; font-size: 16px; letter-spacing: .3em; color: #cfe0ff; margin-top: 8px; }
  [data-layer="flash"] { background: rgba(4, 8, 20, .85); }
  .hqphoto { width: min(620px, 92vw); padding: 14px; background: #6a4a24; border: 3px solid #3a2410; text-align: center; }
  .hqphoto img { display: block; width: 100%; height: auto; border: 6px solid #f4efe2; box-sizing: border-box; }
  .hqphoto .plaque { display: inline-block; margin: 12px 0 8px; padding: 6px 18px; background: #c8a04a; color: #3a2410; font-weight: 900; letter-spacing: .2em; border-radius: 4px; }
  .hqphoto .row { justify-content: center; }
</style>
