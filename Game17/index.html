<style>

-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}

<script type="module">
import * as THREE from "./three.bundle.min.js";
// ================================================================ core
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* The table is laid out in millimetres, like a real one: 524 wide with the
   shooter lane, 1080 long, a 27 mm ball. y runs down the table, towards the
   player. PW is the playfield without the shooter lane; the lower third is
   built for the left and mirrored across PW/2. */
const TW=524,TH=1080,PW=487,BR=13.5;
/* gravity along the table (the slope), and into it (for the ramps) */
const GY=1650,GZ=GY*7.5;
/* a thousandth of a second a step, near enough: a ball at full speed moves
   under 7 mm, a quarter of its size, so nothing can pass through a wall */
const STEP=1/960,VMAX=6500;
const W_UP=32,W_DOWN=18;

// ================================================================ tables
const MX=x=>PW-x;
function newTable(){return{segs:[],circs:[],sens:[],flips:[],paths:[],movers:[],deco:[],inserts:[],labels:[],grid:null,drops:0,spinners:0}}
function seg(t,ax,ay,bx,by,o){const s=Object.assign({ax,ay,bx,by,r:4,e:0.42,fr:0.03,kind:"wall",kick:0,id:null,look:"rail",h:26},o||{});s.i=t.segs.length;t.segs.push(s);return s}
function poly(t,pts,o){const out=[];for(let i=0;i+1<pts.length;i++)out.push(seg(t,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],o));return out}
function circ(t,x,y,r,o){const c=Object.assign({x,y,r,e:0.62,fr:0.06,kind:"post",kick:0,id:null,look:"post"},o||{});c.i=t.circs.length;t.circs.push(c);return c}
function sens(t,o){o.i=t.sens.length;t.sens.push(o);return o}
function arcPts(cx,cy,R,a0,a1,n){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R])}return p}
function mirrorPts(p){return p.map(q=>[MX(q[0]),q[1]])}
/* a rubber post: a metal post with a rubber ring */
function post(t,x,y,o){return circ(t,x,y,6,Object.assign({e:0.7,look:"post"},o))}
/* the rubber band stretched between posts */
function rubber(t,ax,ay,bx,by,o){post(t,ax,ay);post(t,bx,by);return seg(t,ax,ay,bx,by,Object.assign({r:5,e:0.72,fr:0.06,look:"rubber"},o))}
function bumper(t,x,y,id){return circ(t,x,y,26,{kind:"bumper",kick:1250,e:0.35,id,look:"bumper"})}
function sling(t,A,B,C,id){
  /* A top, B outer corner, C bottom; A-C is the kicking rubber */
  for(const q of [A,B,C])circ(t,q[0],q[1],5,{e:0.7,look:"post"});
  seg(t,A[0],A[1],B[0],B[1],{r:5,look:"rubber",e:0.55});seg(t,B[0],B[1],C[0],C[1],{r:5,look:"rubber",e:0.55});
  const s=seg(t,A[0],A[1],C[0],C[1],{r:5,kind:"sling",kick:1050,e:0.6,id,look:"slingrub"});
  let nx=-(C[1]-A[1]),ny=C[0]-A[0];const L=Math.hypot(nx,ny);nx/=L;ny/=L;
  if(((A[0]+C[0])/2-B[0])*nx+((A[1]+C[1])/2-B[1])*ny<0){nx=-nx;ny=-ny}
  s.face=[nx,ny];s.B=B;return s;
}
/* drop targets in a row from (x,y) along (dx,dy), faces towards the normal on
   the left of the row direction */
function drops(t,x,y,dx,dy,n,id,w){
  w=w||24;const L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,out=[];
  for(let i=0;i<n;i++){const cx=x+ux*(w+4)*i,cy=y+uy*(w+4)*i;
    out.push(seg(t,cx-ux*w/2,cy-uy*w/2,cx+ux*w/2,cy+uy*w/2,{r:3,kind:"drop",id:id+i,e:0.35,look:"drop",di:t.drops++,grp:id}))}
  return out;
}
function standup(t,x,y,ang,id,w){w=w||22;const ux=Math.cos(ang),uy=Math.sin(ang);
  return seg(t,x-ux*w/2,y-uy*w/2,x+ux*w/2,y+uy*w/2,{r:4,kind:"target",id,e:0.3,look:"standup"})}
function rollover(t,x,y,id){return sens(t,{type:"circle",kind:"roll",x,y,r:11,id})}
function spinner(t,ax,ay,bx,by,id){return sens(t,{type:"line",kind:"spinner",ax,ay,bx,by,id,si:t.spinners++})}
function scoop(t,x,y,ex,ey,id){return sens(t,{type:"circle",kind:"scoop",x,y,r:15,ex,ey,id})}
/* a ramp or wire: the ball follows pts (x,y,z) once it crosses the mouth
   line (a->b) moving along n; too slow and it rolls back out */
function path(t,id,mouth,pts,o){
  const p=Object.assign({id,pts,look:"ramp"},o||{});
  const [ax,ay,bx,by]=mouth;let nx=-(by-ay),ny=bx-ax;const L=Math.hypot(nx,ny);nx/=L;ny/=L;
  /* the entry direction is the one pointing along the path's first leg */
  if(nx*(pts[1][0]-pts[0][0])+ny*(pts[1][1]-pts[0][1])<0){nx=-nx;ny=-ny}
  p.mouth={ax,ay,bx,by,nx,ny};
  const cum=[0];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]))}
  p.cum=cum;p.len=cum[cum.length-1];p.i=t.paths.length;t.paths.push(p);return p;
}
function smoothPath(ctrl,n){
  /* Catmull-Rom through the control points, n points a span */
  const out=[];for(let i=0;i<ctrl.length-1;i++){const p0=ctrl[Math.max(0,i-1)],p1=ctrl[i],p2=ctrl[i+1],p3=ctrl[Math.min(ctrl.length-1,i+2)];
    for(let k=0;k<n;k++){const s=k/n,s2=s*s,s3=s2*s,q=[];
      for(let d=0;d<3;d++)q.push(0.5*((2*p1[d])+(-p0[d]+p2[d])*s+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*s2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*s3));out.push(q)}}
  out.push(ctrl[ctrl.length-1].slice());return out;
}
/* an insert: a light set into the playfield. shape circle|arrow|tri|star|rect;
   s its size in mm; rot for arrows (0 points up the table); label is
   printed beside it on the playfield */
function ins(t,id,x,y,shape,s,col,o){const q=Object.assign({id,x,y,shape,s,col,rot:0},o||{});t.inserts.push(q);return q}
function label(t,text,x,y,o){t.labels.push(Object.assign({text,x,y,size:9,rot:0,col:"#fff"},o||{}))}
function flipper(t,px,py,side){
  /* side +1 left, -1 right; a is the angle below horizontal, pointing in */
  const f={px,py,side,len:84,r0:13,r1:7,rest:0.52,up:-0.46,e:0.3,fr:0.08,i:t.flips.length};t.flips.push(f);return f;
}

/* Everything every table shares: the cabinet, the arch, the shooter lane,
   the orbit lanes up both sides, and the lower third - outlanes, inlanes,
   slingshots and flippers. */
function baseTable(t,o){
  o=o||{};
  const cab={r:4,look:"cab",e:0.4,h:40};
  /* cabinet sides and the arch over the top */
  seg(t,0,262,0,TH+20,cab);seg(t,TW,262,TW,TH+20,cab);
  poly(t,arcPts(262,262,262,Math.PI,TAU,40),Object.assign({},cab,{look:"arch"}));
  /* the shooter lane */
  seg(t,PW,300,PW,TH+20,{r:4,look:"rail",h:30});
  seg(t,PW+4,1050,TW-4,1050,{r:2,look:"none"});
  /* a one-way gate at the top of the lane: up it lets the ball through,
     from above it turns it into the right orbit */
  seg(t,PW,300,TW-2,258,{r:2,look:"gate",oneway:1});
  /* orbit lanes: 40 wide, up the sides into the arch */
  const oTop=o.orbitTop||330,oBot=o.orbitBot||560;
  seg(t,48,oTop,48,oBot,{r:4,look:"rail"});seg(t,MX(48),oTop,MX(48),oBot,{r:4,look:"rail"});
  /* below each orbit's mouth a rubber turns what comes down it into the
     inlane, so an orbit is never a drain */
  for(const m of [x=>x,MX]){
    seg(t,m(4),590,m(60),700,{r:4,e:0.15,fr:0.01,look:"rail"});
    /* the post between inlane and outlane, and the inlane's guide down on
       to the flipper */
    circ(t,m(36),770,5,{e:0.75,look:"post"});
    poly(t,[[m(36),770],[m(36),880],[m(136),950]],{r:4,look:"rail"});
    /* under the flipper, the apron */
    seg(t,m(140),985,m(212),1027,{r:4,look:"apron",h:14});
    seg(t,m(212),1027,m(212),TH+20,{r:4,look:"none"});
    seg(t,m(4),900,m(4),TH+20,{r:4,look:"none"});
  }
  t.slingL=sling(t,[79,772],[79,850],[128,878],"slingL");
  t.slingR=sling(t,[MX(79),772],[MX(79),850],[MX(128),878],"slingR");
  flipper(t,146,965,1);flipper(t,MX(146),965,-1);
  /* lane switches: outlanes and inlanes */
  sens(t,{type:"circle",kind:"roll",x:18,y:860,r:11,id:"outL"});
  sens(t,{type:"circle",kind:"roll",x:57.5,y:840,r:11,id:"inL"});
  sens(t,{type:"circle",kind:"roll",x:MX(57.5),y:840,r:11,id:"inR"});
  sens(t,{type:"circle",kind:"roll",x:MX(18),y:860,r:11,id:"outR"});
  /* orbit switches half way up each lane */
  sens(t,{type:"line",kind:"lane",ax:4,ay:450,bx:44,by:450,id:"orbitL"});
  sens(t,{type:"line",kind:"lane",ax:MX(44),ay:450,bx:MX(4),by:450,id:"orbitR"});
  /* the plunger's lane */
  sens(t,{type:"line",kind:"lane",ax:PW+4,ay:320,bx:TW-4,by:320,id:"shooter"});
  t.plunger={x:(PW+TW)/2,y:1050-2-BR};
  /* the lights every table has */
  ins(t,"save",PW/2,912,"circle",11,"#ff4d4d",{label:"SHOOT AGAIN"});
  ins(t,"kickL",18,818,"circle",7,"#ffd43b");ins(t,"kickR",MX(18),818,"circle",7,"#ffd43b");
  label(t,"KICK",18,800,{size:6,rot:-Math.PI/2});label(t,"KICK",MX(18),800,{size:6,rot:Math.PI/2});
  ["bx2","bx3","bx4","bx5"].forEach((id,i)=>ins(t,id,PW/2-39+i*26,862,"circle",8,"#ff922b",{label:(i+2)+"X",lsize:6}));
}

/* Build the collision grid once: every wall and post goes into each cell a
   ball touching it could be centred in. */
const CELL=32,GCOLS=Math.ceil((TW+40)/CELL),GROWS=Math.ceil((TH+60)/CELL);
function finishTable(t){
  const g=[];for(let i=0;i<GCOLS*GROWS;i++)g.push([]);
  const put=(x0,y0,x1,y1,v)=>{const c0=clamp(Math.floor((x0+20)/CELL),0,GCOLS-1),c1=clamp(Math.floor((x1+20)/CELL),0,GCOLS-1),r0=clamp(Math.floor((y0+20)/CELL),0,GROWS-1),r1=clamp(Math.floor((y1+20)/CELL),0,GROWS-1);
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)g[r*GCOLS+c].push(v)};
  for(const s of t.segs){const m=s.r+BR+2;s.dx=s.bx-s.ax;s.dy=s.by-s.ay;s.l2=s.dx*s.dx+s.dy*s.dy||1;
    if(s.oneway){const L=Math.sqrt(s.l2);s.nx=s.dy/L;s.ny=-s.dx/L}
    if(!s.mv)put(Math.min(s.ax,s.bx)-m,Math.min(s.ay,s.by)-m,Math.max(s.ax,s.bx)+m,Math.max(s.ay,s.by)+m,s.i)}
  for(const c of t.circs){const m=c.r+BR+2;if(!c.mv)put(c.x-m,c.y-m,c.x+m,c.y+m,-1-c.i)}
  t.grid=g;t.dynSegs=t.segs.filter(s=>s.mv);t.dynCircs=t.circs.filter(c=>c.mv);
  return t;
}

// ================================================================ physics
function newBall(S,x,y,m){const b={id:S.nextId++,x,y,px:x,py:y,vx:0,vy:0,z:0,m:m||"table",pi:-1,ps:0,pv:0,hold:0,ex:0,ey:0,rot:0,ax:1,ay:0,still:0,from:null};S.balls.push(b);return b}
function newSim(T){
  return{t:0,balls:[],nextId:1,ev:[],
    flips:T.flips.map(f=>({a:f.rest,w:0,up:false})),
    down:new Uint8Array(T.drops),            /* drop targets that are down */
    spin:new Float32Array(T.spinners),       /* spinner angles, for drawing */
    spinV:new Float32Array(T.spinners),
    cool:new Float32Array(T.segs.length+T.circs.length),
    lit:{},mag:null,mov:{},kick:new Float32Array(T.segs.length+T.circs.length)};
}
function cloneSim(S){
  const c=Object.assign({},S);c.balls=S.balls.map(b=>Object.assign({},b));c.ev=[];c.flips=S.flips.map(f=>Object.assign({},f));
  c.down=S.down.slice();c.spin=S.spin.slice();c.spinV=S.spinV.slice();c.cool=S.cool.slice();c.kick=S.kick.slice();c.mov=Object.assign({},S.mov);return c;
}
/* push the ball out of a surface along n and bounce it; (svx,svy) is how
   fast the surface itself is moving there. Returns the speed it hit at. */
function bounce(b,nx,ny,pen,e,fr,svx,svy,kick){
  b.x+=nx*pen;b.y+=ny*pen;
  let rx=b.vx-svx,ry=b.vy-svy;const vn=rx*nx+ry*ny;
  if(vn>=0)return 0;
  const tx=-ny,ty=nx,vt=rx*tx+ry*ty;
  /* a ball resting on something does not keep bouncing on it */
  const rest=-vn<40,vn2=(rest?0:-vn*e)+kick,vt2=rest?vt:vt*(1-fr);
  b.vx=nx*vn2+tx*vt2+svx;b.vy=ny*vn2+ty*vt2+svy;
  return -vn;
}
function hitSeg(T,S,b,s){
  if(s.kind==="drop"&&S.down[s.di])return;
  let t=((b.x-s.ax)*s.dx+(b.y-s.ay)*s.dy)/s.l2;t=t<0?0:t>1?1:t;
  const cx=s.ax+s.dx*t,cy=s.ay+s.dy*t;let dx=b.x-cx,dy=b.y-cy;const d2=dx*dx+dy*dy,m=s.r+BR;
  if(d2>=m*m)return;
  const d=Math.sqrt(d2)||1e-6,nx=dx/d,ny=dy/d;
  if(s.oneway){/* only from the side the normal points to */
    if(b.px*s.nx+b.py*s.ny<s.ax*s.nx+s.ay*s.ny-0.5&&(b.vx*s.nx+b.vy*s.ny)>0)return;
    if(b.vx*s.nx+b.vy*s.ny>0&&(b.x-s.ax)*s.nx+(b.y-s.ay)*s.ny<0)return;
  }
  const svx=s.mv?S.mov[s.id+"vx"]||0:0,svy=s.mv?S.mov[s.id+"vy"]||0:0;
  const ci=s.i;let kick=0;
  if(s.kind==="sling"){const vin=-((b.vx-svx)*nx+(b.vy-svy)*ny);if(vin>200&&S.t-S.cool[ci]>0.12&&nx*s.face[0]+ny*s.face[1]>0.3){kick=s.kick;S.cool[ci]=S.t;S.kick[ci]=S.t}}
  const v=bounce(b,nx,ny,m-d,s.e,s.fr,svx,svy,kick);
  if(v>0){
    if(kick)S.ev.push({k:"sling",id:s.id,v,x:b.x,y:b.y});
    else if(s.kind==="drop"){if(v>60){S.down[s.di]=1;S.ev.push({k:"drop",id:s.id,grp:s.grp,v,x:b.x,y:b.y})}}
    else if(s.kind==="target"){if(v>60&&S.t-S.cool[ci]>0.15){S.cool[ci]=S.t;S.kick[ci]=S.t;S.ev.push({k:"target",id:s.id,v,x:b.x,y:b.y})}}
    else if(s.id&&v>60&&S.t-S.cool[ci]>0.15){S.cool[ci]=S.t;S.ev.push({k:"hit",id:s.id,v,x:b.x,y:b.y})}
    else if(v>260)S.ev.push({k:"thud",look:s.look,v,x:b.x,y:b.y});
  }
}
function hitCirc(T,S,b,c){
  const dx=b.x-c.x,dy=b.y-c.y,d2=dx*dx+dy*dy,m=c.r+BR;
  if(d2>=m*m||c.off&&S.lit[c.off])return;
  const d=Math.sqrt(d2)||1e-6,nx=dx/d,ny=dy/d,ci=T.segs.length+c.i;
  let kick=0;
  if(c.kind==="bumper"&&S.t-S.cool[ci]>0.06){kick=c.kick;}
  const svx=c.mv?S.mov[c.id+"vx"]||0:0,svy=c.mv?S.mov[c.id+"vy"]||0:0;
  const v=bounce(b,nx,ny,m-d,c.e,c.fr,svx,svy,kick);
  if(kick&&(v>0||d<m-1)){
    if(v===0){/* touched while already moving away: pop anyway */b.vx+=nx*kick*0.6;b.vy+=ny*kick*0.6}
    S.cool[ci]=S.t;S.kick[ci]=S.t;S.ev.push({k:"bumper",id:c.id,v,x:b.x,y:b.y});
  }else if(v>0){
    if(c.id&&v>60&&S.t-S.cool[ci]>0.15){S.cool[ci]=S.t;S.kick[ci]=S.t;S.ev.push({k:"hit",id:c.id,v,x:b.x,y:b.y})}
    else if(v>260)S.ev.push({k:"thud",look:c.look,v,x:b.x,y:b.y});
  }
}
function flipAngle(f,st){return f.side>0?st.a:Math.PI-st.a}
function hitFlip(T,S,b,f,st){
  const ang=flipAngle(f,st),ca=Math.cos(ang),sa=Math.sin(ang),w=f.side>0?st.w:-st.w;
  let t=((b.x-f.px)*ca+(b.y-f.py)*sa)/f.len;t=t<0?0:t>1?1:t;
  const cx=f.px+ca*f.len*t,cy=f.py+sa*f.len*t,rr=f.r0+(f.r1-f.r0)*t;
  const dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy,m=rr+BR;
  if(d2>=m*m)return;
  const d=Math.sqrt(d2)||1e-6,nx=dx/d,ny=dy/d;
  /* how fast the flipper's face is moving where the ball touches it */
  const sx=cx+nx*rr-f.px,sy=cy+ny*rr-f.py,svx=-w*sy,svy=w*sx;
  const v=bounce(b,nx,ny,m-d,f.e,f.fr,svx,svy,0);
  if(v>120)S.ev.push({k:"flipHit",side:f.side,v,x:b.x,y:b.y,t});
}
function crossed(ax,ay,bx,by,nx,ny,x0,y0,x1,y1){
  /* did the move (x0,y0)->(x1,y1) cross the segment a-b going along n */
  const s0=(x0-ax)*nx+(y0-ay)*ny,s1=(x1-ax)*nx+(y1-ay)*ny;
  if(!(s0<0&&s1>=0))return false;
  const k=s0/(s0-s1),x=x0+(x1-x0)*k,y=y0+(y1-y0)*k,dx=bx-ax,dy=by-ay,u=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy);
  return u>=-0.05&&u<=1.05;
}
function crossedAny(s,x0,y0,x1,y1){
  const nx=-(s.by-s.ay),ny=s.bx-s.ax;
  return crossed(s.ax,s.ay,s.bx,s.by,nx,ny,x0,y0,x1,y1)?1:crossed(s.ax,s.ay,s.bx,s.by,-nx,-ny,x0,y0,x1,y1)?-1:0;
}
function pathPos(p,s){
  const c=p.cum;let i=1;while(i<c.length-1&&c[i]<s)i++;
  const a=p.pts[i-1],b=p.pts[i],L=c[i]-c[i-1]||1,k=clamp((s-c[i-1])/L,0,1);
  return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,(b[0]-a[0])/L,(b[1]-a[1])/L,(b[2]-a[2])/L];
}
function launch(S,b,power){b.m="table";b.vx=0;b.vy=-(1500+3300*clamp(power,0,1));S.ev.push({k:"launch",power})}
function nudge(S,dx){for(const b of S.balls)if(b.m==="table"){b.vx+=dx*140;b.vy-=190}}
/* one step of the world; inp.L/inp.R are the flipper buttons */
function step(T,S,inp){
  const dt=STEP;S.t+=dt;
  for(let i=0;i<T.flips.length;i++){
    const f=T.flips[i],st=S.flips[i],want=!!(f.side>0?inp.L:inp.R),prev=st.a;
    if(want){st.a=Math.max(f.up,st.a-W_UP*dt)}else{st.a=Math.min(f.rest,st.a+W_DOWN*dt)}
    st.w=(st.a-prev)/dt;
    if(want&&!st.up)S.ev.push({k:"flip",side:f.side});
    if(!want&&st.up)S.ev.push({k:"flipOff",side:f.side});
    st.up=want;
  }
  for(let i=0;i<T.spinners;i++){S.spin[i]+=S.spinV[i]*dt;S.spinV[i]*=1-2.2*dt;if(Math.abs(S.spinV[i])<0.6){/* settle hanging down */S.spinV[i]=0;S.spin[i]=Math.round(S.spin[i]/Math.PI)*Math.PI}}
  for(const mv of T.movers)mv.update(S,T);
  for(const b of S.balls){
    if(b.m==="gone")continue;
    if(b.m==="held"||b.m==="plunger"||b.m==="lift"){b.hold-=dt;
      if(b.m==="held"&&b.hold<=0){b.m="table";b.vx=b.ex;b.vy=b.ey;b.lift=0;S.mov["cool:"+b.from]=S.t;S.ev.push({k:"eject",id:b.from})}
      continue}
    if(b.m==="path"){stepPath(T,S,b,dt);continue}
    b.px=b.x;b.py=b.y;
    b.vy+=GY*dt;
    if(S.mag&&S.mag.on){const dx=S.mag.x-b.x,dy=S.mag.y-b.y,d=Math.hypot(dx,dy);if(d<S.mag.r){const k=S.mag.k*(1-d/S.mag.r);b.vx+=dx/(d+1)*k*dt;b.vy+=dy/(d+1)*k*dt-GY*dt*(1-d/S.mag.r);b.vx*=1-3*dt;b.vy*=1-3*dt}}
    /* rolling resistance */
    b.vx*=1-0.1*dt;b.vy*=1-0.1*dt;
    const sp=Math.hypot(b.vx,b.vy);if(sp>VMAX){b.vx*=VMAX/sp;b.vy*=VMAX/sp}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.rot+=sp*dt/BR;if(sp>1){b.ax=b.vx/sp;b.ay=b.vy/sp}
    const c=clamp(Math.floor((b.x+20)/CELL),0,GCOLS-1),r=clamp(Math.floor((b.y+20)/CELL),0,GROWS-1),cell=T.grid[r*GCOLS+c];
    for(let k=0;k<cell.length;k++){const v=cell[k];if(v>=0)hitSeg(T,S,b,T.segs[v]);else hitCirc(T,S,b,T.circs[-1-v])}
    for(const s of T.dynSegs)hitSeg(T,S,b,s);
    for(const cc of T.dynCircs)hitCirc(T,S,b,cc);
    if(b.y>820)for(let i=0;i<T.flips.length;i++)hitFlip(T,S,b,T.flips[i],S.flips[i]);
    sensors(T,S,b);
    if(b.m!=="table")continue;
    if(b.y>TH+BR){b.m="gone";S.ev.push({k:"drain",id:b.id})}
    else if(b.x>PW&&b.y>1000&&Math.abs(b.vy)<30&&Math.abs(b.y-T.plunger.y)<3){b.m="plunger";b.x=T.plunger.x;b.y=T.plunger.y;b.vx=b.vy=0;S.ev.push({k:"inLane"})}
  }
  /* balls against each other */
  const B=S.balls;
  for(let i=0;i<B.length;i++){const a=B[i];if(a.m!=="table")continue;
    for(let j=i+1;j<B.length;j++){const c=B[j];if(c.m!=="table")continue;
      const dx=c.x-a.x,dy=c.y-a.y,d2=dx*dx+dy*dy;if(d2>=4*BR*BR||d2<1e-6)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,pen=(2*BR-d)/2;a.x-=nx*pen;a.y-=ny*pen;c.x+=nx*pen;c.y+=ny*pen;
      const vn=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;if(vn<0){const j2=-vn*0.95;a.vx-=nx*j2;a.vy-=ny*j2;c.vx+=nx*j2;c.vy+=ny*j2;if(-vn>200)S.ev.push({k:"clack",v:-vn,x:a.x,y:a.y})}}}
}
function sensors(T,S,b){
  for(const s of T.sens){
    if(s.type==="circle"){
      const inNow=(b.x-s.x)**2+(b.y-s.y)**2<s.r*s.r,inBefore=(b.px-s.x)**2+(b.py-s.y)**2<s.r*s.r;
      if(inNow&&!inBefore){
        /* a scoop does not take back the ball it has just thrown out */
        if(s.kind==="scoop"){const sp=Math.hypot(b.vx,b.vy);if(sp<3200&&!(S.t-(S.mov["cool:"+s.id]||-9)<0.8)){b.m="held";b.x=s.x;b.y=s.y;b.vx=b.vy=0;b.hold=0.9;b.ex=s.ex;b.ey=s.ey;b.from=s.id;S.ev.push({k:"scoop",id:s.id,ball:b.id});return}}
        else S.ev.push({k:s.kind,id:s.id,x:s.x,y:s.y,ball:b.id,vy:b.vy});
      }
    }else{
      const dir=crossedAny(s,b.px,b.py,b.x,b.y);
      if(dir){
        if(s.kind==="spinner"){const sp=Math.hypot(b.vx,b.vy);S.spinV[s.si]=dir*Math.min(90,sp*0.03);S.ev.push({k:"spinner",id:s.id,spins:Math.max(1,Math.round(sp/260))})}
        else S.ev.push({k:s.kind,id:s.id,dir,ball:b.id,vx:b.vx,vy:b.vy});
      }
    }
  }
  for(const p of T.paths){const m=p.mouth;
    if(crossed(m.ax,m.ay,m.bx,m.by,m.nx,m.ny,b.px,b.py,b.x,b.y)){
      const sp=b.vx*m.nx+b.vy*m.ny;
      b.m="path";b.pi=p.i;b.ps=0;b.pv=Math.max(sp,Math.hypot(b.vx,b.vy)*0.85);b.best=0;S.ev.push({k:"pathIn",id:p.id,ball:b.id});return;
    }
  }
}
function stepPath(T,S,b,dt){
  const p=T.paths[b.pi],q=pathPos(p,b.ps);
  /* along the path, the slope of the table pulls one way and the climb the other */
  /* in easy mode the climb is kinder, so a young player's ramps get made */
  const a=(GY*q[4]-GZ*q[5]*(p.flat?0:1))*(S.assist&&q[5]>0?0.8:1)-Math.sign(b.pv)*(p.wire?140:220);
  b.pv+=a*dt;b.ps+=b.pv*dt;b.best=Math.max(b.best,b.ps);
  b.rot+=Math.abs(b.pv)*dt/BR;
  if(b.ps<=0){/* it did not make it and rolled back out */
    const q0=pathPos(p,0),h=Math.hypot(q0[3],q0[4])||1;b.m="table";b.x=p.pts[0][0];b.y=p.pts[0][1];b.z=0;
    b.vx=q0[3]/h*b.pv;b.vy=q0[4]/h*b.pv;b.px=b.x-b.vx*dt;b.py=b.y-b.vy*dt;S.ev.push({k:"pathFail",id:p.id,ball:b.id,best:b.best/p.len});return}
  if(b.ps>=p.len){const e=pathPos(p,p.len),h=Math.hypot(e[3],e[4])||1,v=Math.max(b.pv,300);
    b.m="table";const last=p.pts[p.pts.length-1];b.x=last[0];b.y=last[1];b.z=0;b.vx=e[3]/h*v;b.vy=e[4]/h*v;b.px=b.x;b.py=b.y;
    S.ev.push({k:"path",id:p.id,ball:b.id});return}
  b.x=q[0];b.y=q[1];b.z=q[2];b.ax=q[3];b.ay=q[4];
}
// ================================================================ layouts
/* a goalie, keeper or anything else that slides back and forth: a short
   wall whose middle moves along x on a sine */
function slider(t,id,cx,y,amp,w,speed,look,o){
  const s=seg(t,cx-w/2,y,cx+w/2,y,{r:7,e:0.5,kind:"target",id,look,mv:1});
  t.movers.push({id,update(S){const k=S.lit[id+"Stop"]?0:1,ph=S.t*speed;
    /* a keeper steps aside while its goal kicks the ball back out */
    const aside=o&&o.scoop&&S.t-(S.mov["cool:"+o.scoop]||-9)<0.9;
    const x=aside?cx+amp*1.7:cx+amp*Math.sin(ph)*k;s.ax=x-w/2;s.bx=x+w/2;S.mov[id+"vx"]=amp*speed*Math.cos(ph)*k;S.mov[id+"x"]=x}});
  return s;
}
function topLanes(t,xs,y){
  /* rollover lanes under the arch, guides between them */
  const g=xs[1]-xs[0];
  for(let i=0;i<=xs.length;i++){const x=xs[0]-g/2+g*i;seg(t,x,y-30,x,y+28,{r:3,look:"lane"})}
  xs.forEach((x,i)=>rollover(t,x,y,"top"+i));
}
/* A ramp: up from the mouth to its top, then down a wire to an inlane.
   side -1 returns to the left inlane, +1 the right. */
function rampTo(t,id,mouthX,mouthY,up,down,o){
  const hw=(o&&o.mw)||25,m=[mouthX-hw+3,mouthY,mouthX+hw-3,mouthY];
  /* the ramp's side walls on the table where it starts */
  seg(t,mouthX-hw,mouthY,mouthX-hw,mouthY-36,{r:3,look:"rampSide"});
  seg(t,mouthX+hw,mouthY,mouthX+hw,mouthY-36,{r:3,look:"rampSide"});
  /* behind the mouth the ramp is overhead: a peaked back so nothing that
     comes down on it can come to rest there */
  poly(t,[[mouthX-hw,mouthY-36],[mouthX,mouthY-58],[mouthX+hw,mouthY-36]],{r:3,look:"none"});
  const ctrl=[[mouthX,mouthY,0]].concat(up);
  const pts=smoothPath(ctrl,6);
  const wire=smoothPath([up[up.length-1]].concat(down),6);
  return path(t,id,m,pts.concat(wire.slice(1)),Object.assign({rampN:pts.length},o||{}));
}

// ================================================================ rules
/* The game on top of the physics: score, balls, ball save, multiball, the
   table's modes and its five missions. Pure, like the physics: the same
   presses at the same moments give the same game, so tools/pinballcheck.mjs
   can play it. Everything a player sees comes out of it as messages (G.msgs)
   and lights (G.lights). */
const PTS={roll:5000,lane:25000,bumper:3000,sling:510,drop:10000,target:15000,spinner:500,scoop:25000,path:50000,hit:1000};
function newGame(T,opt){
  opt=opt||{};
  const G={T,S:newSim(T),score:0,ball:1,balls:opt.balls||3,extra:0,bonus:0,bonusX:1,
    saveT:0,saveLen:opt.save||10,phase:"plunge",phaseT:0,tiltWarn:0,nudges:[],tilted:false,
    lights:{},msgs:[],fx:[],st:{},count:{},mb:false,live:0,lastSwitch:0,
    combo:{id:"",t:-9,n:0},skill:1,missionsDone:{},newMissions:[],t:0,over:false,opt,
    kick:{L:!!opt.kickback,R:!!opt.kickback},doubleT:0,magnetSaves:opt.magnet||0};
  G.S.assist=!!opt.kickback;
  G.rules=RULES[T.key]||RULES.goal;G.rules.setup(G);
  serveBall(G,false);
  return G;
}
function say(G,text,sub,dur,o){G.msgs.push(Object.assign({text,sub:sub||"",t:G.t,dur:dur||1.8},o||{}))}
function fx(G,k,o){G.fx.push(Object.assign({k,t:G.t},o||{}))}
function addScore(G,n){n=Math.round(n*(G.doubleT>0?2:1));G.score+=n;if(G.src){const k=G.curK||"other";G.src[k]=(G.src[k]||0)+n}return n}
function count(G,k,n){G.count[k]=(G.count[k]||0)+(n||1);return G.count[k]}
/* a new ball into the shooter lane; auto is for ball saves and multiball */
function serveBall(G,auto){
  const T=G.T,S=G.S,b=newBall(S,T.plunger.x,T.plunger.y,"plunger");
  b.auto=auto?0.7:0;G.phase=G.phase==="play"&&auto?"play":"plunge";
  if(!auto){G.saveT=0;G.skill=1+((G.ball*7+G.score/1000|0)%3);G.tilted=false;G.tiltWarn=0}
  return b;
}
function ballsInPlay(G){let n=0;for(const b of G.S.balls)if(b.m!=="gone")n++;return n}
/* the plunger: pulled back by pull (0..1) and let go */
function plunge(G,power){
  const b=G.S.balls.find(x=>x.m==="plunger");if(!b)return;
  /* the power bar maps onto the three kinds of plunge: a soft one that falls
     back, the skill-shot band that drops into the top lanes, and a full
     plunge that goes right round the orbit */
  const p=clamp(power,0,1),v=p<0.3?1500+p/0.3*380:p<0.72?1880+(p-0.3)/0.42*300:2180+(p-0.72)/0.28*2600;
  b.m="table";b.vx=0;b.vy=-v;G.S.ev.push({k:"launch",power:p});
  if(G.phase==="plunge"){G.phase="play";G.saveT=G.saveLen;G.skillOn=true;G.skillT=G.t}
}
function gameNudge(G,dx){
  if(G.tilted||G.phase!=="play")return;
  nudge(G.S,dx);fx(G,"nudge",{dx});
  G.nudges=G.nudges.filter(t=>G.t-t<4);G.nudges.push(G.t);
  if(G.nudges.length>=3){G.tiltWarn++;G.nudges=[];
    if(G.tiltWarn>=3){G.tilted=true;say(G,"TILT","Ball lost",2.5,{big:1});fx(G,"tilt")}
    else say(G,"DANGER","Careful with the nudges",1.4)}
}
/* one fixed step of the whole game */
function gameStep(G,inp){
  const dt=STEP;G.t+=dt;
  const S=G.S;
  step(G.T,S,G.tilted?{}:inp);
  if(G.saveT>0&&G.phase==="play")G.saveT-=dt;
  if(G.doubleT>0)G.doubleT-=dt;
  for(const b of S.balls){
    if(b.m==="plunger"&&b.auto>0){b.auto-=dt;if(b.auto<=0){b.m="table";b.vx=0;b.vy=-3600;S.ev.push({k:"launch",power:0.8,auto:1})}}
    /* ball search: a ball that has stopped somewhere it should not gets a kick */
    if(b.m==="table"){const sp=Math.hypot(b.vx,b.vy);b.still=sp<20?(b.still||0)+dt:0;
      if(b.still>2.5){b.still=0;b.vx+=(b.x<PW/2?1:-1)*300;b.vy-=500;fx(G,"search")}}
  }
  for(const e of S.ev){gameEvent(G,e);if(G.log)G.log.push(e)}
  S.ev.length=0;
  G.rules.tick(G,dt);
  if(G.phase==="bonus"){G.phaseT-=dt;if(G.phaseT<=0)nextBall(G)}
}
function gameEvent(G,e){
  const R=G.rules,k=e.k;G.curK=k+(e.id?":"+e.id:"");
  if(k==="drain"){G.curK="bonus";drained(G,e);return}
  if(G.tilted){return}
  const id=e.id;let pts=0;
  switch(k){
    case"roll":pts=PTS.roll;G.bonus+=1000;break;
    case"lane":pts=id==="shooter"?0:PTS.lane;G.bonus+=2000;break;
    case"bumper":pts=PTS.bumper;G.bonus+=100;break;
    case"sling":pts=PTS.sling;break;
    case"drop":pts=PTS.drop;G.bonus+=1000;break;
    case"target":pts=PTS.target;G.bonus+=1000;break;
    case"spinner":pts=PTS.spinner*e.spins;break;
    case"scoop":pts=PTS.scoop;break;
    case"path":pts=PTS.path;G.bonus+=5000;break;
    case"hit":pts=PTS.hit;break;
  }
  if(pts)addScore(G,pts);
  if(k==="roll"||k==="lane"||k==="drop"||k==="target"||k==="scoop"||k==="path"||k==="bumper"){count(G,k+":"+id)}
  /* the skill shot: the lit top lane, straight off the plunger */
  if(G.skillOn&&(k==="roll"||k==="bumper"||k==="sling"||k==="target"||k==="drop"||k==="path"||k==="scoop"||k==="lane"&&id!=="shooter")){
    G.skillOn=false;
    if(k==="roll"&&id==="top"+(G.skill-1)){addScore(G,250000);count(G,"skill");say(G,"SKILL SHOT!","250,000",2,{big:1});fx(G,"flash",{col:"#ffd43b"});fx(G,"sound",{s:"skill"})}
  }
  /* combos: two ramps or orbits one after the other, quickly */
  if(k==="path"||k==="lane"&&/^orbit/.test(id)&&e.dir===-1){
    const c=G.combo;if(G.t-c.t<3.5&&c.id!==id){c.n++;const v=addScore(G,100000*c.n);count(G,"combo");say(G,"COMBO x"+(c.n+1),fmt(v),1.5);fx(G,"sound",{s:"combo",n:c.n})}else c.n=0;
    c.id=id;c.t=G.t;
  }
  /* kickbacks in the outlanes */
  if(k==="roll"&&(id==="outL"||id==="outR")){
    const side=id==="outL"?"L":"R";
    if(G.kick[side]){G.kick[side]=false;const b=G.S.balls.find(x=>x.id===e.ball);if(b){b.x=id==="outL"?18:MX(18);b.y=900;b.vx=0;b.vy=-2700}
      say(G,"KICKBACK!","",1.2);fx(G,"sound",{s:"kick"});fx(G,"flash",{col:"#ff6b6b"})}
    else if(G.magnetSaves>0&&G.saveT<=0){G.magnetSaves--;const b=G.S.balls.find(x=>x.id===e.ball);if(b){b.x=id==="outL"?18:MX(18);b.y=900;b.vx=0;b.vy=-2700}
      say(G,"MAGNET SAVE!","",1.2);fx(G,"sound",{s:"kick"})}
  }
  /* top lanes: all three lit raises the bonus multiplier */
  if(k==="roll"&&/^top\d$/.test(id)){
    const L=G.st.top||(G.st.top=[0,0,0]);L[+id[3]]=1;
    if(L.every(x=>x)){G.st.top=[0,0,0];if(G.bonusX<5){G.bonusX++;say(G,"BONUS "+G.bonusX+"X","",1.4)}else{addScore(G,100000);say(G,"TOP LANES","100,000",1.2)}fx(G,"sound",{s:"lanes"})}
  }
  R.on(G,e);
  /* a scoop that keeps catching the same ball throws it well clear */
  if(k==="scoop"){const b=G.S.balls.find(x=>x.id===e.ball),h=G.loopHits||(G.loopHits=[]);h.push(G.t);while(h.length&&G.t-h[0]>8)h.shift();
    if(h.length>=3&&b){b.ex=(b.x<PW/2?1:-1)*500;b.ey=1300;h.length=0}}
  checkMissions(G);
}
/* the flippers swap which top lanes are lit, as on a real machine */
function laneChange(G,dir){const L=G.st.top;if(!L)return;if(dir>0)L.unshift(L.pop());else L.push(L.shift())}
function drained(G,e){
  const S=G.S;
  if(G.saveT>0&&!G.tilted){G.saveT=Math.max(G.saveT,0);say(G,"BALL SAVED","",1.6,{big:1});fx(G,"sound",{s:"save"});serveBall(G,true);return}
  if(ballsInPlay(G)>0){/* multiball: one gone, play on */
    if(G.mb&&ballsInPlay(G)===1){G.mb=false;G.rules.mbEnd&&G.rules.mbEnd(G);say(G,"MULTIBALL OVER","",1.4)}
    return}
  G.phase="bonus";G.phaseT=2.6;
  const b=G.tilted?0:G.bonus*G.bonusX;G.lastBonus={b,x:G.bonusX};
  addScore(G,b);
  say(G,"BONUS "+fmt(G.bonus)+(G.bonusX>1?" x"+G.bonusX:""),"= "+fmt(b),2.4);
  fx(G,"sound",{s:"drain"});
}
function nextBall(G){
  G.bonus=0;G.bonusX=1;G.mb=false;G.kick.L=G.kick.R=!!G.opt.kickback;
  if(G.extra>0){G.extra--;say(G,"SHOOT AGAIN","",2,{big:1});serveBall(G,false);return}
  if(G.ball>=G.balls){G.phase="over";G.over=true;say(G,"GAME OVER",fmt(G.score),4,{big:1});return}
  G.ball++;serveBall(G,false);G.rules.newBall&&G.rules.newBall(G);
  say(G,"BALL "+G.ball,"",1.6);
}
function startMultiball(G,n,name){
  G.mb=true;for(let i=0;i<n;i++){const b=serveBall(G,true);b.auto=0.5+i*0.9}
  G.saveT=Math.max(G.saveT,12);
  say(G,name||"MULTIBALL",n+1+" balls!",2.5,{big:1});fx(G,"sound",{s:"multiball"});fx(G,"flash",{col:"#ffd43b",long:1});
}
function missionOf(G,i){return G.rules.missions[i]}
function checkMissions(G){
  G.rules.missions.forEach((m,i)=>{if(!G.missionsDone[i]&&m.test(G)){G.missionsDone[i]=true;G.newMissions.push(i);
    say(G,"MISSION DONE!",m.text,2.6,{big:1,star:1});fx(G,"sound",{s:"mission"});fx(G,"flash",{col:"#ffd43b",long:1})}});
}
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function lightsNow(G){
  const L={};const t=G.t;
  const top=G.st.top||[0,0,0];for(let i=0;i<3;i++)L["top"+i]=top[i]?1:G.skillOn&&G.phase!=="plunge"?0:0;
  if(G.phase==="plunge"||G.skillOn)L["top"+(G.skill-1)]=3;
  L.kickL=G.kick.L?1:0;L.kickR=G.kick.R?1:0;
  L.save=G.saveT>0?(G.saveT<3?3:1):0;
  L.bx2=G.bonusX>=2?1:0;L.bx3=G.bonusX>=3?1:0;L.bx4=G.bonusX>=4?1:0;L.bx5=G.bonusX>=5?1:0;
  G.rules.lights(G,L);
  G.lights=L;return L;
}

    if(e.k==="target"&&(e.id==="kL"||e.id==="kR")){s[e.id==="kL"?"kl":"kr"]=1;if(s.kl&&s.kr){s.kl=s.kr=0;G.kick.L=G.kick.R=true;say(G,"KICKBACKS LIT","",1.4);fx(G,"sound",{s:"lanes"})}}
    if(e.k==="spinner"){count(G,"spins",e.spins)}
    if(e.k==="lane"&&/^orbit/.test(e.id)&&e.dir===-1){s.cup++;if(s.cup%4===0){G.extra++;say(G,"EXTRA BALL!","",2.2,{big:1});fx(G,"sound",{s:"extra"})}else say(G,"CORNER!","Orbit "+s.cup%4+" / 4 for an extra ball",1.2)}
  },
  next(G){const s=G.st;return G.mb?(s.jp?"SHOOT THE GOAL":"SHOOT A RAMP"):s.open?"SHOOT THE GOAL":"HIT THE DEFENDERS"},
  tick(G,dt){G.S.lit.keeperStop=G.mb?1:0},
  mbEnd(G){G.st.jp=false},
  lights(G,L){const s=G.st,S=G.S,blink=(G.t*4|0)%2;
    L.goal=G.mb&&s.jp?3:s.open?3:0;L.goalArrow=s.open||G.mb&&s.jp?2:0;
    L.rampL=G.mb?3:s.ramps<5?2:1;L.rampR=L.rampL;

/* a bank of drop targets: all down? and put them back up */
function bankDown(G,grp){let all=true,any=false;for(const q of G.T.segs)if(q.grp===grp){if(G.S.down[q.di])any=true;else all=false}return all}
function bankUp(G,grp){for(const q of G.T.segs)if(q.grp===grp)G.S.down[q.di]=0}
function bankCount(G,grp){let n=0;for(const q of G.T.segs)if(q.grp===grp&&G.S.down[q.di])n++;return n}
function heldBall(G,e){return G.S.balls.find(x=>x.id===e.ball)}
function jackpot(G,v,name){const j=addScore(G,v);say(G,name||"JACKPOT!",fmt(j),1.8,{big:1});fx(G,"sound",{s:"jackpot"});fx(G,"flash",{col:"#ffd43b"});return j}

RULES.wiz={

  on(G,e){const s=G.st;
    if(e.k==="drop"&&e.grp==="book"){fx(G,"sound",{s:"page"});
      if(bankDown(G,"book")){bankUp(G,"book");s.learned++;s.ready++;addScore(G,100000);say(G,"SPELL LEARNED!","Cast it at the castle",2.2,{big:1,anim:"star"});fx(G,"sound",{s:"mission"})}
      else say(G,"SPELL BOOK",bankCount(G,"book")+" / 4",0.9)}
    if(e.k==="scoop"&&e.id==="castle"){const b=heldBall(G,e);
      if(G.mb){if(s.jp){jackpot(G,1500000,"SUPER JACKPOT!");s.jp=false}else say(G,"CASTLE","Fly the broom for a jackpot",1);if(b)b.hold=0.8}
      else if(s.ready>0){s.ready--;const sp=SPELLS[s.cast%3];s.cast++;const v=addScore(G,300000);
        say(G,sp[0]+"!",sp[1],2.4,{big:1,anim:"star"});fx(G,"sound",{s:"spell"});fx(G,"flash",{col:"#b197fc",long:1});
        if(sp[0]==="LEVITATE"){if(b){b.hold=2.6;b.lift=2.6}}else if(b)b.hold=1.4;
        if(sp[0]==="SPARKLE")G.doubleT=Math.max(G.doubleT,20);
        if(sp[0]==="SHIELD")G.saveT=Math.max(G.saveT,20)}
      else{if(b)b.hold=0.8;addScore(G,25000);say(G,"CASTLE","Knock down the spell books",1.1)}}
    if(e.k==="scoop"&&e.id==="cauldron"){const b=heldBall(G,e);fx(G,"sound",{s:"bubble"});
      if(G.mb){if(b)b.hold=0.8;jackpot(G,300000)}
      else if(s.potion){s.potion=false;s.mbs++;s.jp=false;if(b)b.hold=1.8;startMultiball(G,2,"POTION MULTIBALL")}
      else{s.stir++;if(b)b.hold=1.1;
        if(s.stir>=3){s.stir=0;s.brewed++;s.potion=true;addScore(G,150000);say(G,"POTION BREWED!","Shoot the cauldron for multiball",2.2,{big:1})}
        else say(G,"STIR!",3-s.stir+" more to brew a potion",1.2)}}
    if(e.k==="path"){s.flights++;
      if(G.mb){jackpot(G,500000);s.jp=true}
      else{const v=addScore(G,s.flyVal);s.flyVal=Math.min(s.flyVal+25000,300000);say(G,"BROOMSTICK!",fmt(v),1.3)}}
    if(e.k==="target"&&e.id==="owl"){fx(G,"sound",{s:"hoot"});const r=(G.count["target:owl"]||0)%3;
      if(r===1){G.kick.L=G.kick.R=true;say(G,"HOOT!","Kickbacks lit",1.3)}else if(r===2&&G.bonusX<5){G.bonusX++;say(G,"HOOT!","Bonus "+G.bonusX+"X",1.3)}else{addScore(G,75000);say(G,"HOOT!","75,000",1.1)}}
  },
  next(G){const s=G.st;return G.mb?(s.jp?"SHOOT THE CASTLE":"FLY THE BROOM"):s.potion?"SHOOT THE CAULDRON":s.ready>0?"CAST AT THE CASTLE":"HIT THE SPELL BOOKS"},
  tick(G,dt){},
  mbEnd(G){G.st.jp=false},
  lights(G,L){const s=G.st;
    L.castle=G.mb&&s.jp?3:s.ready>0?3:0;L.cauldron=s.potion?3:G.mb?2:2;L.broom=G.mb?3:2;
    for(let i=0;i<4;i++)L["book"+i]=G.S.down[G.T.segs.find(q=>q.id==="book"+i).di]?1:0;

  }

// ================================================================ art
/* The playfield is painted here, in millimetres, onto a canvas that becomes
   its texture: the theme's picture first, then what every real playfield
   has printed on it - the dark rings round the lights, the words by the
   shots - and last the soft shadows the walls and posts throw, baked in. */
let PXMM=2;
function mkCanvas(w,h){const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function rnd(seed){return mulberry32(seed)}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return"rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")"}
function shadeHex(hex,amt){const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return"#"+[n>>16&255,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,"0")).join("")}
function speckle(g,x,y,w,h,n,cols,size,seed){const R=rnd(seed||1);for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];const s=size*(0.5+R());g.fillRect(x+R()*w,y+R()*h,s,s)}}
function archClip(g){g.beginPath();g.moveTo(0,TH);g.lineTo(0,262);g.arc(262,262,262,Math.PI,TAU);g.lineTo(TW,TH);g.closePath()}
function textOn(g,t,x,y,size,col,rot,o){o=o||{};g.save();g.translate(x,y);g.rotate(rot||0);g.font=(o.wt||900)+" "+size+"px "+(o.font||"'Arial Black',Impact,'Helvetica Neue',sans-serif");
  g.textAlign="center";g.textBaseline="middle";if(o.stroke){g.lineWidth=o.sw||size*0.22;g.lineJoin="round";g.strokeStyle=o.stroke;g.strokeText(t,0,0)}
  g.fillStyle=col;g.fillText(t,0,0);g.restore()}
function insertPath(g,q,grow){const s=q.s+(grow||0);g.save();g.translate(q.x,q.y);g.rotate(q.rot||0);g.beginPath();
  if(q.shape==="circle")g.arc(0,0,s,0,TAU);

  else if(q.shape==="tri"){g.moveTo(0,-s);g.lineTo(s*0.8,s*0.6);g.lineTo(-s*0.8,s*0.6);g.closePath()}
  else if(q.shape==="star"){for(let j=0;j<10;j++){const a=-Math.PI/2+j/10*TAU,r=j%2?s*0.45:s;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}

/* a tile of smooth random noise, made once: laid over a painting in a few

   paint does not */
let noiseTiles=null;
function noiseTile(n,seed,oct){const c=mkCanvas(n,n),g=c.getContext("2d"),id=g.createImageData(n,n),R=rnd(seed),G=[];
  for(let o=0;o<oct;o++){const s=4<<o,gr=[];for(let i=0;i<s*s;i++)gr.push(R());G.push({s,gr})}
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let v=0,a=0.5,t=0;for(const {s,gr} of G){const fx=x/n*s,fy=y/n*s,x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0,
      q=(i,j)=>gr[((j+s)%s)*s+(i+s)%s],sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty),
      w=q(x0,y0)*(1-sx)*(1-sy)+q(x0+1,y0)*sx*(1-sy)+q(x0,y0+1)*(1-sx)*sy+q(x0+1,y0+1)*sx*sy;v+=w*a;t+=a;a*=0.55}
    const k=(y*n+x)*4,val=Math.round(v/t*255);id.data[k]=id.data[k+1]=id.data[k+2]=val;id.data[k+3]=255}

function photoPass(g,x,y,w,h,amt,scale,mode,seed){if(!noiseTiles)noiseTiles={};const key=(seed||1)+"";if(!noiseTiles[key])noiseTiles[key]=noiseTile(128,seed||1,5);

function paintPlayfield(T,theme){
  const c=mkCanvas(TW*PXMM,TH*PXMM),g=c.getContext("2d");g.scale(PXMM,PXMM);
  g.fillStyle="#141414";g.fillRect(0,0,TW,TH);
  g.save();archClip(g);g.clip();
  theme.paint(g,T);
  /* what makes paint look like a photograph of a surface: variation at many
     sizes - broad blotches of light and dark, then a finer mottle */
  if(theme.photo!==false){photoPass(g,0,0,TW,TH,0.5,3.2,"soft-light",3);photoPass(g,0,0,TW,TH,0.35,0.9,"soft-light",7);photoPass(g,0,0,TW,TH,0.16,0.25,"overlay",11)}
  /* the lanes along the bottom: outlanes and inlanes printed darker */
  g.fillStyle="rgba(0,0,0,0.28)";for(const m of [x=>x,MX]){g.beginPath();g.moveTo(m(4),700);g.lineTo(m(4),1080);g.lineTo(m(36),1080);g.lineTo(m(36),770);g.closePath();g.fill()}
  /* the shooter lane: bare wood under a strip of paint */
  g.fillStyle="#2a1d12";g.fillRect(PW,300,TW-PW,TH);
  woodGrain(g,PW+2,300,TW-PW-4,TH-300,7);
  g.fillStyle="rgba(0,0,0,0.35)";g.fillRect(PW+2,300,TW-PW-4,TH-300);

  for(const l of T.labels)textOn(g,l.text,l.x,l.y,l.size,l.col,l.rot,{stroke:"rgba(0,0,0,0.6)",sw:l.size*0.25});

     screen-printed playfield */
  for(const q of T.inserts){
    g.fillStyle="rgba(0,0,0,0.85)";insertPath(g,q,q.shape==="circle"?3.2:3.6);g.fill();
    g.strokeStyle="rgba(255,255,255,0.75)";g.lineWidth=0.8;insertPath(g,q,q.shape==="circle"?3.8:4.2);g.stroke();
    g.fillStyle=shadeHex(q.col,-0.55);insertPath(g,q,0);g.fill();
    if(q.label)textOn(g,q.label,q.x,q.y+q.s+(q.lsize||7)*0.95+2,q.lsize||7,"#fff",0,{stroke:"rgba(0,0,0,0.7)",sw:(q.lsize||7)*0.3});
  }

  bakeShadows(g,T);
  g.restore();
  /* varnish wear: a little mottling all over */
  const R=rnd(9);for(let i=0;i<1400;i++){g.fillStyle="rgba(255,255,255,"+(R()*0.025)+")";const s=2+R()*10;g.fillRect(R()*TW,R()*TH,s,s)}

function bakeShadows(g,T){
  g.save();g.shadowColor="rgba(0,0,0,0.55)";g.shadowBlur=7*PXMM;g.shadowOffsetX=1.5*PXMM+4000*PXMM;g.shadowOffsetY=3*PXMM;

  for(const s of T.segs){if(s.look==="none"||s.look==="drop"||s.mv)continue;g.lineWidth=s.r*2+(s.look==="cab"||s.look==="arch"?6:2);g.beginPath();g.moveTo(s.ax,s.ay);g.lineTo(s.bx,s.by);g.stroke()}

function woodGrain(g,x,y,w,h,seed){const R=rnd(seed);g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  for(let i=0;i<w*0.8;i++){const gx=x+R()*w;g.strokeStyle="rgba("+(90+R()*60|0)+","+(55+R()*30|0)+","+(25+R()*15|0)+","+(0.15+R()*0.25)+")";g.lineWidth=0.3+R()*1.2;

/* wood for the cabinet: a canvas of grain */

function syncScene(G,H,dt,view){

  T.flips.forEach((f,i)=>{H.flips[i].rotation.z=-flipAngle(f,S.flips[i])});
  /* balls */
  H.balls.forEach((m,i)=>{const b=S.balls.filter(x=>x.m!=="gone")[i];if(!b){m.visible=false;if(H.blobs)H.blobs[i].visible=false;return}

    const bl=H.blobs&&H.blobs[i];if(bl){bl.visible=b.m!=="path"&&y<apronEdge(b.x);bl.position.x=WX(b.x)+2;bl.position.y=WY(y)-3}
    /* under the apron the ball drops out of sight into the trough */
    if(b.m==="table"&&y>apronEdge(b.x))z-=Math.min(40,(y-apronEdge(b.x))*0.8);
    if(b.m==="held"){z-=8;
      /* a levitation spell lifts it up out of the scoop and floats it */
      if(b.lift>0){const k=clamp(1-b.hold/b.lift,0,1);z+=Math.sin(k*Math.PI)*70+Math.sin(k*TAU*3)*4}}
    m.position.set(WX(b.x),WY(y),z);

    const u=m.userData;if(u.id!==b.id){u.id=b.id;u.rot=b.rot}const d=b.rot-u.rot;u.rot=b.rot;

  /* drop targets sink when down */
  for(const d of H.drops){const want=S.down[d.s.di]?-27:0;d.z+=(want-d.z)*Math.min(1,dt*(want<d.z?28:10));d.g.position.z=d.z}
  /* standups and slings twitch when hit */
  for(const a of H.anim){const k=Math.max(0,1-(S.t-S.kick[a.s.i])*10);a.m.position.y=k*2.5}
  for(const sl of H.slings){const k=Math.max(0,1-(S.t-S.kick[sl.s.i])*12),f=sl.s.face;sl.m.position.set(f[0]*k*4,-f[1]*k*4,0)}

  /* pop bumpers flash and duck their ring */
  for(const bm of H.bumpers){const ci=T.segs.length+bm.c.i,k=Math.max(0,1-(S.t-S.kick[ci])*6);bm.v=Math.max(bm.v*Math.pow(0.02,dt),k);

/* A sunny dog park seen from above: criss-cross mown grass, gravel paths,
   a lily pond, a picket fence round the arch, flower beds and a bench; and
   in the middle Rex the beagle, sitting on his bed by his bowl in front of
   his doghouse, with fire hydrants for pop bumpers. Every helper is pup*. */

/* ================================================================ painting kit */
function pupCurve(g,p){g.moveTo(p[0][0],p[0][1]);for(let i=0;i<p.length-1;i++){const a=p[Math.max(0,i-1)],b=p[i],c=p[i+1],d=p[Math.min(p.length-1,i+2)];
  g.bezierCurveTo(b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6,c[0]-(d[0]-b[0])/6,c[1]-(d[1]-b[1])/6,c[0],c[1])}}
function pupBlob(g,x,y,rx,ry,seed,n,wob,add){const R=rnd(seed);n=n||14;wob=wob==null?0.2:wob;const P=[];
  for(let i=0;i<n;i++){const a=i/n*TAU,k=1-wob/2+R()*wob;P.push([x+Math.cos(a)*rx*k,y+Math.sin(a)*ry*k])}
  const m=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];if(!add)g.beginPath();const s=m(P[n-1],P[0]);g.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const q=m(P[i],P[(i+1)%n]);g.quadraticCurveTo(P[i][0],P[i][1],q[0],q[1])}g.closePath()}
/* a layer the size of the playfield: mask() draws its shape, paint() fills it */
function pupLayer(g,mask,paint,box){const [x0,y0,w,h]=box||[0,0,TW,TH],c=mkCanvas(w*PXMM,h*PXMM),q=c.getContext("2d");q.scale(PXMM,PXMM);q.translate(-x0,-y0);mask(q);
  q.globalCompositeOperation="source-atop";paint(q);g.drawImage(c,x0,y0,w,h)}

function pupBlades(g,x0,y0,w,h,n,seed,cols,len){const R=rnd(seed);g.lineCap="round";

/* speckles as little round dots, batched by colour (arcs: rotated ellipses are very slow) */
function pupDots(g,x0,y0,w,h,n,seed,cols,s0,s1){const R=rnd(seed);

/* flowers, batched: L is a list of [x,y,size,colour,turn] */
function pupFlowers(g,L){const by=new Map();for(const f of L){if(!by.has(f[3]))by.set(f[3],[]);by.get(f[3]).push(f)}
  for(const [col,l] of by){g.fillStyle=col;g.beginPath();for(const [x,y,s,,o] of l)for(let i=0;i<5;i++){const a=o+i/5*TAU,px=x+Math.cos(a)*s*0.55,py=y+Math.sin(a)*s*0.55;g.moveTo(px+s*0.4,py);g.arc(px,py,s*0.4,0,TAU)}g.fill()}

/* a flower bed: stone edging, dark soil, leaves and flowers */
function pupBed(g,x,y,rx,ry,rot,seed,cols){const R=rnd(seed);g.save();g.translate(x,y);g.rotate(rot);
  g.fillStyle="rgba(0,20,0,0.35)";g.beginPath();g.ellipse(1.6,2.6,rx+5,ry+5,0,0,TAU);g.fill();
  const n=Math.round((rx+ry)*0.95),sc=["#9a8f80","#b3a996","#857a6b","#c2b8a6"],st=[];for(let i=0;i<n;i++){const a=i/n*TAU;st.push([Math.cos(a)*(rx+2.2),Math.sin(a)*(ry+2.2),2.2+R()*1.1,(R()*4)|0])}

  g.fillStyle="rgba(255,255,255,0.25)";g.beginPath();for(const [px,py,sr] of st){g.moveTo(px-0.6+sr*0.4,py-0.7);g.arc(px-0.6,py-0.7,sr*0.4,0,TAU)}g.fill();

function wizBoxUV(geo,s,oz){const p=geo.attributes.position,n=geo.attributes.normal,uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++){const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));let u,v;
    if(az>=ax&&az>=ay){u=p.getX(i);v=p.getY(i)}else if(ax>=ay){u=p.getY(i);v=p.getZ(i)+(oz||0)}else{u=p.getX(i);v=p.getZ(i)+(oz||0)}
    uv.setXY(i,u/s,v/s)}return geo}

   bumper, the steel ball rumbling across the wood (a loop of filtered noise
   that follows the ball's speed), and a band per table. iOS lets a page
   start sound only inside a gesture it recognises - a touchend, a click or a
   key - so each of those wakes the context. */

  padBus=AC.createBiquadFilter();padBus.type="lowpass";padBus.frequency.value=1200;padBus.Q.value=0.5;padBus.connect(musBus);
  sfxBus=AC.createGain();sfxBus.gain.value=settings.sfx?1:0;sfxBus.connect(master);
  AC.onstatechange=()=>{if(AC.state==="running")musNext=AC.currentTime+0.05}}catch(e){}}

function audioNudge(){if(AC&&AC.state!=="running"&&AC.resume)AC.resume().catch(()=>{})}

   loop: a context the phone interrupted (a call, the lock screen) has to come
   back even while a frame is slow to arrive */
setInterval(()=>{if(AC&&AC.state!=="running")audioNudge()},600);

// ================================================================ dmd
/* The score display: a dot-matrix panel, 128 by 32 amber dots, like the
   ones in the backbox of every pinball machine from the nineties. What it
   says is drawn small into a 128x32 canvas and then shown through a mask of
   round dots. */
const DMD={src:mkCanvas(128,32),big:null,mask:null,w:0,h:0};
DMD.g=DMD.src.getContext("2d");
function dmdLayout(){
  if(W>H){const w=Math.min((W-SAFE.l-SAFE.r)*0.3,340*U);return{x:SAFE.l+14*U,y:SAFE.t+14*U,w,h:w/4}}
  /* upright: the width of the screen, less room on the left for the pause button */
  const x0=sideL()+44*U,w=Math.min(sideR()-x0,520*U);return{x:x0+(sideR()-x0-w)/2,y:SAFE.t+8*U,w,h:w/4}}
function dmdMask(w,h){const c=mkCanvas(w,h),g=c.getContext("2d"),dx=w/128,dy=h/32,r=Math.min(dx,dy)*0.42;g.fillStyle="#fff";
  for(let j=0;j<32;j++)for(let i=0;i<128;i++){g.beginPath();g.arc((i+0.5)*dx,(j+0.5)*dy,r,0,TAU);g.fill()}return c}
function dmdText(t,x,y,px,al,col){const g=DMD.g;g.font="bold "+px+"px 'Arial Narrow',Arial,'Helvetica Neue',sans-serif";g.textAlign=al||"center";g.textBaseline="middle";g.fillStyle=col||"#ff8a1f";
  const w=g.measureText(t).width,max=al==="left"||al==="right"?70:124;if(w>max){g.save();g.translate(x,y);g.scale(max/w,1);g.fillText(t,0,0);g.restore()}else g.fillText(t,x,y)}
function dmdIcon(k,age){const g=DMD.g;g.fillStyle="#ff8a1f";g.strokeStyle="#ff8a1f";const k2=(age*1.4)%1;
  if(k==="goal"){g.beginPath();g.arc(6+k2*116,26-Math.sin(k2*Math.PI)*16,2.5,0,TAU);g.fill()}
  else if(k==="bone"){const x=6+k2*116;g.fillRect(x-4,28,8,2);g.beginPath();g.arc(x-4,28,1.6,0,TAU);g.arc(x-4,30,1.6,0,TAU);g.arc(x+4,28,1.6,0,TAU);g.arc(x+4,30,1.6,0,TAU);g.fill()}
  else if(k==="boom"){const r=2+k2*14;g.lineWidth=1.5;for(let i=0;i<8;i++){const a=i/8*TAU;g.beginPath();g.moveTo(64+Math.cos(a)*r*0.4,16+Math.sin(a)*r*0.4);g.lineTo(64+Math.cos(a)*r*2,16+Math.sin(a)*r);g.stroke()}}
  else{for(let i=0;i<7;i++){const x=(i*23+age*60)%128,y=3+((i*11)%26);g.fillRect(x,y,1.6,1.6)}}}
function drawDMD(G,idle){
  const g=DMD.g;g.fillStyle="#000";g.fillRect(0,0,128,32);
  const m=G&&!idle?G.msgs.filter(q=>G.t-q.t<q.dur).pop():null;
  if(m){const age=G.t-m.t,on=!m.big||age>0.5||((age*10|0)%2===0);
    if(on){if(m.sub){dmdText(m.text,64,11,m.text.length>12?13:15);dmdText(m.sub,64,26,8,"center","#e06a10")}else dmdText(m.text,64,16,m.text.length>12?14:18)}
    if(m.anim)dmdIcon(m.anim,age)}
  else if(G&&!idle){dmdText(fmt(G.score),64,13,G.score>=1e8?14:17);
    const b=G.phase==="over"?"GAME OVER":(G.opt.daily?"DAILY ":"")+"BALL "+G.ball+(G.extra?" +"+G.extra:"");dmdText(b,3,27,8,"left","#e06a10");
    /* every few seconds the bottom line says what to shoot next */
    const nx=G.rules.next&&G.phase==="play"&&(G.t%8)>4.5?G.rules.next(G):null;
    if(nx){g.fillStyle="#000";g.fillRect(0,21,128,11);dmdText(nx,64,27,8,"center","#ffb347")}
    else dmdText(G.doubleT>0?"2X SCORE":me.name.toUpperCase(),125,27,8,"right","#e06a10")}
  else{/* between games it cycles, like an arcade machine's attract mode */
    const k=Math.floor(TT/3)%4,tb=TABLES.find(t=>t.key===curKey)||TABLES[0],fb=familyBest(tb.key);
    if(k===0){dmdText("PINBALL QUEST",64,12,15);dmdText("PRESS PLAY",64,27,8,"center","#e06a10")}
    else if(k===1){dmdText(tb.name.toUpperCase(),64,12,14);dmdText(starsOf(me,tb.key)+" / 5 STARS",64,27,8,"center","#e06a10")}
    else if(k===2&&fb.length){dmdText("HIGH SCORE",64,9,9,"center","#e06a10");dmdText(fb[0].p.name.toUpperCase()+"  "+fmt(fb[0].s),64,23,12)}
    else{dmdText("FREE PLAY",64,12,15);dmdText(me.name.toUpperCase()+" IS UP",64,27,8,"center","#e06a10")}}
  const lay=dmdLayout(),pw=Math.round(lay.w*DPR),ph=Math.round(lay.h*DPR);
  if(!DMD.mask||DMD.w!==pw||DMD.h!==ph){DMD.mask=dmdMask(pw,ph);DMD.big=mkCanvas(pw,ph);DMD.w=pw;DMD.h=ph}
  const bg=DMD.big.getContext("2d");bg.globalCompositeOperation="source-over";bg.clearRect(0,0,pw,ph);bg.imageSmoothingEnabled=true;bg.drawImage(DMD.src,0,0,pw,ph);
  bg.globalCompositeOperation="destination-in";bg.drawImage(DMD.mask,0,0);bg.globalCompositeOperation="source-over";
  cx.save();cx.setTransform(1,0,0,1,0,0);
  const x=Math.round(lay.x*DPR),y=Math.round(lay.y*DPR),bz=6*DPR*U;
  cx.fillStyle="#0c0c0e";rr(x-bz,y-bz,pw+2*bz,ph+2*bz,8*DPR*U);cx.fill();cx.strokeStyle="#3a3a42";cx.lineWidth=2*DPR;rr(x-bz,y-bz,pw+2*bz,ph+2*bz,8*DPR*U);cx.stroke();
  cx.fillStyle="#050302";cx.fillRect(x,y,pw,ph);
  cx.globalAlpha=0.09;cx.drawImage(DMD.mask,x,y);cx.globalAlpha=1;
  cx.globalCompositeOperation="lighter";cx.drawImage(DMD.big,x,y);cx.globalAlpha=0.35;cx.drawImage(DMD.big,x,y);cx.globalAlpha=1;cx.globalCompositeOperation="source-over";
  cx.restore();return lay}

// ================================================================ tables
/* one 3D table is built at a time; the menus show the last one chosen, with
   a robot playing it */
let TB=null,curKey="",demo=null,demoBot=null,demoAcc=0;
function tableOf(key){const T={goal:tableGoal,pup:tablePup,mine:tableMine,wiz:tableWiz}[key]();T.name=RULES[key].name;return T}
function showTable(key){if(key===curKey&&TB)return;curKey=key;store.set("last",key);
  if(TB){R3.sc.remove(TB.grp);disposeTable(TB)}
  TB=buildTable(tableOf(key),THEMES[key]);R3.sc.add(TB.grp);captureReflections(TB);setBallSkin(me.ball);
  demo=null;layoutDirty=true}
/* free what the old table held on the graphics card - but not what every
   table shares (the chrome, the rubber, the glow) */
function disposeTable(tb){const shared=new Set(Object.values(R3.cache.mats||{}));
  tb.grp.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];
  for(const m of ms){if(shared.has(m)||m.userData.keep)continue;for(const k of ["map","emissiveMap"]){const t=m[k];if(t&&t!==R3.cache.glow&&t!==R3.cache.ins&&!(t.userData&&t.userData.keep))t.dispose()}m.dispose()}}});
  if(tb.env)tb.env.dispose()}
function demoUpdate(dt){
  if(!demo||demo.over||demo.t>240){demo=newGame(tableOf(curKey),{balls:3,kickback:true});demoBot=makeBot(demo.T,mulberry32((TT*1000)|0))}
  demoAcc=Math.min(demoAcc+dt,0.1);
  while(demoAcc>=STEP){if(demo.S.balls.some(b=>b.m==="plunger"&&!b.auto))plunge(demo,0.8);gameStep(demo,demoBot(demo.S,STEP));demoAcc-=STEP}
  demo.fx.length=0;lightsNow(demo);syncScene(demo,TB.H,dt,{pull:0})}
/* Building a table takes a moment on a phone (the playfield is painted,
   every model is made, the shaders are compiled), so anything that needs a
   new table first shows a card saying so, and does the work a frame later. */
let pending=null,pendingShown=0;
function later(key,fn){if(key===curKey&&TB){fn();return}pending={key,fn};pendingShown=0}
function drawLoading(){dim(0.7);const t=TABLES.find(q=>q.key===pending.key);
  txt("Setting up",W/2,H*0.44,20*U,"#adb5bd","center",800);txt(t?t.name:"",W/2,H*0.5,32*U,"#fff","center",900,"#1a0f3a");
  for(let i=0;i<3;i++){cx.fillStyle="rgba(255,212,59,"+(0.3+0.7*(((TT*3|0)%3)===i?1:0))+")";cx.beginPath();cx.arc(W/2+(i-1)*22*U,H*0.57,6*U,0,TAU);cx.fill()}}
/* the robot that plays the attract mode (tools/pinballcheck.mjs has its twin) */
function makeBot(T,rng){const st=T.flips.map(()=>({hold:0,cool:0,wait:-1}));
  return function(S,dt){const inp={};
    T.flips.forEach((f,i)=>{const s=st[i];s.hold-=dt;s.cool-=dt;
      if(s.hold<=0&&s.cool<=0&&s.wait<0){for(const b of S.balls){if(b.m!=="table")continue;
        const tipx=f.px+f.side*f.len*0.87,dx=b.x-(f.px+tipx)/2,dy=b.y-(f.py+20);
        if(Math.abs(dx)<60&&dy>-60&&dy<40&&b.vy>-100){s.wait=rng()*0.12;break}}}
      if(s.wait>=0){s.wait-=dt;if(s.wait<0){s.hold=0.12+rng()*0.1;s.cool=0.3}}
      if(s.hold>0)inp[f.side>0?"L":"R"]=1});
    return inp}}

// ================================================================ play
let scene="title",TT=0,G=null,view={pull:0},acc=0,paused=false,overAt=0,result=null,card=null,shopTab=0,shopSel=null,shakeT=0;

/* the shelf's menu button only shows while the game is not being played */

function startGame(key,o){o=o||{};showTable(key);
  const use=o.use||{},opt={balls:o.daily?1:3+(use.extra?1:0),save:use.saver?30:(me.easy&&!o.daily?20:10),kickback:!o.daily&&me.easy,magnet:use.magnet?1:0,daily:!!o.daily};
  for(const k in use)if(use[k]&&me.items[k]>0)me.items[k]--;save();
  G=newGame(tableOf(key),opt);G.key=key;G.log=[];scene="play";paused=false;result=null;overAt=0;acc=0;view.pull=0;
  setMusic(key);if(me.games<3)G.tut=true}
function input(){
  let L=keyL,R=keyR,P=keyP;
  for(const t of touches.values()){if(t.btn)continue;if(t.side<0)L=true;else R=true}
  /* while a ball waits in the shooter lane, the right side is the plunger */
  const wait=G.S.balls.find(b=>b.m==="plunger"&&!b.auto);
  if(wait){let pulling=P;for(const t of touches.values())if(!t.btn&&t.side>0)pulling=true;
    if(pulling){view.pull=Math.min(1,view.pull+1/60/1.1);R=false}
    else if(view.pull>0.02){plunge(G,view.pull);view.pull=0}}
  else if(view.pull>0)view.pull=Math.max(0,view.pull-0.1);

function layout(){
  const d=dmdLayout();
  if(W>H)fitCamera(W,H,SAFE.t+8,SAFE.b+8,d.x+d.w+24*U,SAFE.r+70*U);
  else fitCamera(W,H,d.y+d.h+12*U,SAFE.b+8,SAFE.l+2,SAFE.r+2);
  R3.cam.userData.home=R3.cam.position.clone();
  resizeGL(W,H,Math.min(window.devicePixelRatio||1,pixelCap()));glExpect={w:glc.width,h:glc.height};layoutDirty=false}
/* The screen is watched on a timer as well as every few frames: a frame can
   take a while when a table is being built, and the canvas must still follow
   the screen (and put itself back if anything else resized it). */
let glExpect={w:0,h:0};
function sizeWatch(){resize();
  if(glc.width!==glExpect.w||glc.height!==glExpect.h||glc.style.width!==W+"px"||glc.style.height!==H+"px"||hud.style.height!==H+"px"){for(const c of [glc,hud]){c.style.width=W+"px";c.style.height=H+"px"}hud.width=Math.round(W*DPR);hud.height=Math.round(H*DPR);layoutDirty=true}
  if(layoutDirty&&R3)layout()}
setInterval(sizeWatch,200);
function playUpdate(dt){
  if(!paused&&!result){const inp=input();acc+=dt;let n=0;while(acc>=STEP&&n<160){gameStep(G,inp);acc-=STEP;n++}if(n>=160)acc=0}
  for(const f of G.fx){if(f.k==="flash")flash(f.col,f.long);else if(f.k==="sound"){sfx(f.s,f.n);voiceFor(f.s)}
    else if(f.k==="shake")shakeT=Math.max(shakeT,0.25*f.amt);else if(f.k==="nudge"){sfx("nudge");shakeT=Math.max(shakeT,0.12)}else if(f.k==="tilt")sfx("tilt")}
  G.fx.length=0;
  for(const e of G.log)sfxFor(e);G.log.length=0;
  /* missions are kept the moment they are done, not at the end of the game */
  while(G.newMissions.length){const i=G.newMissions.shift(),m=me.missions[G.key]||(me.missions[G.key]=[0,0,0,0,0]);if(!G.opt.daily&&!m[i]){m[i]=1;G.fresh=(G.fresh||[]).concat(i);me.coins+=10;save()}}
  lightsNow(G);syncScene(G,TB.H,dt,view);rollUpdate(G.S.balls.filter(b=>b.m!=="gone"));
  if(G.over&&!result){if(!overAt)overAt=TT;if(TT-overAt>2.2)finishGame()}}
function voiceFor(s){const v={goal:"Goal!",multiball:"Multiball!",jackpot:"Jackpot!",skill:"Skill shot!",extra:"Extra ball!",mission:"Mission complete!",save:"Ball saved!"}[s];if(v)callout(v)}
function sfxFor(e){switch(e.k){case"flip":sfx("flip");break;case"flipOff":sfx("flipOff");break;case"flipHit":sfx("flipHit",e.v);break;
  case"bumper":sfx("bumper");break;case"sling":sfx("sling");break;case"drop":sfx("drop");break;case"target":case"hit":sfx("target");break;case"roll":sfx("roll");break;
  case"spinner":sfx("spinner",e.spins);break;case"scoop":sfx("scoop");break;case"eject":sfx("eject");break;case"pathIn":sfx("pathIn");break;case"path":sfx("path");break;
  case"pathFail":sfx("pathFail");break;case"launch":sfx("launch",e.power);break;case"thud":sfx("thud",e.v);break;case"clack":sfx("clack",e.v);break}}

  const coins=Math.min(60,Math.floor(sc/100000))+(g.opt.daily?15:0);me.coins+=coins;

    case"tennis":g.fillStyle="#d8f03c";g.fillRect(0,0,256,128);speckle(g,0,0,256,128,1500,["rgba(255,255,255,0.25)","rgba(120,140,0,0.25)"],2,3);g.strokeStyle="#fff";g.lineWidth=7;g.beginPath();for(let x=0;x<=256;x+=4)g.lineTo(x,64+Math.sin(x/256*TAU*2)*34);g.stroke();break;
    case"pixel":for(let i=0;i<16;i++)for(let j=0;j<8;j++){g.fillStyle=["#5c940d","#74b816","#8ce99a","#2b8a3e"][(i*7+j*3)%4];g.fillRect(i*16,j*16,16,16)}break;
    case"crystal":fill("#e5dbff","#7048e8");{const R=rnd(4);for(let i=0;i<30;i++){g.fillStyle="rgba(255,255,255,"+(0.2+R()*0.4)+")";g.fillRect(R()*256,R()*128,3,3)}}break;
    case"moon":g.fillStyle="#b8bcc4";g.fillRect(0,0,256,128);for(let i=0;i<40;i++){const x=(i*97)%256,y=(i*53)%128,r=3+(i*7)%10;g.fillStyle="rgba(80,85,95,0.5)";g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.fillStyle="rgba(230,232,236,0.4)";g.beginPath();g.arc(x-1,y-1,r*0.6,0,TAU);g.fill()}break;
    case"rainbow":["#ff6b6b","#ffa94d","#ffd43b","#69db7c","#4dabf7","#9775fa"].forEach((c2,i)=>{g.fillStyle=c2;g.fillRect(0,i*128/6,256,128/6+1)});break;
    case"fire":fill("#ffe066","#e03131");{const R=rnd(5);for(let i=0;i<60;i++){g.fillStyle="rgba(255,120,0,0.4)";g.beginPath();g.arc(R()*256,R()*128,4+R()*10,0,TAU);g.fill()}}break;
    default:fill("#f1f3f5","#6c757d")}
  ballCanvases[id]=c;return c}
function setBallSkin(id){if(!TB)return;const mats=R3.cache.ballMats||(R3.cache.ballMats={});
  let m=mats[id];
  if(!m&&id!=="chrome"){const tex=new THREE.CanvasTexture(ballCanvas(id));tex.colorSpace=THREE.SRGBColorSpace;
    m=id==="gold"?new THREE.MeshStandardMaterial({color:0xffc94d,metalness:1,roughness:0.12}):
      id==="crystal"?new THREE.MeshPhysicalMaterial({map:tex,metalness:0,roughness:0.05,transparent:true,opacity:0.88,clearcoat:1}):
      id==="fire"?new THREE.MeshStandardMaterial({map:tex,emissive:0xff5500,emissiveIntensity:0.6,roughness:0.4}):
      new THREE.MeshPhysicalMaterial({map:tex,roughness:id==="tennis"?0.9:0.35,clearcoat:id==="tennis"?0:0.8,metalness:0});
    m.userData.keep=true;mats[id]=m}
  if(m&&TB.env&&(id==="gold"||id==="crystal")){m.envMap=TB.env;m.needsUpdate=true}
  for(const b of TB.H.balls){if(!b.userData.chrome)b.userData.chrome=b.material;b.material=id==="chrome"?b.userData.chrome:m}
  TB.skin=id}

// ================================================================ speed
/* Phones differ a lot. Play is timed as it goes; a table that cannot keep up
   first loses its shadows, then some sharpness. */
let paceN=0,paceSum=0,paceLevel=0;
function pixelCap(){return paceLevel>=2?1:paceLevel>=1?1.5:2}
function watchPace(dt){if(paceLevel>=2)return;paceN++;paceSum+=dt;if(paceN<120)return;const avg=paceSum/paceN;paceN=0;paceSum=0;
  if(avg>1/42){paceLevel++;lowFx=true;if(paceLevel===1){R3.r.shadowMap.enabled=false;R3.sc.traverse(o=>{if(o.material)o.material.needsUpdate=true})}layoutDirty=true}}

// ================================================================ input
function hitBtn(p){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b}return null}
function onMenu(t){try{return!!(t&&t.closest&&t.closest("[id^=shelf-menu]"))}catch(e){return false}}
/* a touch on a button is a button; anywhere else in play it is a flipper,
   by which half of the screen it landed on */
function press(p,id){const b=hitBtn(p);if(b){touches.set(id,{btn:true});sfx("tap");b.fn();return}
  if(scene==="play"&&G&&!paused&&!result)touches.set(id,{side:p.x<W/2?-1:1,y0:p.y,t0:performance.now()})}
let evN=0,lastTouch=0;
window.addEventListener("touchstart",e=>{lastTouch=performance.now();evN++;audioWake();for(const t of e.changedTouches){if(onMenu(t.target))continue;press({x:t.clientX,y:t.clientY},t.identifier)}},{passive:false});
/* a quick flick up the screen nudges the table */
window.addEventListener("touchmove",e=>{for(const t of e.changedTouches){const q=touches.get(t.identifier);if(!q||q.btn||q.nudged)continue;
  if(q.y0-t.clientY>60*U&&performance.now()-q.t0<260&&G){q.nudged=true;gameNudge(G,q.side*0.6)}}},{passive:true});
/* a finger the browser no longer lists is let go, whatever happened to its
   touchend: a system swipe can eat one, and a flipper that never drops is a
   game that cannot be played */
function tend(e){lastTouch=performance.now();evN++;audioWake();for(const t of e.changedTouches)touches.delete(t.identifier);
  const live=new Set();for(const t of e.touches)live.add(t.identifier);for(const id of [...touches.keys()])if(typeof id==="number"&&!live.has(id))touches.delete(id)}
window.addEventListener("touchend",tend);window.addEventListener("touchcancel",tend);
window.addEventListener("mousedown",e=>{if(performance.now()-lastTouch<900||onMenu(e.target))return;audioWake();press({x:e.clientX,y:e.clientY},"m")});
window.addEventListener("mouseup",()=>touches.delete("m"));
const isL=e=>e.key==="ArrowLeft"||e.key==="z"||e.key==="Z"||e.key==="Shift"&&e.location===1,isR=e=>e.key==="ArrowRight"||e.key==="/"||e.key==="m"||e.key==="M"||e.key==="Shift"&&e.location===2,isP=e=>e.key===" "||e.key==="Enter"||e.key==="ArrowDown";
window.addEventListener("keydown",e=>{audioWake();
  if(isL(e)){keyL=true;e.preventDefault()}if(isR(e)){keyR=true;e.preventDefault()}if(isP(e)){keyP=true;e.preventDefault()}
  if((e.key==="ArrowUp"||e.key==="n")&&G&&scene==="play")gameNudge(G,0);
  if(e.key==="Escape"||e.key==="p"){if(scene==="play"&&!result)paused=!paused;else if(scene!=="title"&&scene!=="play")scene="title"}});
window.addEventListener("keyup",e=>{if(isL(e))keyL=false;if(isR(e))keyR=false;if(isP(e))keyP=false});
window.addEventListener("blur",()=>{touches.clear();keyL=keyR=keyP=false});
document.addEventListener("visibilitychange",()=>{if(document.hidden){touches.clear();keyL=keyR=keyP=false;if(scene==="play"&&G&&!result)paused=true}});
window.__shelfInput=()=>"touches:"+touches.size+" events:"+evN+" scene:"+scene;

// ================================================================ loop
let last=0,sizeTick=0,nudgeT=0;
function frame(ts){requestAnimationFrame(frame);const now=ts/1000;let dt=last?now-last:1/60;last=now;dt=Math.min(Math.max(dt,0),0.1);TT+=dt;
  if((sizeTick=(sizeTick+1)%5)===0)sizeWatch();if(TT-nudgeT>1){nudgeT=TT;audioNudge()}musicTick();
  if(pending&&pendingShown>=2){const p=pending;pending=null;showTable(p.key);p.fn();if(layoutDirty)layout()}
  if(layoutDirty)layout();
  btns=[];
  if(scene==="play"&&G){watchPace(dt);playUpdate(dt)}
  else{if(!musKey)setMusic("menu");if(TB&&!pending)demoUpdate(dt);rollUpdate([])}
  /* the camera shakes a touch for nudges and explosions */
  if(R3.cam.userData.home){R3.cam.position.copy(R3.cam.userData.home);if(shakeT>0){shakeT=Math.max(0,shakeT-dt);const a=shakeT*16;R3.cam.position.x+=(Math.random()-0.5)*a;R3.cam.position.z+=(Math.random()-0.5)*a}}
  renderFrame(dt);
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,hud.width,hud.height);
  drawDMD(scene==="play"?G:demo,scene!=="play");
  screenXf();
  if(scene==="play"&&G){drawPlayHUD();if(paused)drawPause();if(result)drawResult()}
  else if(scene==="title")drawTitle();else if(scene==="who")drawWho();else if(scene==="tables")drawTables();else if(scene==="card")drawCard();else if(scene==="shop")drawShop();
  if(pending){btns=[];drawLoading();pendingShown++}
  drawToast();
  window.__frames=(window.__frames||0)+1}
initGL(glc);later(new URLSearchParams(location.search).get("t")||store.get("last","goal"),()=>{});
requestAnimationFrame(frame);
/* for the checks in tools/: start a game, press the flippers, read the game */
window.PB={get G(){return G},get TB(){return TB},get scene(){return scene},R3,get lowFx(){return lowFx},get me(){return me},
  start(key,o){startGame(key||"goal",o||{})},card(key,daily){card={key,daily:!!daily,use:{}};scene="card"},plunge(p){if(G)plunge(G,p)},flip(side,on){if(side<0)keyL=on;else keyR=on},go(s){scene=s},
  step(n){for(let i=0;i<n;i++)gameStep(G,{L:keyL,R:keyR})},tableOf,showTable,
  /* how long a table takes to paint and build, for tools/ */
  timeTable(key){const t0=performance.now();const pf=paintPlayfield(tableOf(key),THEMES[key]);const t1=performance.now();const keep=PXMM;PXMM=0.42;paintPlayfield(tableOf(key),THEMES[key]);PXMM=keep;const t2=performance.now();
    curKey="";showTable(key);const t3=performance.now();return{paint:Math.round(t1-t0),thumb:Math.round(t2-t1),build:Math.round(t3-t2)}},finish(){if(G){G.over=true;finishGame()}}};
</script></body></html>
