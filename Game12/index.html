// Six-a-side arcade football, built the way Sensible Soccer was: the ball is
// never owned. It is a free body that players knock ahead of themselves, so
// dribbling is a run of touches, a tackle is getting your body there first,
// and nothing in the game is decided by a dice roll. One button kicks, and
// holding a direction after the kick bends the ball through the air.
// Sophia, Rory and Dylan Games, Inc.

// ---------------------------------------------------------------- audio
let AC=null,master=null,crowdGain=null,noiseBuf=null;
function audioInit(){if(AC)return;
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
  const n=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=420;f.Q.value=0.6;
  crowdGain=AC.createGain();crowdGain.gain.value=0;src.connect(f);f.connect(crowdGain);crowdGain.connect(master);src.start()}catch(e){}}
function tone(f0,f1,dur,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02)}
function noise(dur,vol,freq,delay){if(!AC||!noiseBuf)return;const t=AC.currentTime+(delay||0);
 const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=freq||800;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02)}
let crowdLevel=0;
function setCrowd(v){crowdLevel=v;if(crowdGain&&AC)crowdGain.gain.setTargetAtTime(v,AC.currentTime,0.3)}

 kick(p){noise(0.07,0.22+0.32*p,700+700*p);tone(150,60,0.09,"sine",0.18+0.1*p)},

 touch(){noise(0.03,0.07,900)},
 whistle(n){for(let i=0;i<(n||1);i++){tone(2200,2300,0.32,"square",0.06,i*0.42);tone(2900,2800,0.32,"sine",0.05,i*0.42)}},
 goal(){if(!AC)return;[523,659,784,1047].forEach((f,i)=>tone(f,f,0.3,"square",0.12,i*0.12));noise(2.5,0.5,900,0);
  setCrowd(0.9);setTimeout(()=>setCrowd(0.22),3000)},
 post(){tone(900,480,0.26,"triangle",0.3);noise(0.08,0.2,1200)},
 save(){noise(0.16,0.3,420);tone(200,120,0.12,"sine",0.14)},
 tackle(){noise(0.12,0.3,320);tone(150,80,0.12,"sawtooth",0.15)},

            normal:{name:"NORMAL",speed:0.97,react:0.18,gkReact:0.16,gkSpeed:0.92,gkDive:0.95,aim:0.11,pass:0.12},
            hard  :{name:"HARD",  speed:1.05,react:0.10,gkReact:0.09,gkSpeed:1.08,gkDive:1.15,aim:0.05,pass:0.06}};

// ---------------------------------------------------------------- state

let cfg={mode:"1p",team:save.team||0,opp:1,diff:"normal",half:60,cup:false};
let M=null,cup=null,pk=null;
let shake=0,goalFlash=0;
function btn(x,y,w,h,label,cb,opt){buttons.push({x,y,w,h,label,cb,opt:opt||{}})}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);

function text(s,x,y,size,color,align,noStroke){cx.font="bold "+size+"px sans-serif";cx.textAlign=align||"center";cx.textBaseline="middle";
 if(!noStroke){cx.lineWidth=Math.max(3,size/7);cx.strokeStyle="rgba(0,0,0,0.6)";cx.lineJoin="round";cx.strokeText(s,x,y)}
 cx.fillStyle=color||"#fff";cx.fillText(s,x,y)}
function textFit(s,x,y,size,color,maxw,align){cx.font="bold "+size+"px sans-serif";const w=cx.measureText(s).width;
 text(s,x,y,w>maxw?Math.max(10,Math.floor(size*maxw/w)):size,color,align)}

// ---------------------------------------------------------------- input
// One thumb steers from anywhere in its half of the screen; one button does
// everything else. A tap on the button near the ball is a pass, a hold is a
// shot, and the same button away from the ball switches player or slides.
function mkPad(){return{stick:{id:null,ox:0,oy:0,dx:0,dy:0,mag:0},K:{id:null,down:false,pressed:false,released:false,held:0},
 zone:{x:0,y:0,w:0,h:0},bK:{x:0,y:0,r:0},rot:0}}
const pads=[mkPad(),mkPad()];
function padLayout(){const SB=SAFE.b,SL=SAFE.l,SR=SAFE.r;
 if(cfg.mode==="2p"){const bw=Math.min(210,W*0.22);
  Object.assign(pads[0].zone,{x:0,y:0,w:bw,h:H*0.5});pads[0].bK={x:bw*0.5,y:H*0.78,r:Math.min(46,bw*0.26)};pads[0].rot=Math.PI/2;
  Object.assign(pads[1].zone,{x:W-bw,y:H*0.5,w:bw,h:H*0.5});pads[1].bK={x:W-bw*0.5,y:H*0.22,r:Math.min(46,bw*0.26)};pads[1].rot=-Math.PI/2}
 else{Object.assign(pads[0].zone,{x:0,y:H*0.12,w:W*0.6,h:H*0.88});
  pads[0].bK={x:W-92-SR,y:H-104-SB,r:58};pads[0].rot=0;
  Object.assign(pads[1].zone,{x:0,y:0,w:0,h:0})}}
const ptrs=new Map();
function inRect(p,z){return z.w>0&&p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h}
function inBtn(p,b){return b.r>0&&dist(p.x,p.y,b.x,b.y)<b.r*1.35}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function onMenu(el){for(;el;el=el.parentNode)if(el.id&&String(el.id).indexOf("shelf-menu")===0)return true;return false}
let lastTouchAt=0;
const ghostMouse=()=>performance.now()-lastTouchAt<900;
function ptrDown(e){audioInit();const p=pos(e);ptrs.set(e.pointerId,p);
 if(scene!=="play"&&scene!=="pk"){if(uiTap(p))return;return}
 for(const pad of pads){if(inBtn(p,pad.bK)&&pad.K.id===null){pad.K.id=e.pointerId;pad.K.down=true;pad.K.pressed=true;pad.K.held=0;return}}
 for(const pad of pads){if(inRect(p,pad.zone)&&pad.stick.id===null){pad.stick.id=e.pointerId;pad.stick.ox=p.x;pad.stick.oy=p.y;
  pad.stick.dx=pad.stick.dy=pad.stick.mag=0;return}}}
function ptrMove(e){const p=pos(e);ptrs.set(e.pointerId,p);
 for(const pad of pads){if(pad.stick.id===e.pointerId){const dx=p.x-pad.stick.ox,dy=p.y-pad.stick.oy,d=Math.hypot(dx,dy);
  const R=46;if(d>R*1.6){pad.stick.ox+=(d-R*1.6)*dx/d;pad.stick.oy+=(d-R*1.6)*dy/d}
  const dx2=p.x-pad.stick.ox,dy2=p.y-pad.stick.oy,d2=Math.hypot(dx2,dy2);
  if(d2>5){pad.stick.dx=dx2/d2;pad.stick.dy=dy2/d2;pad.stick.mag=Math.min(1,d2/R)}else{pad.stick.dx=pad.stick.dy=pad.stick.mag=0}}}}
function ptrUp(e){ptrs.delete(e.pointerId);
 for(const pad of pads){if(pad.stick.id===e.pointerId){pad.stick.id=null;pad.stick.dx=pad.stick.dy=pad.stick.mag=0}
  if(pad.K.id===e.pointerId){pad.K.id=null;pad.K.down=false;pad.K.released=true}}}
cv.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&ghostMouse())return;if(e.pointerType!=="mouse")lastTouchAt=performance.now();
 if(onMenu(e.target))return;ptrDown(e)});
window.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")lastTouchAt=performance.now();ptrMove(e)});
window.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")lastTouchAt=performance.now();ptrUp(e)});
window.addEventListener("pointercancel",ptrUp);
window.addEventListener("blur",()=>{for(const pad of pads){pad.stick.id=null;pad.stick.mag=0;pad.K.id=null;pad.K.down=false}});
const keys={};
window.addEventListener("keydown",e=>{audioInit();if(keys[e.code])return;keys[e.code]=true;
 if(e.code==="Space"||e.code==="KeyZ"){pads[0].K.down=true;pads[0].K.pressed=true;pads[0].K.held=0}
 if(e.code==="Enter"&&scene!=="play"&&buttons.length)buttons[0].cb();
 if(e.code==="KeyP"||e.code==="Escape"){if(scene==="play"){scene="pause"}else if(scene==="pause")scene="play"}});
window.addEventListener("keyup",e=>{keys[e.code]=false;
 if(e.code==="Space"||e.code==="KeyZ"){pads[0].K.down=false;pads[0].K.released=true}});
function keyStick(){const s=pads[0].stick;if(s.id!==null)return;
 let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
 let dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
 const d=Math.hypot(dx,dy);if(d>0){s.dx=dx/d;s.dy=dy/d;s.mag=1}else{s.dx=s.dy=s.mag=0}}
function padEndFrame(){for(const pad of pads){pad.K.pressed=false;pad.K.released=false}}
// The screen may be rotated so that you always attack up it. Input is rotated
// back by the same angle, so "up the screen" is always "toward their goal".
function stickWorld(pad){const s=pad.stick;if(s.mag<0.06)return{x:0,y:0,mag:0};
 const a=-(VIEW.rot+pad.rot),c=Math.cos(a),si=Math.sin(a);
 return{x:s.dx*c-s.dy*si,y:s.dx*si+s.dy*c,mag:s.mag}}
// ---------------------------------------------------------------- match
// The kick reach is wider than the control reach: while you charge a shot the
// ball keeps running ahead of you, and it should still be yours to hit.
const CTRL_R=15.5,KICK_R=27,TOUCH_CD=0.15;
// Aftertouch turns the ball at a steady rate rather than pushing it sideways
// with a fixed force. A force keeps bending harder as the ball slows down, so
// a held stick used to spiral it almost back the way it came.
const BENDR=1.75,LIFT=330;      // radians per second of curl, and lift
const SP_BASE=168,SP_SPRINT=208;
function mkPlayer(team,slot,i){return{team,slot,i,n:slot.n,role:slot.role,x:0,y:0,vx:0,vy:0,face:0,anim:0,
 dx:0,dy:0,sprint:false,kickCd:0,touchCd:0,slide:0,sdx:0,sdy:0,down:0,think:0,react:0,dive:0,diveDir:0,diveT:0,
 seen:0,speed:1,skin:["#f1c27d","#e0ac69","#8d5524","#c68642","#ffdbac"][(i*7+team*3)%5]}}
function newMatch(c){const t0=TEAMS[c.team],t1=TEAMS[c.opp];
 M={teams:[{def:t0,dir:1,score:0,human:c.mode!=="cpu"?0:-1,ai:DIFF[c.diff]},
           {def:t1,dir:-1,score:0,human:c.mode==="2p"?1:-1,ai:DIFF[c.diff]}],
    players:[],ball:{x:PW/2,y:PH/2,z:0,vx:0,vy:0,vz:0,spin:0,last:null,lastTeam:0,bendT:0,bendPad:-1,shotT:-9,saved:false},
    ctrl:[null,null],switchCd:[0,0],half:1,halfLen:c.half,clock:0,phase:"kickoff",phaseT:0,
    msg:"",msgT:0,cam:{x:PW/2,y:PH/2},protect:0,kickoffTeam:0,restartFor:-1,shots:[0,0],
    stats:{touches:0,tackles:0,saves:0,posts:0},winner:-2,simT:0};
 for(let t=0;t<2;t++)for(const s of SLOTS)M.players.push(mkPlayer(t,s,M.players.length));
 for(const p of M.players){const T=M.teams[p.team];p.speed=T.def.speed*(T.human>=0?1:T.ai.speed)}
 setupKickoff(0);M.kickoffTeam=0}
function slotWorld(p,fx,fy){const d=M.teams[p.team].dir;return{x:d>0?fx*PW:(1-fx)*PW,y:fy*PH}}
function homePos(p){return slotWorld(p,p.slot.fx,p.slot.fy)}
function placeAll(){for(const p of M.players){const h=homePos(p);p.x=h.x;p.y=h.y;p.vx=p.vy=0;
 p.slide=0;p.down=0;p.dive=0;p.diveT=0;p.kickCd=0;p.touchCd=0;p.face=M.teams[p.team].dir>0?0:Math.PI}}
function goalX(t){return M.teams[t].dir>0?PW:0}
function ownGoalX(t){return M.teams[t].dir>0?0:PW}
function ballStop(){const b=M.ball;b.vx=b.vy=b.vz=0;b.z=0;b.bendT=0;b.saved=false}
function setupKickoff(team){placeAll();const b=M.ball;b.x=PW/2;b.y=PH/2;ballStop();b.last=null;b.lastTeam=team;
 // the side kicking off starts with someone on the ball, the other side is held back
 const T=M.teams[team];
 for(const p of M.players){if(p.team!==team&&dist(p.x,p.y,PW/2,PH/2)<110){const a=Math.atan2(p.y-PH/2,p.x-PW/2||0.01);
  p.x=PW/2+Math.cos(a)*115;p.y=PH/2+Math.sin(a)*115}}
 const taker=M.players.find(p=>p.team===team&&p.role==="MF");
 taker.x=PW/2-M.teams[team].dir*16;taker.y=PH/2;
 if(T.human>=0)M.ctrl[team]=taker;
 M.phase="kickoff";M.phaseT=0;M.protect=0.5;M.cam.x=PW/2;M.cam.y=PH/2}
function restart(kind,team,x,y){const b=M.ball;b.x=clamp(x,4,PW-4);b.y=clamp(y,4,PH-4);ballStop();b.lastTeam=team;b.last=null;
 M.protect=0.65;M.restartFor=team;M.phase="play";
 // pull the other side back out of the way and bring a taker to the ball
 for(const p of M.players){if(p.team!==team&&p.role!=="GK"){const d=dist(p.x,p.y,b.x,b.y);
  if(d<70){const a=Math.atan2(p.y-b.y,p.x-b.x||0.01);p.x=b.x+Math.cos(a)*72;p.y=b.y+Math.sin(a)*72}}}
 let taker=null,bd=1e9;
 for(const p of M.players){if(p.team!==team||p.role==="GK")continue;const d=dist(p.x,p.y,b.x,b.y);if(d<bd){bd=d;taker=p}}
 if(kind==="goalkick")taker=M.players.find(p=>p.team===team&&p.role==="GK");
 if(taker){const a=Math.atan2(PH/2-b.y,goalX(team)-b.x);taker.x=b.x-Math.cos(a)*13;taker.y=b.y-Math.sin(a)*13;
  taker.vx=taker.vy=0;taker.kickCd=0;taker.touchCd=0;if(M.teams[team].human>=0)M.ctrl[team]=taker}
 const names={throwin:"THROW IN",corner:"CORNER",goalkick:"GOAL KICK"};
 M.msg=names[kind]||"";M.msgT=1.1}
function nearestPlayer(team,x,y,outfield,excl){let best=null,bd=1e9;

  cx.fillStyle="#fff";cx.fillRect(mx+M.ball.x/PW*mw-2,my+M.ball.y/PH*mh-2,4,4)}
 for(const pad of pads){drawStick(pad);drawButton(pad,"KICK")}
 // the reminder fades once the match is under way
 if(cfg.mode!=="2p"&&M.simT<11){cx.globalAlpha=Math.min(0.8,(11-M.simT)/3);
  text("hold to shoot  ·  steer after the kick to bend it",W/2,H-14-SB,13,"#dfe","center");cx.globalAlpha=1}}
function drawMatch(){viewSetup();
 const sx=(Math.random()-0.5)*shake*10,sy=(Math.random()-0.5)*shake*10;
 cx.save();cx.translate(sx,sy);
 drawPitch();drawGoals();
 const order=M.players.slice().sort((a,b)=>a.y-b.y);
 for(const p of order)drawPlayer(p);
 drawBall();
 cx.restore();
 if(goalFlash>0){cx.fillStyle="rgba(255,255,255,"+goalFlash*0.4+")";cx.fillRect(0,0,W,H)}
 drawHUD()}
// ---------------------------------------------------------------- screens
function drawTitle(){cx.fillStyle="#14401f";cx.fillRect(0,0,W,H);
 for(let i=0;i<16;i++){cx.fillStyle=i%2?"rgba(255,255,255,0.03)":"rgba(0,0,0,0.05)";cx.fillRect(i*W/16,0,W/16+1,H)}
 const bob=Math.sin(frameT*2)*5;
 buttons=[];
 const bw=Math.min(330,W-60),bh=Math.min(58,H*0.09);
 // centre the whole block rather than hanging it off the top
 const contentH=Math.min(74,W/8)+64+3*(bh+12)+40;
 const top=Math.max(SAFE.t+16,(H-contentH)/2);
 const ty=top+Math.min(74,W/8)*0.5;
 textFit("SUPER STRIKERS",W/2+3,ty+3+bob,Math.min(74,W/8),"#0b2410",W-40);
 textFit("SUPER STRIKERS",W/2,ty+bob,Math.min(74,W/8),"#ffe14d",W-40);
 textFit("One button. Bend it after you hit it.",W/2,ty+Math.min(74,W/8)*0.5+26,Math.min(20,W/22),"#dff0e2",W-60);
 const y0=ty+Math.min(74,W/8)*0.5+62;
 btn(W/2-bw/2,y0,bw,bh,"QUICK MATCH",()=>{cfg.mode="1p";cfg.cup=false;scene="setup"},{fill:"#2a8a3a",size:23});
 btn(W/2-bw/2,y0+bh+12,bw,bh,"CUP  ·  3 ROUNDS",()=>{cfg.mode="1p";cfg.cup=true;scene="setup"},{fill:"#b8860b",size:23});
 btn(W/2-bw/2,y0+2*(bh+12),bw,bh,"2 PLAYERS, 1 iPAD",()=>{cfg.mode="2p";cfg.cup=false;scene="setup"},{fill:"#2a4a8a",size:21});
 const st="Cups "+(save.cups||0)+"   ·   Won "+(save.wins||0)+" of "+(save.played||0);
 text(st,W/2,y0+3*(bh+12)+26,16,"#bfe6c6");
 drawButtons()}
function drawSetup(){cx.fillStyle="#14401f";cx.fillRect(0,0,W,H);
 buttons=[];const narrow=W<660;
 const cols=narrow?2:4,cw=Math.min(150,(W-40)/cols-10),ch=58,x0=W/2-(cols*(cw+10)-10)/2;
 const rowsN=Math.ceil(TEAMS.length/cols);
 const contentH=44+rowsN*(ch+10)+(cfg.cup?10:70)+96+60;
 const top=Math.max(SAFE.t+10,(H-contentH)/2);
 textFit(cfg.cup?"PICK YOUR TEAM FOR THE CUP":"PICK THE TEAMS",W/2,top+16,Math.min(30,W/16),"#ffe14d",W-40);
 const y0=top+44;
 TEAMS.forEach((T,i)=>{const r=Math.floor(i/cols),c=i%cols,x=x0+c*(cw+10),y=y0+r*(ch+10);
  const mine=i===cfg.team,theirs=i===cfg.opp&&!cfg.cup;
  cx.fillStyle=mine?"rgba(255,225,77,0.25)":theirs?"rgba(120,180,255,0.2)":"rgba(0,0,0,0.3)";rr(x,y,cw,ch,10);cx.fill();
  cx.lineWidth=mine||theirs?3:1.5;cx.strokeStyle=mine?"#ffe14d":theirs?"#7fb4ff":"rgba(255,255,255,0.3)";cx.stroke();
  cx.fillStyle=T.kit;rr(x+6,y+6,16,ch-12,4);cx.fill();
  cx.fillStyle=T.kit2;rr(x+24,y+6,7,ch-12,3);cx.fill();
  textFit(T.short,x+cw/2+14,y+20,19,"#fff",cw-46);
  textFit(T.name.split("'")[0],x+cw/2+14,y+40,12,"#cfe",cw-46);
  btn(x,y,cw,ch,"",()=>{if(cfg.cup){cfg.team=i}else{if(i===cfg.team)return;
   if(i===cfg.opp)cfg.opp=cfg.team;cfg.team=i}},{fill:"rgba(0,0,0,0)",stroke:"rgba(0,0,0,0)"})});
 const rows=rowsN,yb=y0+rows*(ch+10)+10;
 if(!cfg.cup){text("tap a team to take it  ·  the other is your opponent",W/2,yb+2,13,"#bfe6c6");
  btn(W/2-120,yb+18,110,42,"SWAP",()=>{const a=cfg.team;cfg.team=cfg.opp;cfg.opp=a},{size:16});
  btn(W/2+10,yb+18,110,42,"OPPONENT",()=>{cfg.opp=(cfg.opp+1)%TEAMS.length;if(cfg.opp===cfg.team)cfg.opp=(cfg.opp+1)%TEAMS.length},{size:14})}
 const yd=yb+(cfg.cup?10:70);
 const diffs=["easy","normal","hard"];
 diffs.forEach((d,i)=>{const bw2=Math.min(104,(W-60)/3),x=W/2-(3*(bw2+8)-8)/2+i*(bw2+8);
  const sel=cfg.diff===d;cx.fillStyle=sel?"rgba(255,225,77,0.22)":"rgba(0,0,0,0.3)";rr(x,yd,bw2,40,9);cx.fill();
  cx.lineWidth=sel?3:1.5;cx.strokeStyle=sel?"#ffe14d":"rgba(255,255,255,0.3)";cx.stroke();
  textFit(DIFF[d].name,x+bw2/2,yd+20,16,sel?"#ffe14d":"#fff",bw2-10);
  btn(x,yd,bw2,40,"",()=>{cfg.diff=d},{fill:"rgba(0,0,0,0)",stroke:"rgba(0,0,0,0)"})});
 const halves=[[45,"SHORT"],[60,"NORMAL"],[90,"LONG"]];
 halves.forEach(([v,n],i)=>{const bw2=Math.min(104,(W-60)/3),x=W/2-(3*(bw2+8)-8)/2+i*(bw2+8),y=yd+48;
  const sel=cfg.half===v;cx.fillStyle=sel?"rgba(140,220,255,0.2)":"rgba(0,0,0,0.3)";rr(x,y,bw2,36,9);cx.fill();
  cx.lineWidth=sel?3:1.5;cx.strokeStyle=sel?"#7fd6ff":"rgba(255,255,255,0.3)";cx.stroke();
  textFit(n,x+bw2/2,y+18,14,sel?"#7fd6ff":"#fff",bw2-10);
  btn(x,y,bw2,36,"",()=>{cfg.half=v},{fill:"rgba(0,0,0,0)",stroke:"rgba(0,0,0,0)"})});
 const yg=yd+100;
 btn(W/2-150,yg,140,50,"BACK",()=>{scene="title"},{size:18});
 btn(W/2+10,yg,140,50,cfg.cup?"START CUP":"KICK OFF",()=>{save.team=cfg.team;store.set("save",save);
  if(cfg.cup){cup={round:0,opps:pickOpps(cfg.team,3),won:false,lost:false};scene="cup"}else startMatch()},{fill:"#2a8a3a",size:18});
 drawButtons()}
function pickOpps(mine,n){const pool=TEAMS.map((t,i)=>i).filter(i=>i!==mine);
 for(let i=pool.length-1;i>0;i--){const j=rint(0,i);const t=pool[i];pool[i]=pool[j];pool[j]=t}
 return pool.slice(0,n)}
function drawCup(){cx.fillStyle="#14401f";cx.fillRect(0,0,W,H);buttons=[];
 textFit("THE CUP",W/2,50+SAFE.t,Math.min(40,W/12),"#ffe14d",W-40);
 const names=["QUARTER-FINAL","SEMI-FINAL","FINAL"];
 const rowH=Math.min(66,H*0.11),y0=100+SAFE.t,bw=Math.min(520,W-40);
 for(let r=0;r<3;r++){const y=y0+r*(rowH+8),opp=TEAMS[cup.opps[r]];
  const state=r<cup.round?"WON":r===cup.round?(cup.lost?"LOST":"NEXT"):"";
  cx.fillStyle=r===cup.round&&!cup.lost?"rgba(255,225,77,0.15)":"rgba(255,255,255,0.07)";
  rr(W/2-bw/2,y,bw,rowH,10);cx.fill();
  cx.lineWidth=r===cup.round?3:1.5;cx.strokeStyle=r===cup.round?"#ffe14d":"rgba(255,255,255,0.25)";cx.stroke();
  textFit(names[r],W/2-bw/2+16,y+rowH/2,16,"#cfe","left");
  cx.fillStyle=opp.kit;rr(W/2+bw/2-150,y+10,14,rowH-20,4);cx.fill();
  textFit("vs "+opp.name,W/2+bw/2-130,y+rowH/2,16,"#fff","left");
  if(state)text(state,W/2+bw/2-30,y+rowH/2,15,state==="WON"?"#8dff5a":state==="LOST"?"#ff8080":"#ffe14d","right")}
 const yb=y0+3*(rowH+8)+20;
 if(cup.won){textFit("YOU WON THE CUP!",W/2,yb+10,Math.min(34,W/14),"#ffe14d",W-40);
  btn(W/2-110,yb+50,220,52,"BACK TO MENU",()=>{scene="title"},{fill:"#2a8a3a",size:18})}
 else if(cup.lost){textFit("Knocked out. Try again?",W/2,yb+10,Math.min(24,W/18),"#ff9090",W-40);
  btn(W/2-110,yb+46,220,52,"BACK TO MENU",()=>{scene="title"},{size:18})}
 else btn(W/2-120,yb,240,54,"PLAY "+names[cup.round],()=>startMatch(),{fill:"#2a8a3a",size:17});
 drawButtons()}
function startMatch(){
 // a cup match with no cup behind it should not be reachable, but a crash
 // here would take the whole game with it
 if(cfg.cup&&!cup)cup={round:0,opps:pickOpps(cfg.team,3),won:false,lost:false};
 cfg.opp=cfg.cup?cup.opps[Math.min(cup.round,2)]:cfg.opp;
 newMatch(Object.assign({},cfg));
 if(cfg.cup){const d=["easy","normal","hard"];const idx=Math.min(2,d.indexOf(cfg.diff)+cup.round);
  M.teams[1].ai=DIFF[d[idx]];for(const p of M.players)if(p.team===1)p.speed=M.teams[1].def.speed*M.teams[1].ai.speed}
 scene="play";audioInit();setCrowd(0.18);SFX.whistle(1);padLayout()}
function drawResult(){drawMatch();cx.fillStyle="rgba(4,14,8,0.78)";cx.fillRect(0,0,W,H);buttons=[];
 const won=M.winner===0,drew=M.winner===-1;
 textFit(won?"YOU WIN!":drew?"A DRAW":"YOU LOST",W/2,H*0.26,Math.min(56,W/10),won?"#ffe14d":drew?"#fff":"#ff9090",W-40);
 textFit(M.teams[0].def.short+"  "+M.teams[0].score+" - "+M.teams[1].score+"  "+M.teams[1].def.short,W/2,H*0.26+58,Math.min(32,W/16),"#fff",W-40);
 if(pk&&pk.shots[0].length)text("penalties "+pk.shots[0].filter(Boolean).length+" - "+pk.shots[1].filter(Boolean).length,W/2,H*0.26+96,18,"#cfe");
 text("shots "+M.shots[0]+" - "+M.shots[1]+"    saves "+M.stats.saves+"    tackles "+M.stats.tackles,W/2,H*0.26+126,15,"#bfe6c6");
 const y=H*0.64;
 if(cfg.cup&&!cup.won&&!cup.lost)btn(W/2-110,y,220,54,"NEXT ROUND",()=>{scene="cup"},{fill:"#2a8a3a",size:19});
 else if(cfg.cup)btn(W/2-110,y,220,54,"CUP TABLE",()=>{scene="cup"},{fill:"#2a8a3a",size:19});
 else btn(W/2-230,y,220,54,"PLAY AGAIN",()=>startMatch(),{fill:"#2a8a3a",size:19});
 btn(W/2+(cfg.cup?-110:10),y+(cfg.cup?62:0),220,54,"MENU",()=>{scene="title";pk=null},{size:19});
 drawButtons()}
function drawPause(){drawMatch();cx.fillStyle="rgba(4,14,8,0.75)";cx.fillRect(0,0,W,H);buttons=[];
 textFit("PAUSED",W/2,H*0.3,Math.min(52,W/10),"#ffe14d",W-40);
 btn(W/2-120,H*0.45,240,56,"KEEP PLAYING",()=>{scene="play"},{fill:"#2a8a3a",size:19});
 btn(W/2-120,H*0.45+68,240,56,"GIVE UP",()=>{scene="title"},{size:19});
 drawButtons()}
// ---------------------------------------------------------------- loop
function drawPK(){viewSetup();drawPitch();drawGoals();
 const order=M.players.slice().sort((a,b)=>a.y-b.y);
 for(const p of order)drawPlayer(p);
 drawBall();
 const ST=SAFE.t;
 const a=pk.shots[0].filter(Boolean).length,c=pk.shots[1].filter(Boolean).length;
 text("PENALTIES   "+M.teams[0].def.short+" "+a+" - "+c+" "+M.teams[1].def.short,W/2,28+ST,22,"#ffe14d");
 for(let t=0;t<2;t++){const y=58+ST+t*20;
  for(let i=0;i<Math.max(5,pk.shots[t].length);i++){const x=W/2-((Math.max(5,pk.shots[t].length))*18)/2+i*18;
   const s=pk.shots[t][i];cx.fillStyle=s===undefined?"rgba(255,255,255,0.2)":s?"#8dff5a":"#ff6060";
   cx.beginPath();cx.arc(x,y,6,0,TAU);cx.fill()}}
 if(M.msgT>0){cx.globalAlpha=Math.min(1,M.msgT*1.6);
  textFit(M.msg,W/2,H*0.3,Math.min(50,W/9),"#ffe14d",W-40);cx.globalAlpha=1}
 if(pk.phase==="ready"){const kT=M.teams[pk.kicker];
  textFit((kT.human>=0?"YOUR KICK":kT.def.short+" TO KICK")+"  ·  aim with the stick, hold to blast",
   W/2,H-30-SAFE.b,Math.min(17,W/26),"#dff0e2",W-30)}
 for(const pad of pads){drawStick(pad);drawButton(pad,"KICK")}}
function frame(ts){requestAnimationFrame(frame);
 const dt=Math.min(0.05,(ts-tPrev)/1000||0.016);tPrev=ts;frameT+=dt;
 if(shake>0)shake=Math.max(0,shake-dt*2.2);
 if(goalFlash>0)goalFlash=Math.max(0,goalFlash-dt*1.6);
 cx.setTransform(DPR,0,0,DPR,0,0);
 cx.fillStyle="#0d2a14";cx.fillRect(0,0,W,H);
 if(scene==="play"&&M){stepMatch(dt);drawMatch()}
 else if(scene==="pk"&&pk){pkStep(dt);drawPK()}
 else if(scene==="pause")drawPause();
 else if(scene==="result")drawResult();
 else if(scene==="cup")drawCup();
 else if(scene==="setup")drawSetup();
 else drawTitle();
 padEndFrame()}
window.__shelfPause=function(on){if(on&&scene==="play")scene="pause"};
bakePitch();layout();
requestAnimationFrame(frame);
window.SS12={get M(){return M},get scene(){return scene},set scene(v){scene=v},get cfg(){return cfg},
 get pads(){return pads},get safe(){return SAFE},startMatch,TEAMS,DIFF,
 sim(dt){if(scene==="play"&&M)stepMatch(dt)}};
</script>
