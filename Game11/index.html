// iOS lets a page start sound only inside a gesture it recognises, and a
// touchstart is not one - a touchend, a click or a key is. The context used
// to be made on touchstart and never resumed, so on a phone it could sit
// suspended with its clock at zero: the music scheduler wrote a bar into the
// void and stalled, and one-shot sounds went nowhere. Every gesture that
// counts now also wakes the context, and when it comes alive the scheduler,
// where there is one, re-anchors to now.
function audioWake(){audioInit();if(!AC)return;
