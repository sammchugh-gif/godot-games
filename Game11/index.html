 if(p.t==="plank"||p.t==="tramp"){const L=PIECES[p.t].len/2;s.push({ax:p.x-c*L,ay:p.y-sn*L,bx:p.x+c*L,by:p.y+sn*L,e:PIECES[p.t].e,th:7,piece:p})}
 else if(p.t==="curve"){const R=PIECES.curve.r,n=8;for(let i=0;i<n;i++){const a0=p.a+Math.PI*0.5*i/n,a1=p.a+Math.PI*0.5*(i+1)/n;s.push({ax:p.x+Math.cos(a0)*R,ay:p.y+Math.sin(a0)*R,bx:p.x+Math.cos(a1)*R,by:p.y+Math.sin(a1)*R,e:0.35,th:6,piece:p})}}

// ---------------------------------------------------------------- state
let hintOn=false,misses=0,trayDraw=false;

const progress=store.get("progress",{}),sandbox=store.get("sandbox",{slots:[null,null,null]});let sandboxSlot=0;
let buttons=[];function btn(x,y,w,h,label,cb,opt){buttons.push({x,y,w,h,label,cb,opt:opt||{}})}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function text(s,x,y,size,color,align,noStroke){cx.font="bold "+size+"px sans-serif";cx.textAlign=align||"center";cx.textBaseline="middle";if(!noStroke){cx.lineWidth=Math.max(3,size/7);cx.strokeStyle="rgba(0,0,0,0.6)";cx.lineJoin="round";cx.strokeText(s,x,y)}cx.fillStyle=color||"#fff";cx.fillText(s,x,y)}

function loadLevel(i){levelIdx=i;mode="puzzle";hintOn=false;misses=0;const L=LEVELS[i];pieces=L.fixed.map(p=>Object.assign({},p));trayCount=Object.assign({},L.tray);resetRun();scene="play"}

function saveSandbox(){if(mode!=="sandbox")return;sandbox.slots[sandboxSlot]=pieces.filter(p=>!p.fixed).map(p=>({t:p.t,x:p.x,y:p.y,a:p.a,link:p.link}));store.set("sandbox",sandbox)}
function resetRun(){running=false;won=false;lost=0;simT=0;marbles=[];trail=[];parts=[];resultT=0;cannonCd.clear();portalCd.clear();const L=mode==="puzzle"?level():null;starsGot=L?L.stars.map(()=>false):[];sel=null}
function spawnMarbles(){marbles=[];if(mode==="puzzle"){const L=level();marbles.push({x:L.spawn[0],y:L.spawn[1],vx:0,vy:0,r:12,col:"#ff5a5a",alive:true})}
 else{const cols=["#ff5a5a","#5ad0ff","#7fff6a","#ffd05a","#d07aff"];for(let i=0;i<5;i++)marbles.push({x:120+i*40,y:40,vx:0,vy:0,r:12,col:cols[i],alive:true,delay:i*0.5})}}

// ---------------------------------------------------------------- physics
function cupSegs(g){const e=0.25,th=4;return[{ax:g[0]-44,ay:g[1]-36,bx:g[0]-30,by:g[1]+20,e,th,piece:{t:"cup"}},{ax:g[0]+44,ay:g[1]-36,bx:g[0]+30,by:g[1]+20,e,th,piece:{t:"cup"}},{ax:g[0]-30,ay:g[1]+20,bx:g[0]+30,by:g[1]+20,e,th,piece:{t:"cup"}}]}
function step(dt){simT+=dt;const segs=[];for(const p of pieces)segs.push(...segsOf(p,simT));if(mode==="puzzle")segs.push(...cupSegs(level().goal));
 for(const m of marbles){if(!m.alive)continue;if(m.delay>0){m.delay-=dt;continue}
  m.vy+=900*dt;
  // fans
  for(const p of pieces){if(p.t!=="fan")continue;const c=Math.cos(p.a),s=Math.sin(p.a);const dx=m.x-p.x,dy=m.y-p.y;const along=-(dx*(-s)+dy*c)*-1;const lx=dx*c+dy*s,ly=dx*s-dy*c;
   // local: fan blows along its "up" (-y in local frame rotated by a)
   const lx2=dx*Math.cos(-p.a)-dy*Math.sin(-p.a),ly2=dx*Math.sin(-p.a)+dy*Math.cos(-p.a);
   if(Math.abs(lx2)<PIECES.fan.w/2&&ly2<0&&ly2>-PIECES.fan.h){const str=2600*(1-(-ly2)/PIECES.fan.h*0.5);const ux=Math.sin(p.a),uy=-Math.cos(p.a);m.vx+=ux*str*dt;m.vy+=uy*str*dt;m.vx*=0.995;m.vy*=0.995;if(Math.random()<0.3)parts.push({x:p.x+rnd(-20,20),y:p.y,vx:ux*rnd(150,300),vy:uy*rnd(150,300),life:0.5,col:"rgba(200,255,240,0.6)",r:3})}}
  m.x+=m.vx*dt;m.y+=m.vy*dt;
  // segments
  for(const sg of segs){const ex=sg.bx-sg.ax,ey=sg.by-sg.ay,L2=ex*ex+ey*ey||1;let t=((m.x-sg.ax)*ex+(m.y-sg.ay)*ey)/L2;t=clamp(t,0,1);const px=sg.ax+ex*t,py=sg.ay+ey*t;const dx=m.x-px,dy=m.y-py;const d=Math.hypot(dx,dy)||0.001;const R=m.r+sg.th;
   if(d<R){const nx=dx/d,ny=dy/d;m.x+=nx*(R-d);m.y+=ny*(R-d);let vn=m.vx*nx+m.vy*ny;
    let sv=0;if(sg.spin){const rx=px-sg.ax,ry=py-sg.ay;const pvx=-ry*sg.spin,pvy=rx*sg.spin;sv=pvx*nx+pvy*ny}
    if(vn<sv){const e=sg.e;const j=-(1+e)*(vn-sv);m.vx+=nx*j;m.vy+=ny*j;
     const tx=-ny,ty=nx;const vt=m.vx*tx+m.vy*ty;m.vx-=tx*vt*0.02;m.vy-=ty*vt*0.02;
     if(sg.piece.t==="tramp"){const sp=Math.hypot(m.vx,m.vy);if(sp<520){m.vx+=nx*(520-sp)*0.6;m.vy+=ny*(520-sp)*0.6}sg.piece.squish=1}
     if(Math.abs(j)>60)SFX.bounce(Math.abs(j));if(Math.abs(j)>200)parts.push({x:px,y:py,vx:nx*100,vy:ny*100,life:0.25,col:"#fff",r:4})}}}
  // bumpers, cannons, portals, stars, goal
  for(const p of pieces){
   if(p.t==="bumper"){const dx=m.x-p.x,dy=m.y-p.y,d=Math.hypot(dx,dy)||0.001,R=m.r+PIECES.bumper.r;if(d<R){const nx=dx/d,ny=dy/d;m.x+=nx*(R-d);m.y+=ny*(R-d);const vn=m.vx*nx+m.vy*ny;if(vn<0){m.vx-=nx*vn*2;m.vy-=ny*vn*2}const sp=Math.hypot(m.vx,m.vy);if(sp<420){m.vx+=nx*(420-sp);m.vy+=ny*(420-sp)}p.squish=1;SFX.bounce(500);for(let i=0;i<6;i++)parts.push({x:p.x,y:p.y,vx:rnd(-200,200),vy:rnd(-200,200),life:0.3,col:"#ffe080",r:4})}}
   else if(p.t==="cannon"){const d=dist(m.x,m.y,p.x,p.y);const cd=cannonCd.get(m)||0;if(d<PIECES.cannon.r+m.r&&simT>cd){cannonCd.set(m,simT+0.6);const ux=Math.cos(p.a),uy=Math.sin(p.a);m.x=p.x+ux*34;m.y=p.y+uy*34;m.vx=ux*760;m.vy=uy*760;SFX.cannon();p.squish=1;for(let i=0;i<10;i++)parts.push({x:m.x,y:m.y,vx:ux*rnd(100,400)+rnd(-100,100),vy:uy*rnd(100,400)+rnd(-100,100),life:0.4,col:"#ffb060",r:4})}}
