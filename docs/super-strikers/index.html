 const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=500;crowdGain=AC.createGain();crowdGain.gain.value=0;src.connect(f);f.connect(crowdGain);crowdGain.connect(master);src.start()}catch(e){}}
function tone(f0,f1,dur,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02)}

let crowdLevel=0;

const SFX={
 kick(p){noise(0.08,0.25+0.3*p,600+600*p);tone(120,60,0.08,"sine",0.2)},
 pass(){noise(0.06,0.2,500)},
 whistle(n){for(let i=0;i<(n||1);i++){tone(2200,2300,0.35,"square",0.06,i*0.45);tone(2900,2800,0.35,"sine",0.05,i*0.45)}},
 goal(){if(!AC)return;[523,659,784,1047].forEach((f,i)=>tone(f,f,0.3,"square",0.12,i*0.12));noise(2.5,0.5,900,0);setCrowd(0.9);setTimeout(()=>setCrowd(0.25),3000)},
 post(){tone(900,500,0.25,"triangle",0.3)},

 {name:"Sophia's Sharks",short:"SHA",kit:"#0aa5a5",kit2:"#111827",gk:"#e63946",skill:0.95,speed:1.0},
 {name:"Thunder Lions",short:"LIO",kit:"#f4c20d",kit2:"#111111",gk:"#3a86ff",skill:0.9,speed:1.02},
 {name:"Night Wolves",short:"WOL",kit:"#6c757d",kit2:"#7b2cbf",gk:"#80ed99",skill:0.9,speed:0.98},
 {name:"Ice Eagles",short:"EAG",kit:"#f1f5f9",kit2:"#38bdf8",gk:"#f97316",skill:0.92,speed:1.0},
 {name:"Jungle Tigers",short:"TIG",kit:"#f77f00",kit2:"#111111",gk:"#a7f3d0",skill:1.0,speed:1.03},
 {name:"Forest Bears",short:"BEA",kit:"#2d6a4f",kit2:"#b08968",gk:"#ffd166",skill:0.88,speed:0.96}];

// ---------------------------------------------------------------- state

let M=null;   // the match
let cup=null; // cup state
let pk=null;  // penalty shoot-out state
function btn(x,y,w,h,label,cb,opt){buttons.push({x,y,w,h,label,cb,opt:opt||{}})}

// ---------------------------------------------------------------- input
// A pad = one stick zone + two buttons (A pass/switch, B shoot/tackle).
function mkPad(){return{stick:{id:null,cx:0,cy:0,dx:0,dy:0,mag:0},A:{id:null,down:false,pressed:false,released:false,held:0},B:{id:null,down:false,pressed:false,released:false,held:0},zone:{x:0,y:0,w:0,h:0},bA:{x:0,y:0,r:0},bB:{x:0,y:0,r:0},rot:0}}
const pads=[mkPad(),mkPad()];
function padLayout(){
 if(cfg.mode==="2p"){const bw=Math.min(190,W*0.2);
  // player 1 at the left end, facing right: stick top half of the left band, buttons bottom half
  Object.assign(pads[0].zone,{x:0,y:0,w:bw,h:H*0.5});pads[0].bB={x:bw*0.62,y:H*0.72,r:Math.min(40,bw*0.24)};pads[0].bA={x:bw*0.36,y:H*0.88,r:Math.min(32,bw*0.19)};pads[0].rot=Math.PI/2;
  // player 2 at the right end, facing left: stick bottom half of the right band, buttons top half
  Object.assign(pads[1].zone,{x:W-bw,y:H*0.5,w:bw,h:H*0.5});pads[1].bB={x:W-bw*0.62,y:H*0.28,r:Math.min(40,bw*0.24)};pads[1].bA={x:W-bw*0.36,y:H*0.12,r:Math.min(32,bw*0.19)};pads[1].rot=-Math.PI/2}
 else{Object.assign(pads[0].zone,{x:0,y:H*0.15,w:W*0.55,h:H*0.85});pads[0].bB={x:W-84,y:H-96,r:54};pads[0].bA={x:W-196,y:H-64,r:42};pads[0].rot=0;Object.assign(pads[1].zone,{x:0,y:0,w:0,h:0})}}
const ptrs=new Map();
function inRect(p,z){return p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h}
cv.addEventListener("pointerdown",e=>{audioInit();const p={x:e.clientX,y:e.clientY};
 if(scene!=="match"&&scene!=="pk"){if(uiTap(p))return;if(scene==="match"||scene==="pk")return}
 if(scene==="match"||scene==="pk"){if(uiTap(p))return;
  for(const pad of pads){if(dist(p.x,p.y,pad.bB.x,pad.bB.y)<pad.bB.r+14&&pad.B.id===null){pad.B.id=e.pointerId;pad.B.down=true;pad.B.pressed=true;pad.B.held=0;return}
   if(dist(p.x,p.y,pad.bA.x,pad.bA.y)<pad.bA.r+14&&pad.A.id===null){pad.A.id=e.pointerId;pad.A.down=true;pad.A.pressed=true;pad.A.held=0;return}}
  for(const pad of pads){if(inRect(p,pad.zone)&&pad.stick.id===null){pad.stick.id=e.pointerId;pad.stick.cx=p.x;pad.stick.cy=p.y;pad.stick.dx=0;pad.stick.dy=0;pad.stick.mag=0;return}}}});
cv.addEventListener("pointermove",e=>{for(const pad of pads){const s=pad.stick;if(s.id===e.pointerId){let dx=e.clientX-s.cx,dy=e.clientY-s.cy;const d=Math.hypot(dx,dy),R=52;if(d>R){s.cx+=dx/d*(d-R);s.cy+=dy/d*(d-R);dx=dx/d*R;dy=dy/d*R}s.dx=dx/R;s.dy=dy/R;s.mag=Math.min(1,d/R)}}});
function ptrUp(e){for(const pad of pads){if(pad.stick.id===e.pointerId){pad.stick.id=null;pad.stick.dx=pad.stick.dy=pad.stick.mag=0}if(pad.A.id===e.pointerId){pad.A.id=null;pad.A.down=false;pad.A.released=true}if(pad.B.id===e.pointerId){pad.B.id=null;pad.B.down=false;pad.B.released=true}}}
cv.addEventListener("pointerup",ptrUp);cv.addEventListener("pointercancel",ptrUp);
const keys={};window.addEventListener("keydown",e=>{audioInit();if(keys[e.code])return;keys[e.code]=true;if(e.code==="KeyZ"||e.code==="Space"){pads[0].A.down=true;pads[0].A.pressed=true;pads[0].A.held=0}if(e.code==="KeyX"||e.code==="ShiftLeft"){pads[0].B.down=true;pads[0].B.pressed=true;pads[0].B.held=0}
 if(e.code==="KeyM"){pads[1].A.down=true;pads[1].A.pressed=true;pads[1].A.held=0}if(e.code==="KeyN"){pads[1].B.down=true;pads[1].B.pressed=true;pads[1].B.held=0}});
window.addEventListener("keyup",e=>{keys[e.code]=false;if(e.code==="KeyZ"||e.code==="Space"){pads[0].A.down=false;pads[0].A.released=true}if(e.code==="KeyX"||e.code==="ShiftLeft"){pads[0].B.down=false;pads[0].B.released=true}if(e.code==="KeyM"){pads[1].A.down=false;pads[1].A.released=true}if(e.code==="KeyN"){pads[1].B.down=false;pads[1].B.released=true}});
function keyStick(){const s=pads[0].stick;if(s.id!==null)return;let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);const d=Math.hypot(dx,dy);if(d>0){s.dx=dx/d;s.dy=dy/d;s.mag=1}else if(!s.id){s.dx=s.dy=s.mag=0}
 const s2=pads[1].stick;if(s2.id!==null)return;dx=(keys.KeyL?1:0)-(keys.KeyJ?1:0);dy=(keys.KeyK?1:0)-(keys.KeyI?1:0);const d2=Math.hypot(dx,dy);if(d2>0){s2.dx=dx/d2;s2.dy=dy/d2;s2.mag=1}else{s2.dx=s2.dy=s2.mag=0}}
function padEndFrame(){for(const pad of pads){for(const b of[pad.A,pad.B]){b.pressed=false;b.released=false}}}
// ---------------------------------------------------------------- match setup
function mkPlayer(team,slot,i){return{team,slot,i,n:slot.n,role:slot.role,x:0,y:0,vx:0,vy:0,face:0,anim:0,kickCd:0,slide:0,down:0,hold:0,think:0,intent:null,dive:0,dx:0,dy:0,speed:1,skin:["#f1c27d","#e0ac69","#8d5524","#c68642","#ffdbac"][(i*7+team*3)%5]}}
function newMatch(c){const t0=TEAMS[c.team],t1=TEAMS[c.opp];
 M={teams:[{def:t0,dir:1,score:0,human:c.mode!=="cpu"?0:-1,ai:DIFF[c.diff]},{def:t1,dir:-1,score:0,human:c.mode==="2p"?1:-1,ai:DIFF[c.diff]}],players:[],ball:{x:PW/2,y:PH/2,z:0,vx:0,vy:0,vz:0,owner:null,last:null,lastTeam:0,saveChk:false,spin:0},
  phase:"kickoff",phaseT:0,clock:0,half:1,halfLen:c.half,msg:"",msgT:0,ctrl:[null,null],switchCd:[0,0],restartTeam:0,protect:0,kickoffTeam:0,cam:{x:PW/2,y:PH/2,z:1},parts:[],scorers:[],shots:[0,0],stats:{poss:[0,0]},cupRound:c.cupRound||0,goalFlash:0,last:null,dbg:{saved:0,parry:0,goal:0,blocked:0,off:0,post:0,shots:0},simT:0};
 if(c.mode==="2p"){M.teams[0].human=0;M.teams[1].human=1}
 for(let t=0;t<2;t++)for(let s=0;s<SLOTS.length;s++)M.players.push(mkPlayer(t,SLOTS[s],M.players.length));
 for(const p of M.players)p.speed=M.teams[p.team].def.speed*(M.teams[p.team].human>=0?1:M.teams[p.team].ai.speed);
 M.kickoffTeam=Math.random()<0.5?0:1;setupKickoff(M.kickoffTeam);M.cam.x=PW/2;M.cam.y=PH/2;setCrowd(0.25)}
function slotWorld(p,fx,fy){const d=M.teams[p.team].dir;return{x:d>0?fx*PW:(1-fx)*PW,y:fy*PH}}
function homePos(p){return slotWorld(p,p.slot.fx,p.slot.fy)}
function placeAll(){for(const p of M.players){const h=homePos(p);p.x=h.x;p.y=h.y;p.vx=p.vy=0;p.slide=0;p.down=0;p.dive=0;p.kickCd=0;p.face=M.teams[p.team].dir>0?0:Math.PI}}
function setupKickoff(team){placeAll();const b=M.ball;b.x=PW/2;b.y=PH/2;b.z=0;b.vx=b.vy=b.vz=0;b.owner=null;b.spin=0;
 const fw=M.players.filter(p=>p.team===team&&p.role==="FW");const d=M.teams[team].dir;fw[0].x=PW/2-d*10;fw[0].y=PH/2;fw[1].x=PW/2-d*40;fw[1].y=PH/2+30;
 // everyone else stays in their own half
 for(const p of M.players){if(p.team!==team||p.role!=="FW"){const d2=M.teams[p.team].dir;if(d2>0)p.x=Math.min(p.x,PW/2-30);else p.x=Math.max(p.x,PW/2+30)}}
 own(fw[0]);M.phase="kickoff";M.phaseT=0;M.protect=1.2;M.restartTeam=team;M.ctrl=[null,null];for(let t=0;t<2;t++)if(M.teams[t].human>=0)M.ctrl[t]=team===t?fw[0]:nearestPlayer(t,PW/2,PH/2,true);
 M.msg="KICK OFF";M.msgT=1.2}
function own(p){const b=M.ball;b.owner=p;b.last=p;b.lastTeam=p.team;b.vx=b.vy=b.vz=0;b.z=0;b.saveChk=false;p.hold=0;b.ownT=0;if(M.teams[p.team].human>=0&&p.role!=="GK")M.ctrl[p.team]=p}
function nearestPlayer(team,x,y,outfield,excl){let best=null,bd=1e9;for(const p of M.players){if(p.team!==team||(outfield&&p.role==="GK")||p===excl)continue;const d=dist(p.x,p.y,x,y);if(d<bd){bd=d;best=p}}return best}
function goalX(team){return M.teams[team].dir>0?PW:0}          // the goal this team attacks
function ownGoalX(team){return M.teams[team].dir>0?0:PW}
function restart(kind,team,x,y){const b=M.ball;b.owner=null;b.vx=b.vy=b.vz=0;b.z=0;b.spin=0;b.x=x;b.y=y;
 let p;if(kind==="goalkick"){p=M.players.find(q=>q.team===team&&q.role==="GK");b.x=ownGoalX(team)+M.teams[team].dir*55;b.y=PH/2}
 else p=nearestPlayer(team,x,y,true);
 p.x=b.x-M.teams[team].dir*6;p.y=b.y;p.vx=p.vy=0;p.slide=0;p.down=0;
 // push opponents back a little
 for(const q of M.players){if(q.team!==team){const d=dist(q.x,q.y,b.x,b.y);if(d<70){const a=Math.atan2(q.y-b.y,q.x-b.x);q.x=clamp(b.x+Math.cos(a)*70,PR,PW-PR);q.y=clamp(b.y+Math.sin(a)*70,PR,PH-PR)}}}
 own(p);M.phase="play";M.protect=1.0;M.restartTeam=team;M.msg=kind==="throw"?"THROW IN":kind==="corner"?"CORNER":"GOAL KICK";M.msgT=1.0;if(M.teams[team].human>=0)M.ctrl[team]=p}
// ---------------------------------------------------------------- update: match
function humanTeamOf(padIdx){for(let t=0;t<2;t++)if(M.teams[t].human===padIdx)return t;return -1}
function kickBall(p,vx,vy,vz){const b=M.ball;b.owner=null;b.vx=vx;b.vy=vy;b.vz=vz||0;b.last=p;b.lastTeam=p.team;b.saveChk=false;p.kickCd=0.35;M.protect=0}
function passFrom(p,dirx,diry,lob){const team=p.team;let best=null,bs=-1e9;const hasDir=Math.hypot(dirx,diry)>0.2;
 for(const q of M.players){if(q.team!==team||q===p||q.role==="GK")continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<15)continue;
  let s=0;if(hasDir){const al=(dx*dirx+dy*diry)/(d*Math.hypot(dirx,diry));s+=al*3-(al<0.3?4:0)}else{s+=(q.x-p.x)*M.teams[team].dir/200}
  s-=Math.max(0,d-380)/100;const od=nearestOppDist(team,q.x,q.y);s+=Math.min(od,80)/60;if(laneBlocked(p,q))s-=2.5;if(s>bs){bs=s;best=q}}
 if(!best)return false;
 const lead=Math.min(0.4,dist(p.x,p.y,best.x,best.y)/500);const tx=best.x+best.vx*lead,ty=best.y+best.vy*lead;const d=dist(p.x,p.y,tx,ty);
 const noise=(M.teams[team].human>=0?0.03:M.teams[team].ai.pass)*(1.1-M.teams[team].def.skill);
 const a=Math.atan2(ty-p.y,tx-p.x)+rnd(-noise,noise);const sp=lob?clamp(d*1.1,220,380):clamp(d*1.55,200,430);
 kickBall(p,Math.cos(a)*sp,Math.sin(a)*sp,lob?110:0);M.pendingRecv=best;SFX.pass();return true}
function nearestOppDist(team,x,y){let bd=1e9;for(const q of M.players){if(q.team===team)continue;const d=dist(q.x,q.y,x,y);if(d<bd)bd=d}return bd}
function laneBlocked(p,q){const dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1;for(const o of M.players){if(o.team===p.team)continue;const t=((o.x-p.x)*dx+(o.y-p.y)*dy)/(L*L);if(t<0.1||t>0.9)continue;const px=p.x+dx*t,py=p.y+dy*t;if(dist(o.x,o.y,px,py)<14)return true}return false}
function shootFrom(p,power,aimY){const team=p.team;const gx=goalX(team);const acc=M.teams[team].human>=0?0.06:M.teams[team].ai.aim*(1.1-M.teams[team].def.skill);
 const ty=PH/2+clamp(aimY,-1,1)*(GW-6)+rnd(-1,1)*acc*80;const a=Math.atan2(ty-p.y,gx-p.x);const sp=380+330*power;const vz=18+95*power*power*(dist(p.x,p.y,gx,ty)<120?1.4:1);

function controlHuman(t,dt){const padIdx=M.teams[t].human;const pad=pads[padIdx];const b=M.ball;
 // pick the controlled player

function formationTarget(p){const st=teamState(p.team);const b=M.ball;const d=M.teams[p.team].dir;const bfx=d>0?b.x/PW:1-b.x/PW,bfy=b.y/PH;

function aiPlayer(p,dt){const b=M.ball,t=p.team,T=M.teams[t];const ai=T.human>=0?DIFF.normal:T.ai;

 if(M.phase==="kickoff"&&b.owner!==p){p.dx=p.dy=0;return}
 if(p.role==="GK"){aiKeeper(p,dt,ai);return}
 if(b.owner===p){aiCarrier(p,dt,ai);return}

 const chasers=[];const ranked=M.players.filter(q=>q.team===t&&q.role!=="GK"&&q.down<=0).sort((a,c)=>dist(a.x,a.y,b.x,b.y)-dist(c.x,c.y,b.x,b.y));

 const ctrl=M.ctrl[t];
 if(chasers.includes(p)&&p!==ctrl||(st==="loose"&&ranked[0]===p&&(!ctrl||dist(ctrl.x,ctrl.y,b.x,b.y)>120))){
  const lead=b.owner?0.05:Math.min(0.5,dist(p.x,p.y,b.x,b.y)/400);let tx=b.x+b.vx*lead,ty=b.y+b.vy*lead;
  if(b.owner&&b.owner.team!==t){// get goal-side of the carrier

  return}
 // pass receiver runs to meet the ball

 const f=formationTarget(p);
 // spread out from teammates

function aiCarrier(p,dt,ai){const b=M.ball,t=p.team,d=M.teams[t].dir,gx=goalX(t);p.hold+=dt;

function stepMatch(dt){const b=M.ball;M.phaseT+=dt;M.simT+=dt;const recentShot=()=>b.shotT!==undefined&&M.simT-b.shotT<1.2;if(M.msgT>0)M.msgT-=dt;if(M.protect>0)M.protect-=dt;if(M.goalFlash>0)M.goalFlash-=dt;
 keyStick();

 if(M.phase==="halftime"){if(M.phaseT>3){M.half=2;M.clock=0;for(const T of M.teams)T.dir*=-1;setupKickoff(1-M.kickoffTeam);M.msg="SECOND HALF";M.msgT=1.5}return}
 if(M.phase==="fulltime"){if(M.phaseT>3)endMatch();return}
 // decide movement

 if(M.phase==="kickoff"){// kickoff: play begins on the first pass/move of the kicker or after 1 s for AI
  const k=b.owner;if(k&&(Math.hypot(k.dx,k.dy)>0.1||!b.owner||M.phaseT>1.0&&M.teams[k.team].human<0))M.phase="play";if(!b.owner)M.phase="play"}

 for(const p of M.players){

 // player-player collisions

 // ball
 if(b.owner){const o=b.owner;const mv=Math.hypot(o.vx,o.vy);const fa=mv>8?Math.atan2(o.vy,o.vx):o.face;const lead=8+Math.min(6,mv/16);b.x=o.x+Math.cos(fa)*lead;b.y=o.y+Math.sin(fa)*lead;b.z=0;b.vx=o.vx;b.vy=o.vy;b.spin+=mv*dt*0.02;

   if(q.slide>0){kickBall(q,q.sdx*200+q.vx*0.3,q.sdy*200+q.vy*0.3,20);o.kickCd=0.6;o.down=0.4;SFX.tackle();M.pendingRecv=null}
   else{const qT=M.teams[q.team];const pr=qT.human>=0?1:(qT.ai===DIFF.easy?0.45:qT.ai===DIFF.normal?0.7:0.9);
    if(Math.random()<pr){o.kickCd=0.6;own(q);M.pendingRecv=null;SFX.tackle()}else{q.kickCd=0.5;q.vx*=-0.3;q.vy*=-0.3}}break}}}
 else{
  b.vz-=250*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
  if(b.z<=0){b.z=0;if(b.vz<-30){b.vz=-b.vz*0.45;b.vx*=0.85;b.vy*=0.85;SFX.bounce()}else b.vz=0;const sp=Math.hypot(b.vx,b.vy);if(sp>0){const dec=Math.min(sp,(70+sp*0.45)*dt);b.vx-=b.vx/sp*dec;b.vy-=b.vy/sp*dec}}

   for(const py of[PH/2-GW,PH/2+GW]){if(dist(b.x,b.y,gx,py)<BR+3&&b.z<ZBAR){const a=Math.atan2(b.y-py,b.x-gx);b.vx=Math.cos(a)*Math.hypot(b.vx,b.vy)*0.7;b.vy=Math.sin(a)*Math.hypot(b.vx,b.vy)*0.7;b.x=gx+Math.cos(a)*(BR+4);b.y=py+Math.sin(a)*(BR+4);SFX.post();setCrowd(0.6);M.dbg.post++}}
   if(Math.abs(b.y-PH/2)<GW&&Math.abs(b.z-ZBAR)<BR+2&&b.z>0){b.vz=Math.abs(b.vz)*-0.5;b.vx*=-0.6;b.z=ZBAR-BR-3;SFX.post()}}

   const reach=PR+BR+(p.dive>0?12:4);if(dist(p.x,p.y,b.x,b.y)<reach&&b.z<ZBAR+4&&!b.saveChk){b.saveChk=true;const ai=M.teams[t].human>=0?DIFF.normal:M.teams[t].ai;const sp=Math.hypot(b.vx,b.vy);
    let pr=ai.save;if(sp>500)pr*=0.75;if(Math.abs(b.y-PH/2)>GW-12)pr*=0.5;if(b.z>14)pr*=0.8;if(p.dive<=0&&Math.abs(b.y-p.y)>10)pr*=0.6;

    const sp=Math.hypot(b.vx,b.vy);if(sp>380&&(recentShot()||Math.random()<0.5)){if(recentShot())M.dbg.blocked++;if(Math.random()<0.5){b.vx*=0.35;b.vy*=0.35;b.vz=30}p.kickCd=0.25;break}// too hot to trap

 // stats and clock

 cam.x=lerp(cam.x,tx,Math.min(1,dt*4));cam.y=lerp(cam.y,ty,Math.min(1,dt*4));

function goal(team){const b=M.ball;M.teams[team].score++;M.phase="goal";M.phaseT=0;M.concede=1-team;M.msg="GOAL!";M.msgT=3;M.goalFlash=1;
 const sc=b.last&&b.last.team===team?b.last:null;M.scorers.push({team,n:sc?sc.n:0,min:clockMin(),own:!sc});SFX.goal();SFX.whistle(1);
 for(let i=0;i<80;i++)M.parts.push({x:b.x,y:b.y,vx:rnd(-220,220),vy:rnd(-260,60),life:rnd(1,2.2),col:[M.teams[team].def.kit,M.teams[team].def.kit2,"#fff"][i%3]});b.vx*=0.2;b.vy*=0.2}
function updateParts(dt){for(const p of M.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt}M.parts=M.parts.filter(p=>p.life>0)}
function clockMin(){const m=Math.floor(M.clock/M.halfLen*45)+(M.half===2?45:0);return Math.min(m,90)}
function clockStr(){const total=M.clock/M.halfLen*45+(M.half===2?45:0);const m=Math.floor(Math.min(total,90)),s=Math.floor((total%1)*60);return (m<10?"0":"")+m+":"+(s<10?"0":"")+s}
function endMatch(){const a=M.teams[0].score,c=M.teams[1].score;save.played++;
 if(cfg.cup&&a===c){startPK();return}
 finishMatch(a>c?0:c>a?1:-1)}
function finishMatch(winner){M.winner=winner;if(winner===0)save.wins++;store.set("save",save);
 if(cfg.cup){if(winner===0){cup.round++;if(cup.round>=3){save.cups++;store.set("save",save);cup.won=true}}else cup.lost=true}

// ---------------------------------------------------------------- penalty shoot-out
// Five each, then sudden death. Shooter aims with the stick (left / right / centre,

function pickOpps(me,n){const pool=TEAMS.map((_,i)=>i).filter(i=>i!==me);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,n)}
function startMatch(){cfg.opp=cfg.cup?cup.opps[cup.round]:cfg.opp;const diffs=["easy","normal","hard"];if(cfg.cup){cfg.diff=diffs[Math.min(2,Math.max(0,diffs.indexOf(cfg.diff)))]}
 newMatch(Object.assign({},cfg,{cupRound:cfg.cup?cup.round:0}));if(cfg.cup){const d=["easy","normal","hard"];M.teams[1].ai=DIFF[d[Math.min(2,d.indexOf(cfg.diff)+cup.round)]];for(const p of M.players)if(p.team===1)p.speed=M.teams[1].def.speed*M.teams[1].ai.speed}
 padLayout();scene="match";SFX.whistle(1)}

 for(let r=0;r<rows;r++){const y=120+r*70;const opp=TEAMS[cup.opps[r]];const state=r<cup.round?"WON":r===cup.round?(cup.lost?"LOST":"NEXT"):"";
  rr(W/2-260,y-26,520,56,10);cx.fillStyle=r===cup.round&&!cup.lost?"rgba(255,225,77,0.15)":"rgba(255,255,255,0.07)";cx.fill();
  text(names[r],W/2-240,y,15,"#cfd8e8","left",true);text(TEAMS[cfg.team].short+"  vs  "+opp.name,W/2-80,y,17,"#fff","left",true);text(state,W/2+240,y,16,state==="WON"?"#8dff5a":state==="LOST"?"#ff5a5a":"#ffe14d","right",true)}
 if(cup.won){text("CHAMPIONS!  🏆",W/2,350,44,"#ffe14d");btn(W/2-100,H-80,200,50,"DONE",()=>{scene="title"},{fill:"#2a8a3a",size:20})}
 else if(cup.lost){text("Knocked out. Try again!",W/2,350,28,"#ff9090");btn(W/2-100,H-80,200,50,"MENU",()=>{scene="title"},{size:20})}
 else{btn(W/2-100,H-80,200,50,"PLAY "+names[cup.round].split("-")[0],()=>startMatch(),{fill:"#2a8a3a",size:18})}
 drawButtons()}
function drawResult(){bg();buttons=[];const A=M.teams[0],B=M.teams[1];const w=M.winner;
 text(w===-1?"DRAW":(w===0?A.def.name:B.def.name)+" WIN!",W/2,H*0.16,Math.min(44,W/12),"#ffe14d");

 const tot=M.stats.poss[0]+M.stats.poss[1]||1;text("Possession "+Math.round(M.stats.poss[0]/tot*100)+"% - "+Math.round(M.stats.poss[1]/tot*100)+"%     Shots "+M.shots[0]+" - "+M.shots[1],W/2,H-120,15,"#cfd8e8");
 btn(W/2-100,H-80,200,50,cfg.cup?"CONTINUE":"MENU",()=>{if(cfg.cup)scene="cup";else scene="title";pk=null},{fill:"#2a8a3a",size:20});drawButtons()}

function frame(ts){const dt=Math.min(0.04,(ts-tPrev)/1000||0.016);tPrev=ts;frameT+=dt;cx.setTransform(DPR,0,0,DPR,0,0);
