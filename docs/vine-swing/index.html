<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<!-- Not black-translucent: on a Home Screen app iOS then hands the page a
     viewport a status bar shorter than the screen while still reporting the
     full safe-area insets, so the canvas stops short and a band of bare page
     shows at the bottom. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vine Swing</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0d2a1c;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
</style><script>window.__shelfPaused=function(){try{return scene!=="play"}catch(e){return true}};</script><script src="../menu.js" defer></script>
<script src="../fresh.js" defer></script>
</head><body><canvas id="c"></canvas>
<script>
"use strict";
// ============================================================ Vine Swing
// A one-finger jungle swinger. Hold anywhere to grab the vine ring the
// monkey is looking at, let go to fly. Four worlds of ten levels, three
// stars a level, a new jungle every day, and the family's best runs to race.
// Sophia, Rory and Dylan Games, Inc.
document.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const cv=document.getElementById("c"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1,U=1;
// The canvas is viewport-fit=cover, so the notch and the home indicator sit
// on top of it. CSS knows the safe insets; script only learns them by
// measuring an element that uses them.
const safeProbe=document.createElement("div");
safeProbe.style.cssText="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;"+
 "padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
document.body.appendChild(safeProbe);
const SAFE={t:0,r:0,b:0,l:0};
// In a browser tab the home indicator lives in Safari's own toolbar strip,
// yet the page is still told about a bottom inset. The page only owes it room
// when it owns the whole screen.
function ownsTheScreen(){return navigator.standalone!==false}
function readSafe(){const st=getComputedStyle(safeProbe);
 SAFE.t=parseFloat(st.paddingTop)||0;SAFE.r=parseFloat(st.paddingRight)||0;
 SAFE.b=ownsTheScreen()?(parseFloat(st.paddingBottom)||0):0;SAFE.l=parseFloat(st.paddingLeft)||0}
// Sized from the visual viewport, in pixels, and re-checked several times a
// second: iOS does not reliably say when the screen under a page has grown
// (the same fix every game on the shelf carries - see tools/fitcheck.mjs).
function screenSize(){const vv=window.visualViewport,de=document.documentElement;
 let w=Math.round(vv&&vv.width?vv.width:innerWidth),
     h=Math.round(vv&&vv.height?vv.height:innerHeight);
 if(ownsTheScreen()){w=Math.max(w,Math.round(de.clientWidth)||0);
                     h=Math.max(h,Math.round(de.clientHeight)||0)}
 return{w:Math.max(1,w),h:Math.max(1,h),d:Math.min(window.devicePixelRatio||1,2)}}
function resize(){readSafe();const z=screenSize();const grew=z.w!==W||z.h!==H||z.d!==DPR;DPR=z.d;W=z.w;H=z.h;
 cv.style.width=W+"px";cv.style.height=H+"px";
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 // U is the size of one menu unit: a phone held upright gets about 0.9, an
 // iPad about 1.4, so a button is always a comfortable size for a thumb.
 U=Math.max(0.72,Math.min(1.6,Math.min(W/430,H/560)));
 if(grew)layersDirty=true}
function sizeWatch(){const z=screenSize();
 if(z.w!==W||z.h!==H||z.d!==DPR||cv.width!==Math.round(W*DPR)||cv.height!==Math.round(H*DPR))resize()}
function reflow(){resize();setTimeout(resize,60);setTimeout(resize,250)}
let layersDirty=true;
window.addEventListener("resize",reflow);window.addEventListener("orientationchange",()=>setTimeout(reflow,150));
window.addEventListener("pageshow",reflow);document.addEventListener("visibilitychange",()=>{if(!document.hidden)reflow()});
if(window.visualViewport){visualViewport.addEventListener("resize",reflow);visualViewport.addEventListener("scroll",reflow)}
resize();

// Shown small on the title screen, so it is always clear which version a
// phone is running. A Home Screen app can hold on to an old copy for days.
const BUILD="2026.09.23-6";
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
// Levels are built from a seed, so the same number gives the same jungle on
// every device: that is what makes the daily run the same for everyone.
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
 return"rgb("+f(r)+","+f(g)+","+f(b)+")"}
function fmtT(t){if(t==null||!isFinite(t))return"--";const m=Math.floor(t/60),s=t-m*60;
 return(m?m+":"+(s<10?"0":""):"")+s.toFixed(1)}

// ================================================================ saves
// Everything lives under "vineswing." - the shelf menu finds a game's saves
// by the prefix taken from its folder name.
const store={get(k,d){try{const v=localStorage.getItem("vineswing."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem("vineswing."+k,JSON.stringify(v))}catch(e){}}};
// One device, a whole family: each player keeps their own bananas, stars and
// wardrobe, and every level's records are compared across all of them.
const PCOLS=["#ff6b6b","#4dabf7","#51cf66","#fcc419","#cc5de8","#ff922b"];
function newProfile(name,i){return{id:"p"+Date.now().toString(36)+Math.floor(Math.random()*1e4),name,col:PCOLS[i%PCOLS.length],
 bananas:0,stars:{},best:{},owned:{monkey:1,nohat:1,leaves:1},char:"monkey",hat:"nohat",trail:"leaves",
 items:{magnet:1,shield:1,reach:1},worlds:[1,0,0,0],daily:{},streak:0,lastDaily:"",flips:0}}
let profiles=store.get("profiles",null);
if(!Array.isArray(profiles)||!profiles.length){profiles=["Sophia","Rory","Dylan"].map(newProfile);store.set("profiles",profiles)}
let me=profiles.find(p=>p.id===store.get("who",""))||profiles[0];
function save(){store.set("profiles",profiles);store.set("who",me.id)}
const settings=Object.assign({music:true,sfx:true},store.get("settings",{}));
function saveSettings(){store.set("settings",settings)}
// The best run a family has ever put in on a level is kept as a ghost to race.
function ghostKey(id){return"ghost."+id}

// ================================================================ content
// World units: the water is at y=560, ledges stand at 430, vine rings hang
// between about 120 and 300. The camera fits roughly 1150x720 of this to the
// screen, whichever way up the screen is.
// DEADT: how long a splash lasts - the ride back to the flag in a bubble
const DEADT=1.3,FLOOR=560,PLAT=430,MR=16,GRAV=1500,REACH=320,REACH_BIG=440,LMIN=60,VMAX=1500,DT=1/120;
const WORLDS=[
 {name:"Jungle Canopy",sky:["#62c2ec","#c8efff"],far:"#6dbb8a",mid:"#3e8f5c",near:"#1f5e3a",floor:"#2b93bd",floorTop:"#7fd6f0",
  ring:"#c98a3c",ledge:"#8a5a2e",ledgeTop:"#5fbf4a",acc:"#ffd43b",price:0,need:0,hazard:"water"},
 {name:"Temple Ruins",sky:["#f0a868","#ffe6bf"],far:"#c89464",mid:"#a2764c",near:"#6d4e33",floor:"#5b7a2f",floorTop:"#9dbb4f",
  ring:"#d4b06a",ledge:"#b59a78",ledgeTop:"#d9c6a2",acc:"#ffe066",price:250,need:12,hazard:"swamp"},
 {name:"Misty Falls",sky:["#7fa6de","#e6f2ff"],far:"#9cb8d8",mid:"#5f86b0",near:"#34597d",floor:"#3f8fd6",floorTop:"#c9ecff",
  ring:"#e0e8f0",ledge:"#6a7f93",ledgeTop:"#7ccf8a",acc:"#9ff0ff",price:500,need:14,hazard:"rapids"},
 {name:"Volcano Peak",sky:["#2a1030","#ff7a45"],far:"#5a2a3a",mid:"#3b1b27",near:"#24101a",floor:"#ff5a1f",floorTop:"#ffd35a",
  ring:"#ffb35a",ledge:"#4a3a3a",ledgeTop:"#7a5a4a",acc:"#ffb35a",price:800,need:16,hazard:"lava"}];
// Cosmetic only. Nothing in the shop makes a level easier except the
// power-ups, which are used up.
const CHARS=[
 {id:"monkey",name:"Momo",kind:"Monkey",price:0,fur:"#8a5a34",face:"#f2cf9e",belly:"#d9a878",tail:"curl"},
 {id:"lemur",name:"Lulu",kind:"Lemur",price:150,fur:"#9aa0a8",face:"#f4f4f4",belly:"#e6e6e6",tail:"ring",ring:"#2b2b2b",mask:"#2b2b2b"},
 {id:"snow",name:"Yuki",kind:"Snow Monkey",price:250,fur:"#c9c4bd",face:"#ff8a8a",belly:"#e8e3dc",tail:"stub"},
 {id:"panda",name:"Rusty",kind:"Red Panda",price:400,fur:"#c8561e",face:"#fff4e6",belly:"#3a2418",tail:"ring",ring:"#7a2e0e",mask:"#c8561e"},
 {id:"gold",name:"Sunny",kind:"Golden Monkey",price:600,fur:"#e8a33a",face:"#7fc4ff",belly:"#ffd27a",tail:"curl"},
 {id:"space",name:"Cosmo",kind:"Space Monkey",price:900,fur:"#6a4a8a",face:"#f2cf9e",belly:"#b59ad6",tail:"curl",helmet:true}];
const HATS=[{id:"nohat",name:"No hat",price:0},{id:"cap",name:"Cap",price:80},{id:"flower",name:"Flower",price:100},
 {id:"pirate",name:"Pirate",price:150},{id:"party",name:"Party",price:200},{id:"wizard",name:"Wizard",price:350},{id:"crown",name:"Crown",price:500}];
const TRAILS=[{id:"leaves",name:"Leaves",price:0},{id:"sparks",name:"Sparkles",price:120},{id:"bubbles",name:"Bubbles",price:150},
 {id:"stars",name:"Stars",price:250},{id:"rainbow",name:"Rainbow",price:300},{id:"fire",name:"Fire",price:400}];
const ITEMS=[{id:"magnet",name:"Banana Magnet",price:20,say:"Pulls in bananas"},
 {id:"shield",name:"Bubble Shield",price:30,say:"Saves you once"},
 {id:"reach",name:"Long Arms",price:25,say:"Grab rings from further"}];

// ================================================================ levels
// Ten levels a world. Each world brings one or two new things and keeps the
// old ones; d runs from 0 (the first level) to about 1 (the last volcano).
const FEAT_AT=[
 {shroom:2,ring:4,lowthorn:5,bee:7,highthorn:8},
 {crumble:0,pillar:1,shroom:0,ring:0,lowthorn:3,bee:4,highthorn:6},
 {move:0,shroom:0,ring:0,pillar:0,lowthorn:1,crumble:3,bee:2,highthorn:5},
 {move:0,shroom:0,ring:0,pillar:0,lowthorn:0,crumble:0,bee:0,highthorn:2}];
const D0=[0,.2,.34,.5],DSTEP=[.042,.04,.04,.05];
// Seeds that tools/vinecheck.mjs has proved finishable; a level without one
// in here falls back to its default.
const SEEDS={"1-1":54782730,"1-2":809111715,"1-3":210467,"1-4":1907153369,"1-5":539993013,"1-6":524654,"1-7":91046210,"1-8":1076582011,"1-9":1225807579,"1-10":687010752,"2-1":1796381347,"2-2":1865447672,"2-3":345705110,"2-4":2110270634,"2-5":1325104912,"2-6":1847664480,"2-7":698433795,"2-8":1532267494,"2-9":1134744618,"2-10":945430429,"3-1":1090745578,"3-2":178465702,"3-3":1609609360,"3-4":1357246232,"3-5":2137569523,"3-6":229327742,"3-7":1512230926,"3-8":1193153032,"3-9":813819612,"3-10":1744218684,"4-1":1788387920,"4-2":1678974560,"4-3":147811060,"4-4":1920370652,"4-5":2089621010,"4-6":685560389,"4-7":576692517,"4-8":75872511,"4-9":1762683648,"4-10":93696831};
function levelSpec(w,i){const feats={},at=FEAT_AT[w];
 for(const k in at)if(i>=at[k])feats[k]=at[k]===i&&(w>0||i>0)?3:1;
 const d=D0[w]+DSTEP[w]*i;
 const len=w===0&&i===0?1500:w===0&&i===1?2000:2400+d*4000;
 const id=(w+1)+"-"+(i+1);
 return{id,world:w,idx:i,d,len,feats,seed:SEEDS[id]||(1009+w*7919+i*104729),tut:w===0&&i<3?i+1:0}}
function dayKey(dt){dt=dt||new Date();return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function dailySpec(key){let h=2166136261;for(const c of key){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}h>>>=0;
 const day=Math.floor(Date.parse(key+"T12:00:00Z")/864e5),w=((day%4)+4)%4,feats={};
 for(const k in FEAT_AT[w])feats[k]=1;
 // the whole family plays the same daily, the youngest included, so it sits
 // around the middle of the second world whatever world it is dressed as
 return{id:"daily-"+key,world:w,idx:-1,d:.25+.25*((h>>>8)%100)/100,len:3400,feats,seed:h,tut:0,daily:key}}

function genLevel(sp){
 const R=mulberry(sp.seed),r=()=>R(),d=sp.d,f=sp.feats;
 const L={id:sp.id,spec:sp,world:sp.world,d,anchors:[],bananas:[],golds:[],thorns:[],bees:[],shrooms:[],rings:[],rects:[],cps:[],signs:[],goalX:0,par:0};
 L.rects.push({x:-300,y:PLAT,w:420,h:FLOOR-PLAT+80});
 L.cps.push({x:0,y:PLAT});
 let ax=250,ay=230;
 const A=(x,y,type,o)=>{const a=Object.assign({x,y,type:type||0,mx:0,my:0,ms:0,mp:0},o||{});L.anchors.push(a);return a};
 A(ax,ay);
 const gold=[],spc=()=>lerp(sp.tut?255:265,345,d)*(0.93+0.14*r()),nh=y=>clamp(y+(r()*2-1)*lerp(20,95,d),125,285);
 const B=(x,y)=>L.bananas.push({x,y});
 // bananas trace the way from one ring to the next: under the one you are
 // on, and in an arc over the gap to the next
 function arc(px,py,nx,ny){for(const t of[.3,.5,.7]){const x0=px+130,y0=py+150,x2=nx-130,y2=ny+150,xc=(px+nx)/2,yc=Math.min(py,ny)-30;
   B((1-t)*(1-t)*x0+2*t*(1-t)*xc+t*t*x2,(1-t)*(1-t)*y0+2*t*(1-t)*yc+t*t*y2)}}
 function under(x,y){if(y+215<FLOOR-60)for(const a of[-.45,0,.45])B(x+215*Math.sin(a),y+215*Math.cos(a))}
 function next(dx,y,type,o){const nx=ax+dx;arc(ax,ay,nx,y);gold.push({x:(ax+nx)/2,y:Math.min(ay,y)-45});const a=A(nx,y,type,o);ax=nx;ay=y;return a}
 under(ax,ay);
 const kinds=[["run",3]];
 for(const k in f)kinds.push([k,f[k]]);
 let since=0,last="",count=0;
 // the very first level gets its ledges closer together: a splash there
 // should cost a few seconds, not the whole level
 const cpEvery=sp.tut===1?450:lerp(1100,1650,d);
 if(sp.tut===1){L.signs.push({x:120,y:250,t:"HOLD",icon:1},{x:640,y:330,t:"LET GO",icon:2})}
 if(sp.tut===2){L.signs.push({x:160,y:250,t:"GOLD BANANAS",icon:3})}
 while(ax<sp.len){
  const x0=ax;
  if(since>cpEvery){ // a ledge to stand on, and to come back to after a splash
   // it reaches back toward the last ring, so a swing that comes up short
   // lands on it instead of in the water
   const px=ax+spc()*0.85;L.rects.push({x:px-165,y:PLAT,w:260,h:FLOOR-PLAT+80});L.cps.push({x:px,y:PLAT});
   for(const o of[-50,0,50])B(px+o,PLAT-40);
   arc(ax,ay,px+230,220);A(px+230,220);ax=px+230;ay=220;since=0;last="cp";continue}
  let tot=0;for(const k of kinds)if(k[0]!==last||k[0]==="run")tot+=k[1];
  let pick=r()*tot,kind="run";for(const k of kinds){if(k[0]===last&&k[0]!=="run")continue;pick-=k[1];if(pick<=0){kind=k[0];break}}
  // the very first thing in a level is always a plain stretch
  if(count++===0)kind="run";
  if(kind==="run"){const n=2+Math.floor(r()*(sp.tut===1?3:2));for(let j=0;j<n;j++){next(spc(),nh(ay));under(ax,ay);gold.push({x:ax,y:ay+280>FLOOR-70?FLOOR-70:ay+280})}}
  else if(kind==="shroom"){const gx=ax+spc()*0.9,ny=clamp(ay-20,140,250);
   L.shrooms.push({x:gx,y:476,r:42});for(const yy of[390,320,250])B(gx,yy);gold.push({x:gx,y:130});
   const a=A(gx+lerp(255,300,d),ny);ax=a.x;ay=ny;under(ax,ay);
   if(sp.tut===3)L.signs.push({x:gx-120,y:300,t:"BOUNCE!",icon:4})}
  else if(kind==="ring"){const dx=spc()*1.4,ny=nh(ay),mx=ax+dx/2,my=Math.min(ay,ny)+120;
   L.rings.push({x:mx,y:my,r:50});B(mx-60,my+10);B(mx+60,my-10);next(dx,ny);under(ax,ay)}
  else if(kind==="lowthorn"){const ny=clamp(Math.min(ay,nh(ay))-20,125,200);const a=next(spc(),ny);
   L.thorns.push({x:a.x,y:500,r:30},{x:a.x-150,y:515,r:26},{x:a.x+150,y:515,r:26});under(ax,ay)}
  else if(kind==="highthorn"){const ny=clamp(nh(ay)+20,170,285),px=ax;next(spc(),ny);const mx=(px+ax)/2,top=Math.min(ay,ny)-lerp(120,85,d);
   L.thorns.push({x:mx,y:top,r:30},{x:mx-55,y:top-35,r:24},{x:mx+55,y:top-35,r:24});under(ax,ay)}
  else if(kind==="bee"){const px=ax,py=ay,ny=nh(ay);next(spc()*1.05,ny);
   L.bees.push({x:(px+ax)/2,y:(py+ny)/2+70,ax:0,ay:lerp(70,110,d),s:lerp(2.2,3.2,d),p:r()*TAU,r:20});under(ax,ay)}
  else if(kind==="crumble"){for(let j=0;j<3;j++){next(spc()*0.95,nh(ay),1)}}
  else if(kind==="move"){const n=2+Math.floor(r()*2);for(let j=0;j<n;j++){const hz=r()<0.6;
   next(spc()*1.05,clamp(nh(ay),140,260),2,hz?{mx:lerp(55,95,d),ms:lerp(1.1,1.7,d),mp:r()*TAU}:{my:lerp(45,70,d),ms:lerp(1.1,1.7,d),mp:r()*TAU});
   if(!hz)under(ax,ay)}}
  else if(kind==="pillar"){const px=ax,dx=spc()*1.2,ny=clamp(nh(ay)-40,130,190);next(dx,ny);
   const top=lerp(420,340,d);L.rects.push({x:(px+ax)/2-40,y:top,w:80,h:FLOOR-top+80,pillar:1});B((px+ax)/2,top-60);under(ax,ay)}
  since+=ax-x0;last=kind}
 // the finish ledge starts under the end of the last ring's swing, so a
 // child who just lets go at the bottom still bumps into it - and touching
 // it at all counts as finishing
 const gx=ax+spc()*0.55;arc(ax,ay,gx+120,PLAT-60);
 L.rects.push({x:gx,y:PLAT,w:700,h:FLOOR-PLAT+80});L.goalX=gx;L.endX=gx+700;
 // no banana inside a thorn bush, a pillar or the water
 L.bananas=L.bananas.filter(b=>b.y<FLOOR-45&&!L.thorns.some(t=>Math.hypot(b.x-t.x,b.y-t.y)<t.r+34)&&
  !L.rects.some(q=>b.x>q.x-20&&b.x<q.x+q.w+20&&b.y>q.y-20)&&!L.shrooms.some(s=>Math.hypot(b.x-s.x,b.y-s.y)<s.r+30));
 // three gold bananas, one in each third of the level, each a little out of
 // the way: over a ring, deep in a dip, or on top of a mushroom's bounce
 const ok=g=>g.y<FLOOR-55&&g.x<gx-60&&!L.thorns.some(t=>Math.hypot(g.x-t.x,g.y-t.y)<t.r+50)&&
  !L.rects.some(q=>g.x>q.x-30&&g.x<q.x+q.w+30&&g.y>q.y-40)&&!L.anchors.some(a=>Math.hypot(g.x-a.x,g.y-a.y)<60);
 const pool=gold.filter(ok);
 for(let k=0;k<3;k++){const lo=gx*k/3,hi=gx*(k+1)/3;let c=pool.filter(g=>g.x>=lo&&g.x<hi&&!L.golds.includes(g));
  if(!c.length)c=pool.filter(g=>!L.golds.includes(g));if(c.length)L.golds.push(c[Math.floor(r()*c.length)])}
 L.golds=L.golds.map(g=>({x:g.x,y:g.y}));
 L.bananas=L.bananas.filter(b=>!L.golds.some(g=>Math.hypot(b.x-g.x,b.y-g.y)<40));
 L.bananas.sort((a,b)=>a.x-b.x);
 // par is a brisk run, not a perfect one: about half as long again as the
 // robot in tools/vinecheck.mjs, which swings very well indeed
 L.par=Math.round((gx/lerp(420,300,d)*1.25+3)*2)/2;
 return L}

// ================================================================ physics
// One fixed step of 1/120s, and nothing in here reads the clock, the screen
// or Math.random: the same run and the same finger give the same result every
// time. That is what lets tools/vinecheck.mjs prove a level can be finished,
// and what lets a ghost replay line up with the level it was recorded on.
const AP={x:0,y:0};

// ---------------------------------------------------------------- monkey
// Seen from the side, facing the way it is going: an ear at the back of the
// head, one big eye, a muzzle that sticks out in front, and an outline so it
// reads against any background. The poses are hang, fly and stand (and

const MS=1.4,HAND=28*MS,STANDLIFT=28.1*MS-MR-1;
function drawMonkey(x,y,rot,c,hat,opt){opt=opt||{};const C=CHARS.find(k=>k.id===c)||CHARS[0],sc=(opt.scale||1)*MS;

 if(C.tail==="stub"){cx.moveTo(-9,9);cx.lineTo(-14,12)}
 else{cx.moveTo(-9,9);cx.bezierCurveTo(-24,14,-31,0,-25,-9);cx.bezierCurveTo(-21,-15,-15,-12,-17,-7)}
 cx.strokeStyle=ink;cx.lineWidth=(C.tail==="ring"?7:5)+2.6;cx.stroke();cx.strokeStyle=C.fur;cx.lineWidth=C.tail==="ring"?7:5;cx.stroke();
 if(C.tail==="ring"){cx.strokeStyle=C.ring;cx.setLineDash([4,4]);cx.stroke();cx.setLineDash([])}
 // the far arm and leg, a shade darker
 // arms that go up run behind the head, never across the face
 if(pose==="hang"){limb(-2,-4,-11,-15,-3,-27,4.6,furD);limb(-4,12,-9+kick,18,-6+kick,23,5,furD)}
 else if(pose==="fly"){limb(-2,-4,-10,-4,-15,-13,4.6,furD);limb(-4,12,-10,16,-16,17,5,furD)}

 else{limb(-2,-4,-7,4,-6,12,4.6,furD);limb(-4,12,-6,18,-5,24,5,furD)}
 // body
 const bg=cx.createRadialGradient(-3,-1,2,0,4,16);bg.addColorStop(0,furL);bg.addColorStop(0.55,C.fur);bg.addColorStop(1,furD);
 cx.fillStyle=bg;cx.strokeStyle=ink;cx.lineWidth=1.6;cx.beginPath();cx.ellipse(0,4,11,13.5,-0.12,0,TAU);cx.fill();cx.stroke();

 if(pose==="hang")limb(2,-3,-8,-15,1,-27,5,C.fur);

 dot(-5,-16,5.6,C.fur);cx.fillStyle=palm;cx.beginPath();cx.arc(-5,-16,3,0,TAU);cx.fill();
 // One outline round the head and the muzzle together: the ink shape is

 cx.fillStyle=ink;cx.beginPath();cx.arc(3,-13,13.1,0,TAU);cx.fill();cx.beginPath();cx.ellipse(13.2,-7.8,7.5,6.3,0.15,0,TAU);cx.fill();
 const hg=cx.createRadialGradient(0,-18,2,3,-13,13);hg.addColorStop(0,furL);hg.addColorStop(0.6,C.fur);hg.addColorStop(1,furD);
 cx.fillStyle=hg;cx.beginPath();cx.arc(3,-13,11.5,0,TAU);cx.fill();

 if(C.mask){cx.fillStyle=C.mask;cx.beginPath();cx.ellipse(9.5,-15,5,4.5,0.2,0,TAU);cx.fill()}

 cx.fillStyle=ink;cx.beginPath();cx.arc(17.6,-9.8,0.95,0,TAU);cx.fill();
 if(opt.open){cx.fillStyle="#5a1a1a";cx.beginPath();cx.ellipse(13.5,-5.6,3,2.4,0.1,0,TAU);cx.fill();cx.fillStyle="#ff8aa0";cx.beginPath();cx.ellipse(13.8,-4.6,1.8,1,0,0,TAU);cx.fill()}
 else{cx.strokeStyle=ink;cx.lineWidth=1.2;cx.beginPath();cx.moveTo(10,-6.2);cx.quadraticCurveTo(13,-3.8,16.2,-6.4);cx.stroke()}
 cx.fillStyle="rgba(255,120,140,0.35)";cx.beginPath();cx.arc(8,-8.6,2.3,0,TAU);cx.fill();
 const blink=((T+(opt.seed||0))%3.4)<0.12;
 if(blink){cx.strokeStyle=ink;cx.lineWidth=1.4;cx.beginPath();cx.moveTo(6.5,-15.5);cx.quadraticCurveTo(9.5,-13.8,12.4,-15.5);cx.stroke()}

  const lx=opt.look?opt.look.x*1.1:0,ly=opt.look?opt.look.y*1.3:0;
  cx.fillStyle="#1b1310";cx.beginPath();cx.arc(10.2+lx,-15.3+ly,2.2,0,TAU);cx.fill();cx.fillStyle="#fff";cx.beginPath();cx.arc(10.9+lx,-16.3+ly,0.9,0,TAU);cx.fill()}
 cx.strokeStyle=ink;cx.lineWidth=1.3;cx.beginPath();cx.moveTo(6.6,-20.4);cx.quadraticCurveTo(9.5,-21.6,12.4,-20.4);cx.stroke();
 // near arm, over everything
 if(pose==="hang"){dot(-2.5,-27.5,3.2,palm);dot(1,-28.5,3.4,palm)}

  cx.fillStyle="rgba(255,255,255,0.7)";cx.beginPath();cx.ellipse(-2,-22,5,2.2,-0.6,0,TAU);cx.fill();cx.fillStyle="#b8c4d0";cx.fillRect(-7,0,22,3.5)}

// ---------------------------------------------------------------- life
// The jungle is not empty: butterflies, dragonflies, falling leaves, dust
// in the ruins, embers over the lava, fish that jump, and a crocodile that
// watches the water and snaps at a splash. All of it is only for show.
let critters=[],critW=-1;
const CRIT=[{fly:3,leaf:7,fish:2,croc:1},{fly:3,dust:10,fish:1,croc:1},{fly:2,leaf:3,fish:3},{ember:16}];
function spawnCritter(k,x0,x1,y0){const R=Math.random,x=lerp(x0,x1,R());
 if(k==="fly")return{k,x,y:lerp(160,400,R()),hx:x,hy:lerp(160,400,R()),ph:R()*TAU,col:["#ff922b","#74c0fc","#f783ac","#ffd43b","#b197fc"][Math.floor(R()*5)]};
 if(k==="leaf")return{k,x,y:y0-20-R()*200,vx:(R()-0.5)*30,vy:25+R()*25,ph:R()*TAU,r:R()*TAU,col:R()<0.5?"#6fbf4a":"#c9a23a"};
 if(k==="dust")return{k,x,y:lerp(y0,FLOOR,R()),ph:R()*TAU};
 if(k==="ember")return{k,x,y:FLOOR+10,vy:-(50+R()*90),ph:R()*TAU,life:2+R()*3};
 if(k==="fish")return{k,x,y:FLOOR+30,wait:1+R()*5,vx:0,vy:0,col:R()<0.5?"#ff8a3d":"#4dabf7",dir:R()<0.5?1:-1};
 if(k==="croc")return{k,x,y:FLOOR,dir:R()<0.5?1:-1,snap:0,ph:R()*TAU}}
function critterSplash(x,kind){if(kind!=="floor")return;for(const c of critters)if(c.k==="croc"&&Math.abs(c.x-x)<260&&c.snap<=0){c.snap=1;pop(c.x,FLOOR-70,"CHOMP!","#b2f2bb",1.2);sfx("chomp")}}
function stepCritters(w,dt,s){if(critW!==w){critters=[];critW=w}
 const x0=cam.x-W/2/cam.z,x1=cam.x+W/2/cam.z,y0=cam.y-H/2/cam.z;
 critters=critters.filter(c=>c.x>x0-500&&c.x<x1+500&&!c.gone);
 const want=CRIT[w];
 for(const k in want){let n=0;for(const c of critters)if(c.k===k)n++;while(n<want[k]){const fresh=critters.length===0;critters.push(spawnCritter(k,fresh?x0:x1,fresh?x1:x1+400,y0));n++}}
 for(const c of critters){
  if(c.k==="fly"){c.ph+=dt;c.hx+=Math.sin(c.ph*0.3)*20*dt;c.x+=((c.hx+Math.sin(c.ph*0.9)*60)-c.x)*dt*1.5;c.y+=((c.hy+Math.sin(c.ph*1.3)*40)-c.y)*dt*1.5;
   if(s&&Math.hypot(s.x-c.x,s.y-c.y)<90){c.hy-=120*dt;c.hx+=(c.x-s.x)*dt}}
  else if(c.k==="leaf"){c.ph+=dt;c.x+=(c.vx+Math.sin(c.ph*1.7)*40)*dt;c.y+=c.vy*dt;c.r+=Math.sin(c.ph*1.7)*dt*2;if(c.y>FLOOR)c.gone=1}
  else if(c.k==="dust"){c.ph+=dt;c.x+=Math.sin(c.ph*0.4)*6*dt+4*dt;c.y+=Math.cos(c.ph*0.5)*5*dt}
  else if(c.k==="ember"){c.ph+=dt;c.y+=c.vy*dt;c.x+=Math.sin(c.ph*3)*20*dt;c.life-=dt;if(c.life<0||c.y<y0-40)c.gone=1}
  else if(c.k==="fish"){if(c.wait>0){c.wait-=dt;if(c.wait<=0){c.vx=c.dir*(90+Math.random()*60);c.vy=-(430+Math.random()*160);c.y=FLOOR+4;puff(c.x,FLOOR,6,"splash","#d0ebff",120,0.5)}}
   else{c.vy+=900*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.vy>0&&c.y>FLOOR+4){puff(c.x,FLOOR,6,"splash","#d0ebff",120,0.5);c.wait=2+Math.random()*6;c.y=FLOOR+30}}}
  else if(c.k==="croc"){c.ph+=dt;c.x+=c.dir*14*dt;if(Math.sin(c.ph*0.15)>0.98)c.dir=-c.dir;if(c.snap>0)c.snap-=dt*0.9}}}
function drawCritters(w,T,layer){
 for(const c of critters){
  if(layer==="mid"){
   if(c.k==="fly"){const f=Math.abs(Math.sin(T*18+c.ph));cx.save();cx.translate(c.x,c.y);
    if(w===1){cx.fillStyle="rgba(210,240,255,0.7)";cx.beginPath();cx.ellipse(-2,-3,9,2.5*f+0.5,-0.3,0,TAU);cx.ellipse(-2,3,9,2.5*f+0.5,0.3,0,TAU);cx.fill();cx.fillStyle="#1c7ed6";cx.fillRect(-4,-1.5,16,3)}
    else{cx.fillStyle=c.col;cx.beginPath();cx.ellipse(-4,-2,6,8*f+1,-0.5,0,TAU);cx.ellipse(4,-2,6,8*f+1,0.5,0,TAU);cx.fill();cx.fillStyle="rgba(0,0,0,0.25)";cx.beginPath();cx.ellipse(-3,4,3.5,4*f+0.5,-0.3,0,TAU);cx.ellipse(3,4,3.5,4*f+0.5,0.3,0,TAU);cx.fill();
     cx.fillStyle="#2b2b2b";cx.fillRect(-1,-6,2,11)}cx.restore()}
   else if(c.k==="leaf")leaf(c.x,c.y,16,c.r,c.col);
   else if(c.k==="dust"){cx.fillStyle="rgba(255,240,200,"+(0.35+0.25*Math.sin(T*2+c.ph))+")";cx.beginPath();cx.arc(c.x,c.y,1.8,0,TAU);cx.fill()}
   else if(c.k==="ember"){const a=Math.max(0,Math.min(1,c.life))*(0.6+0.4*Math.sin(T*12+c.ph));cx.fillStyle="rgba(255,"+Math.round(150+80*Math.sin(c.ph))+",60,"+a+")";cx.beginPath();cx.arc(c.x,c.y,2.2,0,TAU);cx.fill()}}
  else if(layer==="water"&&c.k==="fish"&&c.wait<=0){const a=Math.atan2(c.vy,c.vx);cx.save();cx.translate(c.x,c.y);cx.rotate(a);
   cx.fillStyle=c.col;cx.beginPath();cx.ellipse(0,0,13,6,0,0,TAU);cx.fill();cx.beginPath();cx.moveTo(-10,0);cx.lineTo(-20,-7);cx.lineTo(-20,7);cx.fill();
   cx.fillStyle="#fff";cx.beginPath();cx.arc(7,-1.5,2.2,0,TAU);cx.fill();cx.fillStyle="#000";cx.beginPath();cx.arc(7.6,-1.5,1.1,0,TAU);cx.fill();cx.restore()}
  else if(layer==="front"&&c.k==="croc"){const bob=Math.sin(T*2+c.ph)*2,open=c.snap>0?Math.sin(Math.min(1,(1-c.snap)*3)*Math.PI)*18:0;cx.save();cx.translate(c.x,FLOOR+2+bob);cx.scale(c.dir,1);
   const g=w===1?"#5a7a2a":"#3f8a3a",d=w===1?"#3e5a1a":"#2b6a2b";
   if(open>1){cx.fillStyle="#e8687a";cx.beginPath();cx.moveTo(8,-4);cx.lineTo(56,-6-open);cx.lineTo(56,4);cx.closePath();cx.fill();
    cx.fillStyle=g;cx.beginPath();cx.moveTo(6,-6);cx.quadraticCurveTo(34,-10-open*1.2,58,-8-open);cx.lineTo(58,-2-open);cx.quadraticCurveTo(30,-4-open*0.6,6,-2);cx.fill();
    cx.fillStyle="#fff";for(let k=0;k<4;k++){cx.beginPath();cx.moveTo(20+k*9,-3-open*(0.3+k*0.18));cx.lineTo(24+k*9,2-open*(0.3+k*0.18));cx.lineTo(28+k*9,-3-open*(0.3+k*0.18));cx.fill()}}
   cx.fillStyle=g;cx.beginPath();cx.ellipse(28,-3,30,6,0,Math.PI,0);cx.fill();
   cx.fillStyle=d;for(let k=0;k<4;k++){cx.beginPath();cx.ellipse(-24-k*16,-1,6,3.5,0,Math.PI,0);cx.fill()}
   for(const ex of[2,14]){cx.fillStyle=g;cx.beginPath();cx.arc(ex,-7,6.5,Math.PI,0);cx.fill();cx.fillStyle="#fff8d0";cx.beginPath();cx.arc(ex,-8,4,0,TAU);cx.fill();
    cx.fillStyle="#1b1b1b";cx.beginPath();cx.ellipse(ex+1,-8,1.4,3,0,0,TAU);cx.fill()}
   cx.fillStyle=d;cx.beginPath();cx.arc(52,-7,2,0,TAU);cx.arc(46,-7,2,0,TAU);cx.fill();cx.restore()}}}
// birds cross the sky behind the hills; they need no memory of their own
function drawBirds(w,T){if(w===3)return;cx.strokeStyle=w===1?"rgba(90,50,30,0.55)":"rgba(40,60,70,0.55)";cx.lineWidth=Math.max(1.5,2*U);cx.lineCap="round";
 for(let i=0;i<4;i++){const sp=22+i*9,span=W+300,x=((T*sp+i*397-cam.x*cam.z*0.05)%span+span)%span-150,y=H*(0.1+0.05*i)+Math.sin(T*0.6+i*2)*12*U,f=Math.sin(T*7+i*1.7),s=(7+i%2*3)*U;
  cx.beginPath();cx.moveTo(x-s,y-f*s*0.6);cx.quadraticCurveTo(x-s*0.4,y-s*0.2,x,y);cx.quadraticCurveTo(x+s*0.4,y-s*0.2,x+s,y-f*s*0.6);cx.stroke()}}

// ---------------------------------------------------------------- confetti
const conf=[];
function confetti(n){const cols=["#ff6b6b","#ffd43b","#51cf66","#4dabf7","#cc5de8","#ff922b"];for(let i=0;i<n;i++)conf.push({x:Math.random()*W,y:-20-Math.random()*H*0.4,vx:(Math.random()-0.5)*80,vy:80+Math.random()*120,r:Math.random()*TAU,vr:(Math.random()-0.5)*10,c:cols[i%6],w:(5+Math.random()*5)*U,h:(3+Math.random()*3)*U})}
function drawConfetti(dt){screenXf();for(let i=conf.length-1;i>=0;i--){const p=conf[i];p.vy+=60*dt;p.x+=(p.vx+Math.sin(p.r*2)*40)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.y>H+30){conf.splice(i,1);continue}
 cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.r*1.3)),p.w,p.h*Math.abs(Math.cos(p.r*1.3))+0.5);cx.restore()}}

// ---------------------------------------------------------------- bits
const parts=[];
function puff(x,y,n,kind,col,sp,life){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(sp||120)*(0.3+Math.random());

const RAINBOW=["#ff6b6b","#ffa94d","#ffe066","#69db7c","#4dabf7","#9775fa"];
function trailPuff(kind,x,y){if(parts.length>400)return;
 if(kind==="leaves")parts.push({x,y,vx:(Math.random()-0.5)*40,vy:20,t:0,life:0.9,kind:"leaf",col:Math.random()<0.5?"#51cf66":"#94d82d",r:Math.random()*TAU,s:1});
 else if(kind==="sparks")parts.push({x:x+(Math.random()-0.5)*14,y:y+(Math.random()-0.5)*14,vx:0,vy:0,t:0,life:0.5,kind:"spark",col:Math.random()<0.5?"#fff":"#ffe066",r:0,s:1});
 else if(kind==="bubbles")parts.push({x,y,vx:(Math.random()-0.5)*20,vy:-30,t:0,life:1,kind:"bubble",col:"#a5d8ff",r:0,s:0.6+Math.random()*0.8});
 else if(kind==="stars")parts.push({x,y,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,t:0,life:0.8,kind:"star",col:RAINBOW[Math.floor(Math.random()*6)],r:Math.random()*TAU,s:1});
 else if(kind==="fire")parts.push({x,y,vx:(Math.random()-0.5)*30,vy:-40,t:0,life:0.45,kind:"fire",col:"#ff922b",r:0,s:1})}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue}
 p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==="splash"||p.kind==="chunk")p.vy+=900*dt;else if(p.kind==="leaf")p.vx+=Math.sin(p.t*6+p.r)*60*dt;p.r+=dt*3}}

 else if(p.kind==="spark"){cx.fillRect(p.x-2,p.y-2,4,4)}
 else if(p.kind==="bubble"){cx.strokeStyle=p.col;cx.lineWidth=2;cx.beginPath();cx.arc(p.x,p.y,5*p.s,0,TAU);cx.stroke()}
 else if(p.kind==="star"){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.beginPath();for(let j=0;j<10;j++){const a=j/10*TAU,r=j%2?3:7;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.fill();cx.restore()}
 else if(p.kind==="fire"){cx.fillStyle=k>0.5?"#ffd43b":p.col;cx.beginPath();cx.arc(p.x,p.y,4+6*k,0,TAU);cx.fill()}
 else{cx.beginPath();cx.arc(p.x,p.y,(p.kind==="splash"?5:4)*p.s*k+1,0,TAU);cx.fill()}}cx.globalAlpha=1}
// the rainbow is a ribbon rather than a spray: it keeps the last half second
// of the monkey's path and paints six bands along it
function drawRibbon(pts){if(pts.length<3)return;cx.lineCap="round";cx.lineJoin="round";

  for(let i=0;i<pts.length;i++){const p=pts[i],o=(b-2.5)*4;i?cx.lineTo(p.x,p.y+o):cx.moveTo(p.x,p.y+o)}cx.stroke()}cx.globalAlpha=1}
const pops=[];

 padBus=AC.createBiquadFilter();padBus.type="lowpass";padBus.frequency.value=1100;padBus.Q.value=0.5;padBus.connect(musBus);

 o.connect(g);g.connect(bus||sfxBus);o.start(t);o.stop(t+dur+0.03)}
let noiseBuf=null;
function noise(dur,vol,delay,hi,bus,at){if(!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

 s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02)}

// The music: a little band per world. A kick and a clap, a shaker on the
// off-beats, a bass that walks the chords, a soft pad holding each chord for
// its bar, and a marimba tune built from two phrases - one said twice, then
// an answer, then the first again - so it has a shape a child can hum.
// Everything is written a quarter of a second ahead of the clock.
const MUS=[{root:57,minor:0,bpm:108},{root:55,minor:0,bpm:100},{root:60,minor:0,bpm:112},{root:52,minor:1,bpm:118}];
const CHORDS=[[[0,4,7],[9,12,16],[5,9,12],[7,11,14]],[[0,3,7],[8,12,15],[3,7,10],[10,14,17]]];
let musNext=0,musStep=0,musWorld=-1,musPat=null;
function setMusic(w){if(w===musWorld)return;musWorld=w;const R=mulberry(77+w*13),phrase=()=>{const p=[];for(let i=0;i<16;i++)p.push(R()<(i%2?0.3:0.72)?Math.floor(R()*7):-1);p[0]=Math.floor(R()*3);return p};
 const A=phrase(),B=phrase(),A2=A.slice(0,12).concat([4,2,-1,0]);musPat=A.concat(A,B,A2);musStep=0}
const mtof=m=>440*Math.pow(2,(m-69)/12);
// for tools/wakecheck.mjs: is the sound running, and is the music being written
window.__audio=()=>AC?{state:AC.state,now:AC.currentTime,next:musNext,timer:musWorld>=0&&settings.music}:null;
window.__audioCtx=()=>AC;
function musicTick(){if(!AC||AC.state!=="running"||musWorld<0||!settings.music)return;const M=MUS[musWorld],sp=60/M.bpm/2;
 if(musNext<AC.currentTime-0.5)musNext=AC.currentTime+0.05;
 while(musNext<AC.currentTime+0.25){const i=musStep%64,bar=Math.floor(i/8)%4,b8=i%8,t=musNext;
  const sc=M.minor?[0,3,5,7,10,12,15]:[0,2,4,7,9,12,14],ch=CHORDS[M.minor][bar],r=M.root;
  if(b8===0||b8===4)tone(150,42,0.2,"sine",0.32,0,musBus,t);
  if(b8===2||b8===6)noise(0.11,0.11,0,1500,musBus,t);
  noise(0.03,b8%2?0.05:0.025,0,7000,musBus,t);
  if(b8===0||b8===3||b8===4||b8===7){const n=b8===7?ch[2]:ch[0];tone(mtof(r-12+n),mtof(r-12+n),0.28,"triangle",0.2,0,musBus,t)}
  if(b8===0)for(const n of ch)tone(mtof(r+n),mtof(r+n),sp*7.5,"triangle",0.05,0,padBus,t);
  const n=musPat[i];if(n>=0){const f=mtof(r+12+sc[n]);tone(f,f,0.26,"sine",0.13,0,musBus,t);tone(f*4,f*4,0.04,"sine",0.025,0,musBus,t);tone(f*2,f*2,0.12,"triangle",0.03,0,musBus,t)}
  musStep++;musNext+=sp}}

 let stars=1|(run.ng>=lv.golds.length?2:0)|(t<=lv.par?4:0);const oldStars=me.stars[id]||0;

 for(let i=0;i<lv.golds.length;i++)icon("gold",lx+14*U+i*24*U,t0+52*U,20*U,s.gd[i]?"#ffc81a":"rgba(255,255,255,0.4)");
 const b=46*U;
 button(sideR()-b,t0,b,b,"",()=>{restart()},{icon:"restart",col:"rgba(255,255,255,0.85)",ink:"#2b2b2b"});
 button(sideR()-b*2-10*U,t0,b,b,"",()=>{scene=lv.spec.daily?"title":"map";if(!lv.spec.daily)selWorld=lv.world},{icon:"home",col:"rgba(255,255,255,0.85)",ink:"#2b2b2b"});
 let iy=t0+b+14*U;for(const k of["magnet","shield","reach"]){if(!items[k]||(k==="shield"&&!s.shield))continue;icon(k,sideR()-b/2,iy,24*U,"#fff");iy+=32*U}
 // the hints sit up in the sky, clear of the monkey
 const hy=Math.max(t0+110*U,H*0.3);
 if(!started){const a=0.6+0.4*Math.sin(T*5);cx.globalAlpha=a;icon("hand",W/2,hy,46*U,"#fff");
  txt(lv.spec.tut===1?"HOLD to grab the vine":"HOLD ANYWHERE TO GO",W/2,hy+46*U,24*U,"#fff","center",900,"rgba(0,0,0,0.5)");cx.globalAlpha=1}
 else if(lv.spec.tut===2&&s.att>=0&&s.grabs<5){const a=0.65+0.35*Math.sin(T*4);cx.globalAlpha=a;
  txt("Slide up to climb the vine \u2191",W/2,hy+18*U,21*U,"#fff","center",900,"rgba(0,0,0,0.5)");txt("and down to go lower \u2193",W/2,hy+46*U,19*U,"#fff","center",800,"rgba(0,0,0,0.5)");cx.globalAlpha=1}
 else if(lv.spec.tut===1&&s.att>=0&&s.grabs<3){txt("...LET GO to fly!",W/2,hy+30*U,24*U,"#fff","center",900,"rgba(0,0,0,0.5)")}
 else if(lv.spec.tut===1&&s.deaths&&s.att<0&&s.grabs<4){txt("Hold again when a ring glows",W/2,hy+30*U,22*U,"#fff","center",900,"rgba(0,0,0,0.5)")}
 // standing on a ledge with no ring in reach, say what a tap does
 else if(s.gr&&s.att<0&&!(s.dead>0)&&!s.fin&&pickTarget(lv,s)<0){const a=0.6+0.4*Math.sin(T*5);cx.globalAlpha=a;
  txt("HOLD to hop forward \u2192",W/2,hy+30*U,22*U,"#fff","center",900,"rgba(0,0,0,0.5)");cx.globalAlpha=1}}
function drawDone(){const d=doneInfo,k=ease((T-doneAt-0.6)/0.4);if(k<=0)return;dim(0.55*k);
 const pw=Math.min(W-SAFE.l-SAFE.r-24*U,480*U),ph=Math.min(H-SAFE.t-SAFE.b-24*U,470*U),px=W/2-pw/2,py=H/2-ph/2+(1-k)*60*U,q=ph/470;
 cx.globalAlpha=k;panel(px,py,pw,ph);
 fitTxt(d.daily?"Daily Jungle done!":"Level "+lv.spec.id+" clear!",W/2,py+40*q,32*q,pw-40*U,"#5a3a00","center",900);
 txt(fmtT(d.t),W/2,py+92*q,48*q,d.t<=d.par?"#1c7ed6":"#5a3a00","center",900);txt("par "+fmtT(d.par),W/2,py+126*q,15*q,"#9a7a50","center",800);
 const age=T-doneAt-1;
 [["flag",1,"#2b8a3e"],["gold",2,"#f59f00"],["clock",4,"#1c7ed6"]].forEach((r,i)=>{const got=!!(d.stars&r[1]),show=age>i*0.35,x=W/2+(i-1)*84*q,y=py+178*q;
  cx.fillStyle="rgba(0,0,0,0.07)";cx.beginPath();cx.arc(x,y,32*q,0,TAU);cx.fill();
  if(show&&got){if(!d["s"+i]){d["s"+i]=1;sfx("star",i)}const pk=1+0.3*Math.max(0,1-(age-i*0.35)*4);icon(r[0],x,y,38*q*pk,r[2],true)}else icon(r[0],x,y,34*q,"#d6cfc2")});
 const lines=[];if(d.famRec&&d.beat)lines.push(["New family record! You beat "+d.beat.p.name+"!","#c92a2a"]);else if(d.famRec)lines.push(["New family record!","#c92a2a"]);else if(d.pb)lines.push(["Your best time yet!","#1c7ed6"]);
 if(d.flips)lines.push([d.flips+" flip"+(d.flips>1?"s":"")+" (+"+d.flips*2+" bananas)","#1098ad"]);
 if(d.combo>=3)lines.push(["Best combo x"+d.combo+" (+"+d.comboBn+" bananas)","#e8590c"]);
 lines.forEach((l,i)=>fitTxt(l[0],W/2,py+(232+i*26)*q,17*q,pw-30*U,l[1],"center",800));
 const got=Math.min(d.earn+d.bonus,Math.floor(Math.max(0,age)*60));icon("banana",W/2-40*q,py+296*q,30*q);txt("+"+got,W/2-18*q,py+297*q,26*q,"#5a3a00","left",900);
 const bh=Math.min(56*U,ph*0.13),by=py+ph-bh-18*q,nx=nextSpec(),n=nx?3:2,bw=(pw-40*U-(n-1)*10*U)/n;let x=px+20*U;
 button(x,by,bw,bh,"Again",()=>restart(),{icon:"restart",col:"#ffd43b"});x+=bw+10*U;
 button(x,by,bw,bh,d.daily?"Home":"Levels",()=>{scene=d.daily?"title":"map";selWorld=lv.world},{icon:"home",col:"#e9ecef"});x+=bw+10*U;
 if(nx)button(x,by,bw,bh,"Next",()=>{card={spec:nx,use:{}};scene="card"},{col:"#69db7c",ink:"#113a1a"});
 cx.globalAlpha=1}
function playFrame(dt){playUpdate(dt);const s=run;
 const sp0=Math.hypot(s.vx,s.vy);fx.zoom+=((1-0.16*clamp((sp0-600)/800,0,1))-fx.zoom)*Math.min(1,dt*1.5);zoomMul=fx.zoom;
 fx.shake=Math.max(0,fx.shake-dt*30);shk.x=(Math.random()-0.5)*fx.shake;shk.y=(Math.random()-0.5)*fx.shake;
 let fxX=s.x,fxY=s.y,look=clamp(s.vx*0.28,-160,320);if(s.dead>0){const r=rescuePos(lv,s);fxX=r.x;fxY=r.y;look=0}
 camTo(fxX+look+W/cam.z*0.1,lerp(fxY,330,0.45),camSnap?1:Math.min(1,dt*(s.dead>0?3:4.5)));camSnap=false;
 stepCritters(lv.world,dt,s);
 // the trail
 const sp=Math.hypot(s.vx,s.vy);if(started&&!(s.dead>0)&&sp>320){if(me.trail==="rainbow"){ribbon.push({x:s.x,y:s.y});if(ribbon.length>26)ribbon.shift()}else if(Math.random()<sp/900)trailPuff(me.trail,s.x-s.vx*0.02,s.y-s.vy*0.02)}
 else if(ribbon.length)ribbon.shift();
 const tgt=s.att<0&&!(s.dead>0)&&!s.fin?pickTarget(lv,s):-1;
 drawScene(lv,s,{char:me.char,hat:me.hat,trail:me.trail,col:me.col,ghost,target:tgt,dt,rescue:true});
 if(!doneInfo&&fx.combo>=2){screenXf();const a=Math.min(1,0.4+fx.combo*0.1);txt("COMBO x"+fx.combo,W/2,topY()+(ghost?92:78)*U,(18+Math.min(fx.combo,10))*U,"#ffe066","center",900,"rgba(0,0,0,"+(0.5*a)+")")}
 if(doneInfo){screenXf();drawDone();drawConfetti(dt)}else drawHUD()}

// ================================================================ input
function rectPos(x0,y0){const r=cv.getBoundingClientRect();return{x:r.width?(x0-r.left)*(W/r.width):x0,y:r.height?(y0-r.top)*(H/r.height):y0}}
function hitBtn(p){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b}return null}
function onMenu(t){try{return!!(t&&t.closest&&t.closest("[id^=shelf-menu]"))}catch(e){return false}}
function press(p,id){const b=hitBtn(p);if(b){sfx("tap");b.fn();return"button"}
 if(scene==="play"&&!run.fin){holds.add(id);fingerY[id]=p.y;return"hold"}return""}
// A finger slid up the screen climbs the vine, down lowers it - in step with
// the finger, about as far as it moved on the screen.
function slide(id,y){if(!holds.has(id)||fingerY[id]==null)return;const dy=y-fingerY[id];fingerY[id]=y;
 if(scene==="play"&&run&&run.att>=0)pull+=dy/cam.z*1.25}
let lastTouchAt=0,evN=0;
const ghostMouse=()=>performance.now()-lastTouchAt<900;
window.addEventListener("touchstart",e=>{lastTouchAt=performance.now();evN++;audioWake();
 for(const t of e.changedTouches){if(onMenu(t.target))continue;press(rectPos(t.clientX,t.clientY),t.identifier)}},{passive:false});
// a finger the browser no longer lists is let go, whatever happened to its
// touchend: a system swipe can eat one, and a vine that never lets go is a
// monkey that never flies
window.addEventListener("touchmove",e=>{for(const t of e.changedTouches)slide(t.identifier,rectPos(t.clientX,t.clientY).y)},{passive:true});
window.addEventListener("mousemove",e=>{if(mouseHold){if(fingerY.m==null)fingerY.m=rectPos(e.clientX,e.clientY).y;const was=holds.has("m");holds.add("m");slide("m",rectPos(e.clientX,e.clientY).y);if(!was)holds.delete("m")}});
function tend(e){lastTouchAt=performance.now();evN++;audioWake();for(const t of e.changedTouches)holds.delete(t.identifier);
 const live=new Set();for(const t of e.touches)live.add(t.identifier);for(const id of[...holds])if(typeof id==="number"&&!live.has(id))holds.delete(id)}
window.addEventListener("touchend",tend);window.addEventListener("touchcancel",tend);
cv.addEventListener("mousedown",e=>{if(ghostMouse())return;audioWake();const q=rectPos(e.clientX,e.clientY);if(press(q,"m")==="hold"){holds.delete("m");mouseHold=true;fingerY.m=q.y}});
function mouseUp(){mouseHold=false;holds.delete("m");fingerY.m=null}
window.addEventListener("mouseup",mouseUp);window.addEventListener("pointerup",e=>{if(e.pointerType==="mouse")mouseUp()});
window.addEventListener("keydown",e=>{audioWake();const k=e.key;
 if(k==="ArrowUp"||k==="ArrowDown"){keyPull=k==="ArrowUp"?-1:1;e.preventDefault();return}
 if(k===" "||k==="Enter"||k==="w"){if(scene==="play"&&!run.fin)keyHold=true;else if(scene==="play"&&doneInfo){const n=nextSpec();n?(card={spec:n,use:{}},scene="card"):restart()}
  else if(scene==="card")startLevel(card.spec,Object.assign({},card.use));e.preventDefault()}
 else if(k==="r"&&scene==="play")restart();
 else if(k==="Escape"){scene=scene==="play"?(lv.spec.daily?"title":"map"):scene==="card"?(card.daily?"title":"map"):"title"}});
window.addEventListener("keyup",e=>{const k=e.key;if(k===" "||k==="Enter"||k==="w")keyHold=false;if(k==="ArrowUp"||k==="ArrowDown")keyPull=0});
window.addEventListener("blur",()=>{holds.clear();keyHold=false;mouseHold=false;keyPull=0});
document.addEventListener("visibilitychange",()=>{if(document.hidden){holds.clear();keyHold=false;mouseHold=false}});
window.__shelfInput=()=>"holds:"+holds.size+(keyHold?"+key":"")+(mouseHold?"+mouse":"")+" events:"+evN+" scene:"+scene;

// ================================================================ loop
let last=0,sizeTick=0,nudgeT=0;
function frame(ts){requestAnimationFrame(frame);const now=ts/1000;let dt=last?now-last:1/60;last=now;dt=Math.min(Math.max(dt,0),0.1);T+=dt;
 if((sizeTick=(sizeTick+1)%5)===0)sizeWatch();if(T-nudgeT>1){nudgeT=T;audioNudge()}musicTick();
 btns=[];cx.setTransform(1,0,0,1,0,0);
 if(scene==="play"){watchPace(dt);playFrame(dt)}
 else{if(musWorld<0||scene==="title")setMusic(0);demoUpdate(dt);screenXf();
  if(scene==="title")drawTitle();else if(scene==="who")drawWho();else if(scene==="map")drawMap();else if(scene==="card")drawCard();else if(scene==="shop")drawShop()}
 stepParts(dt);screenXf();drawToast()}
requestAnimationFrame(frame);
// for the checks in tools/: start a level, hold or let go, read the run
window.VS={get lowFx(){return lowFx},set lowFx(v){lowFx=v},get scene(){return scene},get run(){return run},get lv(){return lv},get me(){return me},
 start(w,i){startLevel(levelSpec(w,i),{})},daily(){startLevel(dailySpec(dayKey()),{})},hold(on){on?holds.add("test"):holds.delete("test")},
 go(s){scene=s},genLevel,levelSpec,dailySpec,newRun,step,pickTarget};
