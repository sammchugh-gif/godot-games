<script>
"use strict";
// ================================================================ tiles
// American mah jongg: 152 tiles. Three suits of 1-9, four of each (bams,
// craks, dots); four of each wind; four of each dragon (green goes with bams,
// red with craks, white - "soap" - with dots, and soap is also the zero in a
// year); eight flowers; eight jokers. A tile's code:
//   0-26  suited, suit*9 + number-1      27-30 winds N E W S
//   31-33 dragons green, red, soap       34 flower       35 joker
const SUIT_NAME=["Bam","Crak","Dot"],T_N=27,T_SOAP=33,T_F=34,T_J=35,NCODE=36;
const tSuit=t=>t<27?(t/9|0):-1,tNum=t=>t<27?t%9+1:0,dragonOf=s=>31+s;
const AVAIL=t=>t===T_F||t===T_J?8:4;
function tName(t){if(t<27)return tNum(t)+" "+SUIT_NAME[tSuit(t)];if(t<31)return["North","East","West","South"][t-27]+" wind";
 if(t<34)return["Green","Red","White"][t-31]+" dragon";return t===T_F?"Flower":"Joker"}
function tShort(t){if(t<27)return tNum(t)+"BCD"[tSuit(t)];if(t<31)return"NEWS"[t-27];if(t<34)return["GD","RD","0"][t-31];return t===T_F?"F":"J"}
// tile id (0-151) -> code
const TILE=(()=>{const a=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)a.push(t);for(let k=0;k<8;k++)a.push(T_F);for(let k=0;k<8;k++)a.push(T_J);return a})();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ================================================================ card
// The game's own card, in the American style: the same kinds of hands as
// the League's card (year, 2468, like numbers, quints, runs, odds, winds and
// dragons, 369, singles and pairs), but its own hands - the League's card is
// theirs, and new every year.
// A hand is written the way a card prints it:
//   1-9 a number; 0 the white dragon (soap), a zero in a year
//   i j k l m a number counted from a base: i, i+1, i+2... (runs, like numbers)
//   N E W S winds, F flower, D the dragon that goes with the group's suit
//   a trailing a, b or c is the group's suit: the same letter the same suit,
//   different letters different suits
// A token of one tile repeated is a group (FF a pair, 222a a pung, 2222a a
// kong, 22222a a quint); a token of different tiles (2026a, 13579a) is that
// many single tiles. Jokers can stand in for a tile in a group of three or
// more, never in a pair or a single. c:1 marks a concealed hand (no
// exposures; only the last tile may be called).
const CARD_STD=[
 ["2026",[["FF 2026a 2222b 6666c",25],["222a 0000 222b 6666c",25],["FFFF 2026a NN 2026b",30,1],["NNN 2026a SSS 2026a",30]]],
 ["2468",[["222a 4444a 666a 8888a",25],["FF 2222a 4444b 6666c",25],["22a 444a 66b 888b DDDDc",25],["2222a 44a 66a 8888a FF",25],["FFFF 2222a 88a 4444b",25],["2468a DDDa 2468b DDDb",30,1]]],
 ["Like Numbers",[["FF iiiia iiiib iiiic",25],["iiiia DDDa iiiib DDDb",25],["FFF iiia iiiib iiiic",25]]],
 ["Quints",[["FF iiiiia jja kkkkka",40],["iiiiia DDDDc iiiiib",45],["NNNNN EEEE SSSSS",45]]],
 ["Consecutive Run",[["iia jjja kkkka llla mma",25],["iiiia jjjja kkkkb llb",25],["FF iiiia jjjja kkkka",25],["iiia jjja kkkkb DDDDb",25],["iiiia jjjjb kkkkc FF",25]]],
 ["13579",[["11a 333a 5555a 777a 99a",25],["FF 5555a 7777a 9999a",25],["1111a 333a 5555a DDDa",25],["FFF 13579a 333b 555c",35,1]]],
 ["Winds - Dragons",[["NNNN EEE WWW SSSS",25],["FF NNN EEEE WWW SS",25],["NN EEE WWW SS DDDDa",25],["DDDa DDDb DDDDc FFFF",30],["NNNN SSSS DDa DDb DDc",30,1],["EEEE WWWW iia iib iic",30,1]]],
 ["369",[["3333a 666a 999a FFFF",25],["FF 3333a 6666b 9999c",25],["3333a 66a 9999a DDDDb",25],["FFFF 369a 369b 3333c",30]]],
 ["Singles and Pairs",[["NN EE WW SS iia jjb kkc",50,1],["FF 22a 44a 66a 88a DDb DDc",50,1],["iia jja kka lla mma NN SS",50,1],["336699a 336699b FF",50,1]]]];
// Easy: hold eight, go out with nine
const CARD_EASY=[
 ["2026",[["2026a DDDb FF",30]]],
 ["2468",[["222a 444a 666a",25],["FF 2222a 888a",25],["22a 44a 666a 88a",30,1]]],
 ["Like Numbers",[["iiia iiib iiic",25],["FFF iiiia DDa",25]]],
 ["Quints",[["iiiiia jjjja",35]]],
 ["Consecutive Run",[["iiia jjja kkka",25],["iiia jjjb kkkc",25],["FF iiiia jjja",25]]],
 ["13579",[["111a 333a 555a",25],["FF 5555a 999a",25]]],
 ["Winds - Dragons",[["NNN SSS FFF",25],["EEE WWW DDDa",25],["DDDa DDDb DDDc",30]]],
 ["369",[["333a 666a 999a",25],["FF 3333a 999b",25]]],
 ["Singles and Pairs",[["NN EE WW SS F",40,1],["iia jja kka lla F",40,1]]]];
// Short (hold twelve, go out with thirteen): the standard card with its first
// pair made a single, or where there is no pair its first kong a pung (then
// a quint a kong, a pung a pair)
function shorten(src){const toks=src.split(" ");let i=toks.findIndex(t=>{const b=t.replace(/[abc]$/,"");return b.length===2&&b[0]===b[1]});
 if(i<0)i=toks.findIndex(t=>{const b=t.replace(/[abc]$/,"");return b.length===4&&[...b].every(c=>c===b[0])});
 for(const n of[5,3])if(i<0)i=toks.findIndex(t=>{const b=t.replace(/[abc]$/,"");return b.length===n&&[...b].every(c=>c===b[0])});
 const t=toks[i],sv=/[abc]$/.test(t)?t.slice(-1):"",b=sv?t.slice(0,-1):t;toks[i]=b.slice(1)+sv;return toks.join(" ")}
const CARD_SHORT=CARD_STD.map(([title,hs])=>[title,hs.map(h=>[shorten(h[0])].concat(h.slice(1)))]);
const MODES={easy:{name:"Easy",size:9,pass:2,second:false,card:CARD_EASY},
 short:{name:"Short",size:13,pass:3,second:true,card:CARD_SHORT},
 standard:{name:"Standard",size:14,pass:3,second:true,card:CARD_STD}};

function parseHand(src){const groups=[];
 for(const tok of src.split(/\s+/)){const m=/[abc]$/.exec(tok),sv=m?m[0]:null,body=m?tok.slice(0,-1):tok,ch=[...body];
  if(ch.every(c=>c===ch[0]))groups.push({c:ch[0],k:ch.length,s:sv});else for(const c of ch)groups.push({c,k:1,s:sv})}
 return groups}
// every concrete way a hand can be made: each suit letter a suit, each
// counted number a base that keeps the run on the tiles
function expand(hand){const g=parseHand(hand.src),vars=[...new Set(g.filter(x=>x.s).map(x=>x.s))].sort();
 const off=c=>"ijklm".indexOf(c),maxOff=Math.max(-1,...g.map(x=>off(x.c))),bases=maxOff>=0?Array.from({length:9-maxOff},(_,i)=>i+1):[0];
 const perms=[];(function p(pre){if(pre.length===vars.length){perms.push(pre.slice());return}for(let s=0;s<3;s++)if(!pre.includes(s)){pre.push(s);p(pre);pre.pop()}})([]);
 const out=[],seen=new Set();
 for(const base of bases)for(const pm of perms){const suit=sv=>pm[vars.indexOf(sv)];let ok=true;
  const groups=g.map(x=>{let t;const c=x.c;
   if(c>="1"&&c<="9")t=suit(x.s)*9+(+c)-1;else if(c==="0")t=T_SOAP;else if(off(c)>=0){const n=base+off(c);t=suit(x.s)*9+n-1}
   else if(c==="F")t=T_F;else if("NEWS".includes(c))t=T_N+"NEWS".indexOf(c);else if(c==="D")t=dragonOf(suit(x.s));else ok=false;
   return{t,k:x.k}});
  if(!ok)continue;
  const need=new Map();for(const q of groups){const e=need.get(q.t)||{n:0,j:0};if(q.k>=3)e.j+=q.k;else e.n+=q.k;need.set(q.t,e)}
  // it has to be makeable: no more naturals than there are, jokers only in groups
  let jok=0;for(const [t,e] of need){if(e.n>AVAIL(t)){ok=false;break}jok+=Math.max(0,e.n+e.j-AVAIL(t))}
  if(!ok||jok>8)continue;
  const sig=groups.map(q=>q.t+"x"+q.k).sort().join(",");if(seen.has(sig))continue;seen.add(sig);
  out.push({hand,groups,need:[...need].map(([t,e])=>({t,n:e.n,j:e.j})),gk:groups.map(q=>q.t*8+q.k)})}
 return out}
function buildCard(mode){const M=MODES[mode],hands=[],vars=[];let id=0;
 for(const [title,hs] of M.card)for(const h of hs){const hand={id:id++,section:title,src:h[0],value:h[1],concealed:!!h[2],pairs:title==="Singles and Pairs"};
  hand.size=parseHand(hand.src).reduce((a,q)=>a+q.k,0);hand.variants=expand(hand);hands.push(hand);for(const v of hand.variants)vars.push(v)}
 return{mode,size:M.size,hands,vars}}
const CARDS={};for(const m in MODES)CARDS[m]=buildCard(m);

// ================================================================ reading a hand
// counts of each tile code among a set of tile ids
function countsOf(ids){const h=new Int8Array(NCODE);for(const i of ids)h[TILE[i]]++;return h}
// How many more tiles a player needs for this concrete hand, given the tiles
// in their hand (h, jokers among them) and what they have exposed - or
// Infinity if their exposures rule it out.
function missing(v,h,exps){
 if(exps.length){if(v.hand.concealed)return Infinity;
  const left=v.gk.slice();for(const e of exps){const i=left.indexOf(e.t*8+e.k);if(i<0)return Infinity;left.splice(i,1)}
  // the groups not yet exposed
  const need=new Map();for(const key of left){const t=key>>3,k=key&7,e=need.get(t)||{n:0,j:0};if(k>=3)e.j+=k;else e.n+=k;need.set(t,e)}
  let nd=0,dj=0;for(const [t,e] of need){const ht=h[t];nd+=Math.max(0,e.n-ht);dj+=Math.max(0,e.j-Math.max(0,ht-e.n))}
  return nd+Math.max(0,dj-h[T_J])}
 let nd=0,dj=0;for(const e of v.need){const ht=h[e.t];nd+=Math.max(0,e.n-ht);dj+=Math.max(0,e.j-Math.max(0,ht-e.n))}
 return nd+Math.max(0,dj-h[T_J])}
function heldCount(h){let n=0;for(let t=0;t<NCODE;t++)n+=h[t];return n}
function expCount(exps){let n=0;for(const e of exps)n+=e.k;return n}
// Is it mahjong? The best-paying hand on the card this makes, or null.
function winningHand(card,h,exps){if(heldCount(h)+expCount(exps)!==card.size)return null;let best=null;
 for(const v of card.vars)if(missing(v,h,exps)===0&&(!best||v.hand.value>best.hand.value))best=v;return best}
// the closest hands on the card: for each hand its fewest missing tiles
function closest(card,h,exps){const out=[];
 for(const hand of card.hands){let m=Infinity,bv=null;for(const v of hand.variants){const d=missing(v,h,exps);if(d<m){m=d;bv=v}}out.push({hand,m,v:bv})}
 return out.sort((a,b)=>a.m-b.m||b.hand.value-a.hand.value)}
function bestMissing(card,h,exps){let m=Infinity;for(const v of card.vars){const d=missing(v,h,exps);if(d<m)m=d}return m}

// ================================================================ the game
// Play goes to the right. Seats are numbered in turn order, so a seat's
// right is the next seat, across two on, left three on.
const PASS_DIR={right:1,across:2,left:3};
function newGame(o){
 const M=MODES[o.mode],card=CARDS[o.mode],R=mulberry32(o.seed>>>0),ids=Array.from({length:152},(_,i)=>i);
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 const G={mode:o.mode,card,size:M.size,seed:o.seed>>>0,rng:R,dealer:o.dealer||0,wall:ids,pool:[],
  seats:[0,1,2,3].map(i=>({name:(o.names||[])[i]||"Player "+(i+1),bot:!!(o.bots||[])[i],hand:[],exp:[],disc:[]})),
  phase:"charleston",turn:o.dealer||0,last:null,claims:null,picks:[null,null,null,null],votes:null,
  plan:[["right",M.pass],["across",M.pass],["left",M.pass]],step:0,second:M.second,log:[],result:null,drawn:null,calledFrom:-1,t:0};
 for(let r=0;r<M.size-1;r++)for(let k=0;k<4;k++)G.seats[(G.dealer+k)%4].hand.push(G.wall.pop());
 G.seats[G.dealer].hand.push(G.wall.pop());
 logG(G,"deal");return G}
// (a log entry's own k and t come last, so nothing in o can overwrite them)
function logG(G,k,o){G.log.push(Object.assign({},o||{},{k,t:G.t++}))}
const heldOf=s=>countsOf(s.hand);
// what a seat has to do now, if anything
function waitingOn(G){const w=[];
 if(G.phase==="charleston"||G.phase==="courtesy"){for(let i=0;i<4;i++)if(!G.picks[i])w.push(i)}
 else if(G.phase==="vote"){for(let i=0;i<4;i++)if(G.votes[i]==null)w.push(i)}
 else if(G.phase==="turn")w.push(G.turn);
 else if(G.phase==="claims"){for(let i=0;i<4;i++)if(G.claims[i]===undefined)w.push(i)}
 return w}
function passCount(G){return G.phase==="courtesy"?3:G.plan[G.step][1]}
// ---------------------------------------------------------------- the Charleston
function pick(G,seat,tiles){
 if(G.phase!=="charleston"&&G.phase!=="courtesy")return"not now";const s=G.seats[seat];
 const n=G.phase==="courtesy"?tiles.length:passCount(G);
 if(tiles.length!==n||G.phase==="courtesy"&&n>3)return"pass "+n+" tiles";
 if(new Set(tiles).size!==tiles.length||tiles.some(i=>!s.hand.includes(i)))return"not your tiles";
 if(tiles.some(i=>TILE[i]===T_J))return"jokers are never passed";
 G.picks[seat]=tiles.slice();
 if(G.picks.every(p=>p))(G.phase==="courtesy"?doCourtesy:doPass)(G);
 return null}
function doPass(G){const [dir]=G.plan[G.step],d=PASS_DIR[dir];
 for(let i=0;i<4;i++){const s=G.seats[i];s.hand=s.hand.filter(x=>!G.picks[i].includes(x))}
 for(let i=0;i<4;i++)G.seats[(i+d)%4].hand.push(...G.picks[i]);
 logG(G,"passed",{dir,n:G.picks[0].length});G.picks=[null,null,null,null];G.step++;
 if(G.step<G.plan.length)return;
 // after the first Charleston, everyone may stop the second; after the second, the courtesy pass
 if(G.second&&G.plan.length===3){G.phase="vote";G.votes=[null,null,null,null];return}
 if(G.second){G.phase="courtesy";return}
 startPlay(G)}
function vote(G,seat,more){if(G.phase!=="vote")return"not now";G.votes[seat]=!!more;
 if(G.votes.every(v=>v!=null)){const go=G.votes.every(v=>v);logG(G,"vote",{go});
  if(go){G.plan.push(["left",3],["across",3],["right",3]);G.phase="charleston"}else G.phase="courtesy"}
 return null}
function doCourtesy(G){
 // across from each other, the smaller offer is what both give
 for(const [a,b] of [[0,2],[1,3]]){const n=Math.min(G.picks[a].length,G.picks[b].length),ga=G.picks[a].slice(0,n),gb=G.picks[b].slice(0,n),A=G.seats[a],B=G.seats[b];
  A.hand=A.hand.filter(x=>!ga.includes(x)).concat(gb);B.hand=B.hand.filter(x=>!gb.includes(x)).concat(ga);logG(G,"courtesy",{a,b,n})}
 G.picks=[null,null,null,null];startPlay(G)}
function startPlay(G){G.phase="turn";G.turn=G.dealer;G.drawn=null;G.calledFrom=-1;logG(G,"play")}
// ---------------------------------------------------------------- turns
function drawWall(G){if(!G.wall.length){G.phase="end";G.result={wall:true};logG(G,"wall");return}
 const id=G.wall.pop();G.seats[G.turn].hand.push(id);G.drawn=id;G.calledFrom=-1;G.phase="turn";logG(G,"draw",{seat:G.turn})}
function discard(G,seat,id){if(G.phase!=="turn"||G.turn!==seat)return"not your turn";const s=G.seats[seat];
 if(!s.hand.includes(id))return"not your tile";
 s.hand.splice(s.hand.indexOf(id),1);G.last={id,from:seat};G.drawn=null;G.calledFrom=-1;logG(G,"discard",{seat,id});
 G.phase="claims";G.claims=[undefined,undefined,undefined,undefined];G.claims[seat]=null;
 // nobody is asked who could not use it anyway
 for(let i=0;i<4;i++)if(i!==seat&&!canClaim(G,i).any)G.claims[i]=null;
 settle(G);return null}
// what a seat could do with the last discard
function canClaim(G,seat){const s=G.seats[seat],t=TILE[G.last.id],h=heldOf(s),out={mahjong:false,expose:[],any:false};
 if(t===T_J)return out;
 h[t]++;if(winningHand(G.card,h,s.exp))out.mahjong=true;h[t]--;
 // an exposure has to fit some hand on the card with what is already exposed
 const have=h[t]+h[T_J];
 for(let k=3;k<=5;k++){if(have<k-1)continue;const e=s.exp.concat([{t,k}]);
  if(G.card.vars.some(v=>!v.hand.concealed&&missing(v,h,e)<Infinity))out.expose.push(k)}
 out.any=out.mahjong||out.expose.length>0;return out}
// claim: null (pass), {mahjong:true}, or {k:3|4|5|6}
function claim(G,seat,c){if(G.phase!=="claims"||G.claims[seat]!==undefined)return"not now";
 if(c){const ok=canClaim(G,seat);if(c.mahjong&&!ok.mahjong||c.k&&!ok.expose.includes(c.k))return"that does not fit the card"}
 G.claims[seat]=c||null;settle(G);return null}
function settle(G){if(G.claims.some(c=>c===undefined))return;const from=G.last.from;
 const order=[1,2,3].map(d=>(from+d)%4);
 const mj=order.find(i=>G.claims[i]&&G.claims[i].mahjong);
 if(mj!=null){const s=G.seats[mj];s.hand.push(G.last.id);G.turn=mj;win(G,mj,from);return}
 const ex=order.find(i=>G.claims[i]&&G.claims[i].k);
 if(ex!=null){const s=G.seats[ex],t=TILE[G.last.id],k=G.claims[ex].k,use=[G.last.id];
  // naturals first, jokers to make up the rest
  for(const id of s.hand)if(use.length<k&&TILE[id]===t)use.push(id);
  for(const id of s.hand)if(use.length<k&&TILE[id]===T_J)use.push(id);
  s.hand=s.hand.filter(x=>!use.includes(x));s.exp.push({t,k,ids:use});
  logG(G,"call",{seat:ex,from,tile:t,n:k});G.turn=ex;G.phase="turn";G.calledFrom=from;G.drawn=null;G.claims=null;return}
 G.pool.push(G.last);G.seats[from].disc.push(G.last.id);G.claims=null;G.turn=(from+1)%4;drawWall(G)}
// Trade a natural tile for a joker in anyone's exposure that stands for it
function swapJoker(G,seat,owner,ei,id){if(G.phase!=="turn"||G.turn!==seat)return"not your turn";
 const s=G.seats[seat],e=G.seats[owner].exp[ei];if(!e||!s.hand.includes(id)||TILE[id]!==e.t)return"that tile does not go there";
 const j=e.ids.findIndex(x=>TILE[x]===T_J);if(j<0)return"no joker there";
 const jid=e.ids[j];e.ids[j]=id;s.hand.splice(s.hand.indexOf(id),1,jid);logG(G,"swap",{seat,owner,tile:e.t});return null}
function declare(G,seat){if(G.phase!=="turn"||G.turn!==seat)return"not your turn";
 if(!winningHand(G.card,heldOf(G.seats[seat]),G.seats[seat].exp))return"that is not mahjong yet";win(G,seat,G.calledFrom);return null}
// Paying out: the hand's value from each player; double from whoever threw
// the winning tile, double from everyone if it came off the wall, and double
// again with no jokers (not on singles and pairs, which cannot have any)
function win(G,seat,from){const s=G.seats[seat],v=winningHand(G.card,heldOf(s),s.exp);
 const jokers=s.hand.concat(...s.exp.map(e=>e.ids)).filter(i=>TILE[i]===T_J).length,jl=!jokers&&!v.hand.pairs;
 const base=v.hand.value*(jl?2:1),pay=[0,0,0,0];
 for(let i=0;i<4;i++)if(i!==seat){pay[i]=-(from<0||from===i?2:1)*base;pay[seat]-=pay[i]}
 G.phase="end";G.result={winner:seat,from,hand:v.hand,variant:v,jokerless:jl,self:from<0,pay};logG(G,"mahjong",{seat,from})}

// ================================================================ the bots
// A bot keeps the few hands on the card it is closest to in mind, and plays
// toward them: it passes and throws what none of them want, calls a discard
// when an exposure brings it closer to one of them it can still go for, and
// never passes or throws a joker.
function botScore(G,h,exps){const card=G.card;let best=Infinity;const top=[];
 for(const v of card.vars){const d=missing(v,h,exps);if(d<best)best=d;if(d<Infinity)top.push([d-v.hand.value/200,v])}
 top.sort((a,b)=>a[0]-b[0]);return{best,top:top.slice(0,12).map(x=>x[1])}}
// how much a tile matters to the hands the bot is going for

// Playing on separate devices: the host's device opens a room with a four
// digit code through PeerJS's free connection broker, and the others join
// with the code; after that the devices talk directly (WebRTC). The host
// sends each player their view and applies what they do. A player who drops
// out is played by a bot until they come back with the same code.

function screenSize(){const vv=window.visualViewport,de=document.documentElement;
 let w=Math.round(vv&&vv.width?vv.width:innerWidth),h=Math.round(vv&&vv.height?vv.height:innerHeight);
 if(ownsTheScreen()){w=Math.max(w,Math.round(de.clientWidth)||0);h=Math.max(h,Math.round(de.clientHeight)||0)}
 return{w:Math.max(1,w),h:Math.max(1,h),d:Math.min(window.devicePixelRatio||1,3)}}
function resize(){readSafe();const z=screenSize();DPR=z.d;W=z.w;H=z.h;cv.style.width=W+"px";cv.style.height=H+"px";
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);U=Math.max(0.72,Math.min(1.5,Math.min(W/430,H/600)))}
function sizeWatch(){const z=screenSize();if(z.w!==W||z.h!==H||z.d!==DPR||cv.width!==Math.round(W*DPR)||cv.height!==Math.round(H*DPR))resize()}

function tone(f0,f1,dur,type,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+0.03)}
let noiseBuf=null;
function noise(dur,vol,delay,f){if(!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;fl.type="bandpass";fl.frequency.value=f||2400;fl.Q.value=1.2;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(sfxBus);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02)}
// tiles are bone and plastic: a clack is a short bright knock
const SFX={tap(){tone(700,900,0.05,"triangle",0.08)},clack(){noise(0.06,0.5,0,3200);tone(1900,1500,0.04,"square",0.05)},
 pick(){noise(0.04,0.25,0,4200)},whoosh(){noise(0.3,0.25,0,900);noise(0.3,0.12,0.05,1600)},
 call(){tone(660,660,0.12,"triangle",0.14);tone(990,990,0.18,"triangle",0.12,0.1)},turn(){tone(880,880,0.1,"sine",0.12);tone(1320,1320,0.14,"sine",0.08,0.08)},
 joker(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,f,0.1,"triangle",0.08,i*0.05))},
 mahjong(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.18,"square",0.09,i*0.11));[523,659,784].forEach(f=>tone(f*2,f*2,0.9,"triangle",0.08,0.46));noise(0.4,0.08,0.4,6000)},
 lose(){tone(440,330,0.3,"triangle",0.1);tone(330,220,0.4,"triangle",0.1,0.25)},wall(){tone(300,200,0.5,"sine",0.12)},
 join(){tone(784,1175,0.2,"triangle",0.1)},no(){tone(220,180,0.18,"square",0.08)}};

function handTokens(src){const out=[];for(const tok of src.split(" ")){const sv=/[abc]$/.test(tok)?tok.slice(-1):"",b=sv?tok.slice(0,-1):tok,t=b.replace(/[ijklm]/g,c=>String("ijklm".indexOf(c)+1));

  else out.push({t,col:/^0+$/.test(t)?"#1c7ed6":col})}return out}
function handNote(h){const s=h.src;if(!/[ijklm]/.test(s))return"";const suits=new Set((s.match(/[ijklm]+([abc])/g)||[]).map(x=>x.slice(-1)));
