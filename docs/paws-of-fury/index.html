/* ----------------------------------------------------------------- audio -- */
let actx=null, muted=false, mg=null;
function audioInit(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx=new AC(); mg=actx.createGain(); mg.gain.value=.42; mg.connect(actx.destination);
}
function tone(f,d,t,v,slide){
  if(!actx||muted) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=t||'square'; o.frequency.setValueAtTime(f,actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),actx.currentTime+d);
  g.gain.setValueAtTime(v||.2,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
  o.connect(g); g.connect(mg); o.start(); o.stop(actx.currentTime+d);
}
function nz(d,v,f,q){
  if(!actx||muted) return;
  const n=Math.floor(actx.sampleRate*d), b=actx.createBuffer(1,n,actx.sampleRate), a=b.getChannelData(0);
  for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource(); s.buffer=b;
  const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f||1200; bp.Q.value=q||1;
  const g=actx.createGain(); g.gain.value=v||.25;
  s.connect(bp); bp.connect(g); g.connect(mg); s.start();
}
const SFX={
  jump(){ tone(320,.13,'square',.14,2.2); },
  jump2(){ tone(410,.14,'square',.15,2.3); },
  jump3(){ tone(520,.18,'square',.17,2.6); setTimeout(()=>tone(760,.16,'triangle',.10,2.0),20); },
  land(){ nz(.09,.16,300,1); },
  pound(){ nz(.30,.40,150,.5); tone(70,.3,'sawtooth',.24,.3); },
  bark(){ tone(430,.09,'square',.24,.45); setTimeout(()=>tone(300,.11,'square',.18,.4),68); },
  hit(){ nz(.09,.28,700,1.2); tone(150,.08,'square',.16,.4); },
  stomp(){ nz(.12,.30,420,.9); tone(200,.12,'square',.18,1.8); },
  coin(){ tone(988,.06,'square',.15); setTimeout(()=>tone(1319,.12,'square',.15),58); },
  bone(){ [523,659,784,1046,1319].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.19),i*95)); },
  hurt(){ tone(220,.28,'sawtooth',.19,.5); nz(.18,.20,400,.8); },
  die(){ [440,392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.30,'square',.19),i*130)); },
  sel(){ tone(880,.05,'square',.14); },
  warp(){ tone(180,.40,'sine',.20,6); },
  splash(){ nz(.35,.22,900,.6); }
};
const MUSIC={
  on:false,next:0,step:0,pat:null,bpm:130,
  bank:{
    hub:{b:[0,4,7,4,5,4,2,0], s:[65.4,82.4,98,110],   d:'x..x..x.'},
    w0: {b:[0,0,4,4,7,7,4,2], s:[73.4,92.5,110,123],  d:'x.x.x.x.'},
    w1: {b:[0,2,3,5,7,5,3,2], s:[61.7,77.8,92.5,104], d:'x.xx..x.'},
    w2: {b:[0,5,3,7,0,5,8,7], s:[69.3,87.3,104,116],  d:'xx.x.x.x'},
    w3: {b:[0,-1,2,3,5,3,2,0],s:[58.3,73.4,87.3,98],  d:'x..x.xx.'},
    w4: {b:[0,7,0,7,5,3,5,7], s:[49,65.4,82.4,98],    d:'x.x..xx.'},
    w5: {b:[0,3,7,10,7,3,0,-2],s:[55,69.3,82.4,110],  d:'x.x.xx.x'}
  },
  set(k){ const p=this.bank[k]||this.bank.hub; if(p!==this.pat){ this.pat=p; this.step=0; this.next=0; } },
  tick(){
    if(!actx||muted||!this.on||!this.pat) return;
    const spb=60/this.bpm/2;
    if(this.next===0) this.next=actx.currentTime;
    let guard=0;
    while(this.next<actx.currentTime+.12 && guard++<16){
      const s=this.step%8, p=this.pat;
      this.note(p.s[0]*Math.pow(2,p.b[s]/12), spb*.85,'triangle',.12,this.next);
      if(s%2===0) this.note(p.s[(this.step>>1)%p.s.length]*2, spb*.45,'square',.04,this.next);
      if(p.d[s]==='x') this.drum(this.next);
      this.next+=spb; this.step++;
    }
  },
  note(f,d,t,v,at){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=t; o.frequency.value=f; g.gain.setValueAtTime(v,at);
    g.gain.exponentialRampToValueAtTime(.0001,at+d);
    o.connect(g); g.connect(mg); o.start(at); o.stop(at+d);
  },
  drum(at){
    const n=Math.floor(actx.sampleRate*.05), b=actx.createBuffer(1,n,actx.sampleRate), a=b.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
    const s=actx.createBufferSource(); s.buffer=b;
    const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1700;
    const g=actx.createGain(); g.gain.value=.12;
    s.connect(f); f.connect(g); g.connect(mg); s.start(at);
  }
};

/* ---------------------------------------------------------------- camera --- */
const PROJ=new Float32Array(16), VIEW=new Float32Array(16), VP=new Float32Array(16);
const CAM={ yaw:-Math.PI/2, pitch:0.34, dist:10.5, x:0,y:4,z:10, tx:0,ty:1.2,tz:0,
            shake:0, fov:50*DEG };
function project(x,y,z,o){
  o=o||{};
  const w=VP[3]*x+VP[7]*y+VP[11]*z+VP[15];
  o.vis=w>0.001;
  const iw=1/(w||1);
  o.x=((VP[0]*x+VP[4]*y+VP[8]*z+VP[12])*iw*0.5+0.5)*VW;
  o.y=(1-((VP[1]*x+VP[5]*y+VP[9]*z+VP[13])*iw*0.5+0.5))*VH;
  return o;
}

/* --------------------------------------------------------------- material -- */
let _rough=0.85, _spec=0.06;
function mat(rough,spec){ _rough=rough; _spec=spec; }

/* ---------------------------------------------------------- render passes -- */
function beginFrame(){
  poolReset(); DL.length=0; DLT.length=0; DLS.length=0;
  TOP=ident(m4()); STK.length=0; _flash=0; _alpha=1; _shadowOn=true; _lastPrim=null;
  _rough=0.85; _spec=0.06;
}

function bindLit(p){
  if(_lastPrim===p) return;
  _lastPrim=p;
  gl.bindBuffer(gl.ARRAY_BUFFER,p.vb); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,p.nb); gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  if(p.cb && A_COL>=0){ gl.enableVertexAttribArray(A_COL);
            gl.bindBuffer(gl.ARRAY_BUFFER,p.cb); gl.vertexAttribPointer(A_COL,3,gl.FLOAT,false,0,0); }
  else if(A_COL>=0){ gl.disableVertexAttribArray(A_COL); gl.vertexAttrib3f(A_COL,1,1,1); }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.ib);
}

function shadowPass(cx,cz,radius){
  if(!SHADOW_OK) return;
  const L=LIGHTDIR, d=radius*2.2;
  ortho(-radius,radius,-radius,radius,1,d+radius*3,_lproj);
  lookAt(cx+L[0]*d, L[1]*d, cz+L[2]*d, cx, 0, cz, _lview);
  mul(_lproj,_lview,LIGHT_VP);

  gl.bindFramebuffer(gl.FRAMEBUFFER, shFBO);
  gl.viewport(0,0,SHMAP,SHMAP);
  gl.clearColor(1,1,1,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(P_DEPTH);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);      // front-face cull kills acne
  gl.enableVertexAttribArray(0); gl.disableVertexAttribArray(1); if(A_COL>=0) gl.disableVertexAttribArray(A_COL);
  gl.uniformMatrix4fv(UD.uLightVP,false,LIGHT_VP);
  let bound=null;
  for(let i=0;i<DLS.length;i++){
    const it=DLS[i];
    if(it.p!==bound){ bound=it.p;
      gl.bindBuffer(gl.ARRAY_BUFFER,it.p.vb); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,it.p.ib); }
    gl.uniformMatrix4fv(UD.uModel,false,it.m);
    gl.drawElements(gl.TRIANGLES,it.p.n,gl.UNSIGNED_SHORT,0);
  }
  gl.cullFace(gl.BACK);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,VW,VH);
  _lastPrim=null;
}

let LIGHTDIR=[-0.42,0.84,0.34];
function setLitUniforms(w){
  const sh=CAM.shake, sx=sh?rnd(-sh,sh):0, sy=sh?rnd(-sh,sh):0;
  perspective(CAM.fov, VW/VH, 0.22, 500, PROJ);
  lookAt(CAM.x+sx, CAM.y+sy, CAM.z, CAM.tx, CAM.ty+sy*.3, CAM.tz, VIEW);
  mul(PROJ,VIEW,VP);
  gl.useProgram(P_LIT);
  gl.uniformMatrix4fv(UL.uProj,false,PROJ);
  gl.uniformMatrix4fv(UL.uView,false,VIEW);
  gl.uniformMatrix4fv(UL.uLightVP,false,LIGHT_VP);
  gl.uniform3fv(UL.uLightDir,LIGHTDIR);
  gl.uniform3fv(UL.uLightCol,C(w.light.col));
  gl.uniform3fv(UL.uAmbSky,C(w.light.ambSky||w.light.amb));
  gl.uniform3fv(UL.uAmbGnd,C(w.light.ambGnd||w.light.amb));
  gl.uniform3fv(UL.uFogCol,C(w.fog.col));
  gl.uniform1f(UL.uFogNear,w.fog.near);
  gl.uniform1f(UL.uFogFar,w.fog.far);
  gl.uniform1f(UL.uExposure,w.light.exposure||1.15);
  gl.uniform3f(UL.uCam,CAM.x,CAM.y,CAM.z);
  gl.uniform1f(UL.uShadowOn,SHADOW_OK?1:0);
  gl.uniform2f(UL.uTexel,1/SHMAP,1/SHMAP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,shTex);
  gl.uniform1i(UL.uShadow,0);
  gl.uniform1i(UL.uTex,1);
  gl.uniform1f(UL.uTexAmt,0);
  _boundTex=null;
}
let _boundTex=null;
function drawLit(list){
  for(let i=0;i<list.length;i++){
    const it=list[i];
    bindLit(it.p);
    const amt = it.ta||0;
    gl.uniform1f(UL.uTexAmt, amt);
    if(amt>0){
      gl.uniform1f(UL.uTexScale, it.ts||0.4);
      if(it.tex && it.tex!==_boundTex){
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, it.tex);
        _boundTex=it.tex;
      }
    }
    gl.uniformMatrix4fv(UL.uModel,false,it.m);
    gl.uniformMatrix3fv(UL.uNrm,false,nrm3(it.m));
    gl.uniform3fv(UL.uColor,it.c);
    gl.uniform1f(UL.uEmis,it.e||0);
    gl.uniform1f(UL.uFlash,it.f||0);
    gl.uniform1f(UL.uAlpha,it.a===undefined?1:it.a);
    gl.uniform1f(UL.uRough,it.rg===undefined?0.85:it.rg);
    gl.uniform1f(UL.uSpec,it.sp===undefined?0.06:it.sp);
    gl.drawElements(gl.TRIANGLES,it.p.n,gl.UNSIGNED_SHORT,0);
  }
}
function drawSky(w,t){
  gl.useProgram(P_SKY);
  gl.disableVertexAttribArray(1); if(A_COL>=0) gl.disableVertexAttribArray(A_COL);
  gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.uniform3fv(US.uTop,C(w.sky.top));
  gl.uniform3fv(US.uBot,C(w.sky.bot));
  gl.uniform3fv(US.uSunCol,C(w.sky.sunCol));
  gl.uniform2f(US.uSun,w.sky.sun[0],w.sky.sun[1]);
  gl.uniform1f(US.uSunR,w.sky.sunR);
  gl.uniform1f(US.uWeird,w.sky.weird||0);
  gl.uniform1f(US.uTime,(t||0)*0.02);
  gl.depthMask(false);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.depthMask(true);
  gl.enableVertexAttribArray(1);
  _lastPrim=null;
}
function renderWorld(w,t){
  LIGHTDIR = norm3(w.light.dir);
  shadowPass(CAM.tx, CAM.tz, 24);
  gl.clearColor(0,0,0,1); gl.clearStencil(0);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT|gl.STENCIL_BUFFER_BIT);
  drawSky(w,t);
  setLitUniforms(w);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); gl.disable(gl.BLEND);
  gl.enableVertexAttribArray(0); gl.enableVertexAttribArray(1);
  _lastPrim=null; drawLit(DL);
  if(DLT.length){
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    gl.depthMask(false); gl.disable(gl.CULL_FACE);
    _lastPrim=null; drawLit(DLT);
    gl.depthMask(true); gl.enable(gl.CULL_FACE); gl.disable(gl.BLEND);
  }
}

/* ============================================================================
   WORLD COLLISION
   Terrain is a heightfield; everything else is an axis-aligned box.
   ========================================================================== */
const SOLIDS=[];
function solid(x,y,z,hx,hy,hz,tag){
  const s={x,y,z,hx,hy,hz,top:y+hy,bot:y-hy,tag:tag||null};
  SOLIDS.push(s); return s;
}
function clearSolids(){ SOLIDS.length=0; }

/* --- heightfield ---------------------------------------------------------- */
const TERRAIN={ on:false, size:0, step:0, n:0, h:null, mesh:null, half:0 };
function terrainHeight(x,z){
  if(!TERRAIN.on) return 0;
  const gx=(x+TERRAIN.half)/TERRAIN.step, gz=(z+TERRAIN.half)/TERRAIN.step;
  if(gx<0||gz<0||gx>=TERRAIN.n-1||gz>=TERRAIN.n-1) return -14;
  const i=gx|0, j=gz|0, fx=gx-i, fz=gz-j, n=TERRAIN.n, H=TERRAIN.h;
  const h00=H[j*n+i], h10=H[j*n+i+1], h01=H[(j+1)*n+i], h11=H[(j+1)*n+i+1];
  return lerp(lerp(h00,h10,fx), lerp(h01,h11,fx), fz);
}
function terrainNormal(x,z){
  const e=0.6;
  const hL=terrainHeight(x-e,z), hR=terrainHeight(x+e,z);
  const hD=terrainHeight(x,z-e), hU=terrainHeight(x,z+e);
  return norm3([hL-hR, 2*e, hD-hU]);
}

/* highest standable surface under a circle at (x,z), no higher than maxY */
function groundAt(x,z,r,maxY){
  let best=TERRAIN.on? terrainHeight(x,z) : 0, hit=null;
  if(best>maxY+0.001) best=-1e9;
  for(let i=0;i<SOLIDS.length;i++){
    const s=SOLIDS[i];
    if(x+r<s.x-s.hx || x-r>s.x+s.hx) continue;
    if(z+r<s.z-s.hz || z-r>s.z+s.hz) continue;
    if(s.top<=maxY+0.001 && s.top>best){ best=s.top; hit=s; }
  }
  return {y:best, s:hit};
}
/* slide a vertical cylinder out of every box it is inside */
function pushOut(p,r,h,step){
  let bumped=false;
  for(let i=0;i<SOLIDS.length;i++){
    const s=SOLIDS[i];
    if(p.y+h <= s.bot+0.001) continue;
    if(p.y   >= s.top-0.001) continue;
    if(s.top-p.y <= step) continue;
    const dx=p.x-s.x, dz=p.z-s.z;
    const ox=(s.hx+r)-Math.abs(dx), oz=(s.hz+r)-Math.abs(dz);
    if(ox<=0||oz<=0) continue;
    if(ox<oz) p.x = s.x + sgn(dx||1)*(s.hx+r);
    else      p.z = s.z + sgn(dz||1)*(s.hz+r);
    bumped=true;
  }
  return bumped;
}
function ceilingAt(x,z,r,fromY){
  let best=1e9;
  for(let i=0;i<SOLIDS.length;i++){
    const s=SOLIDS[i];
    if(x+r<s.x-s.hx || x-r>s.x+s.hx) continue;
    if(z+r<s.z-s.hz || z-r>s.z+s.hz) continue;
    if(s.bot>=fromY-0.01 && s.bot<best) best=s.bot;
  }
  return best;
}

/* ------------------------------------------------------------- scenery ----- */
let SCENERY=[];
function GEO(prim,x,y,z,sx,sy,sz,col,o){
  o=o||{};
  let m=T(x,y,z);
  if(o.ry) m=mul(m,RY(o.ry),new Float32Array(16));
  if(o.rz) m=mul(m,RZ(o.rz),new Float32Array(16));
  if(o.rx) m=mul(m,RX(o.rx),new Float32Array(16));
  m=mul(m,S(sx,sy,sz),new Float32Array(16));
  const it={p:prim,m:m,c:col,e:o.e||0,f:0,a:1,rg:o.rg===undefined?0.9:o.rg,
            sp:o.sp===undefined?0.04:o.sp, x:x,y:y,z:z,
            r:Math.max(sx,sy,sz), sh:o.sh===false?0:1};
  SCENERY.push(it);
  return it;
}
function block(x,y,z,sx,sy,sz,col,o){
  GEO(PR.BOX,x,y,z,sx,sy,sz,col,o);
  return solid(x,y,z,sx/2,sy/2,sz/2,(o&&o.tag)||null);
}
function clearScenery(){ SCENERY=[]; }
function drawScenery(){
  const cx=CAM.tx, cz=CAM.tz;
  for(let i=0;i<SCENERY.length;i++){
    const g=SCENERY[i];
    const dx=g.x-cx, dz=g.z-cz;
    if(dx*dx+dz*dz > 12500) continue;   /* beyond the fog: never visible */
    DL.push(g);
    if(g.sh) DLS.push(g);
  }
}

/* ---------------------------------------------------------------- fitting -- */
function fitStage(){
  const box=document.getElementById('stagebox');
  const s=Math.min(innerWidth/VW,(innerHeight-30)/VH);
  box.style.width=(VW*s)+'px'; box.style.height=(VH*s)+'px';
}
addEventListener('resize',fitStage); fitStage();
/* ============================================================================
   PAWS OF FURY 64 — procedural materials
   Every texture is drawn into a canvas at load and uploaded. No image files,
   so the game stays a single portable page. Kept mid-grey: the shader
   multiplies by 2, so 0.5 is "no change" and detail rides either side of it.
   ========================================================================== */

function makeTex(size, draw, smooth){
  const c=document.createElement('canvas');
  c.width=c.height=size;
  const g=c.getContext('2d');
  g.fillStyle='#808080'; g.fillRect(0,0,size,size);
  draw(g,size);
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,c);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  return t;
}
/* value-noise splatter, tiling because every coordinate wraps */
function splat(g,size,n,rMin,rMax,alpha,hue){
  for(let i=0;i<n;i++){
    const x=Math.random()*size, y=Math.random()*size, r=rnd(rMin,rMax);
    const v=(Math.random()*2-1)*alpha;
    const c=Math.round(128+v*127);
    g.fillStyle= hue? `rgba(${clamp(c+hue[0],0,255)},${clamp(c+hue[1],0,255)},${clamp(c+hue[2],0,255)},0.5)`
                    : `rgba(${c},${c},${c},0.5)`;
    for(const dx of [-size,0,size]) for(const dy of [-size,0,size]){
      g.beginPath(); g.arc(x+dx,y+dy,r,0,7); g.fill();
    }
  }
}
function grain(g,size,amount,step){
  const img=g.getImageData(0,0,size,size), d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()*2-1)*amount;
    d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255);
  }
  g.putImageData(img,0,0);
}

const TEX = {};
function buildTextures(){
  /* grass: clumps plus fine blades */
  TEX.grass = makeTex(256,(g,s)=>{
    splat(g,s,90,6,26,0.30,[-6,10,-8]);
    g.lineWidth=1;
    for(let i=0;i<1400;i++){
      const x=Math.random()*s, y=Math.random()*s, l=rnd(2,6), a=rnd(-0.5,0.5);
      const v=Math.round(128+(Math.random()*2-1)*46);
      g.strokeStyle=`rgba(${v-8},${v+12},${v-10},0.55)`;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.sin(a)*l, y-Math.cos(a)*l); g.stroke();
    }
    grain(g,s,10);
  });
  /* stone: mottled, with a few cracks */
  TEX.rock = makeTex(256,(g,s)=>{
    splat(g,s,70,8,34,0.34);
    g.strokeStyle='rgba(90,90,90,0.5)'; g.lineWidth=1.4;
    for(let i=0;i<26;i++){
      let x=Math.random()*s, y=Math.random()*s;
      g.beginPath(); g.moveTo(x,y);
      for(let k=0;k<5;k++){ x+=rnd(-22,22); y+=rnd(-22,22); g.lineTo(x,y); }
      g.stroke();
    }
    grain(g,s,14);
  });
  /* timber: long grain and the odd knot */
  TEX.wood = makeTex(256,(g,s)=>{
    for(let y=0;y<s;y+=1){
      const v=Math.round(128 + Math.sin(y*0.28)*10 + (Math.random()*2-1)*7);
      g.fillStyle=`rgb(${v+12},${v-2},${v-16})`; g.fillRect(0,y,s,1);
    }
    g.strokeStyle='rgba(96,74,52,0.45)'; g.lineWidth=1;
    for(let i=0;i<40;i++){
      const y=Math.random()*s;
      g.beginPath(); g.moveTo(0,y);
      for(let x=0;x<=s;x+=16) g.lineTo(x,y+Math.sin(x*0.05+i)*2.2);
      g.stroke();
    }
    for(let i=0;i<3;i++){
      const x=Math.random()*s,y=Math.random()*s;
      for(let r=10;r>0;r-=2){ g.strokeStyle=`rgba(90,68,46,${0.10+r*0.01})`; g.beginPath(); g.ellipse(x,y,r,r*0.6,0,0,7); g.stroke(); }
    }
    grain(g,s,8);
  });
  /* brushed metal */
  TEX.metal = makeTex(256,(g,s)=>{
    for(let i=0;i<2200;i++){
      const y=Math.random()*s, l=rnd(10,70), x=Math.random()*s;
      const v=Math.round(128+(Math.random()*2-1)*30);
      g.strokeStyle=`rgba(${v},${v},${v+4},0.35)`; g.lineWidth=rnd(0.4,1.3);
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+l,y+rnd(-0.6,0.6)); g.stroke();
    }
    grain(g,s,5);
  });
  /* tiles with grout */
  TEX.tile = makeTex(256,(g,s)=>{
    const n=4, w=s/n;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      const v=Math.round(132+(Math.random()*2-1)*10);
      g.fillStyle=`rgb(${v},${v},${v-3})`;
      g.fillRect(i*w+1.5,j*w+1.5,w-3,w-3);
    }
    g.strokeStyle='rgba(96,96,100,0.85)'; g.lineWidth=3;
    for(let i=0;i<=n;i++){
      g.beginPath(); g.moveTo(i*w,0); g.lineTo(i*w,s); g.stroke();
      g.beginPath(); g.moveTo(0,i*w); g.lineTo(s,i*w); g.stroke();
    }
    grain(g,s,6);
  });
  /* carpet / upholstery */
  TEX.fabric = makeTex(256,(g,s)=>{
    for(let i=0;i<9000;i++){
      const x=Math.random()*s,y=Math.random()*s;
      const v=Math.round(128+(Math.random()*2-1)*34);
      g.fillStyle=`rgba(${v},${v-4},${v},0.5)`;
      g.fillRect(x,y,1.6,1.6);
    }
    g.strokeStyle='rgba(112,112,112,0.25)'; g.lineWidth=1;
    for(let i=0;i<s;i+=6){
      g.beginPath(); g.moveTo(i,0); g.lineTo(i,s); g.stroke();
      g.beginPath(); g.moveTo(0,i); g.lineTo(s,i); g.stroke();
    }
    grain(g,s,10);
  });
  /* dusty regolith / plaster */
  TEX.dust = makeTex(256,(g,s)=>{
    splat(g,s,120,4,30,0.26);
    for(let i=0;i<40;i++){
      const x=Math.random()*s,y=Math.random()*s,r=rnd(6,20);
      g.strokeStyle='rgba(105,105,105,0.35)'; g.lineWidth=1.2;
      g.beginPath(); g.arc(x,y,r,0,7); g.stroke();
    }
    grain(g,s,12);
  });
  /* flat: used when a surface wants no detail at all */
  TEX.none = makeTex(4,()=>{});
}
buildTextures();

/* pick a sensible material from a world's id */
function worldTextures(id){
  switch(id){
    case 'yard':    return {ground:TEX.grass, groundS:0.16, prop:TEX.wood,   propS:0.55};
    case 'kitchen': return {ground:TEX.tile,  groundS:0.09, prop:TEX.metal,  propS:0.5 };
    case 'labs':    return {ground:TEX.tile,  groundS:0.10, prop:TEX.metal,  propS:0.45};
    case 'dyson':   return {ground:TEX.dust,  groundS:0.13, prop:TEX.metal,  propS:0.5 };
    case 'moon':    return {ground:TEX.dust,  groundS:0.10, prop:TEX.rock,   propS:0.35};
    case 'bone':    return {ground:TEX.rock,  groundS:0.12, prop:TEX.rock,   propS:0.4 };
    case 'sofa':    return {ground:TEX.fabric,groundS:0.18, prop:TEX.fabric, propS:0.5 };
    case 'mail':    return {ground:TEX.dust,  groundS:0.14, prop:TEX.wood,   propS:0.5 };
    case 'flea':    return {ground:TEX.fabric,groundS:0.16, prop:TEX.wood,   propS:0.5 };
    case 'void':    return {ground:TEX.dust,  groundS:0.12, prop:TEX.fabric, propS:0.5 };
    default:        return {ground:TEX.rock,  groundS:0.12, prop:TEX.wood,   propS:0.5 };
  }
}
/* ============================================================================
   PAWS OF FURY 64 — touch controls
   Virtual analogue stick (left thumb), action buttons (right thumb), camera
   drag anywhere else, and tap-driven menus. Feeds the same input model the
   keyboard uses, plus TOUCHIN for analogue movement.
   ========================================================================== */

const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0;
if(IS_TOUCH) document.body.classList.add('touch');

/* Plenty of laptops report touch support but are driven by a keyboard, so
   decide by what the player actually uses, not by what the device can do. */
let TOUCH_USED=false, KEY_USED=false;
addEventListener('keydown',()=>{ KEY_USED=true; }, {capture:true});
function touchMode(){ return TOUCH_USED || (IS_TOUCH && !KEY_USED); }

/* analogue movement: x = strafe, z = forward, mag = 0..1 */
const TOUCHIN = { active:false, x:0, z:0, mag:0 };

const STICK = { id:null, ox:0, oy:0, kx:0, ky:0, shown:0 };
const STICK_MAX = 108;
const CAMDRAG = { id:null, lx:0, ly:0 };

/* button positions live in canvas space (1120 x 630) so they scale with the view */
const TBTN = {
  jump : { x:VW-142, y:VH-124, r:78, label:'JUMP',  sub:'x3' },
  bite : { x:VW-300, y:VH-92,  r:56, label:'BITE',  sub:'' },
  pound: { x:VW-128, y:VH-288, r:54, label:'POUND', sub:'/ crouch' },
  pause: { x:VW-56,  y:58,     r:30, label:'II',    sub:'' }
};
const BTNHELD = { jump:null, bite:null, pound:null };

function tCanvasPt(t){
  const r = glc.getBoundingClientRect();
  const w = r.width||VW, h = r.height||VH;   /* guard a degenerate layout */
  return { x:(t.clientX-r.left)/w*VW, y:(t.clientY-r.top)/h*VH };
}
function inBtn(b,p){
  const dx=p.x-b.x, dy=p.y-b.y, rr=b.r*1.20;
  return dx*dx+dy*dy <= rr*rr;
}
function stickUpdate(p){
  let dx=p.x-STICK.ox, dy=p.y-STICK.oy;
  const d=Math.hypot(dx,dy);
  if(d>STICK_MAX){ dx*=STICK_MAX/d; dy*=STICK_MAX/d; }
  STICK.kx=dx; STICK.ky=dy;
  const mag=Math.min(1,d/STICK_MAX);
  TOUCHIN.mag = mag<0.14 ? 0 : (mag-0.14)/0.86;      // dead zone
  TOUCHIN.active = TOUCHIN.mag>0;
  if(TOUCHIN.active){
    const len=Math.hypot(dx,dy)||1;
    TOUCHIN.x =  dx/len;      // screen right  -> strafe right
    TOUCHIN.z = -dy/len;      // screen up     -> forward
  } else { TOUCHIN.x=TOUCHIN.z=0; }
}
function stickRelease(){
  STICK.id=null; STICK.kx=STICK.ky=0;
  TOUCHIN.active=false; TOUCHIN.x=TOUCHIN.z=0; TOUCHIN.mag=0;
}

function onTouchStart(e){
  e.preventDefault();
  audioInit();
  TOUCH_USED=true;
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i], p=tCanvasPt(t);

    if(G.screen!=='play'){                      /* menus are tap-driven */
      if(typeof onTouchTap==='function') onTouchTap(p.x,p.y);
      else pressed.start=true;
      continue;
    }
    if(inBtn(TBTN.pause,p)){ pressed.pause=true; continue; }
    if(inBtn(TBTN.jump,p)){  BTNHELD.jump=t.identifier;  pressed.jmp=true; keys.jmp=true; continue; }
    if(inBtn(TBTN.bite,p)){  BTNHELD.bite=t.identifier;  pressed.atk=true; continue; }
    if(inBtn(TBTN.pound,p)){ BTNHELD.pound=t.identifier; pressed.crouch=true; keys.crouch=true; continue; }
    if(p.x < VW*0.46 && STICK.id===null){
      STICK.id=t.identifier; STICK.ox=p.x; STICK.oy=p.y; STICK.shown=1;
      stickUpdate(p); continue;
    }
    if(CAMDRAG.id===null){ CAMDRAG.id=t.identifier; CAMDRAG.lx=p.x; CAMDRAG.ly=p.y; }
  }
}
function onTouchMove(e){
  e.preventDefault();
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i], p=tCanvasPt(t);
    if(t.identifier===STICK.id){ stickUpdate(p); }
    else if(t.identifier===CAMDRAG.id){
      mouseDX += (p.x-CAMDRAG.lx)*1.15;
      mouseDY += (p.y-CAMDRAG.ly)*0.85;
      CAMDRAG.lx=p.x; CAMDRAG.ly=p.y;
    }
  }
}
function onTouchEnd(e){
  for(let i=0;i<e.changedTouches.length;i++){
    const id=e.changedTouches[i].identifier;
    if(id===STICK.id) stickRelease();
    if(id===CAMDRAG.id) CAMDRAG.id=null;
    if(id===BTNHELD.jump){  BTNHELD.jump=null;  keys.jmp=false; }
    if(id===BTNHELD.bite){  BTNHELD.bite=null; }
    if(id===BTNHELD.pound){ BTNHELD.pound=null; keys.crouch=false; }
  }
}
const _stage=document.getElementById('stagebox');
_stage.addEventListener('touchstart',onTouchStart,{passive:false});
_stage.addEventListener('touchmove', onTouchMove, {passive:false});
_stage.addEventListener('touchend',  onTouchEnd,  {passive:false});
_stage.addEventListener('touchcancel',onTouchEnd, {passive:false});

/* ----------------------------------------------------------------- drawing */
function ringBtn(b,down,accent){
  ux.save();
  ux.beginPath(); ux.arc(b.x,b.y,b.r,0,7);
  ux.fillStyle = down? 'rgba(255,213,74,.34)' : 'rgba(12,14,22,.34)';
  ux.fill();
  ux.lineWidth=3; ux.strokeStyle = down? '#ffd54a' : (accent||'rgba(226,236,248,.55)');
  ux.stroke();
  ux.textAlign='center'; ux.textBaseline='middle';
  ux.fillStyle = down? '#fff' : 'rgba(232,240,250,.85)';
  ux.font='bold '+Math.round(b.r*0.36)+'px "Courier New",monospace';
  ux.fillText(b.label, b.x, b.y - (b.sub?b.r*0.10:0));
  if(b.sub){
    ux.font='bold '+Math.round(b.r*0.20)+'px "Courier New",monospace';
    ux.fillStyle='rgba(226,236,248,.55)';
    ux.fillText(b.sub, b.x, b.y + b.r*0.30);
  }
  ux.restore();
  ux.textBaseline='alphabetic';
}
function drawTouchControls(){
  if(!touchMode()) return;
  /* stick */
  const bx = STICK.id!==null? STICK.ox : 168;
  const by = STICK.id!==null? STICK.oy : VH-150;
  ux.save();
  ux.globalAlpha = STICK.id!==null? 1 : 0.42;
  ux.beginPath(); ux.arc(bx,by,STICK_MAX,0,7);
  ux.fillStyle='rgba(12,14,22,.26)'; ux.fill();
  ux.lineWidth=3; ux.strokeStyle='rgba(226,236,248,.45)'; ux.stroke();
  ux.beginPath(); ux.arc(bx+STICK.kx, by+STICK.ky, 44, 0, 7);
  ux.fillStyle= TOUCHIN.active? 'rgba(255,213,74,.55)':'rgba(226,236,248,.32)';
  ux.fill();
  ux.lineWidth=3; ux.strokeStyle='rgba(255,255,255,.65)'; ux.stroke();
  if(STICK.id===null){
    ux.textAlign='center'; ux.fillStyle='rgba(226,236,248,.55)';
    ux.font='bold 15px "Courier New",monospace';
    ux.fillText('MOVE', bx, by+STICK_MAX+24);
  }
  ux.restore();

  ringBtn(TBTN.jump,  BTNHELD.jump!==null);
  ringBtn(TBTN.bite,  BTNHELD.bite!==null);
  ringBtn(TBTN.pound, BTNHELD.pound!==null);
  ringBtn(TBTN.pause, false);

  ux.textAlign='center'; ux.font='12px "Courier New",monospace';
  ux.fillStyle='rgba(200,210,230,.42)';
  ux.fillText('drag the middle of the screen to swing the camera', VW/2, VH-18);
}

/* ------------------------------------------------------- sizing / rotation */
function checkOrient(){
  document.body.classList.toggle('portrait', IS_TOUCH && innerHeight>0 && innerHeight>innerWidth);
}
function fitStageTouch(){
  const box=document.getElementById('stagebox');
  const iw = innerWidth||VW, ih = innerHeight||VH;
  const pad = IS_TOUCH? 0 : 30;
  const s = Math.max(0.15, Math.min(iw/VW,(ih-pad)/VH));
  box.style.width=(VW*s)+'px'; box.style.height=(VH*s)+'px';
  checkOrient();
}
addEventListener('resize',fitStageTouch);
addEventListener('orientationchange',()=>setTimeout(fitStageTouch,120));
/* Layout is not always settled when this runs, and some embeddings report a
   zero-size viewport at first — which used to leave the game stuck at the
   minimum scale in a corner. Re-measure until it settles, then keep watching. */
addEventListener('load', fitStageTouch);
addEventListener('pageshow', fitStageTouch);
document.addEventListener('visibilitychange', fitStageTouch);
[60,200,600,1500,3000].forEach(ms=>setTimeout(fitStageTouch,ms));
if(window.ResizeObserver){
  try{ new ResizeObserver(fitStageTouch).observe(document.documentElement); }catch(e){}
}
fitStageTouch();
/* ============================================================================
   PAWS OF FURY 64 — worlds
   Heightfield terrain with per-vertex colour, plus ten open areas built from
   a shared kit of props. Each area fills TERRAIN, SCENERY, SOLIDS, BONES,
   KIBBLE and SPAWNS.
   ========================================================================== */

/* mesh upload that carries a colour attribute */
function uploadC(v,n,c,i){
  const o={vb:gl.createBuffer(), nb:gl.createBuffer(), cb:gl.createBuffer(),
           ib:gl.createBuffer(), n:i.length};
  gl.bindBuffer(gl.ARRAY_BUFFER,o.vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,o.nb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(n),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,o.cb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(c),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,o.ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(i),gl.STATIC_DRAW);
  return o;
}

/* ------------------------------------------------------------------ noise -- */
function hash2(x,z,s){
  let h = x*374761393 + z*668265263 + s*1274126177;
  h = (h ^ (h>>13))>>>0;
  h = (h*1274126177)>>>0;
  return (h & 0xffffff)/0xffffff;
}
function vnoise(x,z,s){
  const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  const a=hash2(xi,zi,s), b=hash2(xi+1,zi,s), c=hash2(xi,zi+1,s), d=hash2(xi+1,zi+1,s);
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm(x,z,s,oct,lac,gain){
  let f=1, a=0.5, sum=0, norm=0;
  for(let i=0;i<(oct||4);i++){
    sum += a*vnoise(x*f, z*f, s+i*37);
    norm += a; f*=(lac||2.03); a*=(gain||0.5);
  }
  return sum/norm;
}

/* --------------------------------------------------------------- terrain --- */
/* shape(u,v,n) -> height, where u,v are world coords and n is fbm in 0..1 */
function buildTerrain(size, n, seed, shape, colorer){
  const step=size/(n-1), half=size/2;
  const H=new Float32Array(n*n);
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const x=-half+i*step, z=-half+j*step;
    H[j*n+i] = shape(x, z, fbm(x*0.045, z*0.045, seed, 5));
  }
  TERRAIN.on=true; TERRAIN.size=size; TERRAIN.step=step; TERRAIN.n=n;
  TERRAIN.h=H; TERRAIN.half=half;

  const V=[],N=[],CO=[],I=[];
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const x=-half+i*step, z=-half+j*step, y=H[j*n+i];
    V.push(x,y,z);
    const hL=H[j*n+Math.max(0,i-1)], hR=H[j*n+Math.min(n-1,i+1)];
    const hD=H[Math.max(0,j-1)*n+i], hU=H[Math.min(n-1,j+1)*n+i];
    const nx=(hL-hR), ny=2*step, nz=(hD-hU);
    const l=Math.hypot(nx,ny,nz)||1;
    N.push(nx/l, ny/l, nz/l);
    const slope=1-(ny/l);
    const c=colorer(x,z,y,slope, fbm(x*0.35,z*0.35,seed+91,2));
    CO.push(c[0],c[1],c[2]);
  }
  for(let j=0;j<n-1;j++) for(let i=0;i<n-1;i++){
    const a=j*n+i, b=a+1, c=a+n, d=c+1;
    I.push(a,c,b, b,c,d);
  }
  const mesh=uploadC(V,N,CO,I);
  TERRAIN.mesh=mesh;
  SCENERY.push({p:mesh, m:ident(new Float32Array(16)), c:C('#ffffff'), e:0, f:0, a:1,
                rg:0.96, sp:0.02, x:0,y:0,z:0, r:1e9, sh:1});
}

/* ------------------------------------------------------------ prop kit ----- */
function tree(x,z,h,trunkC,leafC,s,R){
  const y=terrainHeight(x,z);
  s=s||1;
  GEO(PR.CYL, x, y+h*0.45, z, 0.34*s, h*0.95, 0.34*s, trunkC, {sh:1,rg:0.95});
  const n=3+((R?R():0.5)*2|0);
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, rr=(0.9+i*0.12)*s;
    GEO(PR.SPH, x+Math.cos(a)*0.5*s, y+h*(0.95+i*0.10), z+Math.sin(a)*0.5*s,
        rr*2.0, rr*1.7, rr*2.0, leafC, {sh:1,rg:0.98});
  }
  solid(x, y+h*0.45, z, 0.32*s, h*0.5, 0.32*s);
}
function rock(x,z,s,col,R){
  const y=terrainHeight(x,z);
  const rr=R||Math.random;
  for(let i=0;i<3;i++){
    const sx=s*(0.7+rr()*0.7), sy=s*(0.5+rr()*0.6), sz=s*(0.7+rr()*0.7);
    GEO(PR.SPHL, x+(rr()-0.5)*s, y+sy*0.35, z+(rr()-0.5)*s, sx,sy,sz, col,
        {sh:1, rg:0.9, sp:0.05, ry:rr()*3});
  }
  solid(x, y+s*0.4, z, s*0.6, s*0.5, s*0.6);
}
/* a platform you can stand on; returns its top height */
function platform(x,y,z,w,h,d,col,o){
  o=o||{};
  block(x,y,z,w,h,d,col,{sh:1, rg:o.rg===undefined?0.85:o.rg, sp:o.sp||0.05});
  if(o.trim) GEO(PR.BOX, x, y+h/2+0.06, z, w*1.04, 0.12, d*1.04, o.trim, {sh:false});
  return y+h/2;
}
/* stack of rising platforms leading somewhere */
function stair(x,z,dir,n,rise,run,col,R){
  const y0=terrainHeight(x,z);
  let top=y0;
  for(let i=0;i<n;i++){
    const px=x+Math.cos(dir)*run*i, pz=z+Math.sin(dir)*run*i;
    const py=y0+rise*(i+1);
    platform(px, py-0.3, pz, run*1.5, 0.6, run*1.5, col, {trim:null});
    top=py;
  }
  return top;
}
function pillar(x,z,h,col,cap){
  const y=terrainHeight(x,z);
  block(x, y+h/2, z, 2.2, h, 2.2, col, {sh:1});
  if(cap) GEO(PR.BOX, x, y+h+0.2, z, 2.8, 0.4, 2.8, cap, {sh:1});
  return y+h;
}
function floater(x,y,z,r,col,trim){
  GEO(PR.CYL, x, y, z, r*2, 0.9, r*2, col, {sh:1});
  if(trim) GEO(PR.CYL, x, y+0.5, z, r*2.05, 0.16, r*2.05, trim, {sh:false});
  solid(x,y,z,r,0.45,r);
  return y+0.45;
}

/* --------------------------------------------------------- world contents -- */
let BONES=[], KIBBLE=[], SPAWNS=[], WATER=null;
function boneItem(x,y,z,hint){ BONES.push({x,y,z,got:false,t:Math.random()*6,hint:hint||''}); }
function kib(x,y,z){ KIBBLE.push({x,y,z,got:false,t:Math.random()*6}); }
function kibRing(x,y,z,r,n){ for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; kib(x+Math.cos(a)*r, y, z+Math.sin(a)*r); } }
function kibLine(x,y,z,dx,dz,n,step){ for(let i=0;i<n;i++) kib(x+dx*step*i, y, z+dz*step*i); }
function spawn(kind,x,z,opt){ SPAWNS.push(Object.assign({kind,x,z},opt||{})); }

/* ============================================================================
   THE TEN WORLDS
   ========================================================================== */
const WORLDS=[

/* ============================================================================
   REACHABILITY
   Bones were authored by eye, and a dog can only climb so far: a single jump
   clears ~2.8 units, a double ~3.5. Anything parked on a lone pillar or a
   floating disc was stranded, which made worlds impossible to finish. This
   pass snaps stray bones onto nearby platforms and, where a target is still
   marooned, grows a spiral of stepping stones up to it.
   ========================================================================== */
const CLIMB_OK = 2.55;      /* height we assume the player can clear, with margin */
const HOP_OK   = 6.0;       /* horizontal gap we assume they can cross            */
const STEP_RISE= 2.05;      /* how far apart we build the stones we add           */

function solidReach(climb,hop){
  const sn=[], anchors=[];
  for(const s of SOLIDS){
    sn.push({s, x:s.x, z:s.z, y:s.top, r:false});
    anchors.push({x:s.x, z:s.z, y:terrainHeight(s.x,s.z)});
  }
  let changed=true, guard=0;
  while(changed && guard++<40){
    changed=false;
    for(const b of sn){
      if(b.r) continue;
      for(const a of anchors){
        const dx=a.x-b.x, dz=a.z-b.z;
        if(dx*dx+dz*dz<=hop*hop && b.y-a.y<=climb){ b.r=true; changed=true; break; }
      }
      if(b.r) continue;
      for(const a of sn){
        if(!a.r || a===b) continue;
        const dx=a.x-b.x, dz=a.z-b.z;
        if(dx*dx+dz*dz<=hop*hop && b.y-a.y<=climb){ b.r=true; changed=true; break; }
      }
    }
  }
  return sn;
}

/* a helix of small ledges winding up to topY, centred on (tx,tz) */
function climbSpiral(tx,tz,topY,col,trim){
  const baseY=terrainHeight(tx,tz);
  const RAD=5.0, ASTEP=1.05;
  let y=baseY+STEP_RISE, i=0;
  while(y < topY-0.35 && i<40){
    const a=i*ASTEP+tx*0.07;
    const px=tx+Math.cos(a)*RAD, pz=tz+Math.sin(a)*RAD;
    GEO(PR.CYL, px, y, pz, 3.3, 0.5, 3.3, col, {sh:1, rg:0.8, sp:0.08});
    if(trim) GEO(PR.CYL, px, y+0.28, pz, 3.36, 0.10, 3.36, trim, {sh:false});
    solid(px, y, pz, 1.65, 0.25, 1.65);
    y+=STEP_RISE; i++;
  }
  return i;
}

function ensureBonesReachable(w){
  const col  = C(w.stepCol || '#9aa0ac');
  const trim = C(w.stepTrim || '#ffd54a');

  /* 1. a bone hanging in mid-air near a platform belongs on that platform.
        Leave alone anything already sitting pickable on a surface — an earlier
        version chose the *nearest* solid, which on stacked geometry could drag
        a perfectly good bone down inside the slab above it. */
  for(const b of BONES){
    let fine=false;
    for(const s of SOLIDS){
      if(Math.abs(b.x-s.x)<=s.hx+0.6 && Math.abs(b.z-s.z)<=s.hz+0.6 &&
         Math.abs(b.y-s.top-1.15)<1.5){ fine=true; break; }
    }
    if(fine) continue;
    if(Math.abs(b.y-terrainHeight(b.x,b.z)-1.15)<1.5) continue;   /* on the ground */

    /* pick the highest surface at or below the bone, not the closest one */
    let best=null, bestTop=-1e9;
    for(const s of SOLIDS){
      if(Math.hypot(b.x-s.x, b.z-s.z) > 9) continue;
      if(s.top > b.y+1.0 || s.top < b.y-7) continue;
      if(s.top > bestTop){ bestTop=s.top; best=s; }
    }
    if(best){
      b.x = clamp(b.x, best.x-best.hx+0.5, best.x+best.hx-0.5);
      b.z = clamp(b.z, best.z-best.hz+0.5, best.z+best.hz-0.5);
      b.y = best.top+1.15;
    }
  }

  /* 1b. never leave a bone embedded inside solid geometry */
  for(const b of BONES){
    for(let pass=0; pass<4; pass++){
      let inside=null;
      for(const s of SOLIDS){
        if(Math.abs(b.x-s.x)<s.hx-0.1 && Math.abs(b.z-s.z)<s.hz-0.1 &&
           b.y>s.bot+0.1 && b.y<s.top+0.9){ inside=s; break; }
      }
      if(!inside) break;
      b.y = inside.top+1.15;
    }
  }

  /* 2. anything still stranded gets a route built to it */
  let reach = solidReach(CLIMB_OK,HOP_OK);
  const byIdx = new Map();
  SOLIDS.forEach((s,i)=>byIdx.set(s,reach[i]));

  for(const b of BONES){
    let sup=null, supTop=terrainHeight(b.x,b.z);
    for(const s of SOLIDS){
      if(Math.abs(b.x-s.x)<=s.hx+0.6 && Math.abs(b.z-s.z)<=s.hz+0.6 &&
         s.top<=b.y+0.2 && s.top>supTop){ supTop=s.top; sup=s; }
    }
    /* a support only counts if you can actually touch the bone from it — a
       rib at ankle height under a bone 15 units up is not a support */
    const grabbable = Math.abs(b.y - supTop - 0.7) < 1.5;
    const supReach  = sup ? (byIdx.get(sup)||{}).r
                          : (supTop - terrainHeight(b.x,b.z) <= CLIMB_OK);
    if(grabbable && supReach) continue;

    let need = supTop;
    if(!grabbable){                                  /* nothing in reach: add a pad */
      const padY = b.y-1.15;
      GEO(PR.CYL, b.x, padY, b.z, 3.3, 0.5, 3.3, col, {sh:1, rg:0.8, sp:0.08});
      if(trim) GEO(PR.CYL, b.x, padY+0.28, b.z, 3.36, 0.10, 3.36, trim, {sh:false});
      solid(b.x, padY, b.z, 1.65, 0.25, 1.65);
      need = padY+0.25;
    }
    climbSpiral(b.x, b.z, need, col, trim);
    reach = solidReach(CLIMB_OK,HOP_OK);
    byIdx.clear(); SOLIDS.forEach((s,i)=>byIdx.set(s,reach[i]));
  }
}

/* ------------------------------------------------------------- load a world */
function loadWorld(i){
  const w=WORLDS[i];
  clearSolids(); clearScenery();
  BONES=[]; KIBBLE=[]; SPAWNS=[]; WATER=null;
  TERRAIN.on=false;
  const R=seeded(9000+i*613);
  w.build(R);
  ensureBonesReachable(w);

  /* give every surface a material: the terrain gets the world's ground
     texture, everything built on top gets its prop texture */
  if(typeof worldTextures==='function'){
    const mat=worldTextures(w.id);
    for(const g of SCENERY){
      if(g.tex) continue;                       /* respect an explicit choice */
      if(g.r>=1e8){ g.tex=mat.ground; g.ta=0.60; g.ts=mat.groundS; }
      else        { g.tex=mat.prop;   g.ta=0.40; g.ts=mat.propS;   }
    }
  }
  return w;
}
/* ============================================================================
   PAWS OF FURY 64 — game
   Player controller, follow camera, enemies, pickups, HUD, screens, loop.
   ========================================================================== */

const G={ screen:'title', t:0, t2:0, sel:0, worldIdx:0, mapSel:0,
          cleared:[], totalBones:0, hint:'', hintT:0 };
let P=null, world=null, MOBS=[], FX=[], HITS=[];
const GRAV=0.020, LOWG=1;
const PLAYER_R=0.42, STEP_UP=0.62;

/* ------------------------------------------------------------------ fx ---- */
function puff(x,y,z,n,col){
  for(let i=0;i<(n||5);i++)
    FX.push({k:'puff',x,y,z,vx:rnd(-.05,.05),vy:rnd(.01,.07),vz:rnd(-.05,.05),
             life:rndi(16,28),max:28,s:rnd(.18,.36),c:col||C('#cfc6b4')});
}
function spark(x,y,z,n,col){
  for(let i=0;i<(n||6);i++)
    FX.push({k:'spark',x,y,z,vx:rnd(-.12,.12),vy:rnd(.02,.16),vz:rnd(-.12,.12),
             life:rndi(12,22),max:22,s:rnd(.10,.20),c:col||C('#ffe9a0')});
}
function ring(x,y,z,col,life){ FX.push({k:'ring',x,y,z,life:life||22,max:life||22,c:col,s:.5}); }
function popup(x,y,z,txt,col){ FX.push({k:'txt',x,y,z,vy:.028,life:52,max:52,txt,c:col}); }
function shake(v){ CAM.shake=Math.max(CAM.shake,v); }
function hint(t){ G.hint=t; G.hintT=170; }

/* ================================================================= PLAYER == */
function makePlayer(dog){
  return { dog, sp:SPECIES[dog.sp], pal:dog.pal,
    x:0,y:6,z:0, vx:0,vy:0,vz:0, yaw:0, faceYaw:0,
    onGround:false, coyote:0, jumpBuf:0, jumpStage:0, landT:99,
    pound:0, punch:0, punchStep:0, punchT:0, dive:0, crouch:0,
    hp:8, maxhp:8, kibble:0, bones:0, invul:0, flash:0, dead:0,
    walk:0, walkP:0, t:0, spawnX:0, spawnZ:0, squash:1 };
}
function resetPlayerTo(x,z){
  P.x=x; P.z=z; P.y=terrainHeight(x,z)+3;
  P.vx=P.vy=P.vz=0; P.onGround=false; P.pound=0; P.punch=0; P.dead=0;
  P.invul=70;
}

function playerHurt(dmg){
  if(P.invul>0||P.dead) return;
  P.hp-=dmg; P.invul=80; P.flash=14; SFX.hurt(); shake(0.22);
  P.vy=0.13;
  if(P.hp<=0){ P.hp=0; P.dead=60; SFX.die(); }
}

function updatePlayer(){
  const p=P; p.t++;
  if(p.invul>0) p.invul--;
  if(p.flash>0) p.flash--;
  const g = GRAV*(world.lowGrav||1);

  if(p.dead){
    p.dead--; p.vy-=g*0.6; p.y+=p.vy; p.squash=lerp(p.squash,1,.2);
    if(p.dead<=0){
      if(--G.lives<0){ G.screen='over'; G.t2=0; MUSIC.on=false; return; }
      p.hp=p.maxhp; resetPlayerTo(p.spawnX,p.spawnZ);
    }
    return;
  }

  /* ---- desired movement, relative to the camera ---- */
  const fx=-Math.cos(CAM.yaw), fz=-Math.sin(CAM.yaw);
  const rx=-fz, rz=fx;
  let mx=0, mz=0, analog=1;
  if(typeof TOUCHIN!=='undefined' && TOUCHIN.active){   /* thumbstick: analogue */
    mx = fx*TOUCHIN.z + rx*TOUCHIN.x;
    mz = fz*TOUCHIN.z + rz*TOUCHIN.x;
    analog = Math.max(0.28, TOUCHIN.mag);
  } else {
    if(keys.u){ mx+=fx; mz+=fz; }
    if(keys.d){ mx-=fx; mz-=fz; }
    if(keys.r){ mx+=rx; mz+=rz; }
    if(keys.l){ mx-=rx; mz-=rz; }
  }
  const mlen=Math.hypot(mx,mz);
  if(mlen>0.001){ mx/=mlen; mz/=mlen; }

  const crouching = keys.crouch && p.onGround;
  p.crouch = lerp(p.crouch, crouching?1:0, .3);

  /* ---- ground pound ---- */
  if(p.pound){
    if(p.pound===1){                       /* hang, then drop */
      p.vy=0; p.vx=p.vz=0; p.punch=0;
      if(--p.poundT<=0){ p.pound=2; p.vy=-0.52; }
    } else {
      p.vy=-0.52;
    }
  } else if(!p.onGround && take('crouch') && p.y>terrainHeight(p.x,p.z)+0.6){
    p.pound=1; p.poundT=12; p.vy=0.04; SFX.jump2(); p.jumpStage=0;
  }

  /* ---- punch chain ---- */
  if(p.punchT>0){ p.punchT--; if(p.punchT===0) p.punch=0; }
  if(take('atk') && !p.pound && p.punchT<=4){
    p.punchStep = (p.punch && p.punchT>0)? (p.punchStep+1)%3 : 0;
    p.punch=1; p.punchT=18;
    SFX.bark();
    const reach=1.15, hx=p.x+Math.cos(p.faceYaw)*reach, hz=p.z+Math.sin(p.faceYaw)*reach;
    HITS.push({x:hx,y:p.y,z:hz,r:0.95,dmg:1,life:8,set:new Set(),
               kx:Math.cos(p.faceYaw)*0.28, kz:Math.sin(p.faceYaw)*0.28});
    if(p.onGround && mlen>0.001){ p.vx+=Math.cos(p.faceYaw)*0.06; p.vz+=Math.sin(p.faceYaw)*0.06; }
  }

  /* ---- horizontal motion ---- */
  const runMax = (crouching? 0.055 : 0.175) * analog;
  const accel  = p.onGround? (crouching?0.010:0.026) : 0.013;
  if(mlen>0.001 && !p.pound){
    p.vx += mx*accel; p.vz += mz*accel;
    const sp=Math.hypot(p.vx,p.vz);
    if(sp>runMax){ p.vx=p.vx/sp*runMax; p.vz=p.vz/sp*runMax; }
    p.faceYaw += angDiff(p.faceYaw, Math.atan2(mz,mx))*(p.onGround?0.30:0.14);
  } else if(p.onGround){
    const fr = crouching? 0.80 : 0.86;
    p.vx*=fr; p.vz*=fr;
  } else { p.vx*=0.995; p.vz*=0.995; }

  /* ---- jumping ---- */
  if(take('jmp')) p.jumpBuf=8;
  if(p.jumpBuf>0) p.jumpBuf--;
  if(p.coyote>0) p.coyote--;
  const speed=Math.hypot(p.vx,p.vz);
  if(p.jumpBuf>0 && (p.onGround||p.coyote>0) && !p.pound){
    p.jumpBuf=0; p.coyote=0; p.onGround=false;
    if(crouching && speed>0.09){                     /* long jump */
      p.vy=0.26; p.vx=Math.cos(p.faceYaw)*0.30; p.vz=Math.sin(p.faceYaw)*0.30;
      p.dive=18; p.jumpStage=0; SFX.jump2();
    } else {
      if(p.landT<13 && p.jumpStage<2) p.jumpStage++; else p.jumpStage=0;
      p.vy = [0.335,0.375,0.445][p.jumpStage];
      [SFX.jump,SFX.jump2,SFX.jump3][p.jumpStage]();
      p.squash=0.82;
    }
    puff(p.x,p.y,p.z,5);
  }
  if(p.dive>0) p.dive--;
  /* variable jump height */
  if(!keys.jmp && p.vy>0.06 && !p.pound) p.vy*=0.86;

  /* ---- integrate ---- */
  p.vy-=g;
  if(p.vy<-0.72) p.vy=-0.72;
  p.x+=p.vx; p.z+=p.vz; p.y+=p.vy;

  /* ---- collide ---- */
  pushOut(p, PLAYER_R, 1.5, STEP_UP);
  const wasAir=!p.onGround;
  const gr=groundAt(p.x,p.z,PLAYER_R, p.y+(p.vy>0?0.02:STEP_UP));
  if(p.y<=gr.y+0.001 && p.vy<=0){
    p.y=gr.y;
    if(wasAir){
      p.landT=0; p.coyote=0;
      if(p.pound===2){
        SFX.pound(); shake(0.42); puff(p.x,p.y,p.z,16); ring(p.x,p.y+0.1,p.z,C('#ffe0a0'),26);
        HITS.push({x:p.x,y:p.y,z:p.z,r:2.6,dmg:2,life:6,set:new Set(),kx:0,kz:0,radial:1});
        p.squash=0.66;
      } else if(p.vy<-0.30){ SFX.land(); puff(p.x,p.y,p.z,6); p.squash=0.78; }
    }
    p.onGround=true; p.vy=0; p.pound=0; p.jumpStage=p.landT<13?p.jumpStage:p.jumpStage;
  } else {
    if(p.onGround){ p.coyote=7; }
    p.onGround=false;
  }
  if(p.onGround) p.landT++; else p.landT=99;

  const ceil=ceilingAt(p.x,p.z,PLAYER_R,p.y+1.5);
  if(p.vy>0 && p.y+1.6>ceil){ p.y=ceil-1.6; p.vy=-0.02; }

  p.squash=lerp(p.squash,1,.16);

  /* ---- out of the world ---- */
  if(p.y<-26){ playerHurt(1); if(P.hp>0) resetPlayerTo(p.spawnX,p.spawnZ); SFX.warp(); }

  /* ---- animation drivers ---- */
  const hs=Math.hypot(p.vx,p.vz);
  p.walk = lerp(p.walk, p.onGround? clamp(hs/0.175,0,1) : 0, .25);
  p.walkP += hs*1.7 + (p.walk>0.02?0.05:0);
  if(p.walk>0.5 && Math.sin(p.walkP)>0.985) SFX.land();

  /* ---- pickups ---- */
  for(const b of BONES){
    if(b.got) continue;
    if(Math.abs(b.x-p.x)<1.3 && Math.abs(b.z-p.z)<1.3 && Math.abs(b.y-p.y-0.7)<1.7){
      b.got=true; p.bones++; G.totalBones++; SFX.bone();
      popup(b.x,b.y+1.0,b.z,'BONE!','#ffd54a'); ring(b.x,b.y,b.z,C('#ffd54a'),34); shake(0.12);
      hint(b.hint? 'BONE — '+b.hint : 'BONE!');
      if(p.bones>=BONES.length) worldCleared();
    }
  }
  for(const k of KIBBLE){
    if(k.got) continue;
    if(Math.abs(k.x-p.x)<1.0 && Math.abs(k.z-p.z)<1.0 && Math.abs(k.y-p.y-0.6)<1.5){
      k.got=true; p.kibble++; SFX.coin();
      if(p.kibble%12===0 && p.hp<p.maxhp){ p.hp++; popup(p.x,p.y+2,p.z,'+1','#6de07a'); }
    }
  }
}

function worldCleared(){
  if(G.cleared.indexOf(G.worldIdx)<0) G.cleared.push(G.worldIdx);
  G.screen='clear'; G.t2=0; MUSIC.on=false;
}

/* ---------------------------------------------------------------- camera -- */
function updateCamera(){
  const p=P;
  if(keys.camL) CAM.yaw -= 0.030;
  if(keys.camR) CAM.yaw += 0.030;
  if(mouseDX){ CAM.yaw += mouseDX*0.006; mouseDX=0; }
  /* the lower bound used to be 0.02, which meant the camera could never tilt
     up — anything directly overhead was invisible. It can look up now. */
  if(mouseDY){ CAM.pitch = clamp(CAM.pitch + mouseDY*0.004, -0.42, 1.10); mouseDY=0; }
  /* drift behind the dog while running */
  const hs=Math.hypot(p.vx,p.vz);
  if(hs>0.06 && !keys.camL && !keys.camR){
    const want=Math.atan2(p.vz,p.vx)+Math.PI;
    CAM.yaw += angDiff(CAM.yaw, want)*0.012;
  }
  CAM.tx=lerp(CAM.tx,p.x,.22);
  CAM.ty=lerp(CAM.ty,p.y+1.35,.14);
  CAM.tz=lerp(CAM.tz,p.z,.22);
  const cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  let cx=CAM.tx+Math.cos(CAM.yaw)*CAM.dist*cp;
  let cz=CAM.tz+Math.sin(CAM.yaw)*CAM.dist*cp;
  let cy=CAM.ty+CAM.dist*sp;
  const floor=terrainHeight(cx,cz)+1.4;
  if(cy<floor) cy=floor;
  CAM.x=lerp(CAM.x,cx,.20); CAM.y=lerp(CAM.y,cy,.20); CAM.z=lerp(CAM.z,cz,.20);
  if(CAM.shake>0.002) CAM.shake*=0.86; else CAM.shake=0;
}

/* ================================================================== MOBS === */
function spawnMob(kind,x,z){
  const d=MOB_DEFS[kind]; if(!d) return;
  const y=terrainHeight(x,z);
  MOBS.push({ d, kind, sp:SPECIES[d.sp], pal:d.pal,
    x, y, z, vx:0, vy:0, vz:0, faceYaw:rnd(0,6.28), hp:(d.hp/10)|0 || 2,
    state:'wander', t:rndi(0,200), walk:0, walkP:0, cd:rndi(30,120),
    homeX:x, homeZ:z, flash:0, dead:0, squash:1, hurtT:0 });
}
function updateMob(m){
  m.t++;
  if(m.flash>0) m.flash--;
  const g=GRAV*(world.lowGrav||1);

  if(m.dead){
    m.dead--; m.vy-=g; m.y+=m.vy; m.x+=m.vx; m.z+=m.vz;
    m.squash=lerp(m.squash,0.1,.14);
    if(m.dead<=0) m.remove=true;
    return;
  }

  const dx=P.x-m.x, dz=P.z-m.z, dist=Math.hypot(dx,dz);
  const spd=(m.d.speed||0.03)*1.9;

  if(m.hurtT>0){ m.hurtT--; m.x+=m.vx; m.z+=m.vz; m.vx*=.86; m.vz*=.86; }
  else if(dist<11 && !P.dead){                    /* chase */
    m.state='chase';
    m.faceYaw += angDiff(m.faceYaw, Math.atan2(dz,dx))*0.13;
    m.vx=Math.cos(m.faceYaw)*spd; m.vz=Math.sin(m.faceYaw)*spd;
    m.x+=m.vx; m.z+=m.vz; m.walk=lerp(m.walk,1,.2);
  } else {                                        /* wander near home */
    m.state='wander';
    if(--m.cd<=0){ m.cd=rndi(60,190); m.tgt=rnd(0,6.28); }
    if(m.tgt===undefined) m.tgt=rnd(0,6.28);
    const hx=m.homeX-m.x, hz=m.homeZ-m.z;
    if(Math.hypot(hx,hz)>14) m.tgt=Math.atan2(hz,hx);
    m.faceYaw += angDiff(m.faceYaw,m.tgt)*0.05;
    const s=spd*0.42;
    m.vx=Math.cos(m.faceYaw)*s; m.vz=Math.sin(m.faceYaw)*s;
    m.x+=m.vx; m.z+=m.vz; m.walk=lerp(m.walk,0.55,.15);
  }
  m.walkP += Math.hypot(m.vx,m.vz)*2.4;

  pushOut(m,0.4,1.2,0.5);
  m.vy-=g; m.y+=m.vy;
  const gr=groundAt(m.x,m.z,0.4,m.y+0.6);
  if(m.y<=gr.y){ m.y=gr.y; m.vy=0; }
  if(m.y<-30){ m.remove=true; }
  m.squash=lerp(m.squash,1,.2);

  /* touching the player hurts, unless the player is falling onto it */
  if(!P.dead && dist<0.95 && Math.abs(P.y-m.y)<1.5){
    if(P.vy<-0.12 && P.y>m.y+0.35){ killMob(m,'stomp'); P.vy=0.30; P.jumpStage=0; }
    else if(P.pound===2) killMob(m,'pound');
    else playerHurt(1);
  }
}
function killMob(m,how){
  m.dead=26; m.vy=0.24; m.vx=(m.x-P.x)*0.05; m.vz=(m.z-P.z)*0.05;
  SFX.stomp(); spark(m.x,m.y+0.7,m.z,10,C('#ffd9a0'));
  popup(m.x,m.y+1.5,m.z,how==='stomp'?'BONK':'POW','#ffd54a');
  if(Math.random()<0.55) KIBBLE.push({x:m.x,y:m.y+0.7,z:m.z,got:false,t:0,drop:1});
  shake(0.14);
}
function resolveHits(){
  for(const h of HITS){
    h.life--;
    for(const m of MOBS){
      if(m.dead||m.remove||h.set.has(m)) continue;
      const d=Math.hypot(m.x-h.x, m.z-h.z);
      if(d<h.r+0.5 && Math.abs(m.y-h.y)<1.7){
        h.set.add(m);
        m.hp-=h.dmg;
        m.flash=8; m.hurtT=12; m.vx=h.radial?(m.x-h.x)*0.12:h.kx; m.vz=h.radial?(m.z-h.z)*0.12:h.kz;
        SFX.hit();
        if(m.hp<=0) killMob(m,'punch'); else spark(m.x,m.y+0.8,m.z,5);
      }
    }
  }
  HITS=HITS.filter(h=>h.life>0);
}

/* =================================================================== POSE == */
function poseDog(p){
  const po=newPose();
  const wk=p.walk||0, ph=p.walkP||0;
  po.squash=p.squash||1;
  if(wk>0.02){
    const s=Math.sin(ph), c=Math.sin(ph+Math.PI);
    po.hip[0]=s*30*wk;  po.hip[1]=c*30*wk;
    po.knee[0]=Math.max(0,-s)*36*wk; po.knee[1]=Math.max(0,-c)*36*wk;
    po.ankle[0]=Math.max(0,s)*16*wk; po.ankle[1]=Math.max(0,c)*16*wk;
    po.arm[0]=c*28*wk; po.arm[1]=s*28*wk;
    po.lean=5*wk; po.tailY=Math.sin(ph*2)*26*wk; po.headP=Math.abs(Math.sin(ph))*3*wk;
  } else {
    po.tailY=Math.sin(p.t*0.06)*16;
    po.headP=Math.sin(p.t*0.045)*3;
    po.ear=Math.sin(p.t*0.03)*4;
  }
  if(p.crouch>0.05){ po.crouch=p.crouch*0.28; po.lean=8*p.crouch;
    po.hip[0]-=18*p.crouch; po.hip[1]-=18*p.crouch;
    po.knee[0]+=26*p.crouch; po.knee[1]+=26*p.crouch; }
  if(!p.onGround){
    if(p.pound){ po.hip[0]=po.hip[1]=52; po.knee[0]=po.knee[1]=-64;
                 po.arm[0]=po.arm[1]=-70; po.lean=-16; po.tailP=34; po.jaw=0.6; }
    else if(p.dive>0){ po.lean=34; po.arm[0]=po.arm[1]=-96; po.hip[0]=po.hip[1]=-26;
                       po.tailP=40; po.ear=-16; }
    else { po.hip[0]=-30; po.hip[1]=-18; po.knee[0]=48; po.knee[1]=36;
           po.arm[0]=-38; po.arm[1]=-30; po.lean=-7; po.tailP=26;
           if(p.jumpStage===2){ po.twist=(p.t%360)*3; po.lean=-14; } }
  }
  if(p.punch){
    const pr=1-clamp(p.punchT/18,0,1), sw=Math.sin(pr*Math.PI);
    po.jaw=Math.max(po.jaw, sw*0.8);
    if(p.punchStep===0){ po.arm[0]=-40+sw*150; po.elbow[0]=26-sw*30; po.twist=sw*10; }
    else if(p.punchStep===1){ po.arm[1]=-40+sw*150; po.elbow[1]=26-sw*30; po.twist=-sw*12; }
    else { po.arm[0]=-50+sw*140; po.arm[1]=-44+sw*130; po.lean=10+sw*16; po.headP=sw*18; }
  }
  if(p.flash>0) po.ear=-20;
  return po;
}
function poseMob(m){
  const po=newPose();
  const wk=m.walk||0, ph=m.walkP||0;
  po.squash=m.squash||1;
  const s=Math.sin(ph), c=Math.sin(ph+Math.PI);
  po.hip[0]=s*26*wk; po.hip[1]=c*26*wk;
  po.knee[0]=Math.max(0,-s)*30*wk; po.knee[1]=Math.max(0,-c)*30*wk;
  po.arm[0]=c*22*wk; po.arm[1]=s*22*wk;
  po.tailY=Math.sin(ph*2)*22*wk+Math.sin(m.t*0.05)*8;
  po.lean=m.state==='chase'?9:3;
  if(m.state==='chase'){ po.jaw=0.35+Math.sin(m.t*0.3)*0.25; po.ear=-8; }
  if(m.dead){ po.fall=1; }
  return po;
}

/* ================================================================ DRAWING == */
function drawBoneItem(b,t){
  /* a faint column of light so a bone parked high above you can still be
     found from the ground — it fades in with distance so it never blots out
     a bone you are standing next to */
  const dx=b.x-P.x, dz=b.z-P.z, far=Math.min(1, Math.hypot(dx,dz)/26);
  emitFx(PR.CYL, mulAll(T(b.x, b.y+13, b.z), S(0.34, 26, 0.34)),
         C('#ffd54a'), 0.05+far*0.10, 1);
  const y=b.y+0.55+Math.sin(t*0.05+b.t)*0.16;
  const r=mulAll(T(b.x,y,b.z), RY(t*0.035+b.t), RZ(0.5));
  const c=C('#f6f1e2');
  setRoot(r);
  emit(PR.CYL, mulAll(RZ(Math.PI/2), S(0.16,0.66,0.16)), c);
  for(const sx of [-1,1]) for(const sz of [-1,1])
    emit(PR.SPH, mulAll(T(sx*0.34,0,sz*0.14), S(0.24)), c);
  emitFx(PR.SPHL, mulAll(T(b.x,y,b.z), S(1.5)), C('#ffd54a'), 0.16, 1);
}
function drawKibble(k,t){
  const y=k.y+0.4+Math.sin(t*0.07+k.t)*0.10;
  setRoot(mulAll(T(k.x,y,k.z), RY(t*0.06+k.t)));
  emit(PR.SPHL, S(0.26,0.22,0.26), C('#b0793c'));
  emit(PR.SPHL, mulAll(T(0,0.06,0), S(0.16,0.12,0.16)), C('#d19a58'));
}
function drawCritterAt(e,po,scale){
  _flash = (e.flash>0 && ((e.flash>>1)&1))?0.85:0;
  const root=mulAll(T(e.x,e.y,e.z), RY(-(e.faceYaw||0)), S(scale||1));
  buildCritter(e.sp, e.pal, po, root);
  _flash=0;
}
function drawFX(t){
  for(const f of FX){
    const k=f.life/f.max;
    if(f.k==='puff') emitFx(PR.SPHL, mulAll(T(f.x,f.y,f.z), S(f.s*(2-k))), f.c, k*0.35, 1);
    else if(f.k==='spark') emitFx(PR.SPHL, mulAll(T(f.x,f.y,f.z), S(f.s*k)), f.c, k*0.9, 1);
    else if(f.k==='ring'){
      const r=(1-k)*3.2+f.s;
      emitFx(PR.TOR, mulAll(T(f.x,f.y+0.1,f.z), S(r,r,r)), f.c, k*0.7, 1);
    }
  }
}
function updateFX(){
  for(const f of FX){
    f.life--; f.x+=f.vx||0; f.y+=f.vy||0; f.z+=f.vz||0;
    if(f.k==='puff'){ f.vy*=0.94; }
    if(f.k==='spark'){ f.vy-=0.010; }
  }
  FX=FX.filter(f=>f.life>0);
}

/* ------------------------------------------------------------------ HUD --- */
function outline(txt,x,y,size,col,align,lw){
  ux.textAlign=align||'center';
  ux.font='bold '+size+'px "Courier New",monospace';
  ux.lineWidth=lw||Math.max(4,size/5); ux.strokeStyle='rgba(0,0,0,.85)';
  ux.strokeText(txt,x,y); ux.fillStyle=col||'#fff'; ux.fillText(txt,x,y);
}
function kbTouch(kb,tch){ return (typeof touchMode==='function' && touchMode())? tch : kb; }
function drawHUD(){
  ux.clearRect(0,0,VW,VH);
  /* health as a row of bones */
  for(let i=0;i<P.maxhp;i++){
    const x=26+i*26, y=34, on=i<P.hp;
    ux.save(); ux.translate(x,y);
    ux.fillStyle=on?'#f6f1e2':'rgba(20,20,26,.55)';
    ux.strokeStyle='rgba(0,0,0,.6)'; ux.lineWidth=2;
    ux.beginPath(); ux.roundRect? ux.roundRect(-8,-3,16,6,3): ux.rect(-8,-3,16,6); ux.fill(); ux.stroke();
    for(const sx of [-9,9]) for(const sy of [-4,4]){
      ux.beginPath(); ux.arc(sx,sy,3.6,0,7); ux.fill(); ux.stroke(); }
    ux.restore();
  }
  /* bones + kibble */
  outline('BONES '+P.bones+' / '+BONES.length, VW-26, 40, 24, '#ffd54a', 'right');
  outline('KIBBLE '+P.kibble, VW-26, 68, 17, '#e0c08a', 'right');
  outline(world.name, 26, 74, 18, '#cfe4f4', 'left');
  if(G.hintT>0){
    G.hintT--;
    ux.globalAlpha=clamp(G.hintT/40,0,1);
    outline(G.hint, VW/2, VH-52, 22, '#ffd54a');
    ux.globalAlpha=1;
  }
  if(typeof drawTouchControls==='function' && touchMode()){
    drawTouchControls();
  } else {
    ux.textAlign='left'; ux.font='11px "Courier New",monospace'; ux.fillStyle='rgba(200,210,230,.5)';
    ux.fillText('WASD move · SPACE jump (x3) · SHIFT+SPACE long jump · SHIFT in air ground-pound · J bite · Q/E or drag camera', 26, VH-16);
  }
  if(muted){ ux.textAlign='right'; ux.font='11px "Courier New",monospace';
    ux.fillStyle='#5a5a66'; ux.fillText('MUTED',VW-14,VH-16); }
}

    ux.strokeStyle= sel?'#ffd54a': done?'#4ad06a':'#3a3a52';
    ux.lineWidth=sel?2:1; ux.strokeRect(cx+.5,cy+.5,cw-1,chh-1);
    ux.textAlign='left'; ux.font='bold 14px "Courier New",monospace';
    ux.fillStyle= sel?'#fff': done?'#9ae0aa':'#8a8aa0';
    ux.fillText((i+1)+'. '+w.name, cx+10, cy+18);
    ux.font='10px "Courier New",monospace'; ux.fillStyle= sel?'#e8dcc0':'#5f5f74';
    ux.fillText(w.sub, cx+10, cy+33);
    if(done){ ux.textAlign='right'; ux.fillStyle='#4ad06a'; ux.font='bold 11px "Courier New",monospace';
      ux.fillText('CLEAR', cx+cw-10, cy+20); }
  });
  outline('TOTAL BONES  '+G.totalBones, VW/2, VH-72, 22, '#ffd54a');
  if(((G.t2/22)|0)%2===0) outline(kbTouch('ARROWS CHOOSE     ENTER  DROP IN','TAP A WORLD · TAP AGAIN TO DROP IN'), VW/2, VH-36, 20, '#fff');
}
function screenPlay(){
  beginFrame();
  drawScenery();
  drawCritterAt(P, poseDog(P), 1);
  /* a critter is ~44 parts, so drawing every one of them anywhere in the
     world is what costs a tablet its framerate. Only build the near ones. */
  const cx=CAM.tx, cz=CAM.tz;
  const near=(x,z,r)=>{ const dx=x-cx, dz=z-cz; return dx*dx+dz*dz < r; };
  for(const m of MOBS) if(!m.remove && near(m.x,m.z,2600)) drawCritterAt(m, poseMob(m), 1);
  for(const b of BONES) if(!b.got) drawBoneItem(b,G.t);
  for(const k of KIBBLE) if(!k.got && near(k.x,k.z,3600)) drawKibble(k,G.t);
  drawFX(G.t);
  renderWorld(world,G.t);
  drawHUD();
}
function screenPause(){
  screenPlay();
  ux.fillStyle='rgba(0,0,0,.74)'; ux.fillRect(0,0,VW,VH);
  outline('PAUSED', VW/2, 92, 46, '#fff');
  outline('BONES HERE  '+P.bones+' / '+BONES.length, VW/2, 136, 24, '#ffd54a');

  /* the checklist: what you have, and where the rest are hiding */
  const top=176, lh=30;
  BONES.forEach((b,i)=>{
    const y=top+i*lh, got=b.got;
    ux.textAlign='left';
    ux.font='bold 20px "Courier New",monospace';
    ux.fillStyle = got? '#6de07a' : '#5a5a6a';
    ux.fillText(got? '✓' : '○', VW/2-250, y);
    ux.font=(got?'':'bold ')+'19px "Courier New",monospace';
    ux.fillStyle = got? '#7f8a95' : '#ffd54a';
    const txt = b.hint || 'somewhere out there';
    ux.fillText(got? txt : txt, VW/2-218, y);
    if(!got){
      const d=Math.round(Math.hypot(b.x-P.x, b.z-P.z));
      const up=Math.round(b.y-P.y);
      ux.textAlign='right'; ux.font='15px "Courier New",monospace'; ux.fillStyle='#7a8898';
      ux.fillText(d+'m away'+(up>4? ', '+up+' up':''), VW/2+256, y);
    }
  });
  ux.textAlign='center';
  if(typeof touchMode==='function' && touchMode()){
    outline('tap anywhere to carry on', VW/2, 452, 20, '#aab');
    const bw=200, bh=64, bx=VW-bw-24, by=VH-bh-28;
    ux.fillStyle='rgba(12,14,22,.55)'; ux.fillRect(bx,by,bw,bh);
    ux.lineWidth=3; ux.strokeStyle='#ffd54a'; ux.strokeRect(bx+1.5,by+1.5,bw-3,bh-3);
    outline('TO THE MAP', bx+bw/2, by+bh/2+8, 22, '#ffd54a');
  } else {
    outline('P resume   ·   ESC... also resume', VW/2, 452, 18, '#aab');
    outline('press B to bail out to the map', VW/2, 486, 16, '#9aa');
  }
}
function screenClear(){
  beginFrame(); showcaseStage();
  const po=newPose();
  po.arm[0]=po.arm[1]=-60; po.jaw=0.7; po.headP=-24; po.tailY=Math.sin(G.t*0.2)*34;
  buildCritter(P.sp, P.pal, po, mulAll(T(0,0,0), RY(-0.6+Math.sin(G.t*0.02)*0.4), S(1.5)));
  renderShowcase(2.6,7.0,1.4);
  ux.clearRect(0,0,VW,VH);
  outline('EVERY BONE FOUND', VW/2, 150, 46, '#ffd54a');
  outline(world.name, VW/2, 196, 24, '#fff');
  outline('BONES '+BONES.length+'   ·   KIBBLE '+P.kibble, VW/2, 250, 22, '#7fd8ff');
  outline('TOTAL BONES  '+G.totalBones, VW/2, 292, 20, '#6de07a');
  if(G.t2>50 && ((G.t2/20)|0)%2===0) outline(kbTouch('ENTER  →  THE MAP','TAP  →  THE MAP'), VW/2, 380, 24, '#fff');
}
function screenOver(){
  beginFrame(); showcaseStage();
  const po=newPose(); po.fall=1;
  buildCritter(P.sp, P.pal, po, mulAll(T(0,0,0), RY(-0.8), S(1.5)));
  renderShowcase(2.4,6.6,1.0);
  ux.clearRect(0,0,VW,VH);
  ux.fillStyle='rgba(10,6,10,.7)'; ux.fillRect(0,0,VW,VH);
  outline('WALKIES OVER', VW/2, 230, 54, '#e04a3c');
  outline('TOTAL BONES  '+G.totalBones, VW/2, 290, 24, '#ffd54a');
  if(G.t2>40 && ((G.t2/22)|0)%2===0) outline(kbTouch('ENTER  ·  TRY AGAIN','TAP  ·  TRY AGAIN'), VW/2, 370, 24, '#fff');
}

/* --------------------------------------------------- taps on menu screens -- */
function onTouchTap(x,y){
  switch(G.screen){
    case 'select': {
      const i = x < VW/3 ? 0 : x < VW*2/3 ? 1 : 2;
      if(i===G.sel) pressed.start=true;
      else { G.sel=i; SFX.sel(); }
      break; }
    case 'map': {
      const cw=290, chh=42, x0=48, y0=112;
      let hit=-1;
      for(let i=0;i<WORLDS.length;i++){
        const cx=x0+(i%2)*(cw+14), cy=y0+((i/2)|0)*(chh+9);
        if(x>=cx && x<=cx+cw && y>=cy && y<=cy+chh){ hit=i; break; }
      }
      if(hit>=0){
        if(hit===G.mapSel) pressed.start=true;
        else { G.mapSel=hit; SFX.sel(); }
      } else if(y>VH-92) pressed.start=true;
      break; }
    case 'pause':
      if(x>VW-230 && y>VH-120) pressed.bail=true;
      else pressed.pause=true;
      break;
    default:
      pressed.start=true;
  }
}

/* ------------------------------------------------------------------ flow -- */
function enterWorld(i){
  G.worldIdx=i;
  world=loadWorld(i);
  MOBS=[]; FX=[]; HITS=[];
  for(const s of SPAWNS) spawnMob(s.kind,s.x,s.z);
  P.bones=0; P.kibble=0; P.hp=P.maxhp;
  P.spawnX=0; P.spawnZ=0;
  resetPlayerTo(0,0);
  CAM.yaw=-Math.PI/2; CAM.pitch=0.34;
  CAM.tx=P.x; CAM.ty=P.y+1.3; CAM.tz=P.z;
  CAM.x=P.x; CAM.y=P.y+4; CAM.z=P.z+10;
  MUSIC.set(world.music); MUSIC.on=true;
  G.screen='play'; G.t2=0;
  hint('find all '+BONES.length+' bones');
}

function update(){
  G.t++; G.t2++;
  if(take('mute')){ muted=!muted; if(mg) mg.gain.value=muted?0:0.42; }
  MUSIC.tick();
  switch(G.screen){
    case 'title':
      if(take('start')){ audioInit(); MUSIC.set('hub'); MUSIC.on=true; G.screen='select'; G.t2=0; SFX.sel(); }
      break;
    case 'select':
      if(take('l')){ G.sel=(G.sel+DOGS.length-1)%DOGS.length; SFX.sel(); }
      if(take('r')){ G.sel=(G.sel+1)%DOGS.length; SFX.sel(); }
      if(G.t2>16 && take('start')){
        P=makePlayer(DOGS[G.sel]); G.lives=4; G.cleared=[]; G.totalBones=0;
        SFX.bark(); G.screen='map'; G.t2=0;
      }
      break;
    case 'map': {
      const n=WORLDS.length;
      if(take('l')){ G.mapSel=(G.mapSel+n-1)%n; SFX.sel(); }
      if(take('r')){ G.mapSel=(G.mapSel+1)%n; SFX.sel(); }
      if(take('u')){ G.mapSel=(G.mapSel+n-2)%n; SFX.sel(); }
      if(take('d')){ G.mapSel=(G.mapSel+2)%n; SFX.sel(); }
      if(G.t2>14 && take('start')){ SFX.warp(); enterWorld(G.mapSel); }
      break; }
    case 'play':
      if(take('pause')){ G.screen='pause'; break; }
      updatePlayer();
      if(G.screen!=='play') break;
      for(const m of MOBS) updateMob(m);
      MOBS=MOBS.filter(m=>!m.remove);
      resolveHits();
      updateFX();
      updateCamera();
      break;
    case 'pause':
      if(take('bail')){ MUSIC.set('hub'); MUSIC.on=true; G.screen='map'; G.t2=0; SFX.warp(); break; }
      if(take('pause')||take('start')) G.screen='play';
      break;
    case 'clear':
      if(G.t2>50 && take('start')){ MUSIC.set('hub'); MUSIC.on=true; G.screen='map'; G.t2=0; }
      break;
    case 'over':
      if(G.t2>40 && take('start')){ G.screen='title'; G.t2=0; MUSIC.set('hub'); MUSIC.on=true; }
      break;
  }
  clearPressed();
}
function render(){
  switch(G.screen){
    case 'title': screenTitle(); break;
    case 'select': screenSelect(); break;
    case 'map': screenMap(); break;
    case 'play': screenPlay(); break;
    case 'pause': screenPause(); break;
    case 'clear': screenClear(); break;
    case 'over': screenOver(); break;
  }
}

let _acc=0,_last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-_last; _last=now;
  if(dt>200) dt=200;
  _acc+=dt;
  const STEP=1000/60;
  let guard=0;
  while(_acc>=STEP && guard++<5){ _acc-=STEP; update(); }
  render();
}
requestAnimationFrame(frame);
</script>
