<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Star Swarm</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#050614;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
</style><script>window.__shelfPaused=function(){try{return scene!=="play"}catch(e){return true}};</script><script src="../menu.js" defer></script>
<script src="../fresh.js" defer></script>
</head><body><canvas id="c"></canvas>
<script>
"use strict";
// ============================================================ Star Swarm
// A one-thumb space survivor. Fly, your weapons fire themselves, mine the
// asteroids, level up, and fight through six five-minute sectors.
// Sophia, Rory and Dylan Games, Inc.
document.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const cv=document.getElementById("c"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1,S=1;
// The canvas is viewport-fit=cover, so on an iPhone the notch and the
// Dynamic Island sit on top of it and eat whatever the HUD draws up there.
// CSS knows the safe insets; script only learns them by measuring an element
// that uses them.
const safeProbe=document.createElement("div");
safeProbe.style.cssText="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;"+
 "padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
document.body.appendChild(safeProbe);
const SAFE={t:0,r:0,b:0,l:0};
// In a browser tab iOS keeps a strip along the bottom of the screen for its
// own toolbar, and the home indicator lives in that strip - but it still
// reports a bottom inset to the page. Honouring it there leaves the game
// floating a finger's width above the screen with a dark bar beneath. The
// page only owes the indicator room when it owns the whole screen, which is
// exactly what navigator.standalone says.
function ownsTheScreen(){return navigator.standalone!==false}
function readSafe(){const st=getComputedStyle(safeProbe);
 SAFE.t=parseFloat(st.paddingTop)||0;SAFE.r=parseFloat(st.paddingRight)||0;
 SAFE.b=ownsTheScreen()?(parseFloat(st.paddingBottom)||0):0;SAFE.l=parseFloat(st.paddingLeft)||0}
// iOS does not reliably tell a page that the screen it has just grew. Hiding
// the browser's bars, coming back from the app switcher and rotating can all
// leave the page sized to a viewport that is no longer there, and the game
// then draws into the top of the screen with a dead band under it. So: the
// size comes from the visual viewport rather than the layout one, the canvas
// is given that size in pixels rather than a percentage of something that may
// itself be wrong, and the whole thing is checked a few times a second in
// case nothing ever fired.
function screenSize(){const vv=window.visualViewport;
 return{w:Math.max(1,Math.round(vv&&vv.width?vv.width:innerWidth)),
        h:Math.max(1,Math.round(vv&&vv.height?vv.height:innerHeight)),
        d:Math.min(window.devicePixelRatio||1,2)}}
function resize(){readSafe();const z=screenSize();DPR=z.d;W=z.w;H=z.h;
 cv.style.width=W+"px";cv.style.height=H+"px";
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 S=Math.min(H/720,W/1100);if(S<0.55)S=0.55}
// and it repairs the canvas itself, not just the numbers, so anything that
// resets the backing store is put back too
function sizeWatch(){const z=screenSize();
 if(z.w!==W||z.h!==H||z.d!==DPR||cv.width!==Math.round(W*DPR)||cv.height!==Math.round(H*DPR))resize()}
// The event can arrive before the numbers behind it have settled - measured
// here: a viewport that had already grown still reported its old height to
// the handler - so every notice is taken twice more on a short delay.
function reflow(){resize();setTimeout(resize,60);setTimeout(resize,250)}
window.addEventListener("resize",reflow);window.addEventListener("orientationchange",()=>setTimeout(reflow,150));
window.addEventListener("pageshow",reflow);document.addEventListener("visibilitychange",()=>{if(!document.hidden)reflow()});
if(window.visualViewport){visualViewport.addEventListener("resize",reflow);visualViewport.addEventListener("scroll",reflow)}
resize();
// Six sectors, five minutes each. The warp gate opens near the end of every
// sector once its boss is dead; flying into it clears the field and starts the
// next one.
const SECTOR_LEN=300,SECTORS=6,RUN_LEN=SECTOR_LEN*SECTORS,MAX_EN=240,TAU=Math.PI*2;
const BOSS_ORDER=["mother","kraken","warlord"];
// Each of these is one feature, added in its own change, and can be switched
// off here without touching anything else. See notes/star-swarm-features.md
// for what each one is and how to roll it back entirely.
const FEATURES={evolve:true,modes:true,shop:true};
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
// The old mix never returned a value above 0.5, so anything gated behind a
// high threshold never appeared.
function hash(x,y){let h=Math.imul(x,374761393)^Math.imul(y,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}

// ---------------------------------------------------------------- art
// Baked once at start-up: nebula clouds, glow sprites, and gradients built in
// unit space so one per colour serves every size. Drawing from these keeps the
// per-frame work small enough for a phone.
function bake(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);return c}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
 return "rgb("+f(r)+","+f(g)+","+f(b)+")"}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"}
const ART={glow:{},grad:{},en:{},ship:{},back:{},sun:null,hole:null};
const NEB=[["rgba(96,64,190,0.17)","rgba(48,28,116,0.05)"],["rgba(176,58,140,0.14)","rgba(84,18,72,0.04)"],
           ["rgba(40,108,198,0.16)","rgba(18,44,112,0.05)"],["rgba(28,148,140,0.13)","rgba(10,62,62,0.04)"],
           ["rgba(198,116,58,0.10)","rgba(92,46,20,0.03)"]];
function glowSprite(inner,outer){const k=inner+"|"+outer;let sp=ART.glow[k];if(sp)return sp;
 sp=bake(64,64,g=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,inner);gr.addColorStop(0.45,outer);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(0,0,64,64)});
 ART.glow[k]=sp;return sp}
function glow(x,y,r,inner,outer){cx.drawImage(glowSprite(inner,outer),x-r,y-r,r*2,r*2)}
let FX=1,fxAcc=0,fxN=0;
function fxWatch(dt){fxAcc+=dt;fxN++;if(fxN<45)return;const avg=fxAcc/fxN;fxAcc=0;fxN=0;
 if(FX&&avg>1/44)FX=0;else if(!FX&&avg<1/56)FX=1}
const EREF=48;
function enemySprite(type,col,flash){const k=type+"|"+col+"|"+(flash?1:0);let sp=ART.en[k];if(sp)return sp;
 const R=EREF,pad=R*1.6,size=Math.ceil(pad*2);
 sp=bake(size,size,g=>{g.translate(pad,pad);
  const grad=(sx,sy,rr2)=>{if(flash){g.fillStyle="#fff";return}
   const gr=g.createRadialGradient(sx,sy,rr2*0.05,0,0,rr2);
   gr.addColorStop(0,shade(col,0.6));gr.addColorStop(0.35,col);gr.addColorStop(1,shade(col,-0.55));g.fillStyle=gr};
  const plate=v=>{g.fillStyle=flash?"#fff":v};
  if(type==="swarmer"||type==="warlord"){const L=type==="warlord"?R*1.2:R;
   grad(-R*0.2,-R*0.4,R*1.2);
   g.beginPath();g.moveTo(L,0);g.lineTo(-R,-R*(type==="warlord"?1:0.9));g.lineTo(-R*0.45,0);g.lineTo(-R,R*(type==="warlord"?1:0.9));g.closePath();g.fill();
   plate("rgba(255,255,255,0.22)");g.beginPath();g.moveTo(L*0.75,0);g.lineTo(-R*0.3,-R*0.3);g.lineTo(-R*0.3,R*0.3);g.closePath();g.fill();
   plate(type==="warlord"?"#ff4040":"#40d0ff");g.beginPath();g.arc(R*0.2,0,R*(type==="warlord"?0.25:0.16),0,TAU);g.fill()}
  else if(type==="drifter"){grad(-R*0.35,-R*0.4,R*1.2);
   g.beginPath();for(let i=0;i<7;i++){const a=i/7*TAU,rr2=R*(0.8+0.2*hash(i,3));g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}g.closePath();g.fill();
   plate("rgba(0,0,0,0.25)");g.beginPath();g.arc(R*0.3,-R*0.2,R*0.25,0,TAU);g.fill();
   plate("rgba(0,0,0,0.18)");g.beginPath();g.arc(-R*0.35,R*0.3,R*0.16,0,TAU);g.fill()}
  else if(type==="turret"){grad(-R*0.35,-R*0.4,R*1.15);g.beginPath();g.arc(0,0,R,0,TAU);g.fill();
   plate("rgba(255,255,255,0.18)");g.beginPath();g.arc(-R*0.3,-R*0.32,R*0.3,0,TAU);g.fill()}
  else if(type==="mother"){grad(-R*0.3,-R*0.5,R*1.2);g.beginPath();g.ellipse(0,0,R,R*0.55,0,0,TAU);g.fill();
   plate("rgba(255,255,255,0.3)");g.beginPath();g.ellipse(0,-R*0.2,R*0.5,R*0.3,0,0,TAU);g.fill()}
  else{grad(R*0.15,-R*0.35,R*1.1);g.beginPath();g.ellipse(0,0,R,R*0.7,0,0,TAU);g.fill();
   plate("rgba(255,255,255,0.32)");g.beginPath();g.ellipse(R*0.3,0,R*0.35,R*0.3,0,0,TAU);g.fill()}});
 ART.en[k]=sp;return sp}
// ---------------------------------------------------------------- bosses
// The rank and file are 48px sprites seen for two seconds. A boss is the one
// thing the player stops and looks at, so it gets its own art, baked at twice
// the reference size so it stays sharp scaled up, and eyes - which nothing
// else in the swarm has.
const BREF=96;
function bossSprite(type,col,flash){const key="B"+type+"|"+col+"|"+(flash?1:0);let sp=ART.en[key];if(sp)return sp;
 const R=BREF,pad=R*1.7,size=Math.ceil(pad*2);
 const dark=shade(col,-0.62),deep=shade(col,-0.82),mid=shade(col,-0.26),lite=shade(col,0.45);
 sp=bake(size,size,g=>{g.translate(pad,pad);g.lineJoin="round";g.lineCap="round";
  const F=v=>flash?"#fff":v;
  const hull=(x0,y0,r2)=>{if(flash)return "#fff";
   const gr=g.createRadialGradient(x0,y0,r2*0.06,0,0,r2);
   gr.addColorStop(0,lite);gr.addColorStop(0.3,col);gr.addColorStop(0.7,mid);gr.addColorStop(1,dark);return gr};
  const poly=pts=>{g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath()};
  // socket, hot iris, slit pupil, highlight - and an angled brow, which is
  // most of what makes a face read as hostile rather than surprised
  const eye=(x,y,rx,ry,iris,slit,brow)=>{
   g.fillStyle=F("#08040e");g.beginPath();g.ellipse(x,y,rx*1.3,ry*1.3,0,0,TAU);g.fill();
   if(!flash){const eg=g.createRadialGradient(x-rx*0.22,y-ry*0.28,rx*0.08,x,y,rx);
    eg.addColorStop(0,"#fffbe6");eg.addColorStop(0.4,iris);eg.addColorStop(1,shade(iris,-0.6));g.fillStyle=eg}
   else g.fillStyle="#fff";
   g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill();
   g.fillStyle=F("#0b0206");g.beginPath();g.ellipse(x+rx*0.1,y,slit?rx*0.2:rx*0.44,ry*0.82,0,0,TAU);g.fill();
   g.fillStyle="rgba(255,255,255,0.85)";g.beginPath();g.ellipse(x-rx*0.32,y-ry*0.4,rx*0.22,ry*0.2,-0.4,0,TAU);g.fill();
   if(brow){g.fillStyle=F(deep);poly([[x-rx*1.55,y-ry*(brow>0?2.5:1.15)],[x+rx*1.55,y-ry*(brow>0?1.15:2.5)],
     [x+rx*1.55,y-ry*1.05],[x-rx*1.55,y-ry*1.05]]);g.fill()}};
  const rivets=(x0,y0,x1,y1,n)=>{g.fillStyle="rgba(0,0,0,0.35)";
   for(let i=0;i<n;i++){const t=i/(n-1);g.beginPath();g.arc(x0+(x1-x0)*t,y0+(y1-y0)*t,R*0.022,0,TAU);g.fill()}};

  if(type==="kraken"){
   // mantle: a hood that comes to a point at the front
   const mantle=()=>{g.beginPath();g.moveTo(R*1.02,0);
    g.quadraticCurveTo(R*0.7,-R*0.62,R*0.05,-R*0.8);
    g.quadraticCurveTo(-R*0.62,-R*0.88,-R*0.92,-R*0.3);
    g.quadraticCurveTo(-R*1.05,0,-R*0.92,R*0.3);
    g.quadraticCurveTo(-R*0.62,R*0.88,R*0.05,R*0.8);
    g.quadraticCurveTo(R*0.7,R*0.62,R*1.02,0);g.closePath()};
   mantle();g.fillStyle=hull(-R*0.25,-R*0.4,R*1.25);g.fill();
   g.strokeStyle=F("rgba(0,0,0,0.6)");g.lineWidth=R*0.035;g.stroke();
   g.save();mantle();g.clip();
   // ridged plates down the hood
   g.strokeStyle=F("rgba(0,0,0,0.3)");g.lineWidth=R*0.028;
   for(let i=0;i<5;i++){const x=R*0.55-i*R*0.33;g.beginPath();g.moveTo(x,-R*0.85);
    g.quadraticCurveTo(x-R*0.12,0,x,R*0.85);g.stroke()}
   // bio-lights scattered over the hood
   for(let i=0;i<16;i++){const a=hash(i,5)*TAU,d=hash(i+4,5)*R*0.8;
    g.fillStyle=F("rgba(255,120,230,"+(0.25+hash(i+9,5)*0.5)+")");
    g.beginPath();g.arc(Math.cos(a)*d-R*0.1,Math.sin(a)*d,R*(0.02+hash(i+2,5)*0.035),0,TAU);g.fill()}
   g.fillStyle=F("rgba(255,255,255,0.16)");
   g.beginPath();g.ellipse(-R*0.2,-R*0.42,R*0.5,R*0.2,-0.25,0,TAU);g.fill();
   g.restore();
   // beak: two dark plates and a lit gullet between them
   g.fillStyle=F("#ff8a3c");poly([[R*1.0,0],[R*0.44,-R*0.2],[R*0.44,R*0.2]]);g.fill();
   g.fillStyle=F("#1a0512");
   poly([[R*1.12,-R*0.04],[R*0.44,-R*0.4],[R*0.42,-R*0.12],[R*0.86,-R*0.02]]);g.fill();
   poly([[R*1.12,R*0.04],[R*0.44,R*0.4],[R*0.42,R*0.12],[R*0.86,R*0.02]]);g.fill();
   g.strokeStyle=F("rgba(255,255,255,0.25)");g.lineWidth=R*0.022;
   poly([[R*1.12,-R*0.04],[R*0.44,-R*0.4],[R*0.42,-R*0.12],[R*0.86,-R*0.02]]);g.stroke();
   poly([[R*1.12,R*0.04],[R*0.44,R*0.4],[R*0.42,R*0.12],[R*0.86,R*0.02]]);g.stroke();
   g.fillStyle=F("#fff3d0");
   for(let i=0;i<4;i++){const u=i/3;
    poly([[R*(0.5+u*0.4),-R*(0.16-u*0.1)],[R*(0.56+u*0.4),-R*(0.05-u*0.03)],[R*(0.5+u*0.4),0]]);g.fill();
    poly([[R*(0.5+u*0.4),R*(0.16-u*0.1)],[R*(0.56+u*0.4),R*(0.05-u*0.03)],[R*(0.5+u*0.4),0]]);g.fill()}
   // six small eyes across the brow, one huge eye behind them
   eye(R*0.04,0,R*0.34,R*0.3,"#ffd23c",true,0);
   for(let i=0;i<3;i++){const yy=R*(0.4+i*0.18),xx=R*(0.42-i*0.16);
    eye(xx,-yy,R*0.15,R*0.13,"#ff4fd2",true,1);
    eye(xx,yy,R*0.15,R*0.13,"#ff4fd2",true,-1)}
   g.fillStyle=F(deep);
   for(let i=0;i<7;i++){const x=R*0.45-i*R*0.22;
    poly([[x,-R*0.78],[x-R*0.07,-R*0.98],[x+R*0.07,-R*0.9]]);g.fill();
    poly([[x,R*0.78],[x-R*0.07,R*0.98],[x+R*0.07,R*0.9]]);g.fill()}}

  else if(type==="mother"){
   const body=()=>{g.beginPath();g.moveTo(R*1.0,0);
    g.quadraticCurveTo(R*0.75,-R*0.34,R*0.1,-R*0.5);
    g.quadraticCurveTo(-R*0.7,-R*0.62,-R*1.0,-R*0.22);
    g.quadraticCurveTo(-R*1.1,0,-R*1.0,R*0.22);
    g.quadraticCurveTo(-R*0.7,R*0.62,R*0.1,R*0.5);
    g.quadraticCurveTo(R*0.75,R*0.34,R*1.0,0);g.closePath()};
   // mandibles reaching forward, drawn under the hull
   g.fillStyle=F(deep);
   poly([[R*1.25,-R*0.12],[R*0.55,-R*0.46],[R*0.5,-R*0.26],[R*1.12,0]]);g.fill();
   poly([[R*1.25,R*0.12],[R*0.55,R*0.46],[R*0.5,R*0.26],[R*1.12,0]]);g.fill();
   g.strokeStyle=F("rgba(0,0,0,0.5)");g.lineWidth=R*0.03;
   poly([[R*1.25,-R*0.12],[R*0.55,-R*0.46],[R*0.5,-R*0.26],[R*1.12,0]]);g.stroke();
   poly([[R*1.25,R*0.12],[R*0.55,R*0.46],[R*0.5,R*0.26],[R*1.12,0]]);g.stroke();
   body();g.fillStyle=hull(-R*0.3,-R*0.42,R*1.2);g.fill();
   g.strokeStyle=F("rgba(0,0,0,0.6)");g.lineWidth=R*0.04;g.stroke();
   g.save();body();g.clip();
   g.strokeStyle=F("rgba(0,0,0,0.32)");g.lineWidth=R*0.03;
   for(let i=0;i<6;i++){const x=R*0.6-i*R*0.34;g.beginPath();g.moveTo(x,-R*0.6);
    g.quadraticCurveTo(x-R*0.1,0,x,R*0.6);g.stroke()}
   g.fillStyle=F("rgba(255,255,255,0.2)");
   g.beginPath();g.ellipse(-R*0.15,-R*0.24,R*0.62,R*0.14,-0.1,0,TAU);g.fill();
   rivets(-R*0.85,-R*0.3,R*0.5,-R*0.42,7);rivets(-R*0.85,R*0.3,R*0.5,R*0.42,7);
   // armoured carapace ridge
   g.fillStyle=F(mid);poly([[R*0.55,0],[-R*0.1,-R*0.34],[-R*0.8,-R*0.16],[-R*0.8,R*0.16],[-R*0.1,R*0.34]]);g.fill();
   g.strokeStyle=F("rgba(0,0,0,0.4)");g.lineWidth=R*0.025;g.stroke();
   g.restore();
   eye(R*0.1,0,R*0.28,R*0.22,"#8dffb0",true,0);
   eye(R*0.46,-R*0.22,R*0.155,R*0.13,"#ff5a4a",false,1);
   eye(R*0.46,R*0.22,R*0.155,R*0.13,"#ff5a4a",false,-1);
   eye(-R*0.34,-R*0.2,R*0.12,R*0.1,"#ff5a4a",false,1);
   eye(-R*0.34,R*0.2,R*0.12,R*0.1,"#ff5a4a",false,-1)}

  else{// warlord: a dreadnought with a horned brow
   const body=()=>{g.beginPath();g.moveTo(R*1.12,0);
    g.lineTo(R*0.25,-R*0.42);g.lineTo(-R*0.35,-R*0.95);g.lineTo(-R*0.82,-R*0.86);
    g.lineTo(-R*0.62,-R*0.3);g.lineTo(-R*0.95,0);g.lineTo(-R*0.62,R*0.3);
    g.lineTo(-R*0.82,R*0.86);g.lineTo(-R*0.35,R*0.95);g.lineTo(R*0.25,R*0.42);g.closePath()};
   // shoulder cannons, under the hull
   const pod=(y)=>{g.fillStyle=F(deep);
    poly([[R*0.5,y*0.62],[R*0.5,y*1.02],[-R*0.5,y*1.12],[-R*0.5,y*0.6]]);g.fill();
    g.strokeStyle=F("rgba(0,0,0,0.55)");g.lineWidth=R*0.03;g.stroke();
    g.fillStyle=F("#1a1d24");g.fillRect(R*0.46,y*0.66,R*0.3,Math.abs(y)*0.34*(y<0?1:-1)||R*0.2);
    g.fillStyle=F("#ff3a2a");g.beginPath();g.arc(R*0.74,y*0.82,R*0.06,0,TAU);g.fill()};
   pod(-R*0.85);pod(R*0.85);
   body();g.fillStyle=hull(-R*0.2,-R*0.45,R*1.3);g.fill();

// 2 and in 4 each brings a choice you have not had before.
