const ART={glow:{},grad:{},en:{},ship:{}};
const NEB=[["rgba(96,64,190,0.17)","rgba(48,28,116,0.05)"],["rgba(176,58,140,0.14)","rgba(84,18,72,0.04)"],
           ["rgba(40,108,198,0.16)","rgba(18,44,112,0.05)"],["rgba(28,148,140,0.13)","rgba(10,62,62,0.04)"],
           ["rgba(198,116,58,0.10)","rgba(92,46,20,0.03)"]];
function glowSprite(inner,outer){const k=inner+"|"+outer;let sp=ART.glow[k];if(sp)return sp;

function glow(x,y,r,inner,outer){cx.drawImage(glowSprite(inner,outer),x-r,y-r,r*2,r*2)}
let FX=1,fxAcc=0,fxN=0;
function fxWatch(dt){fxAcc+=dt;fxN++;if(fxN<45)return;const avg=fxAcc/fxN;fxAcc=0;fxN=0;
 if(FX&&avg>1/44)FX=0;else if(!FX&&avg<1/56)FX=1}
const EREF=48;
function enemySprite(type,col,flash){const k=type+"|"+col+"|"+(flash?1:0);let sp=ART.en[k];if(sp)return sp;
 const R=EREF,pad=R*1.6,size=Math.ceil(pad*2);
 sp=bake(size,size,g=>{g.translate(pad,pad);
  const grad=(sx,sy,rr2)=>{if(flash){g.fillStyle="#fff";return}
   const gr=g.createRadialGradient(sx,sy,rr2*0.05,0,0,rr2);
   gr.addColorStop(0,shade(col,0.6));gr.addColorStop(0.35,col);gr.addColorStop(1,shade(col,-0.55));g.fillStyle=gr};
  const plate=v=>{g.fillStyle=flash?"#fff":v};
  if(type==="swarmer"||type==="warlord"){const L=type==="warlord"?R*1.2:R;
   grad(-R*0.2,-R*0.4,R*1.2);
   g.beginPath();g.moveTo(L,0);g.lineTo(-R,-R*(type==="warlord"?1:0.9));g.lineTo(-R*0.45,0);g.lineTo(-R,R*(type==="warlord"?1:0.9));g.closePath();g.fill();
   plate("rgba(255,255,255,0.22)");g.beginPath();g.moveTo(L*0.75,0);g.lineTo(-R*0.3,-R*0.3);g.lineTo(-R*0.3,R*0.3);g.closePath();g.fill();
   plate(type==="warlord"?"#ff4040":"#40d0ff");g.beginPath();g.arc(R*0.2,0,R*(type==="warlord"?0.25:0.16),0,TAU);g.fill()}
  else if(type==="drifter"){grad(-R*0.35,-R*0.4,R*1.2);
   g.beginPath();for(let i=0;i<7;i++){const a=i/7*TAU,rr2=R*(0.8+0.2*hash(i,3));g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}g.closePath();g.fill();
   plate("rgba(0,0,0,0.25)");g.beginPath();g.arc(R*0.3,-R*0.2,R*0.25,0,TAU);g.fill();
   plate("rgba(0,0,0,0.18)");g.beginPath();g.arc(-R*0.35,R*0.3,R*0.16,0,TAU);g.fill()}
  else if(type==="turret"){grad(-R*0.35,-R*0.4,R*1.15);g.beginPath();g.arc(0,0,R,0,TAU);g.fill();
   plate("rgba(255,255,255,0.18)");g.beginPath();g.arc(-R*0.3,-R*0.32,R*0.3,0,TAU);g.fill()}
  else if(type==="mother"){grad(-R*0.3,-R*0.5,R*1.2);g.beginPath();g.ellipse(0,0,R,R*0.55,0,0,TAU);g.fill();
   plate("rgba(255,255,255,0.3)");g.beginPath();g.ellipse(0,-R*0.2,R*0.5,R*0.3,0,0,TAU);g.fill()}
  else{grad(R*0.15,-R*0.35,R*1.1);g.beginPath();g.ellipse(0,0,R,R*0.7,0,0,TAU);g.fill();
   plate("rgba(255,255,255,0.32)");g.beginPath();g.ellipse(R*0.3,0,R*0.35,R*0.3,0,0,TAU);g.fill()}});

function buildArt(){
 ART.vigSprite=bake(256,180,(g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,h*0.36,w/2,h/2,w*0.74);
  gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(1,"rgba(0,0,10,0.6)");g.fillStyle=gr;g.fillRect(0,0,w,h)});

 // craters drawn as a lit rim plus a shadowed rim. Flat translucent discs

 for(let v=0;v<3;v++)ART.rock.push(bake(128,128,g=>{g.translate(64,64);g.lineJoin="round";
  const base=["#5f564c","#4f473e","#413a32"][v];
  const outline=()=>{g.beginPath();
   for(let i=0;i<11;i++){const a=i/11*TAU,r=57*(0.8+0.2*hash(i+v*11,v));g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}

  gr.addColorStop(0,shade(base,0.3));gr.addColorStop(0.35,shade(base,0.04));
  gr.addColorStop(0.72,shade(base,-0.3));gr.addColorStop(1,shade(base,-0.72));

  outline();g.save();g.clip();
  for(let i=0;i<8;i++){const a=hash(i,v+3)*TAU,d=6+hash(i+5,v)*44,r=3+hash(i+9,v)*6.5;
   const px=Math.cos(a)*d,py=Math.sin(a)*d;
   g.fillStyle="rgba(0,0,0,0.2)";g.beginPath();g.arc(px,py,r,0,TAU);g.fill();
   g.strokeStyle="rgba(255,255,255,0.2)";g.lineWidth=r*0.26;
   g.beginPath();g.arc(px,py,r*0.88,Math.PI*0.8,Math.PI*1.8);g.stroke();
   g.strokeStyle="rgba(0,0,0,0.3)";g.lineWidth=r*0.24;
   g.beginPath();g.arc(px,py,r*0.88,Math.PI*-0.2,Math.PI*0.8);g.stroke()}
  for(let i=0;i<24;i++){const a=hash(i+40,v)*TAU,d=hash(i+70,v)*54;
   g.fillStyle=hash(i,v+7)>0.5?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.14)";
   g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d,0.8+hash(i+3,v)*1.6,0,TAU);g.fill()}
  // edge highlight: the silhouette redrawn offset down-right inside the clip,
  // so only the top-left rim catches the light
  g.strokeStyle="rgba(255,255,255,0.22)";g.lineWidth=3;
  g.save();g.translate(2.6,2.8);outline();g.stroke();g.restore();
  g.restore();
  outline();g.strokeStyle="rgba(0,0,0,0.5)";g.lineWidth=1.6;g.stroke()}));
}
function vignette(){if(FX)cx.drawImage(ART.vigSprite,0,0,W,H)}
const store={get(k,d){try{const v=localStorage.getItem("starswarm."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("starswarm."+k,JSON.stringify(v))}catch(e){}}};
// ---------------------------------------------------------------- audio

function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination)}catch(e){}}

const SFX={laser(){tone(1200,500,0.07,"sawtooth",0.04)},shot(){tone(600,250,0.06,"square",0.05)},boom(){tone(200,50,0.2,"triangle",0.25);noise(0.15,0.25)},hit(){tone(500,200,0.05,"square",0.05)},
 kill(){tone(320,80,0.14,"square",0.12);noise(0.06,0.1)},gem(){tone(1500,2100,0.05,"sine",0.08)},hurt(){tone(180,80,0.25,"sawtooth",0.25);noise(0.12,0.25)},shieldhit(){tone(900,400,0.08,"sine",0.15)},
 level(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.12,"square",0.15,i*0.09))},pick(){[880,1175].forEach((f,i)=>tone(f,f,0.08,"triangle",0.15,i*0.07))},chest(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.14,"triangle",0.15,i*0.1))},
 rock(){noise(0.14,0.3);tone(150,60,0.12,"triangle",0.2)},boss(){tone(80,40,0.7,"sawtooth",0.35);noise(0.5,0.3)},warp(){[262,330,392,523,659,784,1047,1319].forEach((f,i)=>tone(f,f*1.02,0.2,"sine",0.2,i*0.1))},
 die(){[392,349,330,294,262].forEach((f,i)=>tone(f,f*0.98,0.22,"square",0.2,i*0.17))},win(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,f,0.16,"square",0.18,i*0.12))},click(){tone(1200,900,0.04,"square",0.08)},zap(){tone(1800,300,0.1,"sawtooth",0.1)}};
const LEAD=[69,0,72,76,0,72,69,0, 67,0,69,72,0,69,67,0, 64,0,67,71,0,76,74,71, 69,0,67,0,64,0,0,0, 69,0,72,76,0,79,77,76, 72,0,69,72,0,69,67,0, 64,67,69,72,76,77,79,81, 77,0,76,0,72,0,0,0];
const BASS=[45,0,45,0,52,0,45,0, 43,0,43,0,50,0,43,0, 40,0,40,0,47,0,40,0, 41,0,43,0,45,0,43,0, 45,0,45,0,52,0,45,0, 43,0,43,0,50,0,43,0, 40,0,40,0,47,0,40,0, 41,0,43,0,45,0,0,0];
function musicTick(){if(!AC||!musicOn)return;const spb=60/128/2;while(musicNext<AC.currentTime+0.25){const i=musicStep%LEAD.length,t=musicNext,l=LEAD[i],b=BASS[i];

 if(b){const f=440*Math.pow(2,(b-69)/12),o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+spb*1.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+spb*1.7)}

// One owner for the switch: flipping it used to set a flag and leave the
// track playing until something else happened to stop it.

const keys={};window.addEventListener("keydown",e=>{keys[e.code]=true;if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();onKey(e.code)});window.addEventListener("keyup",e=>keys[e.code]=false);
const touch={id:-1,ox:0,oy:0,x:0,y:0};let mouseDown=false;
// A finger only becomes a game coordinate when it is measured against the
// canvas itself. Assuming the window and the canvas agree breaks every tap
// if they ever disagree, and the game keeps drawing perfectly while it does.
function rectPos(cx0,cy0){const r=cv.getBoundingClientRect();return{x:r.width?(cx0-r.left)*(W/r.width):cx0,y:r.height?(cy0-r.top)*(H/r.height):cy0}}

// If the finger we are following is no longer on the glass, let it go. A
// touch end lost to a system gesture used to leave the stick held for ever,
// and every later tap was then ignored while the game carried on drawing.
// Only skip fingers that landed on the pause overlay, never on a guess about
// which element the browser called the target.

  if(touch.id<0){touch.id=t.identifier;touch.ox=touch.x=p.x;touch.oy=touch.y=p.y}}},{passive:false});

// Long lines - boss announcements above all - used to run off both edges on a
// phone. Shrink to fit rather than clip.
function textFit(s,x,y,size,color,maxw,align){cx.font="bold "+size+"px sans-serif";

function seedRocks(ox,oy){ox=ox||0;oy=oy||0;
 for(let i=0;i<70;i++){const a=Math.random()*TAU,d=rnd(180,1500);G.rocks.push({x:ox+Math.cos(a)*d,y:oy+Math.sin(a)*d,r:rnd(22,52),hp:3,rot:Math.random()*TAU,seed:Math.random()*100});}}
function moveSpeed(){return 210*G.ship.speed*(1+0.12*(G.passives.engine||0))}

function hpMul(){return 1.1+G.t/110}
function spawnEnemy(type,x,y,elite){const d=ENEMY[type];const e={type,x,y,hp:d.hp*(d.boss?1+G.t/420:hpMul())*(elite?4:1),maxhp:0,r:d.r*(elite?1.3:1),spd:d.spd,dmg:d.dmg,xp:d.xp,col:d.col,score:d.score,boss:!!d.boss,elite:!!elite,flash:0,slow:0,wob:Math.random()*TAU,ai:0,dash:0,vx:0,vy:0};e.maxhp=e.hp;G.en.push(e);return e}

function spawnWave(dt){const t=G.t;let rate=1.35+t/55;if(G.secT>SECTOR_LEN-70)rate*=1.4;G.spawnAcc+=rate*dt;
 // past the cap the swarm gets tougher rather than more numerous, which keeps
 // the frame rate honest on a phone thirty minutes into a run
 while(G.spawnAcc>=1){G.spawnAcc-=1;if(G.en.length>=MAX_EN){G.spawnAcc=0;break}
  const p=edgePoint();let type="scout";const r=Math.random();if(t>250&&r<0.16)type="phantom";else if(t>170&&r<0.32)type="turret";else if(t>100&&r<0.5)type="drifter";else if(t>40&&r<0.72)type="swarmer";
  const elite=t>90&&Math.random()<0.05;spawnEnemy(type,p.x,p.y,elite);if(elite)G.elite++;}
 if(t>75&&Math.floor((t-75)/75)>G.swarm){G.swarm++;const n=Math.min(60,18+G.swarm*6);for(let i=0;i<n;i++){const a=i/n*TAU,R=Math.max(W,H)/S*0.6;spawnEnemy(G.swarm%2?"swarmer":"scout",G.px+Math.cos(a)*R,G.py+Math.sin(a)*R)}announce("A SWARM CLOSES IN!")}
 // one boss per sector, three minutes in
 if(G.secT>=165&&!G.secBoss&&!G.bossAlive){G.secBoss=true;const which=BOSS_ORDER[(G.sector-1)%BOSS_ORDER.length];const p=edgePoint();G.bossAlive=spawnEnemy(which,p.x,p.y);announce(ENEMY[which].name+" APPROACHES!");SFX.boss();shake=1}
 if(G.secT>=SECTOR_LEN-45&&!G.gate){const a=Math.random()*TAU;G.gate={x:G.px+Math.cos(a)*700,y:G.py+Math.sin(a)*700,r:60};
  announce(G.sector>=SECTORS?"THE FINAL GATE IS OPEN!":"WARP GATE OPEN - FLY TO IT!");SFX.warp()}}

function fireWeapons(dt){const wp=G.weapons,cd=G.cds;const tick=(k,base)=>{cd[k]=(cd[k]||0)-dt;if(cd[k]<=0){cd[k]=base*rateMul();return true}return false};
 if(wp.laser&&tick("laser",Math.max(0.12,0.42-wp.laser*0.04))){const tg=nearest(G.px,G.py,760);if(tg){const a=Math.atan2(tg.y-G.py,tg.x-G.px);const n=wp.laser>=4?2:1;for(let i=0;i<n;i++){const off=(i-(n-1)/2)*10;G.bul.push({k:"laser",x:G.px-Math.sin(a)*off,y:G.py+Math.cos(a)*off,vx:Math.cos(a)*900,vy:Math.sin(a)*900,r:6,dmg:(7+wp.laser*3)*dmgMul(),life:0.9,pierce:wp.laser>=6?1:0,hit:new Set()})}SFX.laser()}}
 if(wp.spread&&tick("spread",Math.max(0.3,0.9-wp.spread*0.07))){const n=3+Math.floor(wp.spread/2);const tg=nearest(G.px,G.py,700);const base=tg?Math.atan2(tg.y-G.py,tg.x-G.px):G.ang;for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*0.18;G.bul.push({k:"shot",x:G.px,y:G.py,vx:Math.cos(a)*560,vy:Math.sin(a)*560,r:7,dmg:(6+wp.spread*2.5)*dmgMul(),life:1.0,pierce:0,hit:new Set()})}SFX.shot()}
 if(wp.drones){const want=1+Math.floor((wp.drones+1)/2);while(G.drones.length<want)G.drones.push({x:G.px,y:G.py,a:Math.random()*TAU,cd:Math.random()});for(const d of G.drones){d.a+=dt*2.2;const R=58;const tx=G.px+Math.cos(d.a)*R,ty=G.py+Math.sin(d.a)*R;d.x=lerp(d.x,tx,dt*8);d.y=lerp(d.y,ty,dt*8);d.cd-=dt;if(d.cd<=0){d.cd=Math.max(0.35,1.0-wp.drones*0.08)*rateMul();const tg=nearest(d.x,d.y,520);if(tg){const a=Math.atan2(tg.y-d.y,tg.x-d.x);G.bul.push({k:"shot",x:d.x,y:d.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:5,dmg:(5+wp.drones*2.5)*dmgMul(),life:0.9,pierce:0,hit:new Set()});if(Math.random()<0.4)SFX.shot()}}}}
 if(wp.missile&&tick("missile",Math.max(0.6,1.8-wp.missile*0.16))){const n=1+Math.floor(wp.missile/3);for(let i=0;i<n;i++){const a=G.ang+(i-(n-1)/2)*0.8;G.bul.push({k:"missile",x:G.px,y:G.py,vx:Math.cos(a)*200,vy:Math.sin(a)*200,r:9,dmg:(22+wp.missile*8)*dmgMul(),life:3,aoe:70+wp.missile*10,hit:new Set()})}SFX.shot()}
 if(wp.mines){G.mineT-=dt;if(G.mineT<=0){G.mineT=Math.max(0.5,1.6-wp.mines*0.15)*rateMul();G.pk.push({k:"mine",x:G.px-Math.cos(G.ang)*30,y:G.py-Math.sin(G.ang)*30,r:12,life:12,dmg:(24+wp.mines*9)*dmgMul(),aoe:60+wp.mines*8,arm:0.8})}}
 if(wp.wave&&tick("wave",Math.max(1.0,3.0-wp.wave*0.28))){const R=130+wp.wave*24;G.parts.push({k:"ring",x:G.px,y:G.py,r:R,life:0.5,col:"#40d0ff"});for(const e of G.en){if(dist(G.px,G.py,e.x,e.y)<R+e.r){damage(e,(10+wp.wave*4)*dmgMul());const dx=e.x-G.px,dy=e.y-G.py,d=Math.hypot(dx,dy)||1;e.vx+=dx/d*260;e.vy+=dy/d*260}}for(const rk of G.rocks){if(dist(G.px,G.py,rk.x,rk.y)<R+rk.r)hitRock(rk,1)}SFX.zap()}
 if(wp.hole&&tick("hole",Math.max(2.5,6-wp.hole*0.5))){const tg=nearest(G.px,G.py,500);const x=tg?tg.x:G.px+Math.cos(G.ang)*220,y=tg?tg.y:G.py+Math.sin(G.ang)*220;G.pk.push({k:"hole",x,y,r:26+wp.hole*4,life:2.2+wp.hole*0.3,dmg:(6+wp.hole*2.5)*dmgMul(),pull:170+wp.hole*30});SFX.zap()}}
function damage(e,amt,kind){e.hp-=amt;e.flash=0.12;G.txt.push({x:e.x+rnd(-10,10),y:e.y-e.r,s:Math.round(amt)+"",life:0.6,col:kind==="zap"?"#c0f0ff":"#fff"});if(e.hp<=0)killEnemy(e);else if(Math.random()<0.3)SFX.hit()}
function killEnemy(e){if(e.dead)return;e.dead=true;G.kills++;G.score+=e.score*(e.elite?4:1);SFX.kill();
 for(let i=0;i<(e.boss?40:8);i++)G.parts.push({k:"dot",x:e.x,y:e.y,vx:rnd(-180,180),vy:rnd(-180,180),life:rnd(0.3,0.7),col:e.col,r:rnd(3,7)});
 const n=e.boss?12:e.elite?4:1;for(let i=0;i<n;i++){const big=e.boss?10:(e.xp>=3||e.elite)?3:1;G.gems.push({x:e.x+rnd(-e.r,e.r),y:e.y+rnd(-e.r,e.r),v:e.boss?4:e.xp,big})}
 if(e.type==="mother"){for(let i=0;i<8;i++){const a=i/8*TAU;spawnEnemy("scout",e.x+Math.cos(a)*50,e.y+Math.sin(a)*50)}}
 if(e.boss||e.elite){G.bossAlive=e.boss?null:G.bossAlive;G.pk.push({k:"chest",x:e.x,y:e.y,r:22,life:60});if(e.boss){announce(ENEMY[e.type].name+" DESTROYED!");shake=1}}
 else if(Math.random()<(e.type==="drifter"?0.06:0.012)){const r=Math.random();G.pk.push({k:r<0.45?"repair":r<0.8?"magnet":"nuke",x:e.x,y:e.y,r:16,life:25})}}
function hitRock(rk,n){rk.hp-=n;G.parts.push({k:"dot",x:rk.x+rnd(-rk.r,rk.r),y:rk.y+rnd(-rk.r,rk.r),vx:rnd(-60,60),vy:rnd(-60,60),life:0.4,col:"#9a8a7a",r:4});if(rk.hp<=0){rk.dead=true;SFX.rock();for(let i=0;i<10;i++)G.parts.push({k:"dot",x:rk.x,y:rk.y,vx:rnd(-160,160),vy:rnd(-160,160),life:0.6,col:"#8a7a6a",r:rnd(3,8)});const g=rint(2,4);for(let i=0;i<g;i++)G.gems.push({x:rk.x+rnd(-20,20),y:rk.y+rnd(-20,20),v:1,big:1});if(Math.random()<0.2){const r=Math.random();G.pk.push({k:r<0.5?"repair":r<0.85?"magnet":"nuke",x:rk.x,y:rk.y,r:16,life:25})}}}
function explode(x,y,R,dmg){G.parts.push({k:"ring",x,y,r:R,life:0.35,col:"#ffa040"});for(let i=0;i<14;i++)G.parts.push({k:"dot",x,y,vx:rnd(-200,200),vy:rnd(-200,200),life:0.4,col:"#ff8040",r:6});for(const e of G.en){if(dist(x,y,e.x,e.y)<R+e.r)damage(e,dmg)}for(const rk of G.rocks){if(dist(x,y,rk.x,rk.y)<R+rk.r)hitRock(rk,2)}SFX.boom();shake=Math.max(shake,0.4)}
function hurt(d){const amt=Math.max(1,Math.round(d)-armor());G.inv=0.6;G.shT=3.5;if(G.sh>0){G.sh-=amt;SFX.shieldhit();G.txt.push({x:G.px,y:G.py-30,s:"-"+amt,life:0.7,col:"#40d0ff"});if(G.sh<0){G.hp+=G.sh;G.sh=0}}else{G.hp-=amt;SFX.hurt();flash=0.6;G.txt.push({x:G.px,y:G.py-30,s:"-"+amt,life:0.8,col:"#ff5050"})}shake=Math.max(shake,0.4);if(G.hp<=0){G.hp=0;die()}}
function gainXP(v){G.xp+=v*xpMul();SFX.gem();while(G.xp>=G.xpNext){G.xp-=G.xpNext;G.level++;G.xpNext=Math.round((8+G.level*5+G.level*G.level*0.4)*1.2);G.lvlQueue++}}
function die(){scene="over";SFX.die();musicStop();saveRecord()}
// Flying into the gate leaves the whole swarm behind: the field is wiped, the
// asteroids are new, shields come back, and clearing a sector pays an upgrade.
function nextSector(){G.sector++;G.secT=0;G.secBoss=false;G.gate=null;G.bossAlive=null;
 for(const e of G.en)G.parts.push({k:"dot",x:e.x,y:e.y,vx:rnd(-140,140),vy:rnd(-140,140),life:0.5,col:e.col,r:5});
 G.en.length=0;G.bul.length=0;G.rocks.length=0;seedRocks(G.px,G.py);
 G.sh=G.maxsh;G.hp=Math.min(G.maxhp,G.hp+Math.round(G.maxhp*0.25));G.inv=2.5;G.lvlQueue++;
 announce("SECTOR "+G.sector+" OF "+SECTORS);SFX.warp();flash=0.4;shake=0.8}
function win(){scene="win";G.won=true;SFX.win();musicStop();saveRecord()}
function saveRecord(){const id=G.ship.id,r=records[id]||{best:0,time:0,runs:0,sector:0};r.runs++;if(G.score>r.best)r.best=G.score;if(G.t>r.time)r.time=Math.min(G.t,RUN_LEN);if(G.sector>(r.sector||0))r.sector=G.sector;records[id]=r;store.set("records",records);
 let u=false;if(G.sector>=2&&!unlocks.comet){unlocks.comet=true;u=true}if((G.sector>=3||G.won)&&!unlocks.nova){unlocks.nova=true;u=true}if(u){store.set("unlocks",unlocks);G.unlocked=true}}
function options(){const out=[];const nw=Object.keys(G.weapons).length,np=Object.keys(G.passives).length;for(const k in WEAPONS){const l=G.weapons[k]||0;if(l>=WEAPONS[k].max)continue;if(!l&&nw>=4)continue;out.push({k,w:true,l:l+1})}for(const k in PASSIVES){const l=G.passives[k]||0;if(l>=PASSIVES[k].max)continue;if(!l&&np>=4)continue;out.push({k,w:false,l:l+1})}return out}
function makeCards(){const o=options();cards=[];for(let i=0;i<3&&o.length;i++){cards.push(o.splice(rint(0,o.length-1),1)[0])}if(!cards.length)cards.push({k:"heal"})}
function applyCard(c){if(c.k==="heal"){G.hp=G.maxhp;G.sh=G.maxsh}else if(c.w){G.weapons[c.k]=c.l}else{G.passives[c.k]=c.l;if(c.k==="hull"){G.maxhp+=25;G.hp=Math.min(G.maxhp,G.hp+25)}if(c.k==="shield"){G.maxsh+=20;G.sh=G.maxsh}}SFX.level()}
function openChest(){const o=options();if(!o.length){G.hp=G.maxhp;G.sh=G.maxsh;announce("FULL REPAIR!");return}const c=o[rint(0,o.length-1)];applyCard(c);announce("CHEST: "+(c.w?WEAPONS[c.k].name:PASSIVES[c.k].name)+" LV"+c.l+"!");shake=0.5}
// ---------------------------------------------------------------- update
function update(dt){G.t+=dt;G.secT+=dt;
 const st=stickVec(),sp=moveSpeed();
 // ship: velocity follows the stick with a little drift
 G.vx=lerp(G.vx,st.x*sp,dt*7);G.vy=lerp(G.vy,st.y*sp,dt*7);
 let nx=G.px+G.vx*dt,ny=G.py+G.vy*dt;
 for(const rk of G.rocks){const d=dist(nx,ny,rk.x,rk.y);if(d<rk.r+14){const px=(nx-rk.x)/d,py=(ny-rk.y)/d;nx=rk.x+px*(rk.r+14);ny=rk.y+py*(rk.r+14);G.vx*=0.5;G.vy*=0.5}}
 G.px=nx;G.py=ny;if(st.l>0.1)G.ang=Math.atan2(G.vy,G.vx);
 G.inv=Math.max(0,G.inv-dt);G.magnetT=Math.max(0,G.magnetT-dt);G.shT=Math.max(0,G.shT-dt);
 if(G.shT<=0&&G.sh<G.maxsh)G.sh=Math.min(G.maxsh,G.sh+(6.5+4*(G.passives.shield||0))*dt);
 spawnWave(dt);fireWeapons(dt);
 for(const e of G.en){let s=e.spd*(e.slow>0?0.45:1);e.slow=Math.max(0,e.slow-dt);e.flash=Math.max(0,e.flash-dt);e.wob+=dt*6;
  const dx=G.px-e.x,dy=G.py-e.y,d=Math.hypot(dx,dy)||1;
  let mx=0,my=0;
  if(e.type==="swarmer"){e.ai+=dt*5;const px=-dy/d,py=dx/d;mx=dx/d*s+px*Math.sin(e.ai)*120;my=dy/d*s+py*Math.sin(e.ai)*120}
  else if(e.type==="turret"){if(d>280){mx=dx/d*s;my=dy/d*s}else if(d<200){mx=-dx/d*s*0.7;my=-dy/d*s*0.7}e.ai-=dt;if(e.ai<=0&&d<460){e.ai=2.2;G.bul.push({k:"plasma",x:e.x,y:e.y,vx:dx/d*240,vy:dy/d*240,r:9,dmg:e.dmg,life:3,enemy:true})}}
  else if(e.type==="phantom"){e.ai+=dt;if(e.ai%3<2){mx=dx/d*s;my=dy/d*s}}
  else if(e.type==="kraken"){e.dash-=dt;if(e.dash<=0){e.dash=2.5;e.ai=0.6;e.dvx=dx/d*520;e.dvy=dy/d*520;SFX.zap()}if(e.ai>0){e.ai-=dt;mx=e.dvx;my=e.dvy}else{mx=dx/d*s;my=dy/d*s}}
  else if(e.type==="warlord"){mx=dx/d*s;my=dy/d*s;e.ai-=dt;if(e.ai<=0){e.ai=2.0;for(let i=-2;i<=2;i++){const a=Math.atan2(dy,dx)+i*0.3;G.bul.push({k:"plasma",x:e.x,y:e.y,vx:Math.cos(a)*280,vy:Math.sin(a)*280,r:14,dmg:e.dmg,life:2.5,enemy:true})}}}

function shipSprite(ship){let sp=ART.ship[ship.id];if(sp)return sp;

   g.lineTo(x-w/2+h*0.4,y+h/2);g.quadraticCurveTo(x-w/2,y,x-w/2+h*0.4,y-h/2);g.closePath();g.fill();
   g.strokeStyle="rgba(0,0,0,0.5)";g.lineWidth=0.7;g.stroke()};

   body=()=>{g.beginPath();g.moveTo(29,0);g.quadraticCurveTo(15,-4.2,8,-5.4);g.lineTo(-11,-5.6);

   pod(-6,-12.5,16,7,deep);pod(-6,12.5,16,7,deep);

  canopy();g.fillStyle="#080f22";g.fill();
  const cg=g.createLinearGradient(cxp,-cw,cxp,cw);

   g.fillStyle="#0c1220";g.beginPath();g.ellipse(nx,ny,2.4*ns,4.2*ns,0,0,TAU);g.fill();
