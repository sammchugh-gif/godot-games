<script>
"use strict";
// ============================================================ Fact Dash
// Number facts, fast. Adding and taking away to 10 and to 20, times and
// divide to 12: every fact is learned in its family (3 + 5, 5 + 3, 8 - 3,
// 8 - 5), a few at a time, and practised in five little games until it comes
// back quickly. A fact is "fast" once it has been answered right, quickly,
// three times running; a new family arrives when the ones being learned are
// nearly there. A star a day for enough right answers.
// Sophia, Rory and Dylan Games, Inc.
document.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const cv=document.getElementById("c");let cx=cv.getContext("2d");
let W=0,H=0,DPR=1,U=1;
// The canvas is viewport-fit=cover, so the notch and the home indicator sit
// on top of it; script learns the safe insets by measuring an element that
// uses them.
const safeProbe=document.createElement("div");
safeProbe.style.cssText="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;"+
 "padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
document.body.appendChild(safeProbe);
const SAFE={t:0,r:0,b:0,l:0};
function ownsTheScreen(){return navigator.standalone!==false}
function readSafe(){const st=getComputedStyle(safeProbe);
 SAFE.t=parseFloat(st.paddingTop)||0;SAFE.r=parseFloat(st.paddingRight)||0;
 SAFE.b=ownsTheScreen()?(parseFloat(st.paddingBottom)||0):0;SAFE.l=parseFloat(st.paddingLeft)||0}
// sized from the visual viewport and re-checked several times a second: iOS
// does not reliably say when the screen under a page has grown
function screenSize(){const vv=window.visualViewport,de=document.documentElement;
 let w=Math.round(vv&&vv.width?vv.width:innerWidth),h=Math.round(vv&&vv.height?vv.height:innerHeight);
 if(ownsTheScreen()){w=Math.max(w,Math.round(de.clientWidth)||0);h=Math.max(h,Math.round(de.clientHeight)||0)}
 return{w:Math.max(1,w),h:Math.max(1,h),d:Math.min(window.devicePixelRatio||1,2)}}
function resize(){readSafe();const z=screenSize();DPR=z.d;W=z.w;H=z.h;
 cv.style.width=W+"px";cv.style.height=H+"px";cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 // one menu unit: about 0.9 on a phone held upright, 1.4 on an iPad
 U=Math.max(0.7,Math.min(1.6,Math.min(W/430,H/600)))}
function sizeWatch(){const z=screenSize();if(z.w!==W||z.h!==H||z.d!==DPR||cv.width!==Math.round(W*DPR)||cv.height!==Math.round(H*DPR))resize()}
function reflow(){resize();setTimeout(resize,60);setTimeout(resize,250)}
window.addEventListener("resize",reflow);window.addEventListener("orientationchange",()=>setTimeout(reflow,150));
window.addEventListener("pageshow",reflow);document.addEventListener("visibilitychange",()=>{if(!document.hidden)reflow()});
if(window.visualViewport){visualViewport.addEventListener("resize",reflow);visualViewport.addEventListener("scroll",reflow)}
resize();

// Shown small on the home screen, so it is clear which version a phone runs.
const BUILD="2026.10.30-1";
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<0?0:t>1?1:t*t*(3-2*t),easeOut=t=>t<0?0:t>1?1:1-(1-t)*(1-t);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return"rgb("+f(r)+","+f(g)+","+f(b)+")"}
function mix(h1,h2,t){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16),f=s=>Math.round(lerp((a>>s)&255,(b>>s)&255,clamp(t,0,1)));
 return"rgb("+f(16)+","+f(8)+","+f(0)+")"}
const hash1=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};

// ================================================================ facts
// The facts, the families they are learned in, and what to ask next. Pure:
// no screen, no clock, no Math.random (a random source is passed in), so
// tools/factcheck.mjs lifts this section out and plays it by the thousand.
//
// A track is a set of facts: adding to 10, adding and taking away to 10 or to
// 20, times and divide to 12. Facts are learned in families - 3 + 5, 5 + 3,
// 8 - 3 and 8 - 5 belong together - in the order the strategies are taught:
// plus nothing, plus one, plus two, doubles, pairs that make ten, ten plus,
// near doubles, plus nine, then the rest. Times go ones, twos, tens, fives,
// squares, threes, fours, nines, then the harder ones.
const TRACKS=[
 {id:"add10",name:"Adding to 10",short:"+ to 10",ops:"+",max:10,next:"addsub10"},
 {id:"addsub10",name:"Adding and taking away to 10",short:"+ − to 10",ops:"+-",max:10,next:"addsub20"},
 {id:"addsub20",name:"Adding and taking away to 20",short:"+ − to 20",ops:"+-",max:20,next:null},
 {id:"muldiv",name:"Times and divide to 12",short:"× ÷ to 12",ops:"x/",max:12,next:null}];
const TRACK={};for(const t of TRACKS)TRACK[t.id]=t;
const SYM={"+":"+","-":"−","x":"×","/":"÷"};
function factOf(x,op,y){return{k:x+op+y,x,op,y,ans:op==="+"?x+y:op==="-"?x-y:op==="x"?x*y:x/y}}
function addRank(a,b){const c=a+b;return a===0?0:a===1?1:a===2?2:a===b?3:c===10?4:b===10?5:b-a===1?6:b===9?7:8}
function mulRank(a,b){const has=n=>a===n||b===n;
 return has(1)?0:has(2)?1:has(10)?2:has(5)?3:a===b?4:has(3)?5:has(4)?6:has(9)?7:has(11)?8:has(6)?9:has(12)?10:has(7)?11:12}
const FAMS={};
function families(tid){if(FAMS[tid])return FAMS[tid];const t=TRACK[tid],out=[];
 if(t.ops==="x/"){for(let a=1;a<=t.max;a++)for(let b=a;b<=t.max;b++){const c=a*b,f=[factOf(a,"x",b)];
   if(a!==b)f.push(factOf(b,"x",a));f.push(factOf(c,"/",a));if(a!==b)f.push(factOf(c,"/",b));
   out.push({id:a+"x"+b,a,b,c,op:"x",r:mulRank(a,b),facts:f})}}
 else{for(let c=0;c<=t.max;c++)for(let a=0;a<=c/2;a++){const b=c-a;if(b>10)continue;const f=[factOf(a,"+",b)];
   if(a!==b)f.push(factOf(b,"+",a));
   if(t.ops.indexOf("-")>=0){f.push(factOf(c,"-",a));if(a!==b)f.push(factOf(c,"-",b))}
   out.push({id:a+"+"+b,a,b,c,op:"+",r:addRank(a,b),facts:f})}}
 out.sort((p,q)=>p.r-q.r||p.c-q.c||p.a-q.a);return FAMS[tid]=out}
function trackFacts(tid){const out=[];for(const f of families(tid))out.push(...f.facts);return out}
// A fact's record: n tries, ok right, s the run of right-and-quick answers
// (up to 4), sl the run of right-but-slow ones, m whether it has ever been
// missed, f whether it is fast, ms the last time taken.
function stat(p,k){return p.facts[k]||(p.facts[k]={n:0,ok:0,s:0,sl:0,m:0,f:0,ms:0})}
// "Fast" (fluent): right and quick three times running - or twice, for a fact
// never once missed, so a child who already knows a fact is not held on it.
// Once fast it stays fast unless it is got wrong, or is slow twice running:
// one slow answer on a tired day does not undo it.
function fluent(st){return!!st&&!!st.f}
const isFast=(p,k)=>fluent(p.facts[k]);
function famFluent(p,f){return f.facts.every(x=>isFast(p,x.k))}
// the facts this child is working on in a track: those of the families met
function activeFacts(p,tid){const met=new Set(p.intro[tid]||[]),out=[];
 for(const f of families(tid))if(met.has(f.id))out.push(...f.facts);return out}
// How many facts are being learned at once: new families come in until this
// many are not yet fast.
const POOL=6;
// The families to meet before the next game. A family whose facts are all
// fast already (learned on an earlier track) is met without being shown;
// at most three new ones are shown at a time.
function toMeet(p,tid){const met=new Set(p.intro[tid]||[]);
 let learning=activeFacts(p,tid).filter(f=>!isFast(p,f.k)).length;const show=[],quiet=[];
 for(const f of families(tid)){if(met.has(f.id))continue;
  if(famFluent(p,f)){quiet.push(f);continue}
  if(learning>=POOL||show.length>=3)break;
  show.push(f);learning+=f.facts.filter(x=>!isFast(p,x.k)).length}
 return{show,quiet}}
function meet(p,tid,fams){const l=p.intro[tid]||(p.intro[tid]=[]);for(const f of fams)if(l.indexOf(f.id)<0)l.push(f.id)}
// What to ask next. A fact just missed comes back after two others; then
// mostly the facts being learned, with the fast ones mixed in now and then so
// they stay fast; never the same fact twice running, and not one of the last
// few if there is any choice.
function pickFact(p,tid,rng){const act=activeFacts(p,tid);if(!act.length)return null;
 const recent=p.recent||[],byK={};for(const f of act)byK[f.k]=f;
 p.retry=(p.retry||[]).filter(r=>byK[r.k]);
 const due=p.retry.findIndex(r=>r.at<=p.tick&&r.k!==recent[0]);
 if(due>=0)return byK[p.retry.splice(due,1)[0].k];
 const keep=act.length>8?3:act.length>4?2:act.length>1?1:0,avoid=new Set(recent.slice(0,keep));
 const learn=[],known=[];for(const f of act){if(avoid.has(f.k))continue;(isFast(p,f.k)?known:learn).push(f)}
 let from=learn.length&&(!known.length||rng()<0.72)?learn:known.length?known:learn;
 if(!from.length)from=act.filter(f=>f.k!==recent[0]);if(!from.length)from=act;
 const w=from.map(f=>{const st=p.facts[f.k];return!st||!st.n?3:st.m&&st.s<2?2:1});
 let r=rng()*w.reduce((a,b)=>a+b,0);for(let i=0;i<from.length;i++){r-=w[i];if(r<=0)return from[i]}return from[from.length-1]}
// An answer: ok right or wrong, ms how long it took, fastMs the speed goal.
function record(p,k,ok,ms,fastMs){const st=stat(p,k),was=fluent(st);st.n++;st.ms=Math.round(ms);
 if(ok){st.ok++;p.pace=Math.round((p.pace||5000)*0.85+Math.min(ms,15000)*0.15);
  if(ms<=fastMs){st.s=Math.min(4,st.s+1);st.sl=0;if(st.s>=3||(st.s>=2&&!st.m))st.f=1}
  else{st.s=Math.max(0,st.s-1);st.sl=(st.sl||0)+1;if(st.sl>=2)st.f=0}}
 else{st.m=1;st.s=0;st.sl=0;st.f=0;p.retry=(p.retry||[]).filter(r=>r.k!==k).concat([{k,at:p.tick+3}]).slice(-6)}
 p.tick=(p.tick||0)+1;p.recent=[k].concat(p.recent||[]).slice(0,4);
 return{nowFast:!was&&fluent(st),lost:was&&!fluent(st)}}
// every family met and every fact fast: on to the next track
function trackDone(p,tid){return families(tid).every(f=>famFluent(p,f))}
function fastCount(p,tid){let n=0;const all=trackFacts(tid);for(const f of all)if(isFast(p,f.k))n++;return{n,of:all.length}}
// Wrong answers to choose from, for the games where the answer is tapped:
// near misses, and the slips a child really makes (adding instead of taking
// away, the next number in the times table).
function choices(f,n,rng){const a=f.ans,c=[a+1,a-1,a+2,a-2,a+3];
 if(f.op==="+")c.push(Math.abs(f.x-f.y),a+10);if(f.op==="-")c.push(f.x+f.y,f.y);
 if(f.op==="x")c.push(a+f.x,a-f.x,a+f.y,a-f.y,f.x+f.y);if(f.op==="/")c.push(f.y,f.x-f.y,a*2);
 const pool=[];for(const v of c)if(v>=0&&v!==a&&pool.indexOf(v)<0&&Number.isInteger(v))pool.push(v);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 // the near ones first, so there is always a close call among them
 const out=[a];for(const v of pool){if(out.length>=n)break;out.push(v)}
 for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
const factText=f=>f.x+" "+SYM[f.op]+" "+f.y;

// ================================================================ saves
// Everything lives under "factdash." - the shelf menu finds a game's saves by
// the prefix taken from its folder name.
const store={get(k,d){try{const v=localStorage.getItem("factdash."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem("factdash."+k,JSON.stringify(v))}catch(e){}}};
const PCOLS=["#4dabf7","#51cf66","#f783ac","#ffa94d","#9775fa","#ffd43b","#ff6b6b","#20c997"];
function newProfile(name,track,col){return fixProfile({id:"p"+Date.now().toString(36)+Math.floor(Math.random()*1e6),name,track,look:{col,hat:"none",extra:"none"}})}
function fixProfile(p){const d={facts:{},intro:{},retry:[],recent:[],tick:0,coins:0,owned:{},days:{},streak:0,lastLit:"",
  games:{rocket:1,balloon:1},speed:3,goal:30,pace:5000,rounds:0,best:{},track:"addsub10",look:{col:PCOLS[0],hat:"none",extra:"none"}};
 for(const k in d)if(p[k]==null)p[k]=d[k];if(!TRACK[p.track])p.track="addsub10";p.owned["col:"+p.look.col]=1;return p}
let profiles=store.get("profiles",null);
if(!Array.isArray(profiles)||!profiles.length)profiles=[newProfile("Dylan","addsub10","#4dabf7"),newProfile("Rory","addsub20","#51cf66"),newProfile("Sophia","muldiv","#f783ac")];
profiles.forEach(fixProfile);
let me=profiles.find(p=>p.id===store.get("who",""))||null;
// only the last two months of days are kept
function save(){for(const p of profiles){const ks=Object.keys(p.days).sort();while(ks.length>60)delete p.days[ks.shift()]}
 store.set("profiles",profiles);if(me)store.set("who",me.id)}
const settings=Object.assign({sfx:true},store.get("settings",{}));
function saveSettings(){store.set("settings",settings)}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(p){const k=dayKey();return p.days[k]||(p.days[k]={n:0,ok:0,lit:0})}
const fastMs=p=>(p.speed||3)*1000;

// ================================================================ sound
// A phone keeps an audio context asleep until a gesture it recognises (a
// touchend, a click, a key), so every one of those wakes it, and the frame
// loop asks for it back once a second in case the phone interrupted it.
let AC=null,sfxBus=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();
 sfxBus=AC.createGain();sfxBus.gain.value=settings.sfx?0.8:0;sfxBus.connect(AC.destination)}catch(e){}}
function audioWake(){audioInit();if(AC&&AC.state!=="running"&&AC.resume)AC.resume().catch(()=>{})}
function audioNudge(){if(AC&&AC.state!=="running"&&AC.resume)AC.resume().catch(()=>{})}
window.addEventListener("pageshow",audioNudge);window.addEventListener("focus",audioNudge);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)audioNudge()});
window.__audio=()=>AC?{state:AC.state,now:AC.currentTime}:null;window.__audioCtx=()=>AC;
function tone(f0,f1,dur,type,vol,delay){if(!AC||!settings.sfx)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+0.03)}
let noiseBuf=null;
function noise(dur,vol,delay,freq,hi){if(!AC||!settings.sfx)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;
 f.type=hi?"highpass":"lowpass";f.frequency.value=freq||900;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02)}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const SFX={
 tap(){tone(880,700,0.05,"triangle",0.08)},
 key(){tone(620,560,0.05,"triangle",0.1)},
 good(){tone(NOTE(72),NOTE(72),0.12,"triangle",0.16);tone(NOTE(76),NOTE(76),0.18,"triangle",0.16,0.08)},
 fast(){[72,76,79,84].forEach((n,i)=>tone(NOTE(n),NOTE(n),0.16,"triangle",0.13,i*0.05));tone(2400,3200,0.15,"sine",0.04,0.18)},
 // a wrong answer is a soft "hmm", never a buzzer
 bad(){tone(NOTE(60),NOTE(57),0.22,"sine",0.14);tone(NOTE(55),NOTE(52),0.28,"sine",0.1,0.12)},
 pop(){noise(0.08,0.35,0,2500,true);tone(900,300,0.08,"square",0.05)},
 splash(){noise(0.3,0.25,0,1200)},
 hop(){tone(300,700,0.16,"sine",0.12)},
 chomp(){noise(0.06,0.3,0,800);noise(0.06,0.3,0.14,800);noise(0.06,0.3,0.28,800)},
 whoosh(){noise(0.5,0.18,0,700);tone(120,260,0.5,"sawtooth",0.03)},
 vroom(){tone(90,180,0.35,"sawtooth",0.05);noise(0.3,0.08,0,400)},
 coin(){tone(NOTE(88),NOTE(88),0.06,"square",0.05);tone(NOTE(93),NOTE(93),0.12,"square",0.05,0.06)},
 star(){[67,72,76,79,84,88].forEach((n,i)=>tone(NOTE(n),NOTE(n),0.25,"triangle",0.13,i*0.09))},
 meet(){[76,79,84].forEach((n,i)=>tone(NOTE(n),NOTE(n),0.3,"sine",0.12,i*0.12))},
 win(){[60,64,67,72,67,72,76].forEach((n,i)=>tone(NOTE(n),NOTE(n),0.22,"triangle",0.14,i*0.1))},
 buy(){[79,84,88].forEach((n,i)=>tone(NOTE(n),NOTE(n),0.12,"square",0.05,i*0.06))}};
function sfx(k){if(AC&&settings.sfx)try{SFX[k]()}catch(e){}}

// ================================================================ drawing kit
const FONT='ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",-apple-system,BlinkMacSystemFont,system-ui,sans-serif';
function font(px,w){cx.font=(w||800)+" "+Math.max(1,Math.round(px))+"px "+FONT}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function txt(t,x,y,px,col,al,wt,sh){font(px,wt);cx.textAlign=al||"center";cx.textBaseline="middle";
 if(sh){cx.fillStyle=sh;cx.fillText(t,x,y+Math.max(1,px*0.07))}cx.fillStyle=col||"#fff";cx.fillText(t,x,y)}
function fitTxt(t,x,y,px,maxW,col,al,wt,sh){font(px,wt);const w=cx.measureText(t).width;if(w>maxW)px*=maxW/w;txt(t,x,y,px,col,al,wt,sh);return px}
function circle(x,y,r,col){cx.fillStyle=col;cx.beginPath();cx.arc(x,y,Math.max(0.1,r),0,Math.PI*2);cx.fill()}
function ellipse(x,y,rx,ry,col,rot){cx.fillStyle=col;cx.beginPath();cx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,Math.PI*2);cx.fill()}
let btns=[],T=0;
// a button: drawn, and remembered for the next tap. o.hold: must be held.
function button(x,y,w,h,label,fn,o){o=o||{};const r=o.r!=null?o.r:Math.min(h/2,16*U),col=o.col||"#ffffff",ink=o.ink||"#24305e";
 if(!o.flat){cx.fillStyle="rgba(0,0,0,0.22)";rr(x,y+4*U,w,h,r);cx.fill()}
