<script>
"use strict";
/* ===================================================================
   QUESTION ENGINE
   Distractors are never random. Every one is an error children actually
   make — digit reversal, changing the ones when you meant the tens,
   losing the tens when the ones roll over, forgetting to carry, taking
   the smaller digit from the larger, dropping the zero in 7 × 30. If a
   child can win by elimination the question has taught nothing.
   =================================================================== */
const MAXV = { g1:130, g2:1300, g4:100000 }[P.bank];
const IN = v => Number.isInteger(v) && v >= 0 && v <= MAXV;
const rev2 = n => { const s = String(n); return (s.length === 2 && s[1] !== '0') ? Number(s[1] + s[0]) : null; };
const swapHT = n => { const s = String(n); return s.length === 3 ? Number(s[1] + s[0] + s[2]) : null; };
const swapTO = n => { const s = String(n); return s.length === 3 ? Number(s[0] + s[2] + s[1]) : null; };

function build(answer, pool) {
  const out = [answer], seen = new Set([answer]);
  for (const c of pool) {
    if (out.length === 4) break;
    if (c == null || !IN(c) || seen.has(c) || (c === 0 && answer !== 0)) continue;
    seen.add(c); out.push(c);
  }
  let d = 1;
  while (out.length < 4 && d < 200) {
    for (const c of [answer + d, answer - d]) {
      if (out.length === 4) break;
      if (IN(c) && c !== 0 && !seen.has(c)) { seen.add(c); out.push(c); }
    }
    d++;
  }
  return shuffle(out);
}
const numChoices = (answer, pool) => build(answer, pool).map(v => ({ value:v, label:String(v) }));

function legend(parts) {   /* e.g. crate ×3, bag ×4, bone ×7 */
  let g = '', x = 6;
  parts.forEach(p => {
    if (p.n === 0) return;
    const art = p.t === 'h' ? `<g transform="translate(${x},4) scale(0.72)">${crate(0, 0)}</g>`
              : p.t === 't' ? `<g transform="translate(${x},2) scale(0.78)">${bag(0, 0)}</g>`
              : `<g transform="translate(${x + 18},46)">${bone(0, 0, 1.7)}</g>`;
    const w = p.t === 'h' ? 64 : p.t === 't' ? 56 : 44;
    g += art + `<text x="${x + w + 8}" y="62" font-family="Baloo 2,sans-serif" font-size="40" font-weight="800" fill="${INK}">× ${p.n}</text>`;
    x += w + (String(p.n).length > 1 ? 96 : 78);
  });
  return `<svg viewBox="0 0 ${Math.max(x, 200)} 90">${g}</svg>`;
}

function twoRows(a, b) {
  const W = Math.max(a, b) * 24 + 20;
  let g = '';
  for (let i = 0; i < a; i++) g += bone(14 + i * 24, 18, 0.8);
  for (let i = 0; i < b; i++) g += bone(14 + i * 24, 48, 0.8, '#F6BE4A');
  return `<svg viewBox="0 0 ${W} 68" role="img" aria-label="${a} and ${b}">${g}</svg>`;
}

function teachTwo(aHtml, mid, bHtml) {
  return `<div style="display:flex;flex-direction:column;gap:4px;align-items:center;width:100%">
    <div style="width:100%;max-width:430px">${aHtml}</div>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem">${mid}</div>
    <div style="width:100%;max-width:430px">${bHtml}</div></div>`;
}
const bigNum = t => `<p class="num" style="font-family:'Baloo 2',sans-serif;font-size:1.9rem;margin:0">${t}</p>`;

/* column layout for a two-digit sum, so the carry is visible */
function columnSum(a, b, op, hide) {
  const r = op === '+' ? a + b : a - b;
  const w = Math.max(String(a).length, String(b).length + 1, String(r).length);
  const rows = [String(a).padStart(w, ' '), (op + String(b)).padStart(w, ' '), hide ? '' : String(r).padStart(w, ' ')];
  const cw = 34, W = w * cw + 12;
  let g = '';
  rows.forEach((t, i) => {
    for (let k = 0; k < t.length; k++) {
      const ch = t[k]; if (ch === ' ') continue;
      g += `<text x="${18 + k * cw}" y="${40 + i * 44}" text-anchor="middle" font-family="Baloo 2,sans-serif" font-size="36" font-weight="800" fill="${INK}">${ch}</text>`;
    }
  });
  g += `<path d="M4 96 h${W - 8}" stroke="${INK}" stroke-width="4"/>`;
  return `<svg viewBox="0 0 ${W} 158">${g}</svg>`;
}

/* a fraction as a divided bar — the representation Grade 3 is taught on */
function fracBar(num, den, colour) {
  const W = 360, H = 76, cw = W / den;
  let g = '';
  for (let i = 0; i < den; i++)
    g += `<rect x="${(i * cw).toFixed(2)}" y="6" width="${cw.toFixed(2)}" height="60" fill="${i < num ? (colour || '#4CA36B') : '#FFFDF6'}" stroke="${INK}" stroke-width="3"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${num} out of ${den} parts shaded">${g}</svg>`;
}
function twoBars(a, b, c, d) {
  return `<div style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:430px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px"><span class="num" style="font-family:'Baloo 2',sans-serif;font-size:1.4rem;min-width:52px">${a}/${b}</span>${fracBar(a, b)}</div>
    <div style="display:flex;align-items:center;gap:10px"><span class="num" style="font-family:'Baloo 2',sans-serif;font-size:1.4rem;min-width:52px">${c}/${d}</span>${fracBar(c, d, '#E4572E')}</div></div>`;
}

/* a rectangle on squared paper, for area and perimeter */
function gridRect(w, h) {
  const u = 26, W = w * u + 30, H = h * u + 30;
  let g = `<rect x="15" y="15" width="${w * u}" height="${h * u}" fill="#CFE9D8" stroke="${INK}" stroke-width="3.5"/>`;
  for (let i = 1; i < w; i++) g += `<path d="M${15 + i * u} 15 v${h * u}" stroke="${INK}" stroke-width="1.4" opacity=".55"/>`;
  for (let i = 1; i < h; i++) g += `<path d="M15 ${15 + i * u} h${w * u}" stroke="${INK}" stroke-width="1.4" opacity=".55"/>`;
  g += `<text x="${15 + w * u / 2}" y="${H - 2}" text-anchor="middle" font-family="Andika,sans-serif" font-size="15" fill="${INK}">${w}</text>`;
  g += `<text x="6" y="${18 + h * u / 2}" text-anchor="middle" font-family="Andika,sans-serif" font-size="15" fill="${INK}">${h}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="a ${w} by ${h} rectangle">${g}</svg>`;
}

/* ------------------------------------------------------------- BANK g1 */
const GEN = {};
GEN.g1 = function (id) {
  const q = { skill:id, visual:'' };
  switch (id) {
    case 'read50': case 'read99': {
      const n = id === 'read50' ? ri(11, 50) : ri(51, 99);
      const t = Math.floor(n / 10), o = n % 10;
      q.answer = n; q.ask = 'How many bones?'; q.speak = 'How many bones?';
      q.visual = bagsPicture(n);
      q.choices = numChoices(n, [rev2(n), n + 10, n - 10, o * 10 + t + 1, n + 1, n - 1, t + o]);
      q.teach = { html:bagsPicture(n), say:`${t} bags of ten is ${t * 10}. And ${o} more bones. That makes ${n}.`,
                  text:`${t} bags of ten is <b>${t * 10}</b>, and ${o} bones. That makes <b>${n}</b>.` };
      return q;
    }
    case 'match': {
      const t = ri(2, 9), o = ri(1, 9), n = t * 10 + o;
      q.answer = n;
      q.ask = `<span class="big">${t}</span> bags and <span class="big">${o}</span> bones. Which number?`;
      q.speak = `${t} bags of ten and ${o} bones. Which number is that?`;
      q.visual = legend([{ t:'t', n:t }, { t:'o', n:o }]);
      q.choices = numChoices(n, [rev2(n), t + o, n + 10, n - 10, n + 1]);
      q.teach = { html:bagsPicture(n), say:`${t} bags of ten is ${t * 10}. And ${o} bones. That makes ${n}.`,
                  text:`${t} tens and ${o} ones is <b>${n}</b>. The bags always go first.` };
      return q;
    }
    case 'compare': {
      const t = ri(2, 8), a = t * 10 + ri(1, 8);
      const set = [a, a + 1, rev2(a), t * 10 + ri(1, 9) + 10];
      const uniq = [...new Set(set.filter(v => IN(v) && v >= 10 && v <= 99))];
      while (uniq.length < 4) { const c = ri(11, 99); if (!uniq.includes(c)) uniq.push(c); }
      const four = uniq.slice(0, 4);
      const ans = Math.max(...four);
      q.answer = ans; q.ask = 'Which is the <b>biggest</b> number?';
      q.speak = 'Which is the biggest number?';
      q.visual = bagsPicture(ans);
      q.choices = shuffle(four).map(v => ({ value:v, label:String(v) }));
      q.teach = { html:bagsPicture(ans), say:`Look at the bags first. ${ans} has the most bags, so it is the biggest.`,
                  text:`Count the <b>bags</b> first. The most bags wins; only if the bags match do the bones decide.` };
      return q;
    }
    case 'up10': case 'down10': case 'any10': {
      let start, step;
      if (id === 'up10') { start = ri(0, 7) * 10; step = 10; }
      else if (id === 'down10') { start = ri(4, 12) * 10; step = -10; }
      else { const o = ri(1, 9);
        if (Math.random() < .5) { start = o + 10 * ri(0, 7); step = 10; } else { start = o + 10 * ri(4, 8); step = -10; } }
      const seq = [0, 1, 2, 3, 4].map(i => start + i * step);
      if (seq.some(v => v < 0 || v > 130)) return GEN.g1(id);
      const bi = ri(1, 4), a = seq[bi];
      q.answer = a;
      q.ask = step > 0 ? 'Count on in tens. Which stone?' : 'Count back in tens. Which stone?';
      q.speak = (step > 0 ? 'Count on in tens. ' : 'Count back in tens. ') + seq.map((v, i) => i === bi ? 'hmm' : v).join(', ');
      q.visual = stones(seq, bi);
      q.choices = numChoices(a, [a + 1, a - 1, rev2(a), a + 9, a - 9, a + 11]);
      q.teach = { html:stones(seq, -1), say:'Count in tens. ' + seq.join(', '),
                  text:`In tens: ${seq.join(', ')}. Only the <b>bags</b> change.` };
      return q;
    }
    case 'plus1': case 'minus1': case 'plus1x': case 'minus1x': {
      const up = id[0] === 'p', cross = id.endsWith('x');
      let n;
      if (cross) n = up ? ri(1, 10) * 10 - 1 : ri(2, 12) * 10;
      else { do { n = ri(11, 98); } while (up ? n % 10 === 9 : n % 10 === 0); }
      const a = up ? n + 1 : n - 1, ones = n % 10;
      q.answer = a;
      q.ask = `<span class="big">${n}</span><br>What is one ${up ? 'more' : 'less'}?`;
      q.speak = `What is one ${up ? 'more' : 'less'} than ${n}?`;
      q.visual = bagsPicture(n);
      q.choices = numChoices(a, cross ? (up ? [n - 9, a + 10, a + 1, rev2(a)] : [n - 10, n + 1, a - 10, n - 11])
                                      : [up ? n - 1 : n + 1, a + 10, a - 10, a + 1]);
      if (cross && up) q.teach = { html:teachTwo(bagsPicture(n), '9 bones and 1 more = a whole new bag!', bagsPicture(a)),
        say:`${ones} bones and one more makes ten. Ten bones make a new bag. So ${n} and one more is ${a}.`,
        text:`${ones} bones and 1 more makes <b>ten</b> — and ten bones become a <b>new bag</b>. ${n} → <b>${a}</b>.` };
      else if (cross) q.teach = { html:teachTwo(bagsPicture(n), 'open a bag to get 10 bones back', bagsPicture(a)),
        say:`${n} has no loose bones, so open a bag. That gives ten bones. Take one away and you have ${a}.`,
        text:`${n} has no loose bones — so <b>open a bag</b>. That's 10 bones. Take 1 away: <b>${a}</b>.` };
      else q.teach = { html:teachTwo(bagsPicture(n), up ? 'add 1 bone' : 'take 1 bone away', bagsPicture(a)),
        say:`The bags stay the same. Only the bones change. ${n} is ${a}.`,
        text:`The <b>bags</b> stay the same. Only the <b>bones</b> change: <b>${a}</b>.` };
      return q;
    }
    case 'plus10': case 'minus10': {
      const up = id === 'plus10', n = up ? ri(4, 99) : ri(14, 120);
      const a = up ? n + 10 : n - 10;
      q.answer = a;
      q.ask = `<span class="big">${n}</span><br>What is ten ${up ? 'more' : 'less'}?`;
      q.speak = `What is ten ${up ? 'more' : 'less'} than ${n}?`;
      q.visual = n <= 99 ? bagsPicture(n) : '';
      q.choices = numChoices(a, [up ? n + 1 : n - 1, up ? n - 10 : n + 10, up ? n + 20 : n - 20, rev2(a)]);
      q.teach = { html:(n <= 99 && a <= 99) ? teachTwo(bagsPicture(n), up ? 'one more bag of ten' : 'one bag of ten away', bagsPicture(a)) : bigNum(`${n} ${up ? '+' : '−'} 10 = ${a}`),
        say:`Ten ${up ? 'more' : 'less'} means ${up ? 'one more bag' : 'one bag less'}. The loose bones do not change. ${n} becomes ${a}.`,
        text:`Ten ${up ? 'more' : 'less'} = ${up ? 'one more <b>bag</b>' : 'one <b>bag</b> away'}. The loose bones <b>never change</b>.` };
      return q;
    }
    case 'makeTen': {
      const n = ri(1, 9), a = 10 - n;
      q.answer = a;
      q.ask = `<span class="big">${n}</span> + ? = <span class="big">10</span>`;
      q.speak = `${n} and how many more makes ten?`;
      q.visual = `<svg viewBox="0 0 182 74">${looseFrame(n, 0, 4)}</svg>`;
      q.choices = numChoices(a, [a + 1, a - 1, n, a + 2]);
      q.teach = { html:`<svg viewBox="0 0 182 74">${looseFrame(10, 0, 4)}</svg>`,
        say:`Count the empty spaces. ${n} and ${a} makes ten.`,
        text:`Count the <b>empty spaces</b> in the frame — there are ${a}. So ${n} + <b>${a}</b> = 10.` };
      return q;
    }
    case 'doubles': {
      const n = ri(2, 10), a = n * 2;
      q.answer = a;
      q.ask = `<span class="big">${n}</span> + <span class="big">${n}</span>`;
      q.speak = `What is double ${n}? ${n} plus ${n}.`;
      q.visual = arrayPicture(2, n);
      q.choices = numChoices(a, [a + 1, a - 1, a + 2, n * 2 + n]);
      q.teach = { html:arrayPicture(2, n), say:`Two rows of ${n}. That is ${a}.`,
        text:`Two rows of ${n} — double ${n} is <b>${a}</b>.` };
      return q;
    }
    case 'addOnes': {
      const t = ri(1, 9), o = ri(0, 4), n = t * 10 + o, k = ri(2, 9 - o), a = n + k;
      q.answer = a;
      q.ask = `<span class="big">${n}</span> + <span class="big">${k}</span>`;
      q.speak = `What is ${n} add ${k}?`;
      q.visual = bagsPicture(n);
      q.choices = numChoices(a, [a + 10, a - 10, a + 1, o + k]);
      q.teach = { html:teachTwo(bagsPicture(n), `add ${k} more bones`, bagsPicture(a)),
        say:`The bags do not change. ${o} bones and ${k} more is ${o + k}. So the answer is ${a}.`,
        text:`The <b>bags</b> stay the same. Only add to the bones: ${o} + ${k} = ${o + k}, so <b>${a}</b>.` };
      return q;
    }
    case 'addTens': case 'subTens': {
      const up = id === 'addTens';
      let x, y;
      if (up) { x = ri(1, 6) * 10; y = ri(1, 9 - x / 10) * 10; }
      else { x = ri(3, 9) * 10; y = ri(1, x / 10 - 1) * 10; }
      const a = up ? x + y : x - y;
      q.answer = a;
      q.ask = `<span class="big">${x}</span> ${up ? '+' : '−'} <span class="big">${y}</span>`;
      q.speak = `What is ${x} ${up ? 'add' : 'take away'} ${y}?`;
      q.visual = bagsPicture(x);
      q.choices = numChoices(a, [a / 10, a + 10, a - 10, a + 1]);
      q.teach = { html:teachTwo(bagsPicture(x), `${up ? 'add' : 'take away'} ${y / 10} bags`, bagsPicture(a)),
        say:`${x / 10} bags ${up ? 'and' : 'take away'} ${y / 10} bags is ${a / 10} bags. ${a / 10} bags is ${a}.`,
        text:`${x / 10} bags ${up ? '+' : '−'} ${y / 10} bags = ${a / 10} bags — and ${a / 10} bags is <b>${a}</b>.` };
      return q;
    }
  }
  throw new Error('g1 ' + id);
};
</script>

<script>
"use strict";
/* ------------------------------------------------------------- BANK g2
   Rory · end of Grade 1. CCSS 1.OA.B.3–4 / C.5–6 / D.7–8 (facts within
   20, missing numbers, the meaning of equals), 1.NBT.A.1 (to 120),
   1.NBT.B.2–3 (tens and ones, teens, comparing), 1.NBT.C.4–6 (two-digit
   plus one-digit or a whole ten, ten more and less, whole tens away)
   and 1.MD.B.3 (o'clock and half past).

   Everything Grade 1 shares with Dylan's bank is generated by the SAME
   function, so a fix to a teaching panel fixes it for both children.
   ------------------------------------------------------------------ */
const G1_SHARED = new Set(['read99', 'match', 'compare', 'up10', 'any10',
  'plus10', 'minus10', 'makeTen', 'doubles', 'addOnes', 'addTens', 'subTens']);

/* a clock face — 1.MD.B.3 */
function clockFace(h, m) {
  const cx = 110, cy = 110, r = 92;
  let g = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFFDF6" stroke="${INK}" stroke-width="5"/>
           <circle cx="${cx}" cy="${cy}" r="${r - 12}" fill="none" stroke="${INK}" stroke-width="1.6" opacity=".35"/>`;
  for (let i = 1; i <= 12; i++) {
    const ang = (i * 30 - 90) * Math.PI / 180;
    g += `<text x="${(cx + Math.cos(ang) * (r - 24)).toFixed(1)}" y="${(cy + Math.sin(ang) * (r - 24) + 8).toFixed(1)}"
            text-anchor="middle" font-family="Baloo 2,sans-serif" font-size="24" font-weight="800" fill="${INK}">${i}</text>`;
  }
  for (let i = 0; i < 60; i++) {
    const ang = (i * 6 - 90) * Math.PI / 180, big = i % 5 === 0;
    g += `<path d="M${(cx + Math.cos(ang) * (r - 6)).toFixed(1)} ${(cy + Math.sin(ang) * (r - 6)).toFixed(1)}
             L${(cx + Math.cos(ang) * (r - (big ? 13 : 9))).toFixed(1)} ${(cy + Math.sin(ang) * (r - (big ? 13 : 9))).toFixed(1)}"
             stroke="${INK}" stroke-width="${big ? 3 : 1.4}" stroke-linecap="round"/>`;
  }
  const ha = ((h % 12) * 30 + m * 0.5 - 90) * Math.PI / 180;
  const ma = (m * 6 - 90) * Math.PI / 180;
  g += `<path d="M${cx} ${cy} L${(cx + Math.cos(ma) * (r - 24)).toFixed(1)} ${(cy + Math.sin(ma) * (r - 24)).toFixed(1)}" stroke="#4A9BCB" stroke-width="7" stroke-linecap="round"/>`;
  g += `<path d="M${cx} ${cy} L${(cx + Math.cos(ha) * (r - 46)).toFixed(1)} ${(cy + Math.sin(ha) * (r - 46)).toFixed(1)}" stroke="#E4572E" stroke-width="11" stroke-linecap="round"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="7" fill="${INK}"/>`;
  return `<svg viewBox="0 0 220 220" role="img" aria-label="a clock showing ${h} ${m ? 'thirty' : "o'clock"}">${g}</svg>`;
}
const clockLabel = (h, m) => `${h}:${m === 0 ? '00' : '30'}`;

GEN.g2 = function (id) {
  if (G1_SHARED.has(id)) return GEN.g1(id);
  const q = { skill:id, visual:'' };
  switch (id) {

    /* ---- facts within 10 and within 20 · 1.OA.C.6 ---- */
    case 'add10': case 'sub10': {
      const up = id === 'add10';
      const a = ri(2, 6), b = ri(2, 10 - a);
      const x = up ? a : a + b, y = b, r = up ? a + b : a;
      q.answer = r;
      q.ask = `<span class="big">${x}</span> ${up ? '+' : '−'} <span class="big">${y}</span>`;
      q.speak = `What is ${x} ${up ? 'add' : 'take away'} ${y}?`;
      q.visual = up ? twoRows(a, b) : `<svg viewBox="0 0 182 74">${looseFrame(x, 0, 4)}</svg>`;
      q.choices = numChoices(r, [r + 1, r - 1, r + 2, x]);
      q.teach = { html:`<svg viewBox="0 0 182 74">${looseFrame(r, 0, 4)}</svg>`,
        say:`${x} ${up ? 'and' : 'take away'} ${y} is ${r}.`,
        text:`${x} ${up ? '+' : '−'} ${y} = <b>${r}</b>.` };
      return q;
    }
    case 'add20': {
      const a = ri(4, 9), b = ri(10 - a + 1, 9), r = a + b;   /* always crosses ten */
      q.answer = r;
      q.ask = `<span class="big">${a}</span> + <span class="big">${b}</span>`;
      q.speak = `What is ${a} add ${b}?`;
      q.visual = twoRows(a, b);
      q.choices = numChoices(r, [r + 1, r - 1, r + 2, Math.abs(a - b)]);
      q.teach = { html:teachTwo(`<svg viewBox="0 0 182 74">${looseFrame(10, 0, 4)}</svg>`, `fill ten first, then ${r - 10} left over`, `<svg viewBox="0 0 182 74">${looseFrame(r - 10, 0, 4)}</svg>`),
        say:`Make ten first. ${a} needs ${10 - a} to fill the frame, and that leaves ${b - (10 - a)} over. Ten and ${r - 10} is ${r}.`,
        text:`Make <b>ten</b> first: ${a} + ${10 - a} = 10, with ${b - (10 - a)} left over. 10 + ${r - 10} = <b>${r}</b>.` };
      return q;
    }
    case 'sub20': {
      const r = ri(3, 9), b = ri(10 - r + 1, 9), m = r + b;   /* always crosses back */
      q.answer = r;
      q.ask = `<span class="big">${m}</span> − <span class="big">${b}</span>`;
      q.speak = `What is ${m} take away ${b}?`;
      q.visual = `<svg viewBox="0 0 182 148">${looseFrame(10, 0, 4)}${looseFrame(m - 10, 0, 78)}</svg>`;
      q.choices = numChoices(r, [r + 1, r - 1, r + 2, m - b + 10]);
      q.teach = { html:bigNum(`${m} − ${m - 10} = 10<br>10 − ${b - (m - 10)} = <b>${r}</b>`),
        say:`Drop to ten first. ${m} take away ${m - 10} is ten, then take away ${b - (m - 10)} more, which leaves ${r}.`,
        text:`Drop to <b>ten</b> first: ${m} − ${m - 10} = 10, then − ${b - (m - 10)} = <b>${r}</b>.` };
      return q;
    }
    case 'nearDbl': {
      const a = ri(3, 9), r = a + a + 1;
      q.answer = r;
      q.ask = `<span class="big">${a}</span> + <span class="big">${a + 1}</span>`;
      q.speak = `What is ${a} add ${a + 1}?`;
      q.visual = twoRows(a, a + 1);
      q.choices = numChoices(r, [a * 2, r + 1, r + 2, a * 2 + 2]);
      q.teach = { html:teachTwo(arrayPicture(2, a), `double ${a} is ${a * 2}, then one more`, `<svg viewBox="0 0 182 74">${looseFrame(Math.min(r, 10), 0, 4)}</svg>`),
        say:`It is nearly a double. Double ${a} is ${a * 2}, and one more makes ${r}.`,
        text:`Use the double you know: ${a} + ${a} = ${a * 2}, then <b>one more</b> → <b>${r}</b>.` };
      return q;
    }
    case 'missing20': {
      const a = ri(4, 9), r = ri(3, 9), c = a + r;
      q.answer = r;
      q.ask = `<span class="big">${a}</span> + ? = <span class="big">${c}</span>`;
      q.speak = `${a} add how many makes ${c}?`;
      q.choices = numChoices(r, [r + 1, r - 1, c, c + a - 10]);
      q.teach = { html:bigNum(`${c} − ${a} = <b>${r}</b>`),
        say:`A missing add is really a take away. ${c} take away ${a} is ${r}.`,
        text:`A missing add is really a <b>take away</b>: ${c} − ${a} = <b>${r}</b>.` };
      return q;
    }
    /* ---- 1.OA.D.7 · does the equals sign really balance? ---- */
    case 'trueFalse': {
      const a = ri(3, 9), b = ri(3, 9), sum = a + b;
      const good = Math.random() < .5 ? `${a} + ${b} = ${sum}` : `${sum} = ${a} + ${b}`;
      const set = new Set([good]);
      let guard = 0;
      while (set.size < 4 && guard++ < 40) {
        const x = ri(3, 9), y = ri(3, 9), off = pick([1, 2, -1, -2]);
        set.add(Math.random() < .5 ? `${x} + ${y} = ${x + y + off}` : `${x + y + off} = ${x} + ${y}`);
      }
      while (set.size < 4) set.add(`${ri(2, 9)} + ${ri(2, 9)} = ${ri(3, 19)}`);
      q.answer = good; q.text = true;
      q.ask = 'Which one is <b>true</b>?';
      q.speak = 'Which number sentence is true?';
      q.choices = shuffle([...set].slice(0, 4)).map(v => ({ value:v, label:v }));
      q.teach = { html:twoRows(a, b),
        say:`The equals sign means both sides are worth the same. ${a} and ${b} really is ${sum}.`,
        text:`Equals means <b>both sides are worth the same</b> — it is not "the answer goes here". ${good} balances.` };
      return q;
    }
    /* ---- 1.NBT.B.2b · a teen number is a ten and some ones ---- */
    case 'teens': {
      const o = ri(1, 9), n = 10 + o;
      const askOnes = Math.random() < .5;
      q.answer = askOnes ? o : n;
      q.ask = askOnes ? `<span class="big">${n}</span> is ten and how many more?`
                      : `Ten and <span class="big">${o}</span> more`;
      q.speak = askOnes ? `${n} is ten and how many more?` : `What is ten and ${o} more?`;
      q.visual = bagsPicture(n);
      q.choices = askOnes ? numChoices(o, [o + 1, o - 1, n, 10]) : numChoices(n, [o, rev2(n), n + 10, n + 1]);
      q.teach = { html:bagsPicture(n),
        say:`${n} is one full bag of ten and ${o} loose bones.`,
        text:`Every teen number is <b>one bag of ten</b> and some loose bones: ${n} = 10 + ${o}.` };
      return q;
    }
    /* ---- 1.NBT.B.2c · the decades ---- */
    case 'decades': {
      const t = ri(2, 9), n = t * 10;
      const askTens = Math.random() < .5;
      q.answer = askTens ? t : n;
      q.ask = askTens ? `How many bags of ten make <span class="big">${n}</span>?`
                      : `<span class="big">${t}</span> bags of ten`;
      q.speak = askTens ? `How many tens are there in ${n}?` : `What is ${t} tens?`;
      q.visual = bagsPicture(n);
      q.choices = askTens ? numChoices(t, [t + 1, t - 1, n, t * 2]) : numChoices(n, [t, n + 10, n - 10, rev2(n)]);
      q.teach = { html:bagsPicture(n),
        say:`${t} bags of ten is ${n}. Count them in tens.`,
        text:`${t} tens = <b>${n}</b>, and no loose bones at all.` };
      return q;
    }
    /* ---- 1.NBT.A.1 · counting on and back to 120, over the tens ---- */
    case 'count1': case 'back1': {
      const up = id === 'count1';
      const dec = ri(1, 11) * 10;                       /* land the run on a ten */
      const start = up ? dec - 2 : dec + 2;
      const seq = [0, 1, 2, 3, 4].map(i => start + (up ? i : -i));
      if (seq.some(v => v < 0 || v > 120)) return GEN.g2(id);
      const bi = ri(1, 4), a = seq[bi];
      q.answer = a;
      q.ask = up ? 'Count on. Which stone?' : 'Count back. Which stone?';
      q.speak = (up ? 'Count on. ' : 'Count back. ') + seq.map((v, i) => i === bi ? 'hmm' : v).join(', ');
      q.visual = stones(seq, bi);
      q.choices = numChoices(a, [a + 1, a - 1, a + 10, a - 10, rev2(a)]);
      q.teach = { html:stones(seq, -1), say:seq.join(', '),
        text:`${seq.join(', ')} — when the ones fill up, the <b>next bag</b> starts.` };
      return q;
    }
    /* ---- 1.NBT.C.4 / C.6 · two-digit work ---- */
    case 'add2d1x': case 'sub2d1x': {
      const up = id === 'add2d1x';
      const t = ri(1, 8), o = up ? ri(5, 9) : ri(1, 4), n = t * 10 + o;
      const k = up ? ri(10 - o, 9) : ri(o + 1, 9);       /* always crosses the ten */
      const a = up ? n + k : n - k;
      q.answer = a;
      q.ask = `<span class="big">${n}</span> ${up ? '+' : '−'} <span class="big">${k}</span>`;
      q.speak = `What is ${n} ${up ? 'add' : 'take away'} ${k}?`;
      q.visual = bagsPicture(n);
      q.choices = numChoices(a, [up ? t * 10 + (o + k) % 10 : t * 10 - (k - o), a + 10, a - 10, a + 1]);
      q.teach = { html:teachTwo(bagsPicture(n), up ? `${o} and ${k} fills a whole new bag` : `there are not enough bones — open a bag`, bagsPicture(a)),
        say: up ? `${o} bones and ${k} more is ${o + k}. Ten of them make a new bag, leaving ${(o + k) % 10}. So ${a}.`
                : `There are only ${o} loose bones, so open a bag for ten more. Then take ${k} away. That leaves ${a}.`,
        text: up ? `${o} + ${k} = ${o + k} — that fills a <b>whole new bag</b> with ${(o + k) % 10} left over → <b>${a}</b>.`
                 : `Only ${o} loose bones, so <b>open a bag</b> for ten more before taking ${k} away → <b>${a}</b>.` };
      return q;
    }
    case 'add2dTen': {
      const t = ri(1, 6), o = ri(1, 9), n = t * 10 + o, k = ri(1, 9 - t) * 10, a = n + k;
      q.answer = a;
      q.ask = `<span class="big">${n}</span> + <span class="big">${k}</span>`;
      q.speak = `What is ${n} add ${k}?`;
      q.visual = bagsPicture(n);
      q.choices = numChoices(a, [n + k / 10, a + 10, a - 10, a + 1]);
      q.teach = { html:teachTwo(bagsPicture(n), `add ${k / 10} more bags`, bagsPicture(a)),
        say:`Adding ${k} means adding ${k / 10} more bags. The loose bones do not change. ${a}.`,
        text:`Adding ${k} = <b>${k / 10} more bags</b>. The loose bones <b>never change</b> → <b>${a}</b>.` };
      return q;
    }
    /* ---- 1.MD.B.3 · o'clock and half past ---- */
    case 'oclock': case 'halfpast': {
      const half = id === 'halfpast';
      const h = ri(1, 12), m = half ? 30 : 0;
      q.answer = clockLabel(h, m); q.text = true;
      q.ask = 'What time is it?';
      q.speak = 'What time does the clock say?';
      q.visual = clockFace(h, m);
      const nextH = h === 12 ? 1 : h + 1, prevH = h === 1 ? 12 : h - 1;
      const set = new Set([q.answer,
        clockLabel(nextH, m),                 /* half past is often read as the next hour */
        clockLabel(h, half ? 0 : 30),
        clockLabel(prevH, m)]);
      let guard = 0;
      while (set.size < 4 && guard++ < 20) set.add(clockLabel(ri(1, 12), pick([0, 30])));
      q.choices = shuffle([...set].slice(0, 4)).map(v => ({ value:v, label:v }));
      q.teach = { html:clockFace(h, m),
        say: half ? `The short hand has gone past the ${h}, and the long hand points at the 6. That is half past ${h}.`
                  : `The long hand points straight up and the short hand points at the ${h}. That is ${h} o'clock.`,
        text: half ? `The <b>short</b> hand is the hour, and it has only gone <b>past</b> the ${h} — it is not on the ${nextH} yet. Long hand on the 6 means half past. <b>${h}:30</b>.`
                   : `Long hand straight up, short hand on the ${h} → <b>${h}:00</b>.` };
      return q;
    }
    /* ---- Stretch · Grade 2 groups and sharing (2.OA.C.4) ---- */
    case 'groups': {
      const r = ri(2, 5), c = ri(2, 6), a = r * c;
      q.answer = a;
      q.ask = `<span class="big">${r}</span> rows of <span class="big">${c}</span>. How many?`;
      q.speak = `${r} rows of ${c}. How many altogether?`;
      q.visual = arrayPicture(r, c);
      q.choices = numChoices(a, [r + c, a + c, a - c, a + 1]);
      q.teach = { html:arrayPicture(r, c),
        say:`${r} rows of ${c}. Count in ${c}s: ${Array.from({ length:r }, (_, i) => c * (i + 1)).join(', ')}.`,
        text:`${r} rows of ${c} = ${Array.from({ length:r }, () => c).join(' + ')} = <b>${a}</b>.` };
      return q;
    }
    case 'mult2': case 'mult5': case 'mult10': {
      const n = Number(id.slice(4)), b = ri(2, 10), a = n * b;
      q.answer = a;
      q.ask = `<span class="big">${n}</span> × <span class="big">${b}</span>`;
      q.speak = `What is ${n} times ${b}?`;
      q.visual = arrayPicture(Math.min(n, 10), b);
      q.choices = numChoices(a, [n * (b + 1), n * (b - 1), a + 1, n + b]);
      q.teach = { html:arrayPicture(Math.min(n, 10), b),
        say:`${n} rows of ${b}. Count in ${b}s and you land on ${a}.`,
        text:`${n} × ${b} is ${n} rows of ${b} → <b>${a}</b>.` };
      return q;
    }
    case 'share2': case 'share5': case 'share10': {
      const n = Number(id.slice(5)), a = ri(2, 10), pr = n * a;
      q.answer = a;
      q.ask = `<span class="big">${pr}</span> bones shared between <span class="big">${n}</span>`;
      q.speak = `${pr} bones shared equally between ${n}. How many each?`;
      q.visual = arrayPicture(Math.min(n, 10), a);
      q.choices = numChoices(a, [a + 1, a - 1, pr - n, n]);
      q.teach = { html:arrayPicture(Math.min(n, 10), a),
        say:`${pr} shared between ${n} is ${a} each, because ${n} times ${a} is ${pr}.`,
        text:`${pr} ÷ ${n} = <b>${a}</b>, because ${n} × ${a} = ${pr}.` };
      return q;
    }
  }
  throw new Error('g2 ' + id);
};

/* ------------------------------------------------------------- BANK g4
   NOTE: only the t2–t12 cases are reachable from Sophia's menu. Everything
   else here (division, missing factors, fractions, area, perimeter,
   rounding, three-digit sums) is parked, kept working, and comes back by
   adding its id to the g4 skills list above.
   Sophia · rising Grade 4. CCSS 3.OA.C.7 asks for fluency with × and ÷
   within 100 by the end of Grade 3, so this is automaticity work, not
   first exposure; 4.NBT.B.5 builds multi-digit multiplication on top of
   it, which is why multiples of ten are in here.
   ------------------------------------------------------------------ */
GEN.g4 = function (id) {
  const q = { skill:id, visual:'' };
  if (/^t\d+$/.test(id)) {
    const n = Number(id.slice(1)), b = ri(2, 12), a = n * b;
    const [r, c] = Math.random() < .5 ? [n, b] : [b, n];
    q.answer = a;
    q.ask = `<span class="big">${r}</span> × <span class="big">${c}</span>`;
    q.speak = `What is ${r} times ${c}?`;
    q.choices = numChoices(a, [n * (b + 1), n * (b - 1), a + 1, a - 1, a + 10, (n + 1) * b]);
    q.teach = { html:arrayPicture(Math.min(r, 12), Math.min(c, 12)),
      say:`${r} rows of ${c} is ${a}.`,
      text:`${r} × ${c} = <b>${a}</b>. ${n === 9 ? 'For the 9s: the two digits of the answer always add to 9.' : `Nearby: ${n}×${b - 1}=${n * (b - 1)} and ${n}×${b + 1}=${n * (b + 1)}.`}` };
    return q;
  }
  if (/^d\d+$/.test(id)) {
    const n = Number(id.slice(1)), b = ri(2, 12), p = n * b;
    q.answer = b;
    q.ask = `<span class="big">${p}</span> ÷ <span class="big">${n}</span>`;
    q.speak = `What is ${p} divided by ${n}?`;
    q.choices = numChoices(b, [b + 1, b - 1, n, p - n, b + 2]);
    q.teach = { html:arrayPicture(Math.min(n, 12), Math.min(b, 12)),
      say:`${n} times ${b} is ${p}, so ${p} divided by ${n} is ${b}.`,
      text:`Ask "what times ${n} makes ${p}?" — ${n} × <b>${b}</b> = ${p}. Division undoes multiplication.` };
    return q;
  }
  switch (id) {
    case 'missing': {
      const n = ri(3, 12), b = ri(3, 12), p = n * b;
      q.answer = b;
      q.ask = `<span class="big">${n}</span> × ? = <span class="big">${p}</span>`;
      q.speak = `${n} times what makes ${p}?`;
      q.choices = numChoices(b, [b + 1, b - 1, p - n, n]);
      q.teach = { html:arrayPicture(Math.min(n, 12), Math.min(b, 12)),
        say:`A missing factor is a division. ${p} divided by ${n} is ${b}.`,
        text:`A missing factor is a <b>division</b>: ${p} ÷ ${n} = <b>${b}</b>.` };
      return q;
    }
    case 'tens': {
      const n = ri(2, 9), b = ri(2, 9), a = n * b * 10;
      q.answer = a;
      q.ask = `<span class="big">${n}</span> × <span class="big">${b * 10}</span>`;
      q.speak = `What is ${n} times ${b * 10}?`;
      q.choices = numChoices(a, [n * b, a + 10, a - 10, a * 10 > MAXV ? null : a * 10, n * (b + 1) * 10]);
      q.teach = { html:bigNum(`${n} × ${b} = ${n * b},  so  ${n} × ${b * 10} = ${a}`),
        say:`${n} times ${b} is ${n * b}. Ten times bigger, so ${a}.`,
        text:`Do ${n} × ${b} = ${n * b}, then make it <b>ten times bigger</b>: <b>${a}</b>. Don't lose the zero.` };
      return q;
    }
    case 'square': {
      const n = ri(3, 12), a = n * n;
      q.answer = a;
      q.ask = `<span class="big">${n}</span> × <span class="big">${n}</span>`;
      q.speak = `What is ${n} times ${n}?`;
      q.choices = numChoices(a, [n * (n + 1), n * (n - 1), a + 1, n + n]);
      q.teach = { html:arrayPicture(n, n),
        say:`${n} squared is ${a}. It makes a perfect square.`,
        text:`${n} × ${n} = <b>${a}</b> — a square number, ${n} rows of ${n}.` };
      return q;
    }

    /* ---- 3.NF.A.1 · naming a fraction ---- */
    case 'fracName': {
      const gcd = (x, y) => y ? gcd(y, x % y) : x;
      const den = pick([2, 3, 4, 6, 8]);
      let num; do { num = ri(1, den - 1); } while (gcd(num, den) !== 1);
      q.answer = `${num}/${den}`; q.text = true;
      q.ask = 'Which fraction is shaded?';
      q.speak = 'Which fraction is shaded?';
      q.visual = fracBar(num, den);
      const opts = new Set([q.answer, `${den}/${num}`, `${num}/${den - num}`, `${num + 1}/${den}`, `${num}/${den + 1}`]);
      q.choices = shuffle([...opts].slice(0, 4)).map(v => ({ value:v, label:v }));
      q.teach = { html:fracBar(num, den),
        say:`The bar is split into ${den} equal parts and ${num} are shaded. That is ${num} over ${den}.`,
        text:`Bottom = how many <b>equal parts altogether</b> (${den}). Top = how many are <b>shaded</b> (${num}).` };
      return q;
    }
    /* ---- 4.NF.A.1 · equivalent fractions ---- */
    case 'fracEq': {
      /* 3.NF.A.3b keeps equivalents inside halves, thirds, quarters, sixths, eighths */
      const [den, k] = pick([[2, 2], [2, 3], [2, 4], [3, 2], [4, 2]]);
      const num = ri(1, den - 1);
      const a = num * k;
      q.answer = a;
      q.ask = `<span class="big">${num}/${den}</span> = <span class="big">?/${den * k}</span>`;
      q.speak = `${num} over ${den} is the same as how many over ${den * k}?`;
      q.visual = fracBar(num, den);
      q.choices = numChoices(a, [a + 1, a - 1, num + k, den * k - a]);
      q.teach = { html:twoBars(num, den, a, den * k),
        say:`The bottom was multiplied by ${k}, so the top is multiplied by ${k} too. ${num} times ${k} is ${a}.`,
        text:`The bottom went × ${k}, so the top must go <b>× ${k}</b> as well: ${num} × ${k} = <b>${a}</b>. Same amount, more pieces.` };
      return q;
    }
    /* ---- 3.NF.A.3d · comparing fractions ---- */
    case 'fracCmp': {
      let set, ans, mode;
      if (Math.random() < .5) {                       /* same bottom */
        mode = 'den';
        const den = pick([6, 8]);
        const nums = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9].filter(x => x < den)).slice(0, 4);
        if (nums.length < 4) return GEN.g4(id);
        set = nums.map(x => `${x}/${den}`);
        ans = `${Math.max(...nums)}/${den}`;
      } else {                                        /* same top */
        mode = 'num';
        const num = 1;
        const dens = shuffle([2, 3, 4, 6, 8]).slice(0, 4);
        set = dens.map(d => `${num}/${d}`);
        ans = `${num}/${Math.min(...dens)}`;
      }
      q.answer = ans; q.text = true;
      q.ask = 'Which fraction is the <b>biggest</b>?';
      q.speak = 'Which fraction is the biggest?';
      q.choices = shuffle(set).map(v => ({ value:v, label:v }));
      const [an, ad] = ans.split('/').map(Number);
      const other = set.find(x => x !== ans).split('/').map(Number);
      q.teach = { html:twoBars(an, ad, other[0], other[1]),
        say: mode === 'den' ? 'When the bottoms match, the biggest top wins.'
                            : 'When the tops match, the smallest bottom wins, because the pieces are bigger.',
        text: mode === 'den' ? 'Same bottom → the pieces are the same size, so the <b>biggest top</b> wins.'
                             : 'Same top → a <b>bigger bottom means smaller pieces</b>, so the smallest bottom wins.' };
      return q;
    }
    /* ---- a fraction of a set ---- */
    case 'fracSet': {
      const den = pick([2, 3, 4, 6]), m = ri(2, 6), total = den * m;
      q.answer = m;
      q.ask = `<span class="big">1/${den}</span> of <span class="big">${total}</span>`;
      q.speak = `What is one ${den === 2 ? 'half' : den === 3 ? 'third' : den === 4 ? 'quarter' : den === 5 ? 'fifth' : 'sixth'} of ${total}?`;
      q.visual = arrayPicture(den, m);
      q.choices = numChoices(m, [den, total - m, m + 1, Math.round(total / 2)]);
      q.teach = { html:arrayPicture(den, m),
        say:`Share ${total} into ${den} equal rows. Each row has ${m}.`,
        text:`One ${den}th means <b>split into ${den} equal groups</b>: ${total} ÷ ${den} = <b>${m}</b>.` };
      return q;
    }
    /* ---- 3.MD.C.7 and 3.MD.D.8 · area and perimeter ---- */
    case 'area': case 'perim': {
      const w = ri(2, 9), h = ri(2, 8);
      const ar = w * h, pe = 2 * (w + h);
      const isArea = id === 'area';
      q.answer = isArea ? ar : pe;
      q.ask = isArea ? 'What is the <b>area</b>?' : 'What is the <b>perimeter</b>?';
      q.speak = isArea ? 'What is the area of this rectangle?' : 'What is the distance all the way round?';
      q.visual = gridRect(w, h);
      q.choices = numChoices(q.answer, [isArea ? pe : ar, w + h, isArea ? ar + w : pe + 2, isArea ? ar - w : pe - 2]);
      q.teach = { html:gridRect(w, h),
        say: isArea ? `Area is the squares inside. ${w} times ${h} is ${ar}.`
                    : `Perimeter is the fence round the outside. ${w} and ${h} and ${w} and ${h} is ${pe}.`,
        text: isArea ? `<b>Area</b> = the squares <b>inside</b>: ${w} × ${h} = <b>${ar}</b>.`
                     : `<b>Perimeter</b> = the fence <b>around</b>: ${w} + ${h} + ${w} + ${h} = <b>${pe}</b>.` };
      return q;
    }
    /* ---- 3.NBT.A.1 · rounding ---- */
    case 'round10': case 'round100': {
      const to = id === 'round10' ? 10 : 100;
      const n = to === 10 ? ri(23, 989) : ri(105, 989);   /* Grade 3 rounds inside 1000 */
      if (n % to === 0) return GEN.g4(id);
      const a = Math.round(n / to) * to;
      const down = Math.floor(n / to) * to, up = down + to;
      q.answer = a;
      q.ask = `Round <span class="big">${n}</span> to the nearest <b>${to}</b>`;
      q.speak = `Round ${n} to the nearest ${to}.`;
      q.choices = numChoices(a, [a === down ? up : down, Math.round(n / (to * 10)) * to * 10, Math.round(n / (to / 10)) * (to / 10), a + to]);
      q.teach = { html:bigNum(`${down} … <b>${n}</b> … ${up}<br>nearest is <b>${a}</b>`),
        say:`${n} sits between ${down} and ${up}. It is closer to ${a}.`,
        text:`Look at the digit to the <b>right</b> of the ${to === 10 ? 'tens' : 'hundreds'}: 5 or more rounds up, 4 or less stays. → <b>${a}</b>.` };
      return q;
    }
    /* ---- 3.NBT.A.2 · three-digit column arithmetic ---- */
    case 'add1000': case 'sub1000': {
      const add = id === 'add1000';
      let x, y;
      /* a natural mix — not every single one forces a carry or a borrow */
      if (add) { x = ri(105, 699); y = ri(105, 299); }
      else { y = ri(105, 399); x = ri(y + 40, 989); }
      const a = add ? x + y : x - y;
      const cols = v => [Math.floor(v / 100), Math.floor(v / 10) % 10, v % 10];
      const [xh, xt, xo] = cols(x), [yh, yt, yo] = cols(y);
      let noCarry = add ? ((xh + yh) % 10) * 100 + ((xt + yt) % 10) * 10 + (xo + yo) % 10 : null;
      if (noCarry != null && noCarry < a * 0.6) noCarry = null;   /* 679+468 → 37 is not a tempting wrong answer */
      const smallFromLarge = add ? null : Math.abs(xh - yh) * 100 + Math.abs(xt - yt) * 10 + Math.abs(xo - yo);
      q.answer = a;
      q.ask = `<span class="big">${x}</span> ${add ? '+' : '−'} <span class="big">${y}</span>`;
      q.speak = `What is ${x} ${add ? 'add' : 'take away'} ${y}?`;
      q.visual = columnSum(x, y, add ? '+' : '−', true);
      q.choices = numChoices(a, [noCarry, smallFromLarge, a + 100, a - 100, a + 10, a - 10]);
      q.teach = { html:columnSum(x, y, add ? '+' : '−'),
        say: add ? `Ones first, then tens, then hundreds, carrying each time a column goes past ten. The answer is ${a}.`
                 : `Ones first. Where the top digit is too small, borrow from the column on its left. The answer is ${a}.`,
        text: add ? `Ones, then tens, then hundreds — <b>carry</b> every time a column passes ten. The answer is <b>${a}</b>.`
                  : `Where the top digit is smaller, <b>borrow</b> from the left. <b>${a}</b> — never just take the smaller digit from the bigger one (${smallFromLarge}).` };
      return q;
    }
  }
  throw new Error('g4 ' + id);
};
const makeQ = id => GEN[P.bank](id);

/* --------------------------------------------------------- adaptivity */
let repair = [], recent = [];
function chooseSkill(act) {
  for (let i = 0; i < repair.length; i++) if (repair[i].due <= 0) return repair.splice(i, 1)[0].id;
  const ids = ACTS[act].skills;
  const weights = ids.map(id => {
    const st = S.stats[id];
    let w = Math.pow(5.3 - st.str, 1.7) * SKILL[id].w;
    if (st.n === 0) w *= 1.5;
    if (recent.slice(-Math.min(4, ids.length - 1)).includes(id) && ids.length > 2) w *= 0.22;
    return w;
  });
  let r = Math.random() * weights.reduce((x, y) => x + y, 0);
  for (let i = 0; i < ids.length; i++) { r -= weights[i]; if (r <= 0) return ids[i]; }
  return ids[ids.length - 1];
}
function record(id, ok, secs) {
  const st = S.stats[id];
  st.n++; S.seen++;
  if (ok) {
    st.ok++; S.right++;
    const fast = secs <= P.fast;
    if (fast) st.fast++;
    st.str = clamp(st.str + (fast ? 1 : 0.5), 0, 5);
  } else {
    st.str = clamp(st.str - 2, 0, 5);
    repair.push({ id, due:ri(3, 5) });
  }
  repair.forEach(r => r.due--);
  recent.push(id);
}
</script>

let R = null;
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('show', s.id === id));
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function paintTop() {
  $('#bonesLbl').textContent = S.spend;
  $('#houseSub').textContent = `${S.animals.length} animals · ${S.toys.length} toys`;
}
function goHome() { paintTop(); buildMenu(); $('#parkArt').innerHTML = parkSVG(); show('scHome'); }

function buildMenu() {
  const m = $('#actMenu'); m.innerHTML = '';
  ACT_ORDER.filter(k => !hiddenAct(k) || secretOpen()).forEach((k, i) => {
    const A = ACTS[k];
    const b = el('button', 'bigbtn');
    if (k === 'walk' && ACT_ORDER.length % 2 === 1) b.style.gridColumn = '1/-1';
    b.innerHTML = `<span class="glyph" style="background:${A.col}"><svg viewBox="0 0 24 24" fill="none" stroke="#16261F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${GLYPH[A.glyph]}</svg></span>
      <span><b>${A.name}</b><small>${A.sub}</small></span>`;
    b.onclick = () => startRound(k);
    m.appendChild(b);

/* ------------------------------------------------------------- a round */
function paintBuddy() {
  const a = ANIMALS.find(x => x.id === S.active) || ANIMALS[0];
  $('#buddy').innerHTML = animalSVG(a, { wear:S.outfits[a.id] || {} });
}
function startRound(act) { R = { act, i:0, right:0, earned:0, marks:[] }; paintBuddy(); show('scPlay'); nextQ(); }
function pips() {
  const p = $('#pips'); p.innerHTML = '';
  for (let i = 0; i < P.round; i++)
    p.appendChild(el('div', i < R.marks.length ? (R.marks[i] ? 'pip ok' : 'pip no') : (i === R.i ? 'pip now' : 'pip')));
}
function nextQ() {
  if (R.i >= P.round) return endRound();
  pips();
  const id = chooseSkill(R.act), q = makeQ(id);
  R.q = q; R.t0 = performance.now(); R.hinted = false;
  $('#ask').innerHTML = q.ask;
  const vis = $('#visual');
  vis.classList.remove('teaching');
  vis.innerHTML = q.visual;
  const box = $('#answers'); box.innerHTML = '';
  const wide = q.choices.some(c => String(c.label).length > 4);
  q.choices.forEach(c => {
    const b = el('button', 'ans' + (wide ? ' word' : ''), c.label);
    b.onclick = () => answer(b, c.value);
    box.appendChild(b);
  });
  say(q.speak);
  clearTimeout(nextQ._h);
  nextQ._h = setTimeout(() => {
    if (R && R.q === q && !R.hinted && HINTS[id]) {
      R.hinted = true;
      const h = el('p', 'hint', HINTS[id]); h.style.margin = '4px 0 0';
      $('#visual').appendChild(h);
    }
  }, 15000);
}
function answer(btn, v) {
  clearTimeout(nextQ._h);
  const q = R.q, secs = (performance.now() - R.t0) / 1000, ok = v === q.answer;
  document.querySelectorAll('#answers .ans').forEach(b => { b.disabled = true; if (b !== btn) b.classList.add('dim'); });
  record(q.skill, ok, secs);
  R.marks.push(ok); R.i++;
  if (ok) {
    btn.classList.remove('dim'); btn.classList.add('right', 'pop');
    R.right++; R.earned += PER_RIGHT; S.lifetime += PER_RIGHT; S.spend += PER_RIGHT;
    paintTop(); save(); pips();
    const bud = $('#buddy'); bud.classList.remove('pop'); void bud.offsetWidth; bud.classList.add('pop');
    say(pick(['Yes!', 'Good one!', 'That’s it!', 'Nice work!', 'Spot on!']));
    setTimeout(nextQ, 700);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('#answers .ans').forEach(b => {
      if (String(b.textContent) === String(q.answer)) { b.classList.remove('dim'); b.classList.add('right'); }
    });
    save(); pips();
    const t = el('div', 'teach');
    t.innerHTML = `<div style="width:100%">${q.teach.html}</div><p>${q.teach.text}</p>`;
    const vis = $('#visual');
    vis.innerHTML = ''; vis.classList.add('teaching'); vis.appendChild(t);
    vis.scrollTop = 0;
    $('#ask').innerHTML = `The answer is <span class="big">${q.answer}</span>`;
    const box = $('#answers'); box.innerHTML = '';
    const go = el('button', 'cta full', 'Got it — keep going');
    go.onclick = () => nextQ();
    box.appendChild(go);
    go.focus({ preventScroll:true });
    say(q.teach.say);
  }
}
/* fires once, the first time the park is finished */
function checkSecret(stage) {
  if (!SKILLS.some(s => hiddenAct(s.act)) || !secretOpen() || S.secretSeen) return false;
  S.secretSeen = 1; save();
  const c = el('div', 'teach');
  c.style.background = '#F3D779';
  c.innerHTML = `<p style="font-size:1.15rem">You finished the whole park!</p>
    <div style="width:110px;margin:0 auto">${toyArt('chest')}</div>
    <p>A secret gate has opened: <b>${ACTS.secret.name}</b>.<br>
    <span style="font-weight:400">Every times table, backwards.</span></p>`;
  if (stage) stage.appendChild(c);
  say('You finished the whole park! A secret gate has opened. Division!');
  return true;
}
function checkToys() {
  const won = [];
  TOYS.forEach(t => { if (!S.toys.includes(t.id) && t.test(S)) { S.toys.push(t.id); won.push(t); } });
  return won;
}
function endRound() {
  S.rounds++;
  const perfect = R.right === P.round;
  if (perfect) { R.earned += PERFECT_BONUS; S.lifetime += PERFECT_BONUS; S.spend += PERFECT_BONUS; S.perfect++; }
  const a = ANIMALS.find(x => x.id === S.active) || ANIMALS[0];
  S.joy[a.id] = clamp((S.joy[a.id] == null ? 70 : S.joy[a.id]) + 6, 60, 100);
  const newAnimals = ANIMALS.filter(x => !S.animals.includes(x.id) && S.lifetime >= x.cost);
  newAnimals.forEach(x => S.animals.push(x.id));
  const newToys = checkToys();
  save(); paintTop();

  const stage = $('#endStage'); stage.innerHTML = '';
  stage.appendChild(el('h2', 'display', `${R.right} out of ${P.round}`));
  const box = el('div', 'dogbox pop');
  box.innerHTML = animalSVG(a, { wear:S.outfits[a.id] || {} });
  stage.appendChild(box);
  const e = el('p', 'display'); e.style.cssText = 'font-size:1.55rem;margin:0';
  e.textContent = `+${R.earned} bones`; stage.appendChild(e);
  if (perfect) stage.appendChild(el('p', 'hint', `every single one right — ${PERFECT_BONUS} bonus bones`));
  else if (R.right) stage.appendChild(el('p', 'hint', `${R.right} × ${PER_RIGHT} bones. A whole round right is worth ${PERFECT_BONUS} more.`));
  newAnimals.forEach(x => {
    const c = el('div', 'teach');
    c.innerHTML = `<p>A new friend! <b>${x.name}</b> the ${x.species}</p><div class="dogbox">${animalSVG(x, {})}</div>`;
    stage.appendChild(c);
  });
  newToys.forEach(t => {
    const c = el('div', 'teach');
    c.innerHTML = `<p>New toy for the shelf: <b>${t.name}</b></p><div style="width:96px;margin:0 auto">${toyArt(t.id)}</div><p style="font-weight:400;font-size:.9rem">for ${t.how}</p>`;
    stage.appendChild(c);
  });
  const opened = checkSecret(stage);
  if (!newAnimals.length && !newToys.length && !opened) {
    const next = ANIMALS.find(x => !S.animals.includes(x.id));
    if (next) stage.appendChild(el('p', 'hint', `${next.cost - S.lifetime} more bones to meet ${next.name}`));
    say(`${R.right} out of ${P.round}. You earned ${R.earned} bones.`);
  } else {
    say([].concat(newAnimals.map(x => `You unlocked ${x.name}`), newToys.map(t => `You won the ${t.name}`)).join('. ') + '!');
  }
  show('scEnd');
}

/* ------------------------------------------------------------ the house */
function renderHouse() {
  const b = $('#houseBody'); b.innerHTML = '';
  const a = ANIMALS.find(x => x.id === S.active) || ANIMALS[0];
  const joy = S.joy[a.id] == null ? 70 : S.joy[a.id];

  const room = el('div', 'roomwrap'); room.innerHTML = roomSVG(); b.appendChild(room);

  const p = el('div', 'panel');
  p.innerHTML = `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div style="flex:0 0 150px">${animalSVG(a, { wear:S.outfits[a.id] || {} })}</div>
    <div style="flex:1 1 180px"><h3 style="margin:0">${a.name}</h3>
      <p style="margin:2px 0 8px">${a.species} · likes ${FOODS[a.food].name}</p>
      <div class="bar" style="height:16px"><i style="width:${joy}%"></i></div>
      <small style="color:var(--ink-soft)">${joy >= 95 ? 'Absolutely delighted' : joy >= 85 ? 'Over the moon' : joy >= 72 ? 'Very happy' : 'Happy, pottering about'}</small>
    </div></div>`;
  const row = el('div', 'rowbtns'); row.style.marginTop = '10px';
  CARE.forEach(c => {
    const label = c.id === 'feed' ? `Feed ${FOODS[a.food].name} · ${c.cost}` : c.cost ? `${c.name} · ${c.cost}` : `${c.name} · free`;
    const btn = el('button', 'cta alt', label);
    btn.onclick = () => {
      if (S.spend < c.cost) return toast('Not enough bones yet');
      S.spend -= c.cost;
      S.joy[a.id] = clamp(joy + c.joy, 60, 100);
      save(); paintTop(); renderHouse(); toast(`${a.name} ${c.verb}`);
    };
    row.appendChild(btn);
  });
  p.appendChild(row);
  b.appendChild(p);

  const ownedWear = WEAR.filter(w => S.wear.includes(w.id));
  if (ownedWear.length) {
    b.appendChild(el('div', 'sectionhead', `<h2>Dress ${a.name}</h2><span>tap to try it on</span>`));
    const g = el('div', 'grid');
    ['hat', 'glasses', 'neck', 'outfit'].forEach(slot => ownedWear.filter(w => w.slot === slot).forEach(w => {
      const on = (S.outfits[a.id] || {})[slot] === w.id;
      const fits = !(a.kind === 'sea' && (slot === 'neck' || slot === 'outfit')) && !(a.kind === 'bird' && slot === 'outfit');
      const c = el('button', 'card' + (on ? ' sel' : ''));
      const shown = Object.assign({}, S.outfits[a.id] || {});
      if (fits) shown[slot] = w.id;
      c.innerHTML = `<div class="shot">${animalSVG(fits ? a : ANIMALS[0], { wear:fits ? shown : { [slot]:w.id } })}</div>
        <b>${w.name}</b><small>${!fits ? 'not for ' + a.name : on ? 'wearing' : 'tap to wear'}</small>`;
      c.onclick = () => {
        if (!fits) return toast(`That does not fit ${a.name}`);
        S.outfits[a.id] = S.outfits[a.id] || {};
        if (on) delete S.outfits[a.id][slot]; else S.outfits[a.id][slot] = w.id;
        save(); renderHouse();
      };
      g.appendChild(c);
    }));
    b.appendChild(g);
  }

  b.appendChild(el('div', 'sectionhead', `<h2>Toy shelf</h2><span>${S.toys.length} of ${TOYS.length} won</span>`));
  const tg = el('div', 'grid tight');
  TOYS.forEach(t => {
    const has = S.toys.includes(t.id);
    const c = el('div', 'card' + (has ? '' : ' locked'));
    c.innerHTML = `<div class="${has ? '' : 'silhouette'}" style="width:70px">${toyArt(t.id)}</div>
      <b>${has ? t.name : '???'}</b><small>${t.how}</small>`;
    tg.appendChild(c);
  });
  b.appendChild(tg);
  b.appendChild(el('p', 'hint', 'Toys can only be won, never bought.'));

  b.appendChild(el('div', 'sectionhead', `<h2>All animals</h2><span>${S.animals.length} of ${ANIMALS.length}</span>`));
  const g = el('div', 'grid');
  ANIMALS.forEach(x => {
    const have = S.animals.includes(x.id);
    const c = el('button', 'card' + (have ? (x.id === S.active ? ' sel' : '') : ' locked'));
    c.innerHTML = `<div class="${have ? '' : 'silhouette'}" style="width:100%">${animalSVG(x, { wear:have ? (S.outfits[x.id] || {}) : {} })}</div>
      <b>${have ? x.name : '???'}</b><small>${have ? x.species : `${Math.max(0, x.cost - S.lifetime)} more bones`}</small>`;
    c.onclick = () => {
      if (!have) return toast(`Answer more questions to meet ${x.name}`);
      S.active = x.id; save(); renderHouse(); toast(`${x.name} is out and about`);
    };
    g.appendChild(c);
  });
  b.appendChild(g);
  b.appendChild(el('p', 'hint', 'Animals can only be earned by doing maths — never bought.'));
  show('scHouse');
}

/* ---------------------------------------------------------------- shop */
function renderShop() {
  const box = $('#shopBody'); box.innerHTML = '';
  const active = ANIMALS.find(x => x.id === S.active) || ANIMALS[0];
  const fits = (slot, an) => !(an.kind === 'sea' && (slot === 'neck' || slot === 'outfit')) && !(an.kind === 'bird' && slot === 'outfit');
  const modelFor = slot => fits(slot, active) ? active : ANIMALS[0];

  box.appendChild(el('p', 'hint', `${S.spend} bones to spend. Everything here is just for fun — none of it changes the maths.`));

  const priceTag = c => `<span class="price">${c} <svg viewBox="0 0 40 20" width="24" height="13"><g stroke="${INK}" stroke-width="2.6" fill="#F3E7D0"><path d="M8 6a4 4 0 1 0-3 6.6A4 4 0 1 0 12 15h16a4 4 0 1 0 7-2.4A4 4 0 1 0 28 5H12a4 4 0 0 0-4 1z"/></g></svg></span>`;

  const section = (title, note, items, pic, owned, onBuy) => {
    box.appendChild(el('div', 'sectionhead', `<h2>${title}</h2><span>${note}</span>`));
    const g = el('div', 'grid');
    items.forEach(it => {
      const has = owned.includes(it.id);
      const c = el('button', 'card' + (has ? ' owned' : ''));
      c.innerHTML = `<div class="shot">${pic(it)}</div><b>${it.name}</b>${has ? '<small>bought</small>' : priceTag(it.cost)}`;
      c.onclick = () => {
        if (has) return toast('Already yours');
        if (S.spend < it.cost) return toast(`${it.cost - S.spend} more bones needed`);
        S.spend -= it.cost; onBuy(it); save(); paintTop();
        if (secretOpen() && !S.secretSeen) {
          S.secretSeen = 1; save(); goHome();
          toast('The park is finished — a secret gate has opened!');
          say('You finished the whole park! A secret gate has opened. Division!');
          return;
        }
        renderShop(); toast(`Bought ${it.name}`);
      };
      g.appendChild(c);
    });
    box.appendChild(g);
  };

  const slots = [['hat', 'Hats', 'shown on ' + modelFor('hat').name],
                 ['glasses', 'Glasses', 'shown on ' + modelFor('glasses').name],
                 ['neck', 'Collars and scarves', 'shown on ' + modelFor('neck').name],
                 ['outfit', 'Outfits', 'shown on ' + modelFor('outfit').name]];
  slots.forEach(([slot, title, note]) => {
    const model = modelFor(slot);
    section(title, note, WEAR.filter(w => w.slot === slot),
      it => animalSVG(model, { wear:{ [slot]:it.id } }), S.wear, it => S.wear.push(it.id));
  });
  section('Things for the park', 'they appear behind everything', PARKS,
    it => `<svg viewBox="0 0 120 120">${(PARKART[it.id] || (() => ''))()}</svg>`, S.parks, it => S.parks.push(it.id));
  show('scShop');
}

  b.appendChild(p4);

  const reset = el('button', 'cta alt', 'Start the park again');
  reset.style.marginTop = '10px';
  reset.onclick = () => { if (confirm('Erase all progress and start again?')) { S = fresh(); save(); goHome(); } };
  b.appendChild(reset);
  show('scGrown');
}

/* ---------------------------------------------------------------- boot */
buildMenu();
$('#btnHouse').onclick = renderHouse;
$('#btnShop').onclick = renderShop;
$('#btnHome').onclick = goHome;
$('#btnGrown').onclick = renderGrown;
$('#btnBack').onclick = goHome;
$('#btnAgain').onclick = () => startRound(R ? R.act : ACT_ORDER[0]);
$('#btnSound').onclick = () => {
  S.sound = !S.sound; save();
  $('#btnSound').classList.toggle('on', S.sound);
  $('#btnSound').setAttribute('aria-pressed', String(S.sound));
  if (!S.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
  else if (R && R.q) say(R.q.speak);
  toast(S.sound ? 'Reading out loud is on' : 'Reading out loud is off');
};
$('#btnSound').classList.toggle('on', S.sound);
$('#btnSound').setAttribute('aria-pressed', String(S.sound));
document.addEventListener('keydown', e => {
  if (!$('#scPlay').classList.contains('show')) return;
  const go = document.querySelector('#answers .cta.full');
  if (go) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go.click(); } return; }
  const i = '1234'.indexOf(e.key);
  if (i >= 0) { const b = document.querySelectorAll('#answers .ans')[i]; if (b && !b.disabled) b.click(); }
});
(function daily() {
  const d = today();
  if (S.lastDay !== d) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak = (S.lastDay === y) ? S.streak + 1 : 1;
    S.bestStreak = Math.max(S.bestStreak || 0, S.streak);
    S.lastDay = d;
    /* the streak is tracked because two toys are earned by it, but
       turning up is not itself worth any bones */
    checkToys(); save();
    setTimeout(() => toast(`Welcome back ${P.name}!`), 700);
  }
})();
checkToys();
goHome();
if (!STORAGE_OK) setTimeout(() => toast('Heads up: this browser is not saving progress'), 2600);
</script>
