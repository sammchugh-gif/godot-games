<body>
<title>Dylan's Bones Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* ---------- Ten Bones Park -------------------------------------------
   One codebase, three children. The ONLY difference between the three
   published files is the CHILD constant near the top of the script.
   Visual world: enamelled playground signage — flat colour, thick ink
   outlines, hard offset shadows. Committed to a single daylight theme
   on purpose; every colour is painted explicitly so the page holds on
   any host ground.
   -------------------------------------------------------------------- */
:root{
  --ink:#16261F;
  --ink-soft:#4B6B5D;
  --ground:#E4EEE5;
  --paper:#FFFDF6;
  --grass:#4CA36B;
  --grass-deep:#2F6B45;
  --sky:#BFE3F2;
  --sky-deep:#4A9BCB;
  --sun:#F6BE4A;
  --ball:#E4572E;
  --plum:#7A4FA3;
  --bone:#F3E7D0;
  --sea:#5FBFD6;
  --good:#3E9B63;
  --bad:#D2483A;
  --r:18px;
  --edge:3px;
  --shadow:0 4px 0 var(--ink);
  --shadow-lg:0 6px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Andika","Trebuchet MS",system-ui,sans-serif;
  font-size:17px;line-height:1.45;overscroll-behavior:none;
}
h1,h2,h3,.display,.num{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--plum);outline-offset:3px}

#app{
  max-width:860px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;padding:10px 12px 16px;gap:10px;
}
.topbar{display:flex;align-items:center;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:7px;background:var(--paper);
  border:var(--edge) solid var(--ink);border-radius:999px;padding:6px 14px 6px 8px;
  box-shadow:var(--shadow);
}
.chip .num{font-size:1.2rem;line-height:1}
.iconbtn{
  width:46px;height:46px;flex:0 0 auto;display:grid;place-items:center;background:var(--paper);
  border:var(--edge) solid var(--ink);border-radius:14px;box-shadow:var(--shadow);
  transition:transform .08s,box-shadow .08s;
}
.iconbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.iconbtn.on{background:var(--sun)}
.spacer{flex:1}

.screen{display:none;flex:1;flex-direction:column;gap:10px;min-height:0}
.screen.show{display:flex}
#scHome{overflow:hidden}
#scHome .menu{flex:1 1 auto;align-content:center}
#scHome .menu:last-of-type{flex:0 0 auto}
#scHome .bigbtn{height:100%;min-height:72px;max-height:112px}
#scPlay,#scEnd{overflow:hidden}
#scEnd .stage{overflow-y:auto;max-height:none;justify-content:flex-start;gap:6px}
#scEnd .stage h2{margin:2px 0 0;font-size:clamp(1.6rem,5vw,2.4rem)}
.scroller{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding-bottom:10px}

.park{
  flex:1 1 auto;min-height:140px;max-height:32vh;position:relative;border:var(--edge) solid var(--ink);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-lg);background:var(--sky);
}
.park svg{display:block;width:100%;height:100%}
.park .tail{animation:sway 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:80% 80%}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{
  display:flex;align-items:center;gap:11px;text-align:left;background:var(--paper);
  border:var(--edge) solid var(--ink);border-radius:var(--r);padding:12px;
  box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;
}
.bigbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.bigbtn .glyph{
  width:54px;height:54px;flex:0 0 auto;border-radius:14px;border:var(--edge) solid var(--ink);
  display:grid;place-items:center;background:var(--sun);
}
.bigbtn .glyph svg{width:34px;height:34px;display:block}
.bigbtn b{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.22rem;font-weight:800;display:block;line-height:1.1}
.bigbtn small{color:var(--ink-soft);font-size:.85rem;display:block}
.bigbtn.locked{opacity:.5}

.stage{
  background:var(--paper);border:var(--edge) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow-lg);padding:14px;display:flex;flex-direction:column;gap:10px;
  align-items:center;justify-content:center;flex:1 1 auto;min-height:0;max-height:58vh;
}
.ask{font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:clamp(1.25rem,3.2vw,1.95rem);text-align:center;line-height:1.2;margin:0}
.ask .big{font-size:clamp(2.1rem,6.6vw,3.4rem);display:inline-block;vertical-align:-4px;font-variant-numeric:tabular-nums}
.visual{width:100%;flex:1;min-height:70px;display:grid;place-items:center;overflow:hidden}
.visual.teaching{overflow-y:auto;place-items:start center;padding-right:2px}
.visual svg{width:100%;height:auto;max-height:100%;display:block}
.playtop{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.buddy{width:clamp(64px,16vw,110px);flex:0 0 auto;transform-origin:50% 90%}
.buddy svg{width:100%;height:auto;display:block}
.progress{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;flex:1}
.pip{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper)}
.pip.ok{background:var(--good)}
.pip.no{background:var(--bad)}
.pip.now{background:var(--sun)}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto}
.ans{
  background:var(--paper);border:var(--edge) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);padding:12px 8px;min-height:clamp(70px,11vh,124px);
  font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;
  font-size:clamp(1.7rem,5vw,3rem);font-variant-numeric:tabular-nums;
  display:grid;place-items:center;transition:transform .08s,box-shadow .08s,background .15s;
}
.ans:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.ans.word{font-size:clamp(1.2rem,3.4vw,1.9rem)}
.ans.right{background:var(--good);color:#fff}
.ans.wrong{background:var(--bad);color:#fff}
.ans.dim{opacity:.45}

.teach{
  background:var(--sun);border:var(--edge) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;
}
.teach p{margin:0;text-align:center;font-size:1.02rem;font-weight:700}
.teach{width:100%}
#answers .cta.full{grid-column:1/-1;min-height:clamp(64px,9vh,96px);font-size:1.4rem}
.teach svg{max-width:100%;height:auto}
.cta{
  background:var(--grass);color:#fff;border:var(--edge) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);padding:11px 24px;font-family:"Baloo 2",system-ui,sans-serif;
  font-weight:800;font-size:1.22rem;transition:transform .08s,box-shadow .08s;
}
.cta:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.cta.alt{background:var(--paper);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.card{
  background:var(--paper);border:var(--edge) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--shadow);padding:9px;display:flex;flex-direction:column;gap:5px;
  align-items:center;text-align:center;transition:transform .08s,box-shadow .08s;
}
button.card:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.card svg{width:100%;height:auto;display:block}
.card .shot{width:100%;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;background:#F3F8F3;border-radius:12px;border:2px solid #CBD9CC}
.card .shot svg{max-height:100%}
.card b{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.02rem;line-height:1.1}
.card small{color:var(--ink-soft);font-size:.78rem;line-height:1.2}
.card .price{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.92rem}
.card.locked{background:#DCE6DD}
.card.locked .silhouette{filter:brightness(0) opacity(.22)}
.card.sel{background:var(--sun)}
.card.owned{background:#DCEEE1}
.sectionhead{display:flex;align-items:baseline;gap:10px;margin:6px 2px 2px}
.sectionhead h2{font-size:1.28rem;margin:0}
.sectionhead span{color:var(--ink-soft);font-size:.88rem}
.hint{color:var(--ink-soft);font-size:.88rem;text-align:center;margin:6px 0 0}

.roomwrap{border:var(--edge) solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-lg);flex:0 0 auto}
.roomwrap svg{display:block;width:100%;height:auto}
.dogbox{width:min(300px,62%);margin:0 auto}
.dogbox svg{width:100%;height:auto;display:block}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rowbtns .cta{font-size:1rem;padding:9px 16px}

#toast{
  position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-160%);
  background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font-weight:700;
  box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .28s;z-index:50;max-width:92vw;text-align:center;
}
#toast.up{transform:translateX(-50%) translateY(0)}

.gtable{width:100%;border-collapse:collapse;font-size:.93rem}
.gtable th,.gtable td{text-align:left;padding:6px 8px;border-bottom:2px solid #D3DFD4}
.gtable th{font-family:"Baloo 2",system-ui,sans-serif;font-size:.93rem}
.gtable td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;background:var(--grass)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:9px}
.tile{background:var(--paper);border:var(--edge) solid var(--ink);border-radius:var(--r);padding:9px 12px;box-shadow:var(--shadow)}
.tile .k{font-family:"Baloo 2",system-ui,sans-serif;font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{color:var(--ink-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--paper);border:var(--edge) solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-top:10px}
.panel h3{margin:0 0 6px;font-size:1.08rem}
.panel p{margin:0 0 8px;font-size:.9rem;color:var(--ink-soft)}
.warn{background:#FBE0DC;border-color:var(--bad)}
.warn h3{color:var(--bad)}

@media (max-width:430px){
  .bigbtn{padding:10px;gap:8px}
  .bigbtn .glyph{width:46px;height:46px}
  .bigbtn b{font-size:1.08rem}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .32s ease-out}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes swim{0%{transform:translateX(0)}50%{transform:translateX(26px)}100%{transform:translateX(0)}}
.swimmer{animation:swim 6s ease-in-out infinite}
</style>

<div id="app">
  <div class="topbar">
    <button class="iconbtn" id="btnHome" aria-label="Go to the park">
      <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#16261F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    </button>
    <div class="chip" title="Bones to spend">
      <svg viewBox="0 0 40 20" width="32" height="17" aria-hidden="true"><g stroke="#16261F" stroke-width="2.4" fill="#F3E7D0"><path d="M8 6a4 4 0 1 0-3 6.6A4 4 0 1 0 12 15h16a4 4 0 1 0 7-2.4A4 4 0 1 0 28 5H12a4 4 0 0 0-4 1z"/></g></svg>
      <span class="num" id="bonesLbl">0</span>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn on" id="btnSound" aria-label="Read the question out loud" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#16261F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <button class="iconbtn" id="btnGrown" aria-label="Grown-ups">
      <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#16261F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg>
    </button>
  </div>

  <section class="screen show" id="scHome">
    <div class="park" id="parkArt"></div>
    <div class="menu" id="actMenu"></div>
    <div class="menu">
      <button class="bigbtn" id="btnHouse">
        <span class="glyph" style="background:#F0C9A0"><svg viewBox="0 0 24 24" fill="none" stroke="#16261F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-5h5v5"/></svg></span>
        <span><b>My House</b><small id="houseSub">animals and toys</small></span>
      </button>
      <button class="bigbtn" id="btnShop">
        <span class="glyph" style="background:#DCEEE1"><svg viewBox="0 0 24 24" fill="none" stroke="#16261F" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h16l-1.5 11h-13z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg></span>
        <span><b>Shop</b><small>hats, coats, park things</small></span>
      </button>
    </div>
  </section>

  <section class="screen" id="scPlay">
    <div class="playtop">
      <div class="buddy" id="buddy" aria-hidden="true"></div>
      <div class="progress" id="pips"></div>
    </div>
    <div class="stage">
      <p class="ask" id="ask"></p>
      <div class="visual" id="visual"></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <section class="screen" id="scEnd">
    <div class="stage" id="endStage"></div>
    <div class="menu">
      <button class="cta" id="btnAgain">Play again</button>
      <button class="cta alt" id="btnBack">Back to the park</button>
    </div>
  </section>

  <section class="screen" id="scHouse"><div class="scroller" id="houseBody"></div></section>
  <section class="screen" id="scShop"><div class="scroller" id="shopBody"></div></section>
  <section class="screen" id="scGrown"><div class="scroller" id="grownBody"></div></section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   BONES PARK — one engine, three children.
   The only line that differs between the three published files is the
   CHILD constant immediately below. Everything else — art, economy,
   adaptive engine, house, shop — is shared, so a fix in one is a fix
   in all three.
   ===================================================================== */
const CHILD = "dylan";

const PROFILES = {
  dylan:  { name:'Dylan',  grade:'Grade 1', round:8,  key:'bonesPark.dylan.v2',
            bank:'g1', fast:5.0,
            blurb:'tens and ones, counting in tens, ten more and ten less' },
  rory:   { name:'Rory',   grade:'Grade 2', round:10, key:'bonesPark.rory.v2',
            bank:'g2', fast:4.6,
            blurb:'facts to 20, adding within 100, hundreds tens and ones' },
  sophia: { name:'Sophia', grade:'Grade 4', round:10, key:'bonesPark.sophia.v2',
            bank:'g4', fast:4.6,
            blurb:'times tables, 2 to 12' }
};
const P = PROFILES[CHILD];
/* Bones are earned for correct answers only. There is no payment for
   finishing a round and none for opening the app — the one bonus is for
   getting every question in a round right. */
const PER_RIGHT = 20, PERFECT_BONUS = 50;

/* ---------------------------------------------------------------- util */
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const today = () => new Date().toISOString().slice(0, 10);

/* ------------------------------------------------------------- animals
   30 to collect. Costs are LIFETIME bones, so nothing bought in the shop
   can ever slow the collection down. kind picks the renderer; food and
   habitat drive the house. */
const ANIMALS = [
  { id:'biscuit', name:'Biscuit', species:'golden retriever', cost:0,     kind:'quad', food:'bone', tongue:1,   body:'#E3B274', patch:'#C9924F', ear:'floppy', tail:'plume', fluff:2 },
  { id:'zoe',     name:'Zoe',     species:'lagotto romagnolo',cost:160,   kind:'quad', food:'bone',   body:'#F6F1E6', patch:'#A97A52', ear:'floppy', tail:'curl',  fluff:3, spots:1 },
  { id:'sooty',   name:'Sooty',   species:'black cat',        cost:340,   kind:'quad', food:'fish',   body:'#3A3A42', patch:'#2A2A31', ear:'cat',    tail:'whip',  fluff:1, cat:1 },
  { id:'clover',  name:'Clover',  species:'rabbit',           cost:530,   kind:'quad', food:'carrot', body:'#EDE6DA', patch:'#C2AE96', ear:'lop',    tail:'puff',  fluff:1, small:1 },
  { id:'nacho',   name:'Nacho',   species:'corgi',            cost:750,   kind:'quad', food:'bone', tongue:1,   body:'#DE9B4E', patch:'#FBF3E6', ear:'perk',   tail:'stub',  fluff:1, low:1 },
  { id:'pickle',  name:'Pickle',  species:'guinea pig',       cost:980,   kind:'quad', food:'carrot', body:'#C98A55', patch:'#F5EDE0', ear:'fold',   tail:'none',  fluff:0, small:1, spots:1 },
  { id:'ginger',  name:'Ginger',  species:'tabby cat',        cost:1230,  kind:'quad', food:'fish',   body:'#E09A52', patch:'#B7702F', ear:'cat',    tail:'whip',  fluff:1, cat:1, stripes:1 },
  { id:'splash',  name:'Splash',  species:'duck',             cost:1500,  kind:'bird', food:'seed',   body:'#F7F2E6', patch:'#E3D8C2', beak:'flat',  legs:'web',  crest:0 },
  { id:'pepper',  name:'Pepper',  species:'dalmatian',        cost:1780,  kind:'quad', food:'bone',   body:'#FBF7EF', patch:'#2B2B2B', ear:'floppy', tail:'whip',  fluff:0, spots:2 },
  { id:'quill',   name:'Quill',   species:'hedgehog',         cost:2090,  kind:'quad', food:'leaf',   body:'#D8B98F', patch:'#6E5238', ear:'fold',   tail:'none',  fluff:0, small:1, low:1, spiky:1 },
  { id:'tilly',   name:'Tilly',   species:'sheep',            cost:2410,  kind:'quad', food:'hay',    body:'#F7F3EA', patch:'#3A3A42', ear:'lop',    tail:'puff',  fluff:3 },

}

<script>
"use strict";
/* ===================================================================
   ART — everything is drawn in SVG; nothing is loaded from anywhere.
   =================================================================== */
const INK = '#16261F';

function bone(cx, cy, s, fill) {
  s = s || 1; fill = fill || '#F3E7D0';
  const w = 7 * s, r = 2.6 * s, h = 2 * s, sw = (1.6 * s).toFixed(2);
  return `<g stroke="${INK}" stroke-width="${sw}" fill="${fill}" stroke-linejoin="round">
    <circle cx="${cx - w}" cy="${cy - r}" r="${r}"/><circle cx="${cx - w}" cy="${cy + r}" r="${r}"/>
    <circle cx="${cx + w}" cy="${cy - r}" r="${r}"/><circle cx="${cx + w}" cy="${cy + r}" r="${r}"/>
    <rect x="${cx - w}" y="${cy - h}" width="${w * 2}" height="${h * 2}" rx="${h}"/></g>`;
}

/* a bag = ten bones, drawn as a visible ten-frame so "ten" is shown */
function bag(x, y) {
  const px = x + 11, py = y + 33, cw = 9.2, ch = 11;
  let cells = '', bones = '';
  for (let i = 0; i < 10; i++) {
    const c = i % 5, r = (i / 5) | 0;
    cells += `<rect x="${(px + c * cw).toFixed(2)}" y="${(py + r * ch).toFixed(2)}" width="${cw}" height="${ch}" fill="none" stroke="${INK}" stroke-width="1"/>`;
    bones += bone(px + c * cw + cw / 2, py + r * ch + ch / 2, 0.3, '#FBF3E6');
  }
  return `<g>
    <path d="M${x + 5} ${y + 16} h58 q4 0 4 5 l-4 46 a7 7 0 0 1-7 6 h-44 a7 7 0 0 1-7-6 l-4-46 q0-5 4-5z"
          fill="#E9C892" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M${x + 5} ${y + 16} q7-11 29-11 t29 11 z" fill="#D8B172" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
    <rect x="${px}" y="${py}" width="${cw * 5}" height="${ch * 2}" rx="2" fill="#FFFDF6" stroke="${INK}" stroke-width="1.6"/>
    ${cells}${bones}</g>`;
}

/* a crate = ten bags = one hundred, drawn as a 10 × 10 flat */
function crate(x, y) {
  let cells = '';
  for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++)
    cells += `<rect x="${(x + 8 + c * 6.8).toFixed(1)}" y="${(y + 12 + r * 5.6).toFixed(1)}" width="6.8" height="5.6" fill="${(r + c) % 2 ? '#F0DDB6' : '#E4C68F'}" stroke="${INK}" stroke-width=".6"/>`;
  return `<g>
    <rect x="${x + 4}" y="${y + 8}" width="76" height="64" rx="5" fill="#E9C892" stroke="${INK}" stroke-width="3"/>
    ${cells}
    <rect x="${x + 8}" y="${y + 12}" width="68" height="56" fill="none" stroke="${INK}" stroke-width="2"/>
    <rect x="${x + 4}" y="${y + 8}" width="76" height="64" rx="5" fill="none" stroke="${INK}" stroke-width="3"/></g>`;
}

function looseFrame(ones, x, y) {
  const cw = 34, ch = 31;
  let g = `<rect x="${x}" y="${y}" width="${cw * 5}" height="${ch * 2}" rx="4" fill="#FFFDF6" stroke="${INK}" stroke-width="2.5"/>`;
  for (let i = 0; i < 10; i++) {
    const c = i % 5, r = (i / 5) | 0;
    g += `<rect x="${x + c * cw}" y="${y + r * ch}" width="${cw}" height="${ch}" fill="none" stroke="${INK}" stroke-width="1.4" opacity=".45"/>`;
    if (i < ones) g += bone(x + c * cw + cw / 2, y + r * ch + ch / 2, 1.05);
  }
  return g;
}

/* tens-and-ones picture, 0–99 */
function bagsPicture(n) {
  const tens = Math.floor(n / 10), ones = n % 10;
  const perRow = 5, bw = 68, bh = 78;
  const cols = Math.min(tens, perRow), rows = Math.ceil(tens / perRow) || 0;
  const bagsW = cols * bw, frameW = ones ? 182 : 0;
  const W = Math.max(bagsW + frameW, 160) + 12;
  const H = Math.max(rows * bh, ones ? 74 : 0, 56) + 10;
  let g = '';
  for (let i = 0; i < tens; i++) g += bag(6 + (i % perRow) * bw, 6 + ((i / perRow) | 0) * bh);
  if (ones) g += looseFrame(ones, 6 + bagsW + 8, 8);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tens} bags of ten and ${ones} bones">${g}</svg>`;
}

/* hundreds-tens-ones picture, 0–999 — hundreds on one row, tens and
   ones beneath, so the three sizes stay visibly different */
function pilesPicture(n) {
  const h = Math.floor(n / 100), t = Math.floor(n / 10) % 10, o = n % 10;
  const hCols = Math.min(h, 5), hRows = h ? Math.ceil(h / 5) : 0;
  const row2W = t * 68 + (o ? 190 : 0);
  const W = Math.max(hCols * 88, row2W, 200) + 12;
  const H = hRows * 84 + (t || o ? 86 : 0) + 8;
  let g = '';
  for (let i = 0; i < h; i++) g += crate(6 + (i % 5) * 88, 6 + ((i / 5) | 0) * 84);
  const y2 = hRows * 84 + 2;
  for (let i = 0; i < t; i++) g += bag(6 + i * 68, y2);
  if (o) g += looseFrame(o, 10 + t * 68, y2 + 4);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${h} hundreds, ${t} tens and ${o} ones">${g}</svg>`;
}

/* dot array for a multiplication fact */
function arrayPicture(rows, cols) {
  const s = 22, W = cols * s + 20, H = rows * s + 20;
  let g = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    g += bone(14 + c * s, 14 + r * s, 0.72);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${rows} rows of ${cols}">${g}</svg>`;
}

/* stepping stones for a counting sequence */
function stones(seq, blankIdx) {
  const w = 132, W = seq.length * w + 16, H = 118;
  let g = `<rect x="0" y="88" width="${W}" height="30" fill="#4CA36B"/>`;
  seq.forEach((v, i) => {
    const x = 12 + i * w, blank = i === blankIdx;
    g += `<ellipse cx="${x + 54}" cy="86" rx="54" ry="20" fill="${blank ? '#F6BE4A' : '#CFC5B4'}" stroke="${INK}" stroke-width="3"/>`;
    g += `<text x="${x + 54}" y="96" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="${blank ? 40 : 32}" fill="${INK}">${blank ? '?' : v}</text>`;
    if (i < seq.length - 1) g += `<path d="M${x + 80} 52 q26-30 52 0" fill="none" stroke="${INK}" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
</script>

<script>
"use strict";
/* ===================================================================
   ANIMALS — three renderers behind one interface. Each returns the
   drawing plus a head anchor (hx, hy, hr) and a neck point, so hats,
   glasses and collars are positioned by the same code for a corgi, a
   parrot and a shark.
   =================================================================== */
/* ===================================================================
   ANIMALS — front-facing, sitting, no outlines.
   This is the pose and the flat-fill style from Sophia's original dog
   park, brought across because clothes fit it far better: a symmetric
   head takes a hat squarely, a symmetric chest takes a collar and a
   coat, and nothing has to be re-registered per breed.

   Canvas is 220 × 230. Every renderer returns the drawing plus the
   anchors the wearables need:
     hx, hy, hr  head centre and radius
     ny          the neck line, where a collar sits
     bx, bt, bw  body centre, its top, and its half-width at the chest
   =================================================================== */
const AW = 220, AH = 230;
const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b2 = Math.round((n & 255) * f);
  return '#' + [r, g, b2].map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('');
};
const SHADOW = '<ellipse cx="110" cy="214" rx="72" ry="10" fill="#16261F" opacity=".13"/>';

function faceParts(a, hx, hy, hr) {
  const cream = a.body === '#FFFFFF' ? '#F1EADC' : '#F8F0E2';
  let g = '';
  const mz = hy + hr * 0.50;
  if (a.snout) {
    g += `<ellipse cx="${hx}" cy="${mz}" rx="${hr * .46}" ry="${hr * .34}" fill="${shade(a.patch, 1.05)}"/>
          <ellipse cx="${hx - hr * .17}" cy="${mz}" rx="${hr * .075}" ry="${hr * .1}" fill="${shade(a.patch, .55)}"/>
          <ellipse cx="${hx + hr * .17}" cy="${mz}" rx="${hr * .075}" ry="${hr * .1}" fill="${shade(a.patch, .55)}"/>`;
  } else if (a.beak) {
    g += `<path d="M${hx - hr * .3} ${mz - hr * .12} h${hr * .6} l-${hr * .3} ${hr * .42}z" fill="#E9A13C"/>`;
  } else {
    g += `<ellipse cx="${hx}" cy="${mz}" rx="${hr * .64}" ry="${hr * .5}" fill="${cream}"/>`;
    g += `<ellipse cx="${hx}" cy="${mz - hr * .30}" rx="${hr * .21}" ry="${hr * .17}" fill="${INK}"/>`;
    g += `<path d="M${hx} ${mz - hr * .14} v${hr * .12} M${hx} ${mz - hr * .02} q-${hr * .17} ${hr * .17} -${hr * .30} 0
             M${hx} ${mz - hr * .02} q${hr * .17} ${hr * .17} ${hr * .30} 0"
             stroke="${INK}" stroke-width="${(hr * .062).toFixed(2)}" fill="none" stroke-linecap="round"/>`;
    if (a.tongue) g += `<path d="M${hx - hr * .13} ${mz + hr * .12} h${hr * .26} a${hr * .13} ${hr * .16} 0 0 1 -${hr * .26} 0z" fill="#E8788C"/>`;
    if (a.cat) g += `<g stroke="${INK}" stroke-width="${(hr * .035).toFixed(2)}" stroke-linecap="round" opacity=".8">
      <path d="M${hx - hr * .5} ${mz - hr * .1} h-${hr * .42} M${hx - hr * .5} ${mz + hr * .06} h-${hr * .4}
               M${hx + hr * .5} ${mz - hr * .1} h${hr * .42} M${hx + hr * .5} ${mz + hr * .06} h${hr * .4}"/></g>`;
  }
  const ex = hr * 0.38, ey = hy - hr * 0.18, er = hr * 0.185;
  g += `<circle cx="${hx - ex}" cy="${ey}" r="${er}" fill="${INK}"/><circle cx="${hx + ex}" cy="${ey}" r="${er}" fill="${INK}"/>
        <circle cx="${hx - ex + er * .34}" cy="${ey - er * .36}" r="${er * .36}" fill="#fff"/>
        <circle cx="${hx + ex + er * .34}" cy="${ey - er * .36}" r="${er * .36}" fill="#fff"/>
        <circle cx="${hx - ex - er * .28}" cy="${ey + er * .34}" r="${er * .17}" fill="#fff" opacity=".9"/>
        <circle cx="${hx + ex - er * .28}" cy="${ey + er * .34}" r="${er * .17}" fill="#fff" opacity=".9"/>`;
  if (a.blush !== false) g += `<ellipse cx="${hx - hr * .72}" cy="${hy + hr * .3}" rx="${hr * .19}" ry="${hr * .12}" fill="#F0847E" opacity=".34"/>
        <ellipse cx="${hx + hr * .72}" cy="${hy + hr * .3}" rx="${hr * .19}" ry="${hr * .12}" fill="#F0847E" opacity=".34"/>`;
  return g;
}

function earArt(a, hx, hy, hr) {
  const p = a.patch;
  switch (a.ear) {
    case 'perk': return `<path d="M${hx - hr * .82} ${hy - hr * .38} l-${hr * .1}-${hr * .78} ${hr * .74} ${hr * .40}z" fill="${p}"/>
      <path d="M${hx + hr * .82} ${hy - hr * .38} l${hr * .1}-${hr * .78} -${hr * .74} ${hr * .40}z" fill="${p}"/>`;
    case 'cat': return `<path d="M${hx - hr * .84} ${hy - hr * .34} l-${hr * .06}-${hr * .66} ${hr * .68} ${hr * .34}z" fill="${a.body}"/>
      <path d="M${hx - hr * .74} ${hy - hr * .42} l-${hr * .03}-${hr * .36} ${hr * .38} ${hr * .19}z" fill="#F0A6A8" opacity=".85"/>
      <path d="M${hx + hr * .84} ${hy - hr * .34} l${hr * .06}-${hr * .66} -${hr * .68} ${hr * .34}z" fill="${a.body}"/>
      <path d="M${hx + hr * .74} ${hy - hr * .42} l${hr * .03}-${hr * .36} -${hr * .38} ${hr * .19}z" fill="#F0A6A8" opacity=".85"/>`;
    case 'lop': return `<ellipse cx="${hx - hr * 1.02}" cy="${hy + hr * .40}" rx="${hr * .30}" ry="${hr * .82}" fill="${p}" transform="rotate(16 ${hx - hr * 1.02} ${hy + hr * .40})"/>
      <ellipse cx="${hx + hr * 1.02}" cy="${hy + hr * .40}" rx="${hr * .30}" ry="${hr * .82}" fill="${p}" transform="rotate(-16 ${hx + hr * 1.02} ${hy + hr * .40})"/>`;
    case 'fold': return `<ellipse cx="${hx - hr * .90}" cy="${hy - hr * .16}" rx="${hr * .34}" ry="${hr * .28}" fill="${p}"/>
      <ellipse cx="${hx + hr * .90}" cy="${hy - hr * .16}" rx="${hr * .34}" ry="${hr * .28}" fill="${p}"/>`;
    case 'none': return '';
    default: return `<ellipse cx="${hx - hr * 1.00}" cy="${hy + hr * .18}" rx="${hr * .34}" ry="${hr * .62}" fill="${p}" transform="rotate(10 ${hx - hr * 1.00} ${hy + hr * .18})"/>
      <ellipse cx="${hx + hr * 1.00}" cy="${hy + hr * .18}" rx="${hr * .34}" ry="${hr * .62}" fill="${p}" transform="rotate(-10 ${hx + hr * 1.00} ${hy + hr * .18})"/>`;
  }
}

function tailArt(a, bx, base) {
  const c = shade(a.body, 0.92), p = a.patch;
  const sx = bx + 58, sy = base - 34;
  switch (a.tail) {
    case 'none': return '';
    case 'stub': return `<circle cx="${sx - 2}" cy="${sy + 6}" r="15" fill="${c}"/>`;
    case 'puff': return `<circle cx="${sx + 2}" cy="${sy + 2}" r="18" fill="${p}"/>`;
    case 'curl': return `<path d="M${sx - 6} ${sy + 6} q34 6 30-24 q-4-20-22-12 q-10 6-2 16" fill="none" stroke="${c}" stroke-width="17" stroke-linecap="round"/>`;
    case 'plume': return `<path d="M${sx - 8} ${sy + 10} q40-2 44-46 q2-22-14-24 q-6 20-30 32z" fill="${c}"/>`;
    case 'ring': return `<path d="M${sx - 6} ${sy + 8} q36 2 38-40" fill="none" stroke="${c}" stroke-width="18" stroke-linecap="round"/>
      <path d="M${sx + 12} ${sy + 4} l3-11 M${sx + 26} ${sy - 8} l4-11 M${sx + 32} ${sy - 24} l4-10" stroke="${p}" stroke-width="11" stroke-linecap="round"/>`;
    case 'mane': return `<path d="M${sx - 10} ${sy} q36 4 40 48 q-24-14-46-22z" fill="${p}"/>`;
    case 'flag': return `<path d="M${sx - 6} ${sy + 8} q30-4 34-40" fill="none" stroke="${c}" stroke-width="16" stroke-linecap="round"/>
      <circle cx="${sx + 28}" cy="${sy - 32}" r="11" fill="${p}"/>`;
    default: return `<path d="M${sx - 6} ${sy + 8} q34-2 36-42 q1-16-11-16 q-9 2-6 14" fill="none" stroke="${c}" stroke-width="16" stroke-linecap="round"/>`;
  }
}

function quadArt(a) {
  const sc = a.small ? 0.90 : a.big ? 1.05 : 1;
  const hr = 52 * sc, hx = 110, hy = 80 * sc + (1 - sc) * 30;
  const bx = 110, bt = hy + hr * 0.80, base = 206;
  const bw = 66 * sc;                       /* half-width at the base   */
  const cw = 34 * sc;                       /* half-width at the chest  */
  let g = SHADOW;

  g += tailArt(a, bx, base);

  /* fluffy breeds get a scalloped silhouette behind everything */
  if (a.fluff >= 3) {
    let puff = '';
    for (let k = 0; k <= 22; k++) {
      const t = k / 22, y = bt + t * (base - bt);
      const w = cw + (bw - cw) * Math.pow(t, .75);
      puff += `<circle cx="${(bx - w).toFixed(1)}" cy="${y.toFixed(1)}" r="${(13 * sc).toFixed(1)}" fill="${a.body}"/>
               <circle cx="${(bx + w).toFixed(1)}" cy="${y.toFixed(1)}" r="${(13 * sc).toFixed(1)}" fill="${a.body}"/>`;
    }
    g += puff;
  }

  /* the sitting body: a bell, narrow at the shoulders, wide at the base */
  const body = `M${bx - cw} ${bt} C${bx - bw - 6} ${bt + (base - bt) * .62}, ${bx - bw} ${base - 30}, ${bx - bw + 4} ${base - 8}
    Q${bx - bw + 6} ${base}, ${bx - bw + 20} ${base} L${bx + bw - 20} ${base}
    Q${bx + bw - 6} ${base}, ${bx + bw - 4} ${base - 8} C${bx + bw} ${base - 30}, ${bx + bw + 6} ${bt + (base - bt) * .62}, ${bx + cw} ${bt} Z`;
  g += `<path d="${body}" fill="${a.body}"/>`;
  g += `<ellipse cx="${bx}" cy="${base - 46}" rx="${bw * .62}" ry="${(base - bt) * .40}" fill="${shade(a.patch, 1.12)}" opacity="${a.spots === 2 ? .0 : .45}"/>`;

  if (a.saddle) g += `<path d="M${bx - cw - 4} ${bt + 6} q${cw + 4} -14 ${(cw + 4) * 2} 0 l6 ${(base - bt) * .5} q-${bw} 16 -${bw * 2} 0z" fill="${a.patch}" opacity=".9"/>`;
  if (a.stripes) {
    const n = a.stripes === 2 ? 4 : 3, w = a.stripes === 2 ? 8 : 5;
    for (let k = 0; k < n; k++) g += `<path d="M${bx - 34 + k * 24} ${bt + 14} q6 30 2 ${(base - bt) * .62}" stroke="${a.patch}" stroke-width="${w}" fill="none" stroke-linecap="round" opacity=".9"/>`;
  }
  if (a.spots === 2) [[-30, 34, 12], [22, 20, 10], [6, 62, 13], [-14, 88, 9], [38, 66, 8]].forEach(pt =>
    g += `<circle cx="${bx + pt[0] * sc}" cy="${bt + pt[1] * sc}" r="${pt[2] * sc}" fill="${a.patch}"/>`);
  else if (a.spots === 1) g += `<ellipse cx="${bx + 24 * sc}" cy="${bt + 40 * sc}" rx="${24 * sc}" ry="${26 * sc}" fill="${a.patch}" opacity=".85"/>`;
  if (a.spiky) {
    for (let k = 0; k <= 12; k++) {
      const t = k / 12, y = bt + 6 + t * (base - bt - 30);
      const w = cw + (bw - cw) * Math.pow(t, .75);
      g += `<path d="M${(bx - w).toFixed(1)} ${y.toFixed(1)} l-16-4 14 12z" fill="${a.patch}"/>
            <path d="M${(bx + w).toFixed(1)} ${y.toFixed(1)} l16-4 -14 12z" fill="${a.patch}"/>`;
    }
  }
  if (a.shell) g += `<path d="M${bx - bw - 2} ${base - 16} a${bw + 2} ${(base - bt) * .78} 0 0 1 ${(bw + 2) * 2} 0z" fill="${a.patch}"/>
    ${[-2, -1, 0, 1, 2].map(k => `<path d="M${bx + k * bw * .38} ${base - 16} q3-30 0-${(base - bt) * .62}" stroke="${shade(a.patch, .62)}" stroke-width="3.4" fill="none" opacity=".85"/>`).join('')}`;

  /* front paws */
  const pw = 23 * sc, ph = 18 * sc;
  g += `<ellipse cx="${bx - 28 * sc}" cy="${base - 12}" rx="${pw}" ry="${ph}" fill="${shade(a.body, 1.12) === a.body ? '#F8F0E2' : '#F8F0E2'}"/>
        <ellipse cx="${bx + 28 * sc}" cy="${base - 12}" rx="${pw}" ry="${ph}" fill="#F8F0E2"/>`;

  g += earArt(a, hx, hy, hr);
  if (a.fluff >= 2) {
    let ruff = '';
    for (let k = 0; k < 16; k++) { const t = (k / 16) * Math.PI * 2;
      ruff += `<circle cx="${(hx + Math.cos(t) * hr * .94).toFixed(1)}" cy="${(hy + Math.sin(t) * hr * .94).toFixed(1)}" r="${(hr * .27).toFixed(1)}" fill="${a.body}"/>`; }
    g += ruff;
  }
  g += `<circle cx="${hx}" cy="${hy}" r="${hr}" fill="${a.body}"/>`;
  if (a.spots === 2) g += `<circle cx="${hx + hr * .52}" cy="${hy - hr * .40}" r="${hr * .30}" fill="${a.patch}"/>`;
  if (a.spots === 1) g += `<ellipse cx="${hx - hr * .46}" cy="${hy - hr * .26}" rx="${hr * .36}" ry="${hr * .32}" fill="${a.patch}" opacity=".85"/>`;
  if (a.blaze) g += `<path d="M${hx - hr * .16} ${hy - hr} h${hr * .32} l${hr * .1} ${hr * .9} h-${hr * .52}z" fill="${a.patch}"/>`;
  if (a.horns) g += `<path d="M${hx - hr * .78} ${hy - hr * .58} q-${hr * .34}-${hr * .3} -${hr * .12}-${hr * .48} q${hr * .3} ${hr * .1} ${hr * .38} ${hr * .38}z
    M${hx + hr * .78} ${hy - hr * .58} q${hr * .34}-${hr * .3} ${hr * .12}-${hr * .48} q-${hr * .3} ${hr * .1} -${hr * .38} ${hr * .38}z" fill="#E8DCC0"/>`;
  if (a.antlers) g += `<g stroke="#9A7549" stroke-width="${hr * .1}" fill="none" stroke-linecap="round">
    <path d="M${hx - hr * .34} ${hy - hr * .9} l-${hr * .2}-${hr * .44} M${hx - hr * .54} ${hy - hr * 1.34} l-${hr * .26} ${hr * .1} M${hx - hr * .54} ${hy - hr * 1.34} l${hr * .1}-${hr * .26}"/>
    <path d="M${hx + hr * .34} ${hy - hr * .9} l${hr * .2}-${hr * .44} M${hx + hr * .54} ${hy - hr * 1.34} l${hr * .26} ${hr * .1} M${hx + hr * .54} ${hy - hr * 1.34} l-${hr * .1}-${hr * .26}"/></g>`;
  g += faceParts(a, hx, hy, hr);

  return { inner:g, hx, hy, hr, ny:hy + hr * 0.92, bx, bt, bw:cw + 8 };
}

function birdArt(a) {
  const sc = a.big ? 1.06 : 1;
  const hr = 44 * sc, hx = 110, hy = 76 * sc, bx = 110, bt = hy + hr * 0.72, base = 204;
  const bw = 56 * sc, cw = 34 * sc;
  let g = SHADOW;
  g += `<path d="M${bx - cw} ${bt} C${bx - bw - 4} ${bt + 60}, ${bx - bw} ${base - 26}, ${bx - bw + 6} ${base - 6}
    Q${bx - bw + 8} ${base}, ${bx - bw + 22} ${base} L${bx + bw - 22} ${base}
    Q${bx + bw - 8} ${base}, ${bx + bw - 6} ${base - 6} C${bx + bw} ${base - 26}, ${bx + bw + 4} ${bt + 60}, ${bx + cw} ${bt} Z" fill="${a.body}"/>`;
  g += `<ellipse cx="${bx}" cy="${base - 44}" rx="${bw * .60}" ry="52" fill="${a.patch}"/>`;
  g += `<ellipse cx="${bx - bw + 4}" cy="${bt + 54}" rx="${20 * sc}" ry="${38 * sc}" fill="${shade(a.body, .92)}" transform="rotate(12 ${bx - bw + 4} ${bt + 54})"/>`;
  g += `<ellipse cx="${bx + bw - 4}" cy="${bt + 54}" rx="${20 * sc}" ry="${38 * sc}" fill="${shade(a.body, .92)}" transform="rotate(-12 ${bx + bw - 4} ${bt + 54})"/>`;
  const lf = a.legs === 'web' ? '#E9A13C' : '#D9A05B';
  [-22, 22].forEach(o => g += a.legs === 'web'
    ? `<path d="M${bx + o - 17} ${base - 2} q17 14 34 0 q-5 7-17 7 q-12 0-17-7z" fill="${lf}"/>`
    : `<g stroke="${lf}" stroke-width="5" stroke-linecap="round"><path d="M${bx + o} ${base - 10} v10 M${bx + o - 9} ${base + 1} h18"/></g>`);
  if (a.crest === 2) g += `<path d="M${hx - hr * .8} ${hy - hr * .5} l-${hr * .1}-${hr * .62} ${hr * .66} ${hr * .3}z

  g += `<circle cx="${hx}" cy="${hy}" r="${hr}" fill="${a.body}"/>`;

  if (a.upright) g += `<path d="M${hx - hr * .92} ${hy + hr * .3} a${hr * .92} ${hr * .8} 0 0 0 ${hr * 1.84} 0 a${hr} ${hr} 0 0 1 -${hr * 1.84} 0z" fill="${a.patch}"/>`;

function seaArt(a) {

  const fin = d => `<path d="${d}" fill="${shade(c, .9)}"/>`;

    g += fin('M40 120 l-24-30 q-6 28 6 38 q-14 12-4 32 q26-8 30-30z');
    g += `<path d="M44 116 q22-${fat ? 62 : 52} 82-${fat ? 56 : 48} q46 2 66 28 q-16 32-64 38 q-58 6-84-14z" fill="${c}"/>`;
    g += `<path d="M56 134 q40 26 96 18 q22-4 38-14 q-16 28-62 32 q-52 4-72-16z" fill="${p}"/>`;
    g += fin(a.shape === 'shark' ? 'M104 76 l14-48 22 48z' : 'M104 80 q14-32 34-18 q-6 8-8 20z');
    g += fin('M110 148 q10 26 32 24 q-8-16-8-26z');
    if (a.shape === 'shark') g += `<g stroke="${shade(c, .78)}" stroke-width="3" fill="none"><path d="M124 108 q-4 12 0 24M134 106 q-4 13 0 26M144 105 q-4 14 0 27"/></g>
      <path d="M176 122 q22 4 32 12 q-20 8-34 2z" fill="#F6D9D2"/>`;

    hx = 168; hy = 104; hr = 30;
    g += `<ellipse cx="${hx}" cy="${hy - 6}" rx="7" ry="7.6" fill="${INK}"/><circle cx="${hx + 2.4}" cy="${hy - 8.6}" r="2.8" fill="#fff"/>
          <ellipse cx="${hx - 14}" cy="${hy + 12}" rx="8" ry="5" fill="#F0847E" opacity=".34"/>
          <path d="M${hx + 4} ${hy + 12} q8 7 16 1" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  } else if (a.shape === 'turtle') {
    [[52, 158], [168, 158], [48, 108], [172, 108]].forEach(f => g += fin(`M${f[0]} ${f[1]} q-24 6-24 22 q4 14 26 6 q11-6 13-20z`));
    g += `<circle cx="176" cy="112" r="30" fill="${c}"/>`;
    g += `<path d="M34 130 a76 52 0 0 1 152 0z" fill="${p}"/><path d="M34 130 h152" stroke="${shade(p, .82)}" stroke-width="4"/>`;
    for (let k = 0; k < 5; k++) g += `<path d="M${60 + k * 26} 130 q3-28 0-38" stroke="${shade(p, .8)}" stroke-width="3" fill="none" opacity=".8"/>`;

  } else {
    for (let k = 0; k < 8; k++) {
      const x = 40 + k * 20, dir = k % 2 ? 1 : -1;
      const d = `M${x} 128 q${dir * 12} 30 ${dir * 3} 50 q${-dir * 14} 14 ${-dir * 3} 20`;
      g += `<path d="${d}" fill="none" stroke="${k % 2 ? p : c}" stroke-width="13" stroke-linecap="round"/>`;
    }
    g += `<path d="M36 130 a76 62 0 0 1 152 0z" fill="${c}"/><ellipse cx="112" cy="108" rx="46" ry="26" fill="${p}" opacity=".4"/>`;
    hx = 112; hy = 96; hr = 40;
    g += faceParts({ blush:true }, hx, hy, hr).replace(/<ellipse cx="[\d.]+" cy="[\d.]+" rx="[\d.]+" ry="[\d.]+" fill="#F8F0E2"\/>/, '');
  }
  return { inner:g, hx, hy, hr, ny:hy + hr * .9, bx:112, bt:hy + hr, bw:44 };
}

/* ---- wearables, placed from the anchors above --------------------- */
function wearArt(w, A, a) {

  };

    bobble:`<g><path d="M${hx - hr * .94} ${top + hr * .26} a${hr * .94} ${hr * .88} 0 0 1 ${hr * 1.88} 0z" fill="#4CA36B"/><rect x="${hx - hr}" y="${top + hr * .16}" width="${hr * 2}" height="${hr * .26}" rx="${hr * .13}" fill="#FBF7EF"/><circle cx="${hx}" cy="${top - hr * .58}" r="${hr * .22}" fill="#FBF7EF"/></g>`,

    flower:`<g><path d="M${hx - hr * .96} ${top + hr * .34} q${hr * .96}-${hr * .5} ${hr * 1.92} 0" fill="none" stroke="#4CA36B" stroke-width="${hr * .11}"/>${[-0.72, -0.25, 0.25, 0.72].map((o, i) => { const fx = hx + o * hr * .95, fy = top + hr * .34 - Math.cos(o * 1.5) * hr * .3; return `<g>${[0, 1, 2, 3, 4].map(k => { const t = k / 5 * Math.PI * 2; return `<circle cx="${(fx + Math.cos(t) * hr * .12).toFixed(1)}" cy="${(fy + Math.sin(t) * hr * .12).toFixed(1)}" r="${hr * .1}" fill="${['#EE7EA6', '#F6BE4A', '#FBF7EF', '#C25FA0'][i % 4]}"/>`; }).join('')}<circle cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="${hr * .07}" fill="#F6BE4A"/></g>`; }).join('')}</g>`,
    ranger:`<g><ellipse cx="${hx}" cy="${top + hr * .3}" rx="${hr * 1.18}" ry="${hr * .2}" fill="#8A6A3E"/><path d="M${hx - hr * .58} ${top + hr * .3} q${hr * .12}-${hr * .74} ${hr * .58}-${hr * .74} t${hr * .58} ${hr * .74}z" fill="#A5814D"/></g>`,
    pirate:`<g><path d="M${hx - hr * 1.06} ${top + hr * .3} q${hr * 1.06}-${hr * .9} ${hr * 2.12} 0 q-${hr} ${hr * .3} -${hr * 2.12} 0z" fill="#2F3540"/><circle cx="${hx}" cy="${top + hr * .06}" r="${hr * .17}" fill="#FBF7EF"/><path d="M${hx - hr * .2} ${top + hr * .18} l${hr * .4}-${hr * .34} M${hx + hr * .2} ${top + hr * .18} l-${hr * .4}-${hr * .34}" stroke="#FBF7EF" stroke-width="${hr * .07}"/></g>`,

  };

}

/* outfits wrap the sitting body, so one shape fits every animal */
const OUTFIT = (w, a, A) => {

    cape:`<path d="M${bx - bw - 6} ${top} C${bx - half - 16} ${top + 60}, ${bx - half - 12} ${bot - 6}, ${bx - half + 2} ${bot + 6} L${bx + half - 2} ${bot + 6} C${bx + half + 12} ${bot - 6}, ${bx + half + 16} ${top + 60}, ${bx + bw + 6} ${top} Z" fill="#7A4FA3"/>`,

    dino:`<g><path d="${shell}" fill="#5FBF7E"/><path d="M${bx - 40} ${top + 4} l10-18 10 18 M${bx - 12} ${top - 2} l11-20 11 20 M${bx + 18} ${top + 2} l11-18 11 18" fill="#F6BE4A"/><ellipse cx="${bx}" cy="${bot - 30}" rx="${half * .62}" ry="26" fill="#CFE9A8"/></g>`,
    space:`<g><path d="${shell}" fill="#DCE6ED"/><circle cx="${bx}" cy="${top + 52}" r="20" fill="#4A9BCB"/><rect x="${bx - half + 8}" y="${top + 34}" width="14" height="26" rx="5" fill="#E4572E"/></g>`
  };
  return O[w.outfit] || '';
};

function animalSVG(a, opt) {
  opt = opt || {}; const w = opt.wear || {};

}
