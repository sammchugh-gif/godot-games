<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0420">
<title>Puzzle Arcade · Agent Rory HQ</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { color-scheme: dark; --bg: #0b0420; --ink: #f4ecff; --dim: #a898c8; --neon: #ff4fd8; --cyan: #4ff0ff; --gold: #ffd166; --accent: #ff4fd8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-text-size-adjust: 100%; overflow-x: hidden; -webkit-user-select: none; user-select: none;
    background: radial-gradient(ellipse at 50% -10%, #3a1070 0%, transparent 60%), linear-gradient(#0b0420, #120630 60%, #0b0420); background-attachment: fixed; }
  /* the CRT: faint scanlines over everything */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px); }
  main { max-width: 1100px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .back { color: var(--dim); text-decoration: none; font-weight: 800; letter-spacing: .1em; font-size: 13px; padding: 8px 12px; border: 1px solid rgba(168,152,200,.35); border-radius: 999px; }
  .ticket { font: 900 15px ui-monospace, Menlo, monospace; color: var(--gold); padding: 7px 14px; border: 2px dashed rgba(255,209,102,.6); border-radius: 10px; background: rgba(255,209,102,.08); letter-spacing: .05em; }
  /* the marquee: lit letters in a frame of chasing bulbs */
  .marquee { position: relative; margin: 16px auto 6px; max-width: 760px; text-align: center; padding: 18px 16px 16px; border-radius: 20px;
    background: linear-gradient(#22093f, #170530); border: 3px solid #2a0d50; box-shadow: 0 0 0 3px #090214, 0 0 40px rgba(255,79,216,.35), inset 0 0 30px rgba(79,240,255,.12); }
  .bulbs { position: absolute; inset: 6px; border-radius: 16px; pointer-events: none;
    background: radial-gradient(circle, #ffe9a8 0 2.5px, transparent 3.5px) 0 0 / 18px 18px; -webkit-mask: linear-gradient(#000 0 0) top/100% 8px no-repeat, linear-gradient(#000 0 0) bottom/100% 8px no-repeat; mask: linear-gradient(#000 0 0) top/100% 8px no-repeat, linear-gradient(#000 0 0) bottom/100% 8px no-repeat; animation: chase 1s steps(2) infinite; }
  @keyframes chase { 50% { background-position: 9px 0; filter: hue-rotate(40deg) brightness(1.3); } }
  .marquee small { display: block; font: 800 12px ui-monospace, Menlo, monospace; letter-spacing: .4em; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  h1 { margin: 6px 0 2px; font-size: clamp(34px, 8vw, 66px); line-height: .95; font-weight: 900; letter-spacing: .02em; color: #fff; text-wrap: balance;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--neon), 0 0 42px var(--neon), 3px 3px 0 #5a0a70; }
  .marquee p { margin: 8px 0 0; font: 800 13px ui-monospace, Menlo, monospace; letter-spacing: .2em; color: var(--gold); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #count { text-align: center; color: var(--dim); font-weight: 700; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  /* each game is a shelf of cartridges */
  .shelf { margin-top: 22px; }
  .shelf h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .shelf h2 span { font-size: clamp(19px, 3.6vw, 24px); font-weight: 900; color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); letter-spacing: .02em; }
  .shelf h2 em { font: 800 13px ui-monospace, Menlo, monospace; font-style: normal; color: var(--dim); white-space: nowrap; }
  .note { margin: 4px 0 0; color: var(--dim); font-size: 13px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 10px; }
  .tile { position: relative; min-height: 118px; border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 14px; padding: 10px 8px 8px; font: inherit; color: var(--ink); cursor: pointer;
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, #1a0836), #12052a 70%); box-shadow: 0 4px 0 #06010f, 0 0 18px color-mix(in srgb, var(--accent) 22%, transparent);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px; transition: transform .08s; }
  .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 #06010f; }
  .tile b { font-size: 36px; line-height: 1.1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  .tile i { font-style: normal; font-weight: 800; font-size: 14px; line-height: 1.15; text-align: center; text-wrap: balance; }
  .tile small { font: 800 12px ui-monospace, Menlo, monospace; color: var(--gold); letter-spacing: .08em; }
  .tile small .off, .lvl small .off { color: rgba(255,255,255,.18); }
  .tile.locked { border-style: dashed; border-color: rgba(168,152,200,.3); background: rgba(255,255,255,.03); box-shadow: none; }
  .tile.locked b { color: rgba(255,255,255,.25); font-size: 34px; font-family: ui-monospace, Menlo, monospace; }
  .tile.locked i { color: rgba(255,255,255,.3); letter-spacing: .2em; }
  .tile.locked small { color: var(--dim); font-family: inherit; letter-spacing: 0; font-weight: 600; text-align: center; font-size: 11px; }
  /* the cards over the top: pick a level, results */
  .overlay { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(6,2,16,.78); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  .panel { width: min(520px, 100%); max-height: 100%; overflow: auto; text-align: center; padding: 20px 18px 18px; border-radius: 22px; background: linear-gradient(#24094a, #12052a); border: 2px solid var(--accent); box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 40%, transparent); animation: pop .22s ease-out; }
  @keyframes pop { from { transform: scale(.88); opacity: 0; } }
  .panel h3 { margin: 4px 0; font-size: 24px; font-weight: 900; text-wrap: balance; }
  .panel p { margin: 6px 0 12px; color: #d8ccf0; font-weight: 600; }
  .panel .from { color: var(--dim); font-size: 14px; }
  .big { font-size: 54px; line-height: 1.1; }
  .levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0 14px; }
  .lvl { border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); border-radius: 14px; padding: 10px 6px; background: rgba(255,255,255,.05); color: var(--ink); font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .lvl b { font: 900 15px ui-monospace, Menlo, monospace; color: var(--cyan); letter-spacing: .08em; }
  .lvl span { font-weight: 800; font-size: 13px; }
  .lvl small { font: 800 12px ui-monospace, Menlo, monospace; color: var(--gold); min-height: 1.2em; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 900; letter-spacing: .06em; color: #10041e; background: var(--cyan); cursor: pointer; box-shadow: 0 4px 0 #0a6a78; }
  .btn.go { background: var(--gold); box-shadow: 0 4px 0 #9a6a10; }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: none; }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .won { font: 900 clamp(26px, 6vw, 38px) ui-monospace, Menlo, monospace; color: var(--gold); letter-spacing: .08em; text-shadow: 0 0 18px rgba(255,209,102,.7); }
  .stars { font-size: 46px; letter-spacing: 6px; margin: 4px 0; }
  .stars span { color: rgba(255,255,255,.28); display: inline-block; }
  .stars span.on { color: var(--gold); text-shadow: 0 0 16px rgba(255,209,102,.8); animation: starpop .35s backwards; }
  @keyframes starpop { from { transform: scale(2.2) rotate(-30deg); opacity: 0; } }
  .tix { font: 800 15px ui-monospace, Menlo, monospace; color: var(--gold) !important; }
  /* the puzzles themselves: each game's clue screen, over the arcade */
  #ui { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  .screen.dim { background: rgba(6, 2, 16, .86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body.playing main { filter: blur(3px); }
  #shelves:empty::before { content: "LOADING…"; display: block; text-align: center; margin-top: 30px; font: 800 14px ui-monospace, Menlo, monospace; letter-spacing: .3em; color: var(--dim); }
  @media (max-width: 420px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); } .tile { min-height: 108px; } .tile b { font-size: 30px; } }
</style>
</head>
<body>
<main>
  <div class="top"><a class="back" href="index.html">◂ HQ</a><span class="ticket">🎟️ <span id="tickets">0</span></span></div>
  <div class="marquee"><div class="bulbs"></div><small>POLARIS</small><h1>PUZZLE ARCADE</h1><p>TAP A GAME TO PLAY</p></div>
  <div id="count"></div>
  <div id="shelves"></div>
</main>
<div id="card" class="overlay" hidden></div>
<div id="ui"></div>
<script type="module" src="arcade.js"></script>
<script src="../fresh.js" defer></script>
</body>
</html>
