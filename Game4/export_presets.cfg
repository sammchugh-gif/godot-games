html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<style>
  html, body { margin:0; padding:0; height:100%; background:#edd9a8; overflow:hidden; }
  body { position:fixed; inset:0; width:100%; height:100%; }
  body { overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  canvas { touch-action:none; outline:none; }
</style>
<script>
  // iPhone Safari: stop a moving finger from becoming a page pan / zoom, which would
  // cancel the touch before the game sees it move.
  document.addEventListener(\"touchmove\", function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener(\"gesturestart\", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener(\"dblclick\", function (e) { e.preventDefault(); }, { passive: false });
</script>"
html/canvas_resize_policy=2
