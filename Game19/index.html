<style>
:root{--paper:#fffaf0;--ink:#3a2a1c;--leaf:#4e9f2a;--leaf2:#78c043}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1d1640;
 font-family:Andika,"Comic Neue",ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);

 overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
#book{position:fixed;left:0;top:0;overflow:hidden;background:#1d1640}
.page{position:absolute;inset:0;will-change:transform,opacity}
.stage{position:absolute;left:0;top:0;right:0;overflow:hidden;background:#241a4a}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* ---- words */
.card{position:absolute;box-sizing:border-box;background:var(--paper);color:var(--ink);
 border-radius:26px;box-shadow:0 10px 30px rgba(20,10,40,.35),inset 0 0 0 3px rgba(255,255,255,.7);
 display:flex;flex-direction:column;justify-content:center}

.words{position:relative;line-height:1.42;font-size:26px;text-wrap:pretty}
.words p{margin:0 0 .38em}.words p:last-child{margin-bottom:0}
.w{border-radius:.3em;padding:0 .04em;transition:background-color .12s,color .12s;cursor:pointer}
.w.on{background:#ffe066;box-shadow:0 0 0 .08em #ffe066}
.who-nufa{color:#2f8a18;font-weight:700}
.who-lily{color:#c2410c;font-weight:700}.who-ben{color:#1d63c7;font-weight:700}
.who-mum{color:#8b2fb8;font-weight:700}.who-dad{color:#0f766e;font-weight:700}
.who-kid,.who-mia,.who-theo{color:#b8326b;font-weight:700}
.pow{font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;font-weight:800;color:#e0512b;letter-spacing:.02em;
 display:inline-block;font-size:1.18em;line-height:1;text-shadow:0 2px 0 #ffd66b}
.prompt{align-self:center;margin-top:.5em;padding:.28em .9em;border-radius:999px;background:#eaf7dc;color:#2f6f14;
 font-size:.72em;font-weight:700;box-shadow:inset 0 0 0 2px #bfe39a;display:flex;gap:.4em;align-items:center}
.prompt svg{width:1.2em;height:1.2em;flex:none}
/* ---- buttons */
.nav{position:absolute;width:66px;height:66px;border:none;border-radius:50%;padding:0;z-index:5;
 background:radial-gradient(circle at 35% 30%,#b8f06f,#5cb82e 60%,#3f8f1c);
 box-shadow:0 5px 0 #2e6d13,0 8px 16px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.nav:active{transform:translateY(3px);box-shadow:0 2px 0 #2e6d13,0 4px 10px rgba(0,0,0,.35)}
.nav svg{width:34px;height:34px}
.nav[hidden]{display:none}
.nav.nudge{animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:10px;z-index:6}
.rb{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:rgba(40,28,80,.62);
 display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.35);
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.rb svg{width:26px;height:26px}
.rb.off{opacity:.75}
#dots{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:4;pointer-events:none}
#dots i{display:block;width:13px;height:8px;border-radius:5px;background:rgba(255,255,255,.35);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:all .3s}
#dots i.seen{background:#a6dc6a}
#dots i.now{background:#6fcf2f;width:26px;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.4)}

.title{position:absolute;left:0;right:0;text-align:center;pointer-events:none;z-index:3;
 font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;font-weight:800;line-height:.95;color:#c7f36f;
 -webkit-text-stroke:0;text-shadow:0 4px 0 #2d6b12,0 7px 0 #1b4209,0 10px 24px rgba(0,0,0,.55)}

.ti{transform-box:fill-box;transform-origin:50% 100%}
.ctr{transform-box:fill-box;transform-origin:50% 50%}

@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}

@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}

.antL{animation:antL 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
.antR{animation:antR 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes antL{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes antR{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-6deg)}}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.drift{animation:drift 70s ease-in-out infinite alternate}
.drift2{animation:drift 95s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(80px)}}
.glowp{animation:glowp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes glowp{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.blinkl{animation:blinkl 1.6s steps(1) infinite}
@keyframes blinkl{0%,100%{opacity:1}50%{opacity:.25}}
.smoke{animation:smoke 3.4s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%;opacity:0}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.7}100%{opacity:0;transform:translate(40px,-170px) scale(1.7)}}
.fall{animation:fall 7s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(-90px,420px) rotate(320deg);opacity:0}}
.flut{animation:flut .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flut{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
.wander{animation:wander 9s ease-in-out infinite alternate}
@keyframes wander{0%{transform:translate(0,0)}33%{transform:translate(60px,-40px)}66%{transform:translate(-30px,-80px)}100%{transform:translate(40px,-20px)}}
.zoom{animation:zoom .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes zoom{from{transform:translate(-3px,2px) rotate(-1.5deg)}to{transform:translate(3px,-2px) rotate(1.5deg)}}
.spinslow{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.shoot{animation:shoot 7s ease-in infinite;opacity:0}
@keyframes shoot{0%,78%{opacity:0;transform:translate(0,0)}80%{opacity:1}92%{opacity:0;transform:translate(-520px,260px)}100%{opacity:0;transform:translate(-520px,260px)}}
.tear{animation:tear 1.8s ease-in infinite;transform-box:fill-box;transform-origin:50% 0%}
@keyframes tear{0%{transform:translateY(0) scale(.3);opacity:0}20%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(46px) scale(.9);opacity:0}}
.hint{pointer-events:none;animation:hint 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes hint{0%,100%{transform:scale(.7) rotate(0);opacity:.55}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
body.paused *{animation-play-state:paused!important}

<script>
"use strict";
const VERSION="1.0";
// ================================================================ drawing
// Every picture is SVG built from these functions, in a 1600 x 1000 scene.
// The things that matter in a picture sit in the middle 800 or so, because
// a phone held upright shows only that much of the width (see fitView).
const SW=1600,SH=1000;
let DEFS=[],UID=0;
const uid=()=>"z"+(UID++).toString(36);
const n1=v=>Math.round(v*10)/10;
const stopsOf=s=>s.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a==null?"":` stop-opacity="${a}"`}/>`).join("");
function lg(s,x1=0,y1=0,x2=0,y2=1){const id=uid();DEFS.push(`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stopsOf(s)}</linearGradient>`);return`url(#${id})`}
function rg(s,cx=.5,cy=.5,r=.5,fx=cx,fy=cy){const id=uid();DEFS.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}" fx="${fx}" fy="${fy}">${stopsOf(s)}</radialGradient>`);return`url(#${id})`}
function rand(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(c,k){let n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const t=k<0?0:255,p=Math.abs(k);
 r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return"#"+(0x1000000|r<<16|g<<8|b).toString(16).slice(1)}
// place something: its own origin lands on (x,y)
const at=(x,y,s,inner,flip)=>`<g transform="translate(${n1(x)} ${n1(y)})${s===1&&!flip?"":` scale(${flip?-s:s} ${s})`}">${inner}</g>`;
// something a child can tap: the outer group is found by name, the inner one moves
const tap=(name,inner,cls)=>`<g class="tp" data-tap="${name}"><g class="ti${cls?" "+cls:""}">${inner}</g></g>`;
// a named group the page can swap or move later
const part=(name,inner,cls)=>`<g data-p="${name}"${cls?` class="${cls}"`:""}>${inner}</g>`;

// ================================================================ Nufa
// Nufa stands with his feet on (0,0) and is about 430 tall to the tips of
// his antennae. mood: happy smile joy wow sad munch brave worried;
// ant: up droop hat poke; arms: down wave up hold hug climb.
function nufa(o={}){
 const mood=o.mood||"happy",ant=o.ant||"up",arms=o.arms||"down",ol="#2b6a1b",sk="#7fd048";
 let s="";
 if(!o.noShadow)s+=`<ellipse cx="0" cy="-2" rx="92" ry="15" fill="url(#gShadow)"/>`;
 // antennae go behind the head
 const antenna=(side)=>{
  const d=side;let path,tx,ty;
  if(ant==="droop"){path=`M${-34*d},-314 C${-60*d},-372 ${-138*d},-370 ${-150*d},-318`;tx=-151*d;ty=-310}
  else if(ant==="poke"){path=`M${-30*d},-318 C${-40*d},-372 ${-56*d},-392 ${-62*d},-418`;tx=-62*d;ty=-424}
  else{path=`M${-36*d},-312 C${-48*d},-362 ${-82*d},-384 ${-90*d},-424`;tx=-92*d;ty=-430}
  let a=`<path d="${path}" stroke="${ol}" stroke-width="14" fill="none" stroke-linecap="round"/><path d="${path}" stroke="#8fdc4e" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  if(o.glow)a=`<circle cx="${tx}" cy="${ty}" r="${o.glowR||95}" fill="url(#gGlow)" class="glowp"/>`+a;
  a+=`<circle cx="${tx}" cy="${ty}" r="21" fill="url(#gTip)" stroke="#d0702a" stroke-width="3"/><circle cx="${tx-6}" cy="${ty-7}" r="6" fill="#fff" opacity=".9"/>`;
  return`<g class="${d>0?"antL":"antR"}" data-p="ant${d>0?"L":"R"}">${a}</g>`};
 if(ant!=="hat")s+=`<g data-p="ants">${antenna(1)}${antenna(-1)}</g>`;
 // legs and feet
 const leg=`M-40,-58 L-46,-16 M40,-58 L46,-16`;
 s+=`<path d="${leg}" stroke="${ol}" stroke-width="36" stroke-linecap="round"/><path d="${leg}" stroke="${sk}" stroke-width="27" stroke-linecap="round"/>`;
 for(const d of[-1,1])s+=`<path d="M${d*20},-2 C${d*18},-26 ${d*44},-30 ${d*60},-26 C${d*82},-22 ${d*84},-2 ${d*70},-2 Z" fill="${sk}" stroke="${ol}" stroke-width="4.5" stroke-linejoin="round"/>`;
 // body: a soft pear
 const body=`M0,-172 C-58,-172 -84,-118 -80,-76 C-76,-38 -46,-28 0,-28 C46,-28 76,-38 80,-76 C84,-118 58,-172 0,-172Z`;
 s+=`<path d="${body}" fill="url(#gNufaB)" stroke="${ol}" stroke-width="5"/>`;
 s+=`<ellipse cx="0" cy="-86" rx="46" ry="44" fill="url(#gBelly)" opacity=".92"/>`;
 s+=`<path d="${body}" fill="url(#gShade)"/>`;
 s+=`<g fill="#5caf35" opacity=".55"><circle cx="-62" cy="-104" r="6"/><circle cx="-68" cy="-84" r="4"/><circle cx="64" cy="-100" r="5"/></g>`;
 // arms
 const hands={down:[[-92,-74],[92,-74]],wave:[[-92,-74],[116,-214]],up:[[-112,-222],[112,-222]],hold:[[-34,-112],[34,-112]],
  hug:[[-48,-126],[48,-126]],holdR:[[-92,-74],[118,-150]],climb:[[-78,-236],[92,-150]],point:[[-92,-74],[132,-200]],cheer:[[-108,-218],[92,-74]]}[arms]||[[-92,-74],[92,-74]];
 const armStr=(sx,sy,hx,hy,d)=>{const mx=(sx+hx)/2+d*14,my=(sy+hy)/2+10;const p=`M${sx},${sy} Q${mx},${my} ${hx},${hy}`;
  return`<path d="${p}" stroke="${ol}" stroke-width="27" fill="none" stroke-linecap="round"/><path d="${p}" stroke="${sk}" stroke-width="18" fill="none" stroke-linecap="round"/>`+

// ================================================================ the story
// Each page: its words, a picture (draw), and what happens when things in
// the picture are tapped (taps). REG remembers how each character was drawn,
// so a tap can redraw one with a new face and put it back afterwards.
let REG={};
function N(x,y,s,o={},name="nufa",cls=""){REG[name+"Art"]={fn:nufa,o};const inner=part(name+"Art",nufa(o));return at(x,y,s,tap(name,cls?`<g class="${cls}">${inner}</g>`:inner),o.flip)}
function P(key,x,y,s,o={},name=key){REG[name+"Art"]={fn:FAM[key],o};return at(x,y,s,tap(name,part(name+"Art",FAM[key](o))),o.flipX)}

// ================================================================ sound
// Made on the spot with Web Audio: nothing to download. The context is made
// by the first touch and asked to wake on every touch after, which is what a
// phone needs (tools/wakecheck.mjs).
let AC=null,MG=null,NB=null;
function audio(){
 if(!AC){const K=window.AudioContext||window.webkitAudioContext;if(!K)return null;
  try{AC=new K();MG=AC.createGain();MG.gain.value=.6;MG.connect(AC.destination);
   const len=AC.sampleRate|0;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}catch(e){AC=null;return null}}
 if(AC.state!=="running"){try{AC.resume()}catch(e){}}
 return AC}
["touchstart","touchend","pointerdown","pointerup","mousedown","keydown"].forEach(t=>addEventListener(t,audio,{capture:true,passive:true}));
window.__audio=()=>AC?{state:AC.state,now:AC.currentTime,next:null,timer:false}:null;
window.__audioCtx=()=>AC;
function tone(f,d,o={}){const a=audio();if(!a||a.state!=="running")return;const t=a.currentTime+(o.at||0);
 const osc=a.createOscillator(),g=a.createGain();osc.type=o.type||"sine";osc.frequency.setValueAtTime(f,t);
 if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+(o.glide||d));
 if(o.vib){const l=a.createOscillator(),lg_=a.createGain();l.frequency.value=o.vib;lg_.gain.value=f*.06;l.connect(lg_);lg_.connect(osc.frequency);l.start(t);l.stop(t+d+.05)}
 const v=o.vol==null?.25:o.vol;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.012));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 osc.connect(g);g.connect(MG);osc.start(t);osc.stop(t+d+.05)}
function noise(d,o={}){const a=audio();if(!a||a.state!=="running"||!NB)return;const t=a.currentTime+(o.at||0);
 const src=a.createBufferSource();src.buffer=NB;src.loop=true;const fl=a.createBiquadFilter();fl.type=o.type||"bandpass";fl.frequency.setValueAtTime(o.f||1000,t);
 if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+d);fl.Q.value=o.q||1;const g=a.createGain();const v=o.vol==null?.3:o.vol;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 src.connect(fl);fl.connect(g);g.connect(MG);src.start(t,Math.random()*.5);src.stop(t+d+.05)}
const SFX={
 boing(){tone(150,.5,{to:480,glide:.1,vol:.32,vib:18});tone(480,.35,{at:.1,to:300,vol:.12})},
 pop(){tone(760,.1,{to:160,vol:.3})},
 crunch(){for(let i=0;i<5;i++)noise(.055,{at:i*.075+Math.random()*.02,f:1600+Math.random()*1800,q:1.4,vol:.55})},
 whoosh(){noise(.9,{f:260,to:2600,q:.9,vol:.35,att:.35})},
 sparkle(){[1319,1568,2093,2637].forEach((f,i)=>tone(f,.4,{at:i*.07,type:"triangle",vol:.1}))},
 chime(){[523,659,784,1047].forEach((f,i)=>tone(f,1,{at:i*.11,vol:.13}))},
 flip(){noise(.2,{type:"highpass",f:1800,vol:.12,att:.04})},
 crash(){noise(1.2,{type:"lowpass",f:1600,to:160,vol:.6});tone(110,.7,{to:40,type:"square",vol:.1});for(let i=0;i<4;i++)noise(.08,{at:.15+i*.12,f:2500,q:2,vol:.3})},
 rustle(){for(let i=0;i<6;i++)noise(.14,{at:i*.07,f:3000+Math.random()*2000,q:.6,vol:.12})},

 meow(){tone(560,.6,{to:900,glide:.2,type:"triangle",vol:.16,vib:6});tone(900,.35,{at:.25,to:520,type:"triangle",vol:.12})},
 honk(){for(let i=0;i<3;i++)tone(330,.16,{at:i*.22,to:290,type:"square",vol:.08})},
 wah(){[392,370,349,311].forEach((f,i)=>tone(f,i===3?.8:.3,{at:i*.32,type:"triangle",vol:.16,vib:i===3?5:0}))},
 babble(){for(let i=0;i<6;i++)tone(520+Math.random()*700,.08,{at:i*.085,type:"square",vol:.045,to:420+Math.random()*900})},
 giggle(){[980,820,920,760,860,700].forEach((f,i)=>tone(f,.08,{at:i*.085,type:"triangle",vol:.12}))},
 squeak(){tone(900,.18,{to:1600,vol:.14,type:"triangle"});tone(1500,.14,{at:.16,to:1100,vol:.1,type:"triangle"})},

// ================================================================ reading aloud
// The words are real text; each sentence is spoken with the voice of whoever

  const u=utter(se.dataset.say,se.dataset.who,{
   onstart(){if(tk!==token)return;hiAt(se,0);

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

  const segs=[];par.split(/(\{\w+\|[^}]*\})/).forEach(p=>{if(!p)return;const m=p.match(/^\{(\w+)\|([^}]*)\}$/);segs.push(m?{who:m[1],t:m[2]}:{who:"n",t:p})});

   const sents=sg.t.match(/[^.!?…]+(?:[.!?…]+[”’"]*)?\s*|[.!?…]+[”’"]*\s*/g)||[sg.t];
   return sents.map(st=>{const raw=st.trim();if(!raw)return"";const clean=raw.replace(/\*/g,"");
    let ci=0,pow=false,h=[];

     if(tok.startsWith("*"))pow=true;const idx=clean.indexOf(ct,ci),c=idx<0?ci:idx;

   `<rect x="${n1(bx)}" y="${n1(by)}" width="${n1(w)}" height="${n1(h)}" rx="${n1(Math.min(34,h/2))}" fill="#fff" stroke="#3a2a1c" stroke-width="5"/>`+

 say(text,who){if(!narrating)speakLine(text,who||"n")},
 burst(x,y,n=12,cols=["#ffd43b","#fff","#8ce99a","#ff8fab","#74c0fc"]){for(let i=0;i<n;i++){const a=i/n*Math.PI*2+Math.random()*.4,d=90+Math.random()*120,g=X.add(`<g transform="translate(${n1(x)} ${n1(y)})"><g>${sparkle(0,0,12+Math.random()*10,cols[i%cols.length])}</g></g>`);

 hearts(x,y,n=4){for(let i=0;i<n;i++){const g=X.add(heart(n1(x+(Math.random()-.5)*160),n1(y+(Math.random()-.5)*60),16+Math.random()*14,["#ff6b8b","#ff8fab","#f06595"][i%3]));const k=g.firstChild.firstChild;

 crumbs(x,y){for(let i=0;i<9;i++){const g=X.add(`<g transform="translate(${x} ${y})"><circle r="${n1(4+Math.random()*5)}" fill="${i%2?"#9ccc3c":"#6f9e25"}"/></g>`);X.anim(g.firstChild.firstChild,[{transform:"translate(0,0)",opacity:1},{transform:`translate(${n1((Math.random()-.5)*160)}px,${n1(60+Math.random()*80)}px)`,opacity:0}],{duration:700,easing:"ease-in",fill:"forwards"});setTimeout(()=>g.remove(),800)}},
 leaves(x,y,n,col){for(let i=0;i<n;i++){const g=X.add(`<g transform="translate(${n1(x+(Math.random()-.5)*400)} ${n1(y+(Math.random()-.5)*120)})"><g><ellipse rx="16" ry="8" fill="${col}"/></g></g>`);X.anim(g.firstChild.firstChild,[{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${n1((Math.random()-.5)*200)}px,${n1(250+Math.random()*200)}px) rotate(${n1(Math.random()*540)}deg)`,opacity:0}],{duration:1800+Math.random()*900,easing:"ease-in",fill:"forwards"});setTimeout(()=>g.remove(),3000)}},
 confetti(){const v=X.view,cols=["#ff6b6b","#ffd43b","#69db7c","#4dabf7","#da77f2","#ff922b"];for(let i=0;i<46;i++){const x=v.x0+Math.random()*v.vw,g=X.add(`<g transform="translate(${n1(x)} ${n1(v.y0-20)})"><g><rect x="-7" y="-4" width="14" height="8" rx="2" fill="${cols[i%6]}"/></g></g>`);
  X.anim(g.firstChild.firstChild,[{transform:"translate(0,0) rotate(0)"},{transform:`translate(${n1((Math.random()-.5)*200)}px,${n1(v.vh+60)}px) rotate(${n1(360+Math.random()*720)}deg)`}],{duration:2200+Math.random()*1600,delay:Math.random()*500,easing:"cubic-bezier(.3,.1,.7,1)",fill:"forwards"});setTimeout(()=>g.remove(),4500)}},
 fxFly(html,x,y,pts,dur,gone,s=1){const g=X.add(`<g transform="translate(${x} ${y}) scale(${s})"><g style="transform-box:fill-box;transform-origin:50% 50%">${html}</g></g>`);
  X.anim(g.firstChild.firstChild,pts.map(([dx,dy,r],i)=>({transform:`translate(${dx/s}px,${dy/s}px) rotate(${r}deg)`,offset:i/(pts.length-1)})),{duration:dur,easing:"ease-in-out",fill:"forwards"});if(gone)setTimeout(()=>g.remove(),dur+30)},
 popBubble(name){const t=X.ti(name);if(!t||X.st[name])return;X.st[name]=1;SFX.pop();X.anim(t,[{transform:"scale(1)",opacity:1},{transform:"scale(1.5)",opacity:0}],{duration:260,fill:"forwards"});
  X.later(3000,()=>{X.st[name]=0;X.anim(t,[{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:500,fill:"forwards"})})},
 crunchAway(name){const t=X.ti(name);if(!t||X.st[name])return;X.st[name]=1;SFX.crunch();X.burstOn(t,6);X.anim(t,[{transform:"scale(1)",opacity:1},{transform:"scale(.2)",opacity:0}],{duration:400,fill:"forwards"});
  X.later(2400,()=>{X.st[name]=0;X.anim(t,[{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:500,fill:"forwards"})})},
 taste(k,x){const sour=!X.st["t_"+k];X.st["t_"+k]=sour?1:0;X.set(k+"Art",{mood:sour?"sour":"laugh"},1500);SFX.crunch();X.hop(k);X.crumbs(x,560);X.bubble(x,470,sour?"SOUR!":"YUM!",{who:k==="theo"?"theo":k==="lily"||k==="ben"?k:"kid",fs:46})},
 shooting(){const v=X.view,x=v.x0+v.vw*.8,y=v.y0+80,g=X.add(`<g transform="translate(${n1(x)} ${n1(y)})"><g><path d="M0,0 L200,-70 L194,-56Z" fill="#fff" opacity=".85"/><circle r="8" fill="#fff"/><circle r="24" fill="url(#gCool)"/></g></g>`);
  X.anim(g.firstChild.firstChild,[{transform:"translate(0,0)",opacity:0},{transform:"translate(-80px,30px)",opacity:1,offset:.15},{transform:"translate(-600px,230px)",opacity:0}],{duration:1300,easing:"ease-in",fill:"forwards"});setTimeout(()=>g.remove(),1400)},
 // sparkles on the things that do something, when nothing has been tapped for a while
 idle(ms){clearTimeout(X.hintT);X.hintT=setTimeout(()=>{if(C!==X||narrating)return;X.hints()},ms==null?5500:ms)},
 hints(){fx.querySelectorAll(".hintg").forEach(h=>h.remove());const m0=svg.getScreenCTM();if(!m0)return;const inv=m0.inverse(),v=X.view;let n=0;
  svg.querySelectorAll("[data-tap]").forEach(t=>{const name=t.dataset.tap;if(X.tapped.has(name)||t.style.display==="none"||n>=6)return;
   try{const b=t.getBBox();if(!b.width)return;const m=inv.multiply(t.getScreenCTM()),pt=svg.createSVGPoint();pt.x=b.x+b.width*.82;pt.y=b.y+b.height*.18;const q=pt.matrixTransform(m);

// ================================================================ touch
let down=null;

 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){if(!PAGES[cur].cover)turn(dx<0?1:-1);return}
 if(Math.hypot(dx,dy)>14||!C)return;

  C.anim(w,[{transform:"translateY(0)"},{transform:"translateY(-6px)"},{transform:"translateY(0)"}],{duration:300});return}
 const t=tgt.closest&&tgt.closest("[data-tap]");if(t){const name=t.dataset.tap,p=PAGES[cur];nextB.classList.remove("nudge");
  C.tapped.add(name);C.clearHints();C.idle(9000);
  const f=p.taps&&p.taps[name];if(f)f(C,t);else{C.hop(name);SFX.pop()}}});

function doAct(b){const a=b.dataset.act;

 else if(a==="self"){readAloud=false;saveRead();syncRead();turn(1)}
 else if(a==="resume"){gestured=true;go(+b.dataset.n||1,1)}
 else if(a==="again"){gestured=true;go(1,-1)}}

prevB.addEventListener("click",()=>turn(-1));nextB.addEventListener("click",()=>turn(1));

againB.addEventListener("click",()=>{gestured=true;if(!readAloud){readAloud=true;saveRead();syncRead()}if(curEl)narrate(curEl)});
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){if(!PAGES[cur].cover||e.key==="ArrowRight")turn(1);e.preventDefault()}else if(e.key==="ArrowLeft")turn(-1)});
