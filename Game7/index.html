<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Slime Storm</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a2a1a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
</style><script>window.__shelfPaused=function(){try{return scene!=="play"}catch(e){return true}};</script><script src="../menu.js" defer></script>
<script src="../fresh.js" defer></script>
</head><body><canvas id="c"></canvas>
<script>
"use strict";
// ============================================================ Slime Storm
// A one-thumb survivor: walk, weapons fire themselves, level up, survive
// ten minutes. Everything is drawn with canvas primitives and every sound is
// synthesised. Sophia, Rory and Dylan Games, Inc.
document.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

const cv=document.getElementById("c"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1,S=1; // S: world units -> css px
// The canvas is viewport-fit=cover, so on an iPhone the notch and the
// Dynamic Island sit on top of it and eat whatever the HUD draws up there.
// CSS knows the safe insets; script only learns them by measuring an element
// that uses them.
const safeProbe=document.createElement("div");
safeProbe.style.cssText="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;"+
 "padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
document.body.appendChild(safeProbe);
const SAFE={t:0,r:0,b:0,l:0};
function readSafe(){const st=getComputedStyle(safeProbe);
 SAFE.t=parseFloat(st.paddingTop)||0;SAFE.r=parseFloat(st.paddingRight)||0;
 SAFE.b=parseFloat(st.paddingBottom)||0;SAFE.l=parseFloat(st.paddingLeft)||0}
function resize(){readSafe();DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(H/720,W/1100);if(S<0.55)S=0.55;}
window.addEventListener("resize",resize);window.addEventListener("orientationchange",()=>setTimeout(resize,150));resize();
const RUN_LEN=600; // seconds to survive
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
// The old mix never returned a value above 0.5, so every piece of scenery
// behind a "> 0.8" test has been invisible since the game was written.
function hash(x,y){let h=Math.imul(x,374761393)^Math.imul(y,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
// ---------------------------------------------------------------- art
// The look of the game is baked once at start-up: tiling ground textures, soft
// glow sprites, and gradients built in unit space so one per colour serves
// every size. Everything drawn per frame after this is cheap, which is what
// keeps an iPad at sixty frames with a hundred slimes on screen.
function bake(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);return c}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
 return "rgb("+f(r)+","+f(g)+","+f(b)+")"}
const ART={glow:{},grad:{},en:{}};
function glowSprite(inner,outer){const k=inner+"|"+outer;let s=ART.glow[k];if(s)return s;
 s=bake(64,64,g=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,inner);gr.addColorStop(0.45,outer);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(0,0,64,64)});
 ART.glow[k]=s;return s}
function glow(x,y,r,inner,outer){cx.drawImage(glowSprite(inner,outer),x-r,y-r,r*2,r*2)}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"}
function bodyGrad(col){let g=ART.grad[col];if(g)return g;
 g=cx.createRadialGradient(-0.34,-0.4,0.05,0,0,1.15);
 g.addColorStop(0,shade(col,0.62));g.addColorStop(0.3,col);g.addColorStop(1,shade(col,-0.5));
 ART.grad[col]=g;return g}
function buildArt(){
 ART.grass=bake(256,256,(g,w,h)=>{
  g.fillStyle="#3d7a38";g.fillRect(0,0,w,h);
  for(let i=0;i<1100;i++){const x=Math.random()*w,y=Math.random()*h,r=2+Math.random()*9;
   g.fillStyle=["rgba(96,152,72,0.20)","rgba(38,92,44,0.22)","rgba(126,176,84,0.13)"][i%3];
   g.beginPath();g.ellipse(x,y,r,r*0.68,Math.random()*3,0,TAU);g.fill()}
  g.lineWidth=1.2;g.lineCap="round";
  for(let i=0;i<520;i++){const x=Math.random()*w,y=Math.random()*h,l=3+Math.random()*6,a=-1.35+Math.random()*0.7;
   g.strokeStyle=Math.random()<0.5?"rgba(156,206,114,0.30)":"rgba(28,66,32,0.28)";
   g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}});
 ART.grassPat=cx.createPattern(ART.grass,"repeat");
 // one soft vignette sprite, blitted rather than recomputed every frame
 ART.vigSprite=bake(256,180,(g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,h*0.34,w/2,h/2,w*0.76);
  gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(1,"rgba(4,12,6,0.55)");g.fillStyle=gr;g.fillRect(0,0,w,h)});
}
// Enemy bodies are painted once per kind and colour, then blitted. Filling a
// shaded path per slime looked the same and cost twice the frame rate.
const EREF=64;
function enemySprite(type,col,flash){const k=type+"|"+col+"|"+(flash?1:0);let sp=ART.en[k];if(sp)return sp;
 const R=EREF,pad=R*1.25,size=Math.ceil(pad*2);
 sp=bake(size,size,g=>{g.translate(pad,pad);
  const fill=v=>{g.fillStyle=flash?"#fff":v};
  const grad=()=>{if(flash){g.fillStyle="#fff";return}
   const gr=g.createRadialGradient(-R*0.34,-R*0.4,R*0.05,0,0,R*1.15);
   gr.addColorStop(0,shade(col,0.62));gr.addColorStop(0.3,col);gr.addColorStop(1,shade(col,-0.5));g.fillStyle=gr};
  if(type==="bruiser"||type==="golem"){grad();
   g.beginPath();g.moveTo(-R*0.98,-R*0.85);g.lineTo(R*0.98,-R*0.85);g.quadraticCurveTo(R*1.1,R*0.95,R*0.7,R*0.95);
   g.lineTo(-R*0.7,R*0.95);g.quadraticCurveTo(-R*1.1,R*0.95,-R*0.98,-R*0.85);g.closePath();g.fill();
   g.strokeStyle="rgba(0,0,0,0.3)";g.lineWidth=R*0.08;
   for(let i=0;i<3;i++){const yy=-R*0.4+i*R*0.5,w2=R*(0.5-i*0.06);g.beginPath();g.moveTo(-w2,yy);g.lineTo(w2-R*0.2,yy+R*0.1);g.stroke()}
   g.fillStyle="rgba(255,255,255,0.16)";g.beginPath();g.ellipse(-R*0.45,-R*0.45,R*0.3,R*0.2,-0.5,0,TAU);g.fill()}
  else if(type==="spitter"){grad();g.beginPath();g.ellipse(0,0,R,R*0.82,0,0,TAU);g.fill();
   fill(shade(col,-0.35));for(let i=0;i<6;i++){const a=i/6*TAU;g.beginPath();g.arc(Math.cos(a)*R*0.66,Math.sin(a)*R*0.52,R*0.17,0,TAU);g.fill()}
   g.fillStyle="rgba(255,255,255,0.3)";g.beginPath();g.ellipse(-R*0.3,-R*0.32,R*0.26,R*0.15,-0.5,0,TAU);g.fill()}
  else if(type==="bat"||type==="batlord"){grad();g.beginPath();g.arc(0,0,R*0.75,0,TAU);g.fill();
   fill(shade(col,-0.35));for(const sx of[-1,1]){g.beginPath();g.moveTo(sx*R*0.35,-R*0.6);g.lineTo(sx*R*0.55,-R*1.08);g.lineTo(sx*R*0.72,-R*0.5);g.closePath();g.fill()}
   g.fillStyle="rgba(255,255,255,0.28)";g.beginPath();g.ellipse(-R*0.28,-R*0.3,R*0.2,R*0.12,-0.5,0,TAU);g.fill()}
  else{grad();g.beginPath();g.moveTo(-R,R*0.15);g.bezierCurveTo(-R,-R*0.85,-R*0.5,-R*1.05,0,-R*1.05);
   g.bezierCurveTo(R*0.5,-R*1.05,R,-R*0.85,R,R*0.15);g.bezierCurveTo(R,R*0.75,R*0.55,R*0.95,0,R*0.95);
   g.bezierCurveTo(-R*0.55,R*0.95,-R,R*0.75,-R,R*0.15);g.closePath();g.fill();
   g.fillStyle="rgba(255,255,255,0.5)";g.beginPath();g.ellipse(-R*0.36,-R*0.42,R*0.26,R*0.15,-0.5,0,TAU);g.fill();
   g.fillStyle="rgba(255,255,255,0.28)";g.beginPath();g.arc(R*0.4,-R*0.2,R*0.1,0,TAU);g.fill()}});
 ART.en[k]=sp;return sp}
// ---------------------------------------------------------------- bosses
// The three bosses were borrowing the rank and file: the Golem was a bruiser,
// the Bat Lord a bat, the Slime King a plain slime with three gold triangles
// balanced on top. They get their own art now, baked at twice the reference
// size so it stays sharp scaled up, and eyes that are theirs rather than the
// same pair every slime wears.
const BREF=128;
// where the live, player-tracking pupils sit on each boss, in sprite units
const BOSSEYE={king:{x:0.34,y:-0.3,r:0.15},batlord:{x:0.3,y:-0.12,r:0.13},golem:{x:0.3,y:-0.22,r:0.12}};
function bossSprite(type,col,flash){const key="B"+type+"|"+col+"|"+(flash?1:0);let sp=ART.en[key];if(sp)return sp;
 const R=BREF,pad=R*1.25,size=Math.ceil(pad*2);
 const dark=shade(col,-0.5),deep=shade(col,-0.72),mid=shade(col,-0.18),lite=shade(col,0.55);
 sp=bake(size,size,g=>{g.translate(pad,pad);g.lineJoin="round";g.lineCap="round";
  const F=v=>flash?"#fff":v;
  const grad=(sx,sy,rr)=>{if(flash)return "#fff";
   const gr=g.createRadialGradient(sx,sy,rr*0.04,0,0,rr);
   gr.addColorStop(0,lite);gr.addColorStop(0.3,col);gr.addColorStop(0.72,mid);gr.addColorStop(1,dark);return gr};
  const poly=pts=>{g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath()};
  // sunken socket with a hot iris; the pupil is drawn live so it can follow
  const socket=(x,y,rx,ry,iris)=>{
   g.fillStyle=F("#0a0710");g.beginPath();g.ellipse(x,y,rx*1.28,ry*1.28,0,0,TAU);g.fill();
   if(!flash){const eg=g.createRadialGradient(x-rx*0.2,y-ry*0.25,rx*0.08,x,y,rx);
    eg.addColorStop(0,"#fffbe8");eg.addColorStop(0.42,iris);eg.addColorStop(1,shade(iris,-0.6));g.fillStyle=eg}
   else g.fillStyle="#fff";
   g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill()};
  const brow=(x,y,w2,h2,sgn)=>{g.fillStyle=F(deep);
   poly([[x-w2,y-h2*(sgn>0?2.2:0.9)],[x+w2,y-h2*(sgn>0?0.9:2.2)],[x+w2,y-h2*0.8],[x-w2,y-h2*0.8]]);g.fill()};

  if(type==="king"){
   // a heavy slime with a crown grown into it
   const body=()=>{g.beginPath();g.moveTo(-R,R*0.2);
    g.bezierCurveTo(-R,-R*0.8,-R*0.52,-R*1.02,0,-R*1.02);
    g.bezierCurveTo(R*0.52,-R*1.02,R,-R*0.8,R,R*0.2);
    g.bezierCurveTo(R,R*0.78,R*0.56,R*0.98,0,R*0.98);
    g.bezierCurveTo(-R*0.56,R*0.98,-R,R*0.78,-R,R*0.2);g.closePath()};
   body();g.fillStyle=grad(-R*0.36,-R*0.44,R*1.2);g.fill();
   g.strokeStyle=F("rgba(0,0,0,0.4)");g.lineWidth=R*0.035;g.stroke();
   g.save();body();g.clip();
   // lesser slimes suspended inside the king
   for(let i=0;i<7;i++){const a=hash(i,3)*TAU,d=hash(i+5,3)*R*0.72;
    g.fillStyle=F("rgba(0,0,0,0.14)");g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d+R*0.2,R*(0.09+hash(i+9,3)*0.1),0,TAU);g.fill();
    g.fillStyle=F("rgba(255,255,255,0.12)");g.beginPath();g.arc(Math.cos(a)*d-R*0.03,Math.sin(a)*d+R*0.16,R*(0.04+hash(i+2,3)*0.04),0,TAU);g.fill()}
   g.fillStyle=F("rgba(255,255,255,0.45)");g.beginPath();g.ellipse(-R*0.38,-R*0.46,R*0.28,R*0.16,-0.5,0,TAU);g.fill();
   g.restore();
   // jaw, fangs, tongue
   g.fillStyle=F("#2a0d18");g.beginPath();
   g.moveTo(-R*0.52,R*0.2);g.quadraticCurveTo(0,R*0.86,R*0.52,R*0.2);
   g.quadraticCurveTo(0,R*0.42,-R*0.52,R*0.2);g.closePath();g.fill();
   g.fillStyle=F("#ff5f8a");g.beginPath();g.ellipse(0,R*0.52,R*0.2,R*0.13,0,0,TAU);g.fill();
   g.fillStyle=F("#fff8e8");
   for(let i=0;i<4;i++){const x=-R*0.36+i*R*0.24;
    poly([[x,R*0.26],[x+R*0.1,R*0.26],[x+R*0.05,R*0.46]]);g.fill()}
   socket(-R*0.34,-R*0.3,R*0.2,R*0.19,"#ffd23c");socket(R*0.34,-R*0.3,R*0.2,R*0.19,"#ffd23c");
   brow(-R*0.34,-R*0.45,R*0.28,R*0.1,1);brow(R*0.34,-R*0.45,R*0.28,R*0.1,-1);
   // crown, sunk into the top of the head rather than floating above it
   g.fillStyle=F("#ffd040");
   poly([[-R*0.62,-R*0.74],[-R*0.5,-R*1.18],[-R*0.24,-R*0.86],[0,-R*1.3],[R*0.24,-R*0.86],
    [R*0.5,-R*1.18],[R*0.62,-R*0.74]]);g.fill();
   g.strokeStyle=F("#8a5a0c");g.lineWidth=R*0.035;g.stroke();
   g.fillStyle=F("#ff5060");g.beginPath();g.arc(0,-R*0.86,R*0.075,0,TAU);g.fill();
   g.fillStyle=F("#50c0ff");g.beginPath();g.arc(-R*0.36,-R*0.82,R*0.05,0,TAU);
   g.arc(R*0.36,-R*0.82,R*0.05,0,TAU);g.fill()}

  else if(type==="batlord"){
   // wings first, so the body sits over them
   const wing=sx=>{g.beginPath();g.moveTo(sx*R*0.42,-R*0.24);
    g.quadraticCurveTo(sx*R*1.22,-R*1.0,sx*R*1.54,-R*0.36);
    g.quadraticCurveTo(sx*R*1.2,-R*0.42,sx*R*1.12,-R*0.18);
    g.quadraticCurveTo(sx*R*1.4,R*0.06,sx*R*1.36,R*0.26);
    g.quadraticCurveTo(sx*R*1.02,-R*0.02,sx*R*0.92,R*0.12);
    g.quadraticCurveTo(sx*R*1.12,R*0.38,sx*R*1.0,R*0.6);
    g.quadraticCurveTo(sx*R*0.72,R*0.22,sx*R*0.42,R*0.3);g.closePath();
    if(!flash){const wg=g.createLinearGradient(0,-R*0.8,0,R*0.5);
     wg.addColorStop(0,mid);wg.addColorStop(1,deep);g.fillStyle=wg}else g.fillStyle="#fff";
    g.fill();g.strokeStyle=F("rgba(0,0,0,0.5)");g.lineWidth=R*0.03;g.stroke();
    g.strokeStyle=F(shade(col,-0.35));g.lineWidth=R*0.05;
    for(const p2 of [[1.5,-0.34],[1.12,-0.18],[0.92,0.12],[1.0,0.6]]){
     g.beginPath();g.moveTo(sx*R*0.45,-R*0.14);g.lineTo(sx*R*p2[0],R*p2[1]);g.stroke()}};
   wing(-1);wing(1);
   // ears
   g.fillStyle=F(mid);
   poly([[-R*0.52,-R*0.5],[-R*0.68,-R*1.16],[-R*0.16,-R*0.66]]);g.fill();
   poly([[R*0.52,-R*0.5],[R*0.68,-R*1.16],[R*0.16,-R*0.66]]);g.fill();
   g.fillStyle=F("#ff9ac0");
   poly([[-R*0.5,-R*0.58],[-R*0.6,-R*1.0],[-R*0.26,-R*0.68]]);g.fill();
   poly([[R*0.5,-R*0.58],[R*0.6,-R*1.0],[R*0.26,-R*0.68]]);g.fill();
   g.beginPath();g.arc(0,0,R*0.78,0,TAU);g.fillStyle=grad(-R*0.3,-R*0.34,R*1.05);g.fill();
   g.strokeStyle=F("rgba(0,0,0,0.4)");g.lineWidth=R*0.035;g.stroke();
   // fur ruff
   g.fillStyle=F(deep);
   for(let i=0;i<11;i++){const a=Math.PI*0.12+i/10*Math.PI*0.76;
    poly([[Math.cos(a)*R*0.72,Math.sin(a)*R*0.72],[Math.cos(a+0.1)*R*0.95,Math.sin(a+0.1)*R*0.95],
     [Math.cos(a+0.2)*R*0.72,Math.sin(a+0.2)*R*0.72]]);g.fill()}
   socket(-R*0.3,-R*0.12,R*0.18,R*0.17,"#ff4a3a");socket(R*0.3,-R*0.12,R*0.18,R*0.17,"#ff4a3a");
   brow(-R*0.3,-R*0.28,R*0.26,R*0.09,1);brow(R*0.3,-R*0.28,R*0.26,R*0.09,-1);
   g.fillStyle=F("#2a0a1c");g.beginPath();g.ellipse(0,R*0.34,R*0.26,R*0.17,0,0,TAU);g.fill();
   g.fillStyle=F("#fff8e8");
   poly([[-R*0.16,R*0.26],[-R*0.05,R*0.26],[-R*0.1,R*0.5]]);g.fill();
   poly([[R*0.16,R*0.26],[R*0.05,R*0.26],[R*0.1,R*0.5]]);g.fill();
   g.fillStyle=F(shade(col,0.3));g.beginPath();g.ellipse(0,R*0.14,R*0.1,R*0.07,0,0,TAU);g.fill()}

  else{// golem: cracked stone with a furnace inside
   const body=()=>{g.beginPath();
    g.moveTo(-R*0.96,-R*0.7);g.lineTo(-R*0.5,-R*0.98);g.lineTo(R*0.5,-R*0.94);g.lineTo(R*0.98,-R*0.62);
    g.lineTo(R*0.86,R*0.2);g.lineTo(R*0.96,R*0.92);g.lineTo(R*0.3,R*0.98);g.lineTo(-R*0.36,R*0.98);
    g.lineTo(-R*0.94,R*0.9);g.lineTo(-R*0.82,R*0.16);g.closePath()};
   // shoulder blocks behind the torso
   g.fillStyle=F(deep);
   poly([[-R*1.24,-R*0.66],[-R*0.6,-R*0.86],[-R*0.62,-R*0.2],[-R*1.2,-R*0.06]]);g.fill();
   poly([[R*1.24,-R*0.66],[R*0.6,-R*0.86],[R*0.62,-R*0.2],[R*1.2,-R*0.06]]);g.fill();
   g.strokeStyle=F("rgba(0,0,0,0.45)");g.lineWidth=R*0.035;
   poly([[-R*1.24,-R*0.66],[-R*0.6,-R*0.86],[-R*0.62,-R*0.2],[-R*1.2,-R*0.06]]);g.stroke();
   poly([[R*1.24,-R*0.66],[R*0.6,-R*0.86],[R*0.62,-R*0.2],[R*1.2,-R*0.06]]);g.stroke();
   body();g.fillStyle=grad(-R*0.4,-R*0.5,R*1.3);g.fill();
   g.strokeStyle=F("rgba(0,0,0,0.5)");g.lineWidth=R*0.05;g.stroke();
   g.save();body();g.clip();
   // the furnace behind the cracks
   if(!flash){const fg=g.createRadialGradient(0,R*0.25,R*0.03,0,R*0.25,R*0.8);
    fg.addColorStop(0,"rgba(255,200,90,0.85)");fg.addColorStop(0.4,"rgba(255,90,30,0.45)");
    fg.addColorStop(1,"rgba(255,60,20,0)");g.fillStyle=fg;
    g.beginPath();g.arc(0,R*0.25,R*0.8,0,TAU);g.fill()}
   g.lineCap="round";
   const crack=pts=>{g.beginPath();g.moveTo(pts[0][0]*R,pts[0][1]*R);

function dmgMul(){return 1+0.15*(G.passives.power||0)}
function rateMul(){return 1/(1+0.12*(G.passives.haste||0))}
function xpMul(){return 1+0.2*(G.passives.wisdom||0)}
function magnetR(){return 90+45*(G.passives.magnet||0)}
function armor(){return G.passives.armor||0}
function hpMul(){return 1+G.t/110}   // enemies get tougher with time

// ---------------------------------------------------------------- spawning
function spawnEnemy(type,x,y){const d=ENEMY[type];const e={type,x,y,hp:d.hp*(d.boss?1+G.t/300:hpMul()),maxhp:0,r:d.r,spd:d.spd,dmg:d.dmg,xp:d.xp,col:d.col,score:d.score,boss:!!d.boss,flash:0,slow:0,burn:0,wob:Math.random()*TAU,ai:0,dash:0};e.maxhp=e.hp;G.en.push(e);return e;}
function edgePoint(){const a=Math.random()*TAU;const R=Math.max(W,H)/S*0.62+40;return {x:G.px+Math.cos(a)*R,y:G.py+Math.sin(a)*R}}
function spawnWave(dt){
 const t=G.t;
 let rate=1.2+t/45; // enemies per second
 if(t>480)rate*=1.5;
 G.spawnAcc+=rate*dt;
 while(G.spawnAcc>=1){G.spawnAcc-=1;const p=edgePoint();let type="slime";const r=Math.random();
  if(t>420&&r<0.16)type="ghost";else if(t>200&&r<0.32)type="spitter";else if(t>110&&r<0.5)type="bruiser";else if(t>50&&r<0.72)type="bat";
  spawnEnemy(type,p.x,p.y);}
 // Swarm rings every 75 s from 1:15.
 if(t>75&&Math.floor((t-75)/75)>G.swarm){G.swarm++;const n=18+G.swarm*6;for(let i=0;i<n;i++){const a=i/n*TAU;const R=Math.max(W,H)/S*0.6;spawnEnemy(G.swarm%2?"bat":"slime",G.px+Math.cos(a)*R,G.py+Math.sin(a)*R);}announce("A SWARM CLOSES IN!");}
 // Bosses.
 if(t>=G.nextBoss&&!G.bossAlive){const which=G.nextBoss<200?"king":G.nextBoss<350?"batlord":"golem";const p=edgePoint();G.bossAlive=spawnEnemy(which,p.x,p.y);G.nextBoss+=150;announce(ENEMY[which].name+" APPEARS!");SFX.boss();shake=1;}
}
function announce(s){G.announce=s;G.announceT=3;}

// ---------------------------------------------------------------- weapons
function nearest(x,y,maxd,skip){let best=null,bd=maxd||1e9;for(const e of G.en){if(skip&&skip.has(e))continue;const d=dist(x,y,e.x,e.y)-e.r;if(d<bd){bd=d;best=e}}return best}
function fireWeapons(dt){
 const wp=G.weapons;const cd=G.cds;
 const tick=(k,base)=>{cd[k]=(cd[k]||0)-dt;if(cd[k]<=0){cd[k]=base*rateMul();return true}return false};
 if(wp.blaster&&tick("blaster",Math.max(0.16,0.55-wp.blaster*0.05))){const n=1+Math.floor((wp.blaster-1)/2);const tg=nearest(G.px,G.py,700);if(tg){const a=Math.atan2(tg.y-G.py,tg.x-G.px);for(let i=0;i<n;i++){const s=a+(i-(n-1)/2)*0.16;G.bul.push({k:"blaster",x:G.px,y:G.py,vx:Math.cos(s)*620,vy:Math.sin(s)*620,r:7,dmg:(8+wp.blaster*3)*dmgMul(),life:1.2,pierce:wp.blaster>=5?1:0,hit:new Set()});}SFX.shot();}}
 if(wp.boomerang&&tick("boomerang",Math.max(0.5,1.5-wp.boomerang*0.12))){const n=1+Math.floor(wp.boomerang/3);const tg=nearest(G.px,G.py,800);const base=tg?Math.atan2(tg.y-G.py,tg.x-G.px):G.facing>0?0:Math.PI;for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*0.7;G.bul.push({k:"boom",x:G.px,y:G.py,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:16+wp.boomerang*2,dmg:(10+wp.boomerang*4)*dmgMul(),life:2.4,t:0,pierce:99,hit:new Set(),rehit:0.35,spin:0});}SFX.shot();}
 if(wp.lightning&&tick("lightning",Math.max(0.6,1.7-wp.lightning*0.15))){const tg=nearest(G.px,G.py,520);if(tg){let cur=tg;const chain=1+wp.lightning;const seen=new Set();let px=G.px,py=G.py;for(let i=0;i<chain&&cur;i++){seen.add(cur);damage(cur,(14+wp.lightning*5)*dmgMul(),"zap");G.parts.push({k:"bolt",x1:px,y1:py,x2:cur.x,y2:cur.y,life:0.18});px=cur.x;py=cur.y;cur=nearest(cur.x,cur.y,260,seen);}SFX.zap();}}
 if(wp.frost&&tick("frost",Math.max(1.2,3.2-wp.frost*0.3))){const R=120+wp.frost*22;G.parts.push({k:"ring",x:G.px,y:G.py,r:R,life:0.5,col:"#a0e8ff"});for(const e of G.en){if(dist(G.px,G.py,e.x,e.y)<R+e.r){damage(e,(9+wp.frost*4)*dmgMul());e.slow=2.2;}}SFX.zap();}
 if(wp.rocket&&tick("rocket",Math.max(0.7,2.0-wp.rocket*0.18))){const n=1+Math.floor(wp.rocket/3);for(let i=0;i<n;i++){const a=Math.random()*TAU;G.bul.push({k:"rocket",x:G.px,y:G.py,vx:Math.cos(a)*200,vy:Math.sin(a)*200,r:9,dmg:(22+wp.rocket*8)*dmgMul(),life:3,aoe:70+wp.rocket*10,hit:new Set()});}SFX.shot();}
 if(wp.fire){G.trailT-=dt;if(G.trailT<=0){G.trailT=0.12;G.pk.push({k:"fire",x:G.px+rnd(-8,8),y:G.py+rnd(-8,8),r:26+wp.fire*4,life:2+wp.fire*0.4,dmg:(4+wp.fire*1.6)*dmgMul()});}}
 if(wp.orbit){G.orbitA+=dt*(2.6+wp.orbit*0.25);}
}
function damage(e,amt,kind){e.hp-=amt;e.flash=0.12;G.txt.push({x:e.x+rnd(-10,10),y:e.y-e.r,s:Math.round(amt)+"",life:0.6,col:kind==="zap"?"#c0f0ff":"#fff"});if(e.hp<=0)killEnemy(e);else if(Math.random()<0.3)SFX.hit();}
function killEnemy(e){if(e.dead)return;e.dead=true;G.kills++;G.score+=e.score;SFX.kill();
 for(let i=0;i<(e.boss?40:8);i++)G.parts.push({k:"dot",x:e.x,y:e.y,vx:rnd(-160,160),vy:rnd(-160,160),life:rnd(0.3,0.7),col:e.col,r:rnd(3,7)});
 const n=e.boss?12:1;for(let i=0;i<n;i++){const big=e.boss?10:e.xp>=3?3:1;G.gems.push({x:e.x+rnd(-e.r,e.r),y:e.y+rnd(-e.r,e.r),v:e.boss?4:e.xp,big,vx:0,vy:0});}
 if(e.type==="king"){for(let i=0;i<8;i++){const a=i/8*TAU;spawnEnemy("slime",e.x+Math.cos(a)*50,e.y+Math.sin(a)*50);}}
 if(e.boss){G.bossAlive=null;G.pk.push({k:"chest",x:e.x,y:e.y,r:22,life:60});announce(ENEMY[e.type].name+" DEFEATED!");shake=1;}
 else if(Math.random()<(e.type==="bruiser"?0.06:0.012)){const r=Math.random();G.pk.push({k:r<0.45?"heart":r<0.8?"magnet":"bomb",x:e.x,y:e.y,r:16,life:25});}
}

// ---------------------------------------------------------------- update
function update(dt){
 G.t+=dt;if(G.t>=RUN_LEN){win();return}
 const st=stickVec();const sp=moveSpeed();
 G.px+=st.x*sp*dt;G.py+=st.y*sp*dt;if(st.x!==0)G.facing=st.x>0?1:-1;
 G.inv=Math.max(0,G.inv-dt);G.magnetT=Math.max(0,G.magnetT-dt);
 if(G.passives.regen){G.hp=Math.min(G.maxhp,G.hp+G.passives.regen*dt);}
 spawnWave(dt);fireWeapons(dt);
 // Enemies.
 for(const e of G.en){
  let s=e.spd*(e.slow>0?0.45:1);e.slow=Math.max(0,e.slow-dt);e.flash=Math.max(0,e.flash-dt);e.wob+=dt*6;
  if(e.burn>0){e.burn-=dt;e.hp-=dt*6;if(e.hp<=0){killEnemy(e);continue}}
  const dx=G.px-e.x,dy=G.py-e.y,d=Math.hypot(dx,dy)||1;
  if(e.type==="bat"){e.ai+=dt*5;const px=-dy/d,py=dx/d;e.x+=(dx/d*s+px*Math.sin(e.ai)*120)*dt;e.y+=(dy/d*s+py*Math.sin(e.ai)*120)*dt;}
  else if(e.type==="spitter"){if(d>260){e.x+=dx/d*s*dt;e.y+=dy/d*s*dt}else if(d<180){e.x-=dx/d*s*0.7*dt;e.y-=dy/d*s*0.7*dt}e.ai-=dt;if(e.ai<=0&&d<420){e.ai=2.4;G.bul.push({k:"spit",x:e.x,y:e.y,vx:dx/d*220,vy:dy/d*220,r:9,dmg:e.dmg,life:3,enemy:true});}}
  else if(e.type==="ghost"){e.ai+=dt;const ph=e.ai%3;if(ph<2){e.x+=dx/d*s*dt;e.y+=dy/d*s*dt}}
  else if(e.type==="batlord"){e.dash-=dt;if(e.dash<=0){e.dash=2.5;e.ai=0.6;e.dvx=dx/d*520;e.dvy=dy/d*520;SFX.zap();}if(e.ai>0){e.ai-=dt;e.x+=e.dvx*dt;e.y+=e.dvy*dt}else{e.x+=dx/d*s*dt;e.y+=dy/d*s*dt}}
  else if(e.type==="golem"){e.x+=dx/d*s*dt;e.y+=dy/d*s*dt;e.ai-=dt;if(e.ai<=0){e.ai=2.2;for(let i=-1;i<=1;i++){const a=Math.atan2(dy,dx)+i*0.35;G.bul.push({k:"rock",x:e.x,y:e.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,r:16,dmg:e.dmg,life:2.5,enemy:true});}}}
  else{e.x+=dx/d*s*dt;e.y+=dy/d*s*dt;}
  // Contact with the player.
  if(d<e.r+16&&G.inv<=0){hurt(e.dmg);}
 }
 // Keep enemies from stacking into one blob.
 const en=G.en;for(let i=0;i<en.length;i++){const a=en[i];for(let j=i+1;j<en.length;j++){const b=en[j];const dx=b.x-a.x,dy=b.y-a.y;const md=a.r+b.r-6;if(Math.abs(dx)<md&&Math.abs(dy)<md){const d=Math.hypot(dx,dy)||1;if(d<md){const push=(md-d)*0.5;const nx=dx/d,ny=dy/d;if(!a.boss){a.x-=nx*push;a.y-=ny*push}if(!b.boss){b.x+=nx*push;b.y+=ny*push}}}}}
 G.en=G.en.filter(e=>!e.dead);
 // Orbit stars.
 if(G.weapons.orbit){const n=2+Math.floor(G.weapons.orbit/2),R=70+G.weapons.orbit*6;for(let i=0;i<n;i++){const a=G.orbitA+i/n*TAU;const sx=G.px+Math.cos(a)*R,sy=G.py+Math.sin(a)*R;for(const e of G.en){if(dist(sx,sy,e.x,e.y)<e.r+14){e.orbT=(e.orbT||0)-dt;if(e.orbT<=0){e.orbT=0.3;damage(e,(9+G.weapons.orbit*4)*dmgMul());}}}}}
 // Bullets.
 for(const b of G.bul){b.life-=dt;
  if(b.k==="boom"){b.t+=dt;b.spin+=dt*14;if(b.t>1.0){const dx=G.px-b.x,dy=G.py-b.y,d=Math.hypot(dx,dy)||1;b.vx=lerp(b.vx,dx/d*640,dt*4);b.vy=lerp(b.vy,dy/d*640,dt*4);if(b.t>1.3&&d<30)b.life=0;}b.rehit-=dt;if(b.rehit<=0){b.hit.clear();b.rehit=0.35}}
  if(b.k==="rocket"){const tg=nearest(b.x,b.y,600);if(tg){const dx=tg.x-b.x,dy=tg.y-b.y,d=Math.hypot(dx,dy)||1;b.vx=lerp(b.vx,dx/d*430,dt*5);b.vy=lerp(b.vy,dy/d*430,dt*5);}if(Math.random()<0.6)G.parts.push({k:"dot",x:b.x,y:b.y,vx:rnd(-30,30),vy:rnd(-30,30),life:0.3,col:"#ffb060",r:5});}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.enemy){if(dist(b.x,b.y,G.px,G.py)<b.r+16&&G.inv<=0){hurt(b.dmg);b.life=0}continue}
  for(const e of G.en){if(b.hit.has(e))continue;if(dist(b.x,b.y,e.x,e.y)<b.r+e.r){b.hit.add(e);
   if(b.k==="rocket"){explode(b.x,b.y,b.aoe,b.dmg);b.life=0;break}
   damage(e,b.dmg);if(b.k==="blaster"){if(b.pierce>0)b.pierce--;else{b.life=0;break}}}}
 }
 G.bul=G.bul.filter(b=>b.life>0);
 // Gems and pickups.
 const mr=G.magnetT>0?4000:magnetR();
 for(const g of G.gems){const dx=G.px-g.x,dy=G.py-g.y,d=Math.hypot(dx,dy);if(d<mr){const s=Math.min(900,400+ (mr-d)*3);g.x+=dx/d*s*dt;g.y+=dy/d*s*dt}if(d<22){g.dead=true;gainXP(g.v);}}
 G.gems=G.gems.filter(g=>!g.dead);if(G.gems.length>400)G.gems.splice(0,G.gems.length-400);
 for(const p of G.pk){p.life-=dt;
  if(p.k==="fire"){for(const e of G.en){if(dist(p.x,p.y,e.x,e.y)<p.r+e.r){e.burnT=(e.burnT||0)-dt;if(e.burnT<=0){e.burnT=0.4;damage(e,p.dmg);}}}continue}
  if(dist(p.x,p.y,G.px,G.py)<p.r+18){p.life=0;
   if(p.k==="heart"){G.hp=Math.min(G.maxhp,G.hp+40);SFX.pick();G.txt.push({x:G.px,y:G.py-30,s:"+40",life:0.8,col:"#ff8090"})}
   else if(p.k==="magnet"){G.magnetT=3;SFX.pick();announce("MAGNET!")}
   else if(p.k==="bomb"){SFX.boom();shake=1.2;flash=0.5;for(const e of G.en){if(!e.boss)damage(e,999);else damage(e,150)}}
   else if(p.k==="chest"){SFX.chest();openChest();}
  }}
 G.pk=G.pk.filter(p=>p.life>0);
 for(const p of G.parts){p.life-=dt;if(p.k==="dot"){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9}}
 G.parts=G.parts.filter(p=>p.life>0);
 for(const t of G.txt){t.life-=dt;t.y-=40*dt}G.txt=G.txt.filter(t=>t.life>0);
 shake=Math.max(0,shake-dt*2.5);flash=Math.max(0,flash-dt*2);G.announceT=Math.max(0,G.announceT-dt);
 if(G.lvlQueue>0){G.lvlQueue--;scene="levelup";makeCards();}
}
function explode(x,y,R,dmg){G.parts.push({k:"ring",x,y,r:R,life:0.35,col:"#ffa040"});for(let i=0;i<14;i++)G.parts.push({k:"dot",x,y,vx:rnd(-200,200),vy:rnd(-200,200),life:0.4,col:"#ff8040",r:6});for(const e of G.en){if(dist(x,y,e.x,e.y)<R+e.r)damage(e,dmg);}SFX.boom();shake=Math.max(shake,0.4);}
function hurt(d){const amt=Math.max(1,Math.round(d)-armor());G.hp-=amt;G.inv=0.6;flash=0.6;shake=Math.max(shake,0.5);SFX.hurt();G.txt.push({x:G.px,y:G.py-30,s:"-"+amt,life:0.8,col:"#ff5050"});if(G.hp<=0){G.hp=0;die();}}
function gainXP(v){G.xp+=v*xpMul();SFX.gem();while(G.xp>=G.xpNext){G.xp-=G.xpNext;G.level++;G.xpNext=Math.round(8+G.level*5+G.level*G.level*0.4);G.lvlQueue++;}}
function die(){scene="over";SFX.die();musicStop();saveRecord();}
function win(){scene="win";SFX.win();musicStop();saveRecord();}
function saveRecord(){const id=G.hero.id;const r=records[id]||{best:0,time:0,runs:0};r.runs++;if(G.score>r.best)r.best=G.score;if(G.t>r.time)r.time=Math.min(G.t,RUN_LEN);records[id]=r;store.set("records",records);}
// Level-up cards.
let cards=[];
function options(){const out=[];const nw=Object.keys(G.weapons).length,np=Object.keys(G.passives).length;
 for(const k in WEAPONS){const l=G.weapons[k]||0;if(l>=WEAPONS[k].max)continue;if(!l&&nw>=4)continue;out.push({k,w:true,l:l+1})}
 for(const k in PASSIVES){const l=G.passives[k]||0;if(l>=PASSIVES[k].max)continue;if(!l&&np>=4)continue;out.push({k,w:false,l:l+1})}
 return out;}
function makeCards(){const o=options();cards=[];for(let i=0;i<3&&o.length;i++){const j=rint(0,o.length-1);cards.push(o.splice(j,1)[0]);}if(!cards.length)cards.push({k:"heal"});}
function applyCard(c){if(c.k==="heal"){G.hp=G.maxhp;}else if(c.w){G.weapons[c.k]=c.l;}else{G.passives[c.k]=c.l;if(c.k==="vitality"){G.maxhp+=25;G.hp=Math.min(G.maxhp,G.hp+25)}}SFX.level();}
function openChest(){const o=options();if(!o.length){G.hp=G.maxhp;announce("FULL HEALTH!");return}const c=o[rint(0,o.length-1)];applyCard(c);announce("CHEST: "+(c.w?WEAPONS[c.k].name:PASSIVES[c.k].name)+" LV"+c.l+"!");shake=0.5;}

// ---------------------------------------------------------------- drawing
function drawGround(){
 const x0=G.px-W/2/S-90,y0=G.py-H/2/S-90,x1=G.px+W/2/S+90,y1=G.py+H/2/S+90;
 cx.fillStyle=ART.grassPat;cx.fillRect(x0,y0,x1-x0,y1-y0);
 const cs=64,i0=Math.floor(x0/cs),i1=Math.floor(x1/cs),j0=Math.floor(y0/cs),j1=Math.floor(y1/cs);
 // patches of lighter and darker turf, laid out by the world's own hash so
 // they never repeat the way a tiled texture does
 const ps=cs*2,pi0=Math.floor(x0/ps),pi1=Math.floor(x1/ps),pj0=Math.floor(y0/ps),pj1=Math.floor(y1/ps);
 for(let j=pj0;j<=pj1;j++)for(let i=pi0;i<=pi1;i++){const p=hash(i*7+1,j*7+3);
  if(p>0.62){cx.fillStyle=p>0.83?"rgba(150,196,110,0.10)":"rgba(24,58,28,0.13)";cx.fillRect(i*ps,j*ps,ps+1,ps+1)}}
 cx.lineCap="round";
 for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const h=hash(i,j);if(h<0.8)continue;
  const x=i*cs+hash(j,i)*cs,y=j*cs+hash(i*3,j)*cs;
  if(h>0.955){cx.fillStyle="rgba(0,0,0,0.18)";cx.beginPath();cx.ellipse(x+1,y+4,8,3.5,0,0,TAU);cx.fill();
   cx.fillStyle="#7d8590";cx.beginPath();cx.ellipse(x,y,7.5,5.5,h*9,0,TAU);cx.fill();
   cx.fillStyle="rgba(255,255,255,0.32)";cx.beginPath();cx.ellipse(x-2,y-2,3.2,2,h*9,0,TAU);cx.fill()}
  else if(h>0.9){const col=h>0.93?"#ffd7e6":"#fff3a0";cx.fillStyle=col;
   for(let k=0;k<5;k++){const a=k/5*TAU+h*7;cx.beginPath();cx.arc(x+Math.cos(a)*4.2,y+Math.sin(a)*4.2,3,0,TAU);cx.fill()}
   cx.fillStyle="#ffb020";cx.beginPath();cx.arc(x,y,2.2,0,TAU);cx.fill()}
  else{cx.strokeStyle=h>0.86?"rgba(140,196,104,0.7)":"rgba(34,76,38,0.55)";cx.lineWidth=2;
   for(let k=-1;k<=1;k++){cx.beginPath();cx.moveTo(x+k*3.4,y+5);cx.quadraticCurveTo(x+k*4.5,y-1,x+k*6.5,y-8);cx.stroke()}}}}
function drawHero(x,y,h,st,t){const moving=st.l>0.1;const bob=Math.abs(Math.sin(t*14))*(moving?4:0);const dir=G?G.facing:1;
 cx.save();cx.translate(x,y);
 cx.fillStyle="rgba(0,0,0,0.28)";cx.beginPath();cx.ellipse(0,18,16,7,0,0,TAU);cx.fill();
 cx.translate(0,-bob);
 const sw=Math.sin(t*14)*(moving?6:0);
 // legs
 cx.fillStyle="#243268";cx.fillRect(-9,6,7,14+sw*0.3);cx.fillRect(2,6,7,14-sw*0.3);
 cx.fillStyle="#1a2450";cx.fillRect(-9,18+sw*0.3,7,3);cx.fillRect(2,18-sw*0.3,7,3);
 // arms swing behind the body
 cx.strokeStyle=shade(h.skin,-0.12);cx.lineWidth=6;cx.lineCap="round";
 cx.beginPath();cx.moveTo(-10,-4);cx.lineTo(-13-sw*0.5,4);cx.stroke();
 cx.beginPath();cx.moveTo(10,-4);cx.lineTo(13+sw*0.5,4);cx.stroke();
 // body, lit from the upper left
 cx.save();cx.translate(0,0);cx.scale(13,15);cx.fillStyle=bodyGrad(h.shirt);
 cx.beginPath();cx.moveTo(-0.92,-0.62);cx.lineTo(0.92,-0.62);cx.quadraticCurveTo(1,0.7,0.8,0.68);cx.lineTo(-0.8,0.68);cx.quadraticCurveTo(-1,0.7,-0.92,-0.62);cx.closePath();cx.fill();cx.restore();
 cx.strokeStyle="rgba(0,0,0,0.28)";cx.lineWidth=1.5;rr(-12,-10,24,20,6);cx.stroke();

 // head

 cx.save();
 if(bat){const f=1+Math.sin(t*20)*(boss?0.1:0.18);cx.scale(f,1)}
 else if(e.type!=="bruiser"&&e.type!=="golem"&&e.type!=="spitter"){const sq=1+Math.sin(e.wob)*0.09;cx.translate(0,r*0.1);cx.scale(sq,1/sq)}

 // eyes follow the player. A boss has its own sockets baked in, so only the
 // pupil is drawn here, over the iris it was given.
 const dx=G.px-e.x,dy=G.py-e.y,d=Math.hypot(dx,dy)||1;
 if(boss){const E=BOSSEYE[e.type]||BOSSEYE.king,ex2=r*E.x,ey2=r*E.y,pr=r*E.r*0.46;
  cx.fillStyle=e.flash>0?"#fff":"#160309";

  cx.ellipse(ex2+dx/d*pr*0.5,ey2+dy/d*pr*0.5,pr*0.62,pr,0,0,TAU);cx.fill();

 else{const ex=r*0.32,ey=-r*0.15,er=Math.max(3,r*0.18);

  cx.fillStyle="#222";

  cx.fillStyle="rgba(255,255,255,0.8)";cx.beginPath();cx.arc(-ex-er*0.3,ey-er*0.35,er*0.2,0,TAU);cx.arc(ex-er*0.3,ey-er*0.35,er*0.2,0,TAU);cx.fill()}
 if(e.slow>0){glow(0,0,r*1.7,"rgba(160,232,255,0.5)","rgba(120,200,255,0.18)");
  cx.strokeStyle="rgba(220,248,255,0.65)";cx.lineWidth=2;cx.beginPath();cx.arc(0,0,r*1.15,0,TAU);cx.stroke()}

 for(const b of G.bul){
  const bg={blaster:"rgba(255,208,64,",boom:"rgba(128,224,255,",rocket:"rgba(255,80,128,",spit:"rgba(208,192,48,",rock:"rgba(128,136,152,"}[b.k];

function wrap(s,x,y,w,size,col){cx.font="bold "+size+"px sans-serif";const words=s.split(" ");let line="",ly=y;for(const wd of words){const t=line?line+" "+wd:wd;if(cx.measureText(t).width>w&&line){text(line,x,ly,size,col);line=wd;ly+=size+5}else line=t}if(line)text(line,x,ly,size,col);}
function drawEnd(won){cx.save();cx.scale(DPR,DPR);drawPanel(won?"YOU SURVIVED THE STORM!":"THE SLIMES GOT YOU",won?"":"Survived "+fmt(G.t),won?"#8dff5a":"#ff8080");
 const y=H*0.42;text("Score "+G.score,W/2,y,40,"#ffe060");text(G.kills+" slimes bashed     Level "+G.level,W/2,y+46,20,"#fff");
 const r=records[G.hero.id];if(r&&G.score>=r.best&&G.score>0)text("NEW BEST!",W/2,y+80,26,"#8dff5a");
 // on a phone in portrait a fixed 210px pair ran off both edges
 const ew=Math.min(210,(W-56)/2);
 buttons=[];btn(W/2-ew-10,H*0.72,ew,60,"PLAY AGAIN",()=>start(),{fill:"#3aa04a",size:24});btn(W/2+10,H*0.72,ew,60,"HEROES",()=>{scene="title"},{size:24});
 if(won){for(let i=0;i<30;i++){const x=(hash(i,3)*W+frameT*60*(1+hash(i,5)))%W,y=(hash(i,9)*H+frameT*90)%H;cx.fillStyle=["#ff6080","#ffe060","#60c0ff","#8dff5a"][i%4];cx.fillRect(x,y,8,8);}}
 drawButtons();cx.restore();}
function drawPause(){cx.save();cx.scale(DPR,DPR);drawPanel("PAUSED","");buttons=[];btn(W/2-120,H*0.45,240,60,"RESUME",()=>{scene="play";musicStart()},{fill:"#3aa04a",size:24});btn(W/2-120,H*0.45+80,240,60,"QUIT RUN",()=>{scene="title";saveRecord()},{size:24});btn(W/2-120,H*0.45+160,240,60,musicOn?"MUSIC: ON":"MUSIC: OFF",()=>musicToggle(),{size:20});drawButtons();cx.restore();}
function start(){newRun(HEROES[heroIdx]);scene="play";audioInit();musicStart();}
function onKey(code){if(code==="KeyP"||code==="Escape"){if(scene==="play"){scene="pause";musicStop()}else if(scene==="pause"){scene="play";musicStart()}}
 if(scene==="title"&&(code==="Space"||code==="Enter"))start();
 if(scene==="levelup"&&["Digit1","Digit2","Digit3"].includes(code)){const i=+code[5]-1;if(cards[i]){applyCard(cards[i]);scene="play"}}
 if((scene==="over"||scene==="win")&&(code==="Space"||code==="Enter"))start();}
musicOn=store.get("music",true);

// ---------------------------------------------------------------- loop
function frame(ts){requestAnimationFrame(frame);inputWatch();/*loop*/const dt=Math.min(0.05,(ts-tPrev)/1000||0.016);tPrev=ts;frameT+=dt;fxWatch(dt);
 cx.setTransform(1,0,0,1,0,0);cx.fillStyle="#1a2a1a";cx.fillRect(0,0,cv.width,cv.height);
 if(scene==="play"){update(dt);}
 if(scene==="play"||scene==="levelup"||scene==="pause"||scene==="over"||scene==="win"){if(G){drawWorld();drawHUD();}}
 if(scene==="title")drawTitle();else if(scene==="levelup")drawLevelUp();else if(scene==="pause")drawPause();else if(scene==="over")drawEnd(false);else if(scene==="win")drawEnd(true);
 drawDiag();
}
buildArt();
requestAnimationFrame(frame);
window.SS={get G(){return G},get scene(){return scene},start,HEROES,set scene(v){scene=v},get fx(){return FX},set fx(v){FX=v?1:0},get safe(){return SAFE}};
</script></body></html>
