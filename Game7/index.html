<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Slime Storm</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a2a1a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
</style></head><body><canvas id="c"></canvas>
<script>
"use strict";
// ============================================================ Slime Storm
// A one-thumb survivor: walk, weapons fire themselves, level up, survive
// ten minutes. Everything is drawn with canvas primitives and every sound is
// synthesised. Sophia, Rory and Dylan Games, Inc.
document.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

const cv=document.getElementById("c"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1,S=1; // S: world units -> css px
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(H/720,W/1100);if(S<0.55)S=0.55;}
window.addEventListener("resize",resize);resize();
const RUN_LEN=600; // seconds to survive
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967296;}
const store={get(k,d){try{const v=localStorage.getItem("slimestorm."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("slimestorm."+k,JSON.stringify(v))}catch(e){}}};

// ---------------------------------------------------------------- audio
let AC=null,master=null,musicOn=true,sfxOn=true,musicTimer=null,musicStep=0,musicNext=0;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);}catch(e){}}
function tone(f0,f1,dur,type,vol,delay){if(!AC||!sfxOn)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,delay){if(!AC||!sfxOn)return;const t=AC.currentTime+(delay||0);const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*0.7+(Math.random()*2-1)*0.3;d[i]=l*(1-i/n);}const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start(t);}
const SFX={
 shot(){tone(700,300,0.06,"square",0.05)},
 boom(){tone(240,60,0.18,"triangle",0.25);noise(0.15,0.2)},
 hit(){tone(500,200,0.05,"square",0.06)},
 kill(){tone(300,90,0.12,"square",0.12)},
 gem(){tone(1400,1900,0.05,"sine",0.08)},
 hurt(){tone(200,90,0.25,"sawtooth",0.25);noise(0.1,0.2)},
 level(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.12,"square",0.15,i*0.09))},
 pick(){[880,1175].forEach((f,i)=>tone(f,f,0.08,"triangle",0.15,i*0.07))},
 chest(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.14,"triangle",0.15,i*0.1))},
 zap(){tone(1500,300,0.1,"sawtooth",0.1);noise(0.05,0.1)},
 boss(){tone(100,60,0.6,"sawtooth",0.35);noise(0.5,0.3)},
 die(){[392,349,330,294,262].forEach((f,i)=>tone(f,f*0.98,0.22,"square",0.2,i*0.17))},
 win(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,f,0.16,"square",0.18,i*0.12))},
 click(){tone(1200,900,0.04,"square",0.08)},
};
// A cheerful loop: bass + lead, 150 BPM, scheduled a beat ahead.
const LEAD=[76,0,79,83,0,79,76,0, 74,0,76,79,0,76,74,0, 72,0,76,79,0,84,83,79, 76,0,74,0,72,0,0,0,
            76,0,79,83,0,86,84,83, 79,0,76,79,0,76,74,0, 72,74,76,79,83,84,86,88, 84,0,83,0,79,0,0,0];
const BASS=[40,0,40,0,47,0,40,0, 38,0,38,0,45,0,38,0, 36,0,36,0,43,0,36,0, 38,0,40,0,43,0,40,0,
            40,0,40,0,47,0,40,0, 38,0,38,0,45,0,38,0, 36,0,36,0,43,0,36,0, 43,0,40,0,36,0,0,0];
function musicTick(){if(!AC||!musicOn){return}const spb=60/150/2;while(musicNext<AC.currentTime+0.25){const i=musicStep%LEAD.length;const t=musicNext;const l=LEAD[i],b=BASS[i];
 if(l){const f=440*Math.pow(2,(l-69)/12);const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(0.045,t);g.gain.exponentialRampToValueAtTime(0.001,t+spb*0.9);o.connect(g);g.connect(master);o.start(t);o.stop(t+spb);}
 if(b){const f=440*Math.pow(2,(b-69)/12);const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0.09,t);g.gain.exponentialRampToValueAtTime(0.001,t+spb*1.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+spb*1.7);}
 if(i%4==0){noise(0.04,0.05,t-AC.currentTime)}
 musicStep++;musicNext+=spb;}}
function musicStart(){if(!AC)return;if(musicTimer)return;musicNext=AC.currentTime+0.1;musicStep=0;musicTimer=setInterval(musicTick,100);}
function musicStop(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

// ---------------------------------------------------------------- input
const keys={};window.addEventListener("keydown",e=>{keys[e.code]=true;if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();onKey(e.code)});window.addEventListener("keyup",e=>{keys[e.code]=false});
const touch={id:-1,ox:0,oy:0,x:0,y:0,taps:[]};let mouseDown=false;
function pos(e){return {x:e.clientX,y:e.clientY}}
cv.addEventListener("touchstart",e=>{audioInit();for(const t of e.changedTouches){const p={x:t.clientX,y:t.clientY};if(uiTap(p))continue;if(touch.id<0){touch.id=t.identifier;touch.ox=touch.x=p.x;touch.oy=touch.y=p.y;}}},{passive:false});
cv.addEventListener("touchmove",e=>{for(const t of e.changedTouches)if(t.identifier===touch.id){touch.x=t.clientX;touch.y=t.clientY}},{passive:false});
function tend(e){for(const t of e.changedTouches)if(t.identifier===touch.id)touch.id=-1}
cv.addEventListener("touchend",tend);cv.addEventListener("touchcancel",tend);
cv.addEventListener("mousedown",e=>{audioInit();const p=pos(e);if(uiTap(p))return;mouseDown=true;touch.id=99;touch.ox=touch.x=p.x;touch.oy=touch.y=p.y;});
window.addEventListener("mousemove",e=>{if(mouseDown){touch.x=e.clientX;touch.y=e.clientY}});
window.addEventListener("mouseup",()=>{mouseDown=false;if(touch.id===99)touch.id=-1});
function stickVec(){let x=0,y=0;if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;
 if(touch.id>=0){const dx=touch.x-touch.ox,dy=touch.y-touch.oy;const d=Math.hypot(dx,dy),R=60;if(d>8){const m=Math.min(d,R)/R;x=dx/d*m;y=dy/d*m;}}
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return {x,y,l:Math.min(l,1)}}
// Buttons: rectangles registered each frame by the UI drawing code.
let buttons=[];
function btn(x,y,w,h,label,cb,opt){buttons.push({x,y,w,h,label,cb,opt:opt||{}});}
function uiTap(p){for(const b of buttons){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){SFX.click();b.cb();return true}}return false}
function drawButtons(){for(const b of buttons){const o=b.opt;cx.save();rr(b.x,b.y,b.w,b.h,14);cx.fillStyle=o.fill||"rgba(255,255,255,0.12)";cx.fill();cx.lineWidth=3;cx.strokeStyle=o.stroke||"rgba(255,255,255,0.5)";cx.stroke();
 cx.fillStyle=o.color||"#fff";cx.font=(o.size||22)+"px sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(b.label,b.x+b.w/2,b.y+b.h/2);cx.restore();}}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function text(s,x,y,size,color,align,weight){cx.font=(weight||"bold")+" "+size+"px sans-serif";cx.textAlign=align||"center";cx.textBaseline="middle";cx.lineWidth=Math.max(3,size/7);cx.strokeStyle="rgba(0,0,0,0.75)";cx.lineJoin="round";cx.strokeText(s,x,y);cx.fillStyle=color||"#fff";cx.fillText(s,x,y);}

// ---------------------------------------------------------------- content
const HEROES=[
 {id:"dylan",name:"DYLAN",desc:"Blaster. Steady and strong.",weapon:"blaster",hp:100,speed:1.0,cap:"#e03030",shirt:"#3060d0",skin:"#f8cc9c"},
 {id:"rory",name:"RORY",desc:"Boomerang. Fastest on his feet.",weapon:"boomerang",hp:85,speed:1.18,cap:"#2fa84f",shirt:"#f0c030",skin:"#f8cc9c"},
 {id:"sophia",name:"SOPHIA",desc:"Star orbit. Toughest of all.",weapon:"orbit",hp:130,speed:1.0,cap:"#b040d0",shirt:"#f070a0",skin:"#f8cc9c"},
];
const WEAPONS={
 blaster:{name:"Blaster",icon:"◆",col:"#ffd040",desc:"Shoots at the nearest slime.",max:6},
 boomerang:{name:"Boomerang",icon:"↺",col:"#80e0ff",desc:"Flies out and back, cutting through everything.",max:6},
 orbit:{name:"Star Orbit",icon:"★",col:"#ffe080",desc:"Stars circle you and smash what they touch.",max:6},
 lightning:{name:"Lightning",icon:"⚡",col:"#c0f0ff",desc:"Zaps the nearest slime and chains to more.",max:6},
 fire:{name:"Fire Trail",icon:"▲",col:"#ff7030",desc:"Leaves burning ground behind you.",max:6},
 frost:{name:"Frost Ring",icon:"❄",col:"#a0e8ff",desc:"A cold pulse that slows and hurts everything near.",max:6},
 rocket:{name:"Rockets",icon:"➤",col:"#ff5080",desc:"Homing rockets that explode.",max:6},
};
const PASSIVES={
 speed:{name:"Speedy Shoes",icon:"»",col:"#80ff80",desc:"+12% move speed.",max:5},
 vitality:{name:"Big Heart",icon:"♥",col:"#ff6080",desc:"+25 max health and heal 25.",max:5},
 regen:{name:"Regrow",icon:"✚",col:"#80ffc0",desc:"Heal 1 every second.",max:5},
 power:{name:"Power",icon:"✊",col:"#ffa040",desc:"+15% damage.",max:5},
 haste:{name:"Quick Fire",icon:"⏩",col:"#ffff80",desc:"Weapons fire 12% faster.",max:5},
 wisdom:{name:"Brainy",icon:"✦",col:"#c0a0ff",desc:"+20% XP from gems.",max:5},
 magnet:{name:"Magnet",icon:"U",col:"#ff80ff",desc:"Gems fly to you from further away.",max:5},
 armor:{name:"Armour",icon:"▣",col:"#c0c0c0",desc:"Take 1 less damage from every hit.",max:3},
};
const ENEMY={
 slime:{hp:6,spd:75,r:16,dmg:8,xp:1,col:"#4fd25a",score:1},
 bat:{hp:5,spd:150,r:13,dmg:6,xp:1,col:"#9a5fe0",score:2},
 bruiser:{hp:45,spd:48,r:26,dmg:16,xp:3,col:"#a0703a",score:5},
 spitter:{hp:18,spd:70,r:17,dmg:10,xp:2,col:"#e8d040",score:4},
 ghost:{hp:12,spd:105,r:16,dmg:9,xp:2,col:"#d0e8ff",score:3},
 king:{hp:700,spd:52,r:64,dmg:25,xp:40,col:"#2fb040",score:100,boss:true,name:"SLIME KING"},
 batlord:{hp:900,spd:130,r:44,dmg:22,xp:50,col:"#6a30c0",score:150,boss:true,name:"BAT LORD"},
 golem:{hp:1800,spd:40,r:70,dmg:35,xp:80,col:"#707888",score:250,boss:true,name:"STONE GOLEM"},
};

// ---------------------------------------------------------------- game state
let G=null; // the run
let scene="title"; // title | play | levelup | pause | over | win | records
let heroIdx=store.get("hero",0);
let shake=0,flash=0,tPrev=0,frameT=0;
const records=store.get("records",{});
function newRun(hero){
 G={t:0,hero,px:0,py:0,hp:hero.hp,maxhp:hero.hp,level:1,xp:0,xpNext:8,kills:0,score:0,facing:1,
  weapons:{},passives:{},en:[],bul:[],gems:[],pk:[],parts:[],txt:[],cds:{},inv:0,orbitA:0,trailT:0,bossAlive:null,nextBoss:150,
  spawnAcc:0,swarm:0,announce:"",announceT:0,lvlQueue:0,magnetT:0,wave:0,chestT:0};
 G.weapons[hero.weapon]=1;
 shake=0;flash=0;
}
function moveSpeed(){return 190*G.hero.speed*(1+0.12*(G.passives.speed||0))}
function dmgMul(){return 1+0.15*(G.passives.power||0)}
function rateMul(){return 1/(1+0.12*(G.passives.haste||0))}
function xpMul(){return 1+0.2*(G.passives.wisdom||0)}
function magnetR(){return 90+45*(G.passives.magnet||0)}
function armor(){return G.passives.armor||0}
function hpMul(){return 1+G.t/110}   // enemies get tougher with time

// ---------------------------------------------------------------- spawning
function spawnEnemy(type,x,y){const d=ENEMY[type];const e={type,x,y,hp:d.hp*(d.boss?1+G.t/300:hpMul()),maxhp:0,r:d.r,spd:d.spd,dmg:d.dmg,xp:d.xp,col:d.col,score:d.score,boss:!!d.boss,flash:0,slow:0,burn:0,wob:Math.random()*TAU,ai:0,dash:0};e.maxhp=e.hp;G.en.push(e);return e;}
function edgePoint(){const a=Math.random()*TAU;const R=Math.max(W,H)/S*0.62+40;return {x:G.px+Math.cos(a)*R,y:G.py+Math.sin(a)*R}}
function spawnWave(dt){
 const t=G.t;
 let rate=1.2+t/45; // enemies per second
 if(t>480)rate*=1.5;
 G.spawnAcc+=rate*dt;
 while(G.spawnAcc>=1){G.spawnAcc-=1;const p=edgePoint();let type="slime";const r=Math.random();
  if(t>420&&r<0.16)type="ghost";else if(t>200&&r<0.32)type="spitter";else if(t>110&&r<0.5)type="bruiser";else if(t>50&&r<0.72)type="bat";
  spawnEnemy(type,p.x,p.y);}
 // Swarm rings every 75 s from 1:15.
 if(t>75&&Math.floor((t-75)/75)>G.swarm){G.swarm++;const n=18+G.swarm*6;for(let i=0;i<n;i++){const a=i/n*TAU;const R=Math.max(W,H)/S*0.6;spawnEnemy(G.swarm%2?"bat":"slime",G.px+Math.cos(a)*R,G.py+Math.sin(a)*R);}announce("A SWARM CLOSES IN!");}
 // Bosses.
 if(t>=G.nextBoss&&!G.bossAlive){const which=G.nextBoss<200?"king":G.nextBoss<350?"batlord":"golem";const p=edgePoint();G.bossAlive=spawnEnemy(which,p.x,p.y);G.nextBoss+=150;announce(ENEMY[which].name+" APPEARS!");SFX.boss();shake=1;}
}
function announce(s){G.announce=s;G.announceT=3;}

// ---------------------------------------------------------------- weapons
function nearest(x,y,maxd,skip){let best=null,bd=maxd||1e9;for(const e of G.en){if(skip&&skip.has(e))continue;const d=dist(x,y,e.x,e.y)-e.r;if(d<bd){bd=d;best=e}}return best}
function fireWeapons(dt){
 const wp=G.weapons;const cd=G.cds;
 const tick=(k,base)=>{cd[k]=(cd[k]||0)-dt;if(cd[k]<=0){cd[k]=base*rateMul();return true}return false};
 if(wp.blaster&&tick("blaster",Math.max(0.16,0.55-wp.blaster*0.05))){const n=1+Math.floor((wp.blaster-1)/2);const tg=nearest(G.px,G.py,700);if(tg){const a=Math.atan2(tg.y-G.py,tg.x-G.px);for(let i=0;i<n;i++){const s=a+(i-(n-1)/2)*0.16;G.bul.push({k:"blaster",x:G.px,y:G.py,vx:Math.cos(s)*620,vy:Math.sin(s)*620,r:7,dmg:(8+wp.blaster*3)*dmgMul(),life:1.2,pierce:wp.blaster>=5?1:0,hit:new Set()});}SFX.shot();}}
 if(wp.boomerang&&tick("boomerang",Math.max(0.5,1.5-wp.boomerang*0.12))){const n=1+Math.floor(wp.boomerang/3);const tg=nearest(G.px,G.py,800);const base=tg?Math.atan2(tg.y-G.py,tg.x-G.px):G.facing>0?0:Math.PI;for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*0.7;G.bul.push({k:"boom",x:G.px,y:G.py,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:16+wp.boomerang*2,dmg:(10+wp.boomerang*4)*dmgMul(),life:2.4,t:0,pierce:99,hit:new Set(),rehit:0.35,spin:0});}SFX.shot();}
 if(wp.lightning&&tick("lightning",Math.max(0.6,1.7-wp.lightning*0.15))){const tg=nearest(G.px,G.py,520);if(tg){let cur=tg;const chain=1+wp.lightning;const seen=new Set();let px=G.px,py=G.py;for(let i=0;i<chain&&cur;i++){seen.add(cur);damage(cur,(14+wp.lightning*5)*dmgMul(),"zap");G.parts.push({k:"bolt",x1:px,y1:py,x2:cur.x,y2:cur.y,life:0.18});px=cur.x;py=cur.y;cur=nearest(cur.x,cur.y,260,seen);}SFX.zap();}}
 if(wp.frost&&tick("frost",Math.max(1.2,3.2-wp.frost*0.3))){const R=120+wp.frost*22;G.parts.push({k:"ring",x:G.px,y:G.py,r:R,life:0.5,col:"#a0e8ff"});for(const e of G.en){if(dist(G.px,G.py,e.x,e.y)<R+e.r){damage(e,(9+wp.frost*4)*dmgMul());e.slow=2.2;}}SFX.zap();}
 if(wp.rocket&&tick("rocket",Math.max(0.7,2.0-wp.rocket*0.18))){const n=1+Math.floor(wp.rocket/3);for(let i=0;i<n;i++){const a=Math.random()*TAU;G.bul.push({k:"rocket",x:G.px,y:G.py,vx:Math.cos(a)*200,vy:Math.sin(a)*200,r:9,dmg:(22+wp.rocket*8)*dmgMul(),life:3,aoe:70+wp.rocket*10,hit:new Set()});}SFX.shot();}
 if(wp.fire){G.trailT-=dt;if(G.trailT<=0){G.trailT=0.12;G.pk.push({k:"fire",x:G.px+rnd(-8,8),y:G.py+rnd(-8,8),r:26+wp.fire*4,life:2+wp.fire*0.4,dmg:(4+wp.fire*1.6)*dmgMul()});}}
 if(wp.orbit){G.orbitA+=dt*(2.6+wp.orbit*0.25);}
}
function damage(e,amt,kind){e.hp-=amt;e.flash=0.12;G.txt.push({x:e.x+rnd(-10,10),y:e.y-e.r,s:Math.round(amt)+"",life:0.6,col:kind==="zap"?"#c0f0ff":"#fff"});if(e.hp<=0)killEnemy(e);else if(Math.random()<0.3)SFX.hit();}
function killEnemy(e){if(e.dead)return;e.dead=true;G.kills++;G.score+=e.score;SFX.kill();
 for(let i=0;i<(e.boss?40:8);i++)G.parts.push({k:"dot",x:e.x,y:e.y,vx:rnd(-160,160),vy:rnd(-160,160),life:rnd(0.3,0.7),col:e.col,r:rnd(3,7)});
 const n=e.boss?12:1;for(let i=0;i<n;i++){const big=e.boss?10:e.xp>=3?3:1;G.gems.push({x:e.x+rnd(-e.r,e.r),y:e.y+rnd(-e.r,e.r),v:e.boss?4:e.xp,big,vx:0,vy:0});}
 if(e.type==="king"){for(let i=0;i<8;i++){const a=i/8*TAU;spawnEnemy("slime",e.x+Math.cos(a)*50,e.y+Math.sin(a)*50);}}
 if(e.boss){G.bossAlive=null;G.pk.push({k:"chest",x:e.x,y:e.y,r:22,life:60});announce(ENEMY[e.type].name+" DEFEATED!");shake=1;}
 else if(Math.random()<(e.type==="bruiser"?0.06:0.012)){const r=Math.random();G.pk.push({k:r<0.45?"heart":r<0.8?"magnet":"bomb",x:e.x,y:e.y,r:16,life:25});}
}

// ---------------------------------------------------------------- update
function update(dt){
 G.t+=dt;if(G.t>=RUN_LEN){win();return}
 const st=stickVec();const sp=moveSpeed();
 G.px+=st.x*sp*dt;G.py+=st.y*sp*dt;if(st.x!==0)G.facing=st.x>0?1:-1;

  else{e.x+=dx/d*s*dt;e.y+=dy/d*s*dt;}

 }

  if(b.k==="boom"){b.t+=dt;b.spin+=dt*14;if(b.t>1.0){const dx=G.px-b.x,dy=G.py-b.y,d=Math.hypot(dx,dy)||1;b.vx=lerp(b.vx,dx/d*640,dt*4);b.vy=lerp(b.vy,dy/d*640,dt*4);if(b.t>1.3&&d<30)b.life=0;}b.rehit-=dt;if(b.rehit<=0){b.hit.clear();b.rehit=0.35}}
  if(b.k==="rocket"){const tg=nearest(b.x,b.y,600);if(tg){const dx=tg.x-b.x,dy=tg.y-b.y,d=Math.hypot(dx,dy)||1;b.vx=lerp(b.vx,dx/d*430,dt*5);b.vy=lerp(b.vy,dy/d*430,dt*5);}if(Math.random()<0.6)G.parts.push({k:"dot",x:b.x,y:b.y,vx:rnd(-30,30),vy:rnd(-30,30),life:0.3,col:"#ffb060",r:5});}

  for(const e of G.en){if(b.hit.has(e))continue;if(dist(b.x,b.y,e.x,e.y)<b.r+e.r){b.hit.add(e);

function explode(x,y,R,dmg){G.parts.push({k:"ring",x,y,r:R,life:0.35,col:"#ffa040"});for(let i=0;i<14;i++)G.parts.push({k:"dot",x,y,vx:rnd(-200,200),vy:rnd(-200,200),life:0.4,col:"#ff8040",r:6});for(const e of G.en){if(dist(x,y,e.x,e.y)<R+e.r)damage(e,dmg);}SFX.boom();shake=Math.max(shake,0.4);}
function hurt(d){const amt=Math.max(1,Math.round(d)-armor());G.hp-=amt;G.inv=0.6;flash=0.6;shake=Math.max(shake,0.5);SFX.hurt();G.txt.push({x:G.px,y:G.py-30,s:"-"+amt,life:0.8,col:"#ff5050"});if(G.hp<=0){G.hp=0;die();}}
function gainXP(v){G.xp+=v*xpMul();SFX.gem();while(G.xp>=G.xpNext){G.xp-=G.xpNext;G.level++;G.xpNext=Math.round(8+G.level*5+G.level*G.level*0.4);G.lvlQueue++;}}
function die(){scene="over";SFX.die();musicStop();saveRecord();}
function win(){scene="win";SFX.win();musicStop();saveRecord();}
function saveRecord(){const id=G.hero.id;const r=records[id]||{best:0,time:0,runs:0};r.runs++;if(G.score>r.best)r.best=G.score;if(G.t>r.time)r.time=Math.min(G.t,RUN_LEN);records[id]=r;store.set("records",records);}
// Level-up cards.
let cards=[];
function options(){const out=[];const nw=Object.keys(G.weapons).length,np=Object.keys(G.passives).length;
 for(const k in WEAPONS){const l=G.weapons[k]||0;if(l>=WEAPONS[k].max)continue;if(!l&&nw>=4)continue;out.push({k,w:true,l:l+1})}
 for(const k in PASSIVES){const l=G.passives[k]||0;if(l>=PASSIVES[k].max)continue;if(!l&&np>=4)continue;out.push({k,w:false,l:l+1})}
 return out;}
function makeCards(){const o=options();cards=[];for(let i=0;i<3&&o.length;i++){const j=rint(0,o.length-1);cards.push(o.splice(j,1)[0]);}if(!cards.length)cards.push({k:"heal"});}
function applyCard(c){if(c.k==="heal"){G.hp=G.maxhp;}else if(c.w){G.weapons[c.k]=c.l;}else{G.passives[c.k]=c.l;if(c.k==="vitality"){G.maxhp+=25;G.hp=Math.min(G.maxhp,G.hp+25)}}SFX.level();}
function openChest(){const o=options();if(!o.length){G.hp=G.maxhp;announce("FULL HEALTH!");return}const c=o[rint(0,o.length-1)];applyCard(c);announce("CHEST: "+(c.w?WEAPONS[c.k].name:PASSIVES[c.k].name)+" LV"+c.l+"!");shake=0.5;}

 let x=W-20;for(const k in G.weapons){const w=WEAPONS[k];cx.fillStyle="rgba(0,0,0,0.45)";rr(x-40,H-52,38,38,8);cx.fill();text(w.icon,x-21,H-34,22,w.col);text(G.weapons[k],x-8,H-20,12,"#fff");x-=44;}
 for(const k in G.passives){const w=PASSIVES[k];cx.fillStyle="rgba(0,0,0,0.3)";rr(x-40,H-52,38,38,8);cx.fill();text(w.icon,x-21,H-34,20,w.col);text(G.passives[k],x-8,H-20,12,"#fff");x-=44;}
 if(G.bossAlive){const b=G.bossAlive;const bw=Math.min(500,W*0.6);cx.fillStyle="rgba(0,0,0,0.55)";rr(W/2-bw/2,60,bw,18,6);cx.fill();cx.fillStyle="#f04060";rr(W/2-bw/2+2,62,(bw-4)*Math.max(0,b.hp/b.maxhp),14,5);cx.fill();text(ENEMY[b.type].name,W/2,88,14,"#ffc0c0");}
 if(G.announceT>0){cx.globalAlpha=Math.min(1,G.announceT);text(G.announce,W/2,H*0.3,32,"#ffe060");cx.globalAlpha=1;}
 if(flash>0){cx.fillStyle="rgba(255,40,40,"+flash*0.35+")";cx.fillRect(0,0,W,H);}
 if(touch.id>=0&&touch.id!==99){cx.strokeStyle="rgba(255,255,255,0.4)";cx.lineWidth=2;cx.beginPath();cx.arc(touch.ox,touch.oy,64,0,TAU);cx.stroke();const dx=touch.x-touch.ox,dy=touch.y-touch.oy,d=Math.hypot(dx,dy),m=Math.min(d,60)/(d||1);cx.fillStyle="rgba(255,255,255,0.45)";cx.beginPath();cx.arc(touch.ox+dx*m,touch.oy+dy*m,26,0,TAU);cx.fill();}
 buttons=[];btn(W-64,52,48,40,"II",()=>{scene="pause";musicStop()},{size:20});
 drawButtons();cx.restore();}
function drawPanel(title,sub,color){cx.fillStyle="rgba(5,10,20,0.72)";cx.fillRect(0,0,W,H);text(title,W/2,H*0.2,Math.min(64,W/10),color||"#ffe060");if(sub)text(sub,W/2,H*0.2+52,22,"#fff");}
function drawTitle(){cx.save();cx.scale(DPR,DPR);
 // backdrop: slimes drifting
 cx.fillStyle="#2f5e2c";cx.fillRect(0,0,W,H);for(let i=0;i<24;i++){const x=(hash(i,7)*W+frameT*(20+i*3))%(W+80)-40,y=hash(i,11)*H;cx.fillStyle="rgba(80,210,90,0.35)";cx.beginPath();cx.ellipse(x,y,26,20,0,0,TAU);cx.fill();}
 const bob=Math.sin(frameT*2)*6;
 text("SLIME STORM",W/2+4,H*0.16+4+bob,Math.min(88,W/8),"#1a2a1a");text("SLIME STORM",W/2,H*0.16+bob,Math.min(88,W/8),"#8dff5a");
 text("Survive ten minutes. Your weapons fire themselves.",W/2,H*0.16+66,20,"#e8ffe0");
 buttons=[];const n=HEROES.length;const cw=Math.min(300,(W-60)/n-10),ch=Math.min(250,H*0.42);const y=H*0.36;
 HEROES.forEach((h,i)=>{const x=W/2+(i-(n-1)/2)*(cw+14)-cw/2;const sel=i===heroIdx;cx.fillStyle=sel?"rgba(255,255,255,0.22)":"rgba(0,0,0,0.35)";rr(x,y,cw,ch,18);cx.fill();cx.lineWidth=sel?5:2;cx.strokeStyle=sel?"#ffe060":"rgba(255,255,255,0.4)";cx.stroke();
  const st={l:sel?1:0};const sv=G;G={facing:1};drawHero(x+cw/2,y+ch*0.4,h,st,frameT);G=sv;
  text(h.name,x+cw/2,y+ch*0.62,26,sel?"#ffe060":"#fff");text(h.desc,x+cw/2,y+ch*0.74,14,"#dfe");const r=records[h.id];text(r?"Best "+r.best+"   "+fmt(r.time):"No runs yet",x+cw/2,y+ch*0.88,14,"#bfe");
  btn(x,y,cw,ch,"",()=>{heroIdx=i;store.set("hero",i)},{fill:"rgba(0,0,0,0)",stroke:"rgba(0,0,0,0)"});});
 btn(W/2-150,H*0.36+ch+24,300,64,"PLAY AS "+HEROES[heroIdx].name,()=>{start()},{fill:"#3aa04a",size:26});
 btn(20,H-64,150,44,musicOn?"MUSIC: ON":"MUSIC: OFF",()=>{musicOn=!musicOn;store.set("music",musicOn)},{size:16});
 text("Left thumb anywhere to move.   Grab gems to level up.   Pick an upgrade card.",W/2,H-30,15,"#cfe");
 drawButtons();cx.restore();}
function drawLevelUp(){cx.save();cx.scale(DPR,DPR);drawPanel("LEVEL "+G.level+"!","Choose an upgrade","#ffe060");
 buttons=[];const n=cards.length;const cw=Math.min(280,(W-40)/n-12),ch=Math.min(300,H*0.5);const y=H*0.35;
 cards.forEach((c,i)=>{const x=W/2+(i-(n-1)/2)*(cw+14)-cw/2;const d=c.k==="heal"?{name:"Full Heal",icon:"♥",col:"#ff6080",desc:"Everything is maxed out. Refill your health."}:c.w?WEAPONS[c.k]:PASSIVES[c.k];
  cx.fillStyle="rgba(20,30,50,0.95)";rr(x,y,cw,ch,18);cx.fill();cx.lineWidth=4;cx.strokeStyle=d.col;cx.stroke();
  text(d.icon,x+cw/2,y+ch*0.24,64,d.col);text(d.name,x+cw/2,y+ch*0.5,22,"#fff");text(c.k==="heal"?"":(c.l===1?"NEW!":"Level "+c.l),x+cw/2,y+ch*0.6,16,"#ffe060");
  wrap(d.desc,x+cw/2,y+ch*0.72,cw-30,15,"#dde");
  btn(x,y,cw,ch,"",()=>{applyCard(c);scene="play";},{fill:"rgba(0,0,0,0)",stroke:"rgba(0,0,0,0)"});});
 drawButtons();cx.restore();}
function wrap(s,x,y,w,size,col){cx.font="bold "+size+"px sans-serif";const words=s.split(" ");let line="",ly=y;for(const wd of words){const t=line?line+" "+wd:wd;if(cx.measureText(t).width>w&&line){text(line,x,ly,size,col);line=wd;ly+=size+5}else line=t}if(line)text(line,x,ly,size,col);}
function drawEnd(won){cx.save();cx.scale(DPR,DPR);drawPanel(won?"YOU SURVIVED THE STORM!":"THE SLIMES GOT YOU",won?"":"Survived "+fmt(G.t),won?"#8dff5a":"#ff8080");
 const y=H*0.42;text("Score "+G.score,W/2,y,40,"#ffe060");text(G.kills+" slimes bashed     Level "+G.level,W/2,y+46,20,"#fff");
 const r=records[G.hero.id];if(r&&G.score>=r.best&&G.score>0)text("NEW BEST!",W/2,y+80,26,"#8dff5a");
 buttons=[];btn(W/2-230,H*0.72,210,60,"PLAY AGAIN",()=>start(),{fill:"#3aa04a",size:24});btn(W/2+20,H*0.72,210,60,"HEROES",()=>{scene="title"},{size:24});
 if(won){for(let i=0;i<30;i++){const x=(hash(i,3)*W+frameT*60*(1+hash(i,5)))%W,y=(hash(i,9)*H+frameT*90)%H;cx.fillStyle=["#ff6080","#ffe060","#60c0ff","#8dff5a"][i%4];cx.fillRect(x,y,8,8);}}
 drawButtons();cx.restore();}
function drawPause(){cx.save();cx.scale(DPR,DPR);drawPanel("PAUSED","");buttons=[];btn(W/2-120,H*0.45,240,60,"RESUME",()=>{scene="play";musicStart()},{fill:"#3aa04a",size:24});btn(W/2-120,H*0.45+80,240,60,"QUIT RUN",()=>{scene="title";saveRecord()},{size:24});btn(W/2-120,H*0.45+160,240,60,musicOn?"MUSIC: ON":"MUSIC: OFF",()=>{musicOn=!musicOn;store.set("music",musicOn)},{size:20});drawButtons();cx.restore();}
function start(){newRun(HEROES[heroIdx]);scene="play";audioInit();musicStart();}
function onKey(code){if(code==="KeyP"||code==="Escape"){if(scene==="play"){scene="pause";musicStop()}else if(scene==="pause"){scene="play";musicStart()}}
 if(scene==="title"&&(code==="Space"||code==="Enter"))start();
 if(scene==="levelup"&&["Digit1","Digit2","Digit3"].includes(code)){const i=+code[5]-1;if(cards[i]){applyCard(cards[i]);scene="play"}}
 if((scene==="over"||scene==="win")&&(code==="Space"||code==="Enter"))start();}
musicOn=store.get("music",true);

// ---------------------------------------------------------------- loop
function frame(ts){const dt=Math.min(0.05,(ts-tPrev)/1000||0.016);tPrev=ts;frameT+=dt;
 cx.setTransform(1,0,0,1,0,0);cx.fillStyle="#1a2a1a";cx.fillRect(0,0,cv.width,cv.height);
 if(scene==="play"){update(dt);}
 if(scene==="play"||scene==="levelup"||scene==="pause"||scene==="over"||scene==="win"){if(G){drawWorld();drawHUD();}}
 if(scene==="title")drawTitle();else if(scene==="levelup")drawLevelUp();else if(scene==="pause")drawPause();else if(scene==="over")drawEnd(false);else if(scene==="win")drawEnd(true);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.SS={get G(){return G},get scene(){return scene},start,HEROES,set scene(v){scene=v}};
</script></body></html>
