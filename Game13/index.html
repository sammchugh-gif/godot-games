<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dungeon Dash</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0a0710;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
</style><script src="../menu.js" defer></script>
<script src="../fresh.js" defer></script>
</head><body><canvas id="c"></canvas>
<script>
"use strict";
// ========================================================== Dungeon Dash
// A one-thumb dungeon crawl. Move with the left of the screen, your weapon
// aims and fires itself, and the two buttons on the right are a dash through
// danger and a special that the dungeon pays you for killing things.
// Three floors, a room at a time, doors that stay shut until the room is
// clear, relics that stack, and a boss at the bottom of every floor.
// Sophia, Rory and Dylan Games, Inc.
document.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
const cv=document.getElementById("c"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
// viewport-fit=cover puts the notch and the home bar on top of the canvas.
// CSS knows where they are; script only finds out by measuring something
// that uses the insets.
const safeProbe=document.createElement("div");
safeProbe.style.cssText="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;"+
 "padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
document.body.appendChild(safeProbe);
const SAFE={t:0,r:0,b:0,l:0};
function readSafe(){const st=getComputedStyle(safeProbe);
 SAFE.t=parseFloat(st.paddingTop)||0;SAFE.r=parseFloat(st.paddingRight)||0;
 SAFE.b=parseFloat(st.paddingBottom)||0;SAFE.l=parseFloat(st.paddingLeft)||0}
function resize(){readSafe();DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,150));resize();

const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
// Angle difference folded into -PI..PI, so turning always takes the short way.
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}

// The phone gives up on the extra scenery long before it gives up on the
// game, so the trimmings watch the frame time and switch themselves off.
let FX=1,fxAcc=0,fxN=0;
function fxWatch(dt){fxAcc+=dt;fxN++;if(fxN<45)return;const avg=fxAcc/fxN;fxAcc=0;fxN=0;
 if(FX&&avg>1/44)FX=0;else if(!FX&&avg<1/56)FX=1}

const store={get(k,d){try{const v=localStorage.getItem("dungeondash."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem("dungeondash."+k,JSON.stringify(v))}catch(e){}}};

// ---------------------------------------------------------------- audio
let AC=null,master=null,musicOn=store.get("music",true)!==false,sfxOn=true,musicTimer=null,musicStep=0,musicNext=0,musicSet=0;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);}catch(e){}}
function tone(f0,f1,dur,type,vol,delay){if(!AC||!sfxOn)return;const t=AC.currentTime+(delay||0);
 const o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02)}
function noise(dur,vol,delay,lp){if(!AC||!sfxOn)return;const t=AC.currentTime+(delay||0);
 const n=Math.max(1,Math.floor(AC.sampleRate*dur)),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 let l=0,k=lp==null?0.7:lp;for(let i=0;i<n;i++){l=l*k+(Math.random()*2-1)*(1-k);d[i]=l*(1-i/n)}
 const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=vol;
 s.connect(g);g.connect(master);s.start(t)}
const SFX={
 arrow(){tone(900,420,0.05,"square",0.04)},
 blade(){tone(520,760,0.07,"triangle",0.05)},
 orb(){tone(300,560,0.09,"sine",0.06)},
 hit(){tone(440,180,0.05,"square",0.055)},
 kill(){tone(280,80,0.13,"square",0.11);noise(0.08,0.07)},
 crit(){tone(1000,300,0.1,"sawtooth",0.09)},
 hurt(){tone(200,80,0.26,"sawtooth",0.24);noise(0.12,0.2)},
 dash(){noise(0.14,0.16,0,0.85);tone(260,700,0.1,"sine",0.05)},
 fury(){[392,523,659,880].forEach((f,i)=>tone(f,f*1.5,0.2,"sawtooth",0.12,i*0.05));noise(0.3,0.2)},
 coin(){tone(1180,1700,0.05,"square",0.06);tone(1700,2100,0.05,"square",0.04,0.04)},
 heart(){[659,880,1046].forEach((f,i)=>tone(f,f,0.1,"sine",0.13,i*0.07))},
 key(){[880,1175,1568].forEach((f,i)=>tone(f,f,0.09,"triangle",0.12,i*0.06))},
 door(){tone(150,70,0.35,"sawtooth",0.16);noise(0.3,0.14,0,0.9)},
 clear(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.13,"square",0.14,i*0.08))},
 relic(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.16,"triangle",0.14,i*0.1))},
 buy(){tone(880,1320,0.09,"square",0.1);tone(1320,1760,0.09,"square",0.08,0.08)},
 deny(){tone(200,140,0.14,"square",0.1)},
 stairs(){[440,554,659,880,1108].forEach((f,i)=>tone(f,f,0.18,"sine",0.14,i*0.11))},
 boss(){tone(90,52,0.8,"sawtooth",0.34);noise(0.7,0.28,0,0.92)},
 bossdie(){[220,185,147,110,82].forEach((f,i)=>tone(f,f*0.9,0.3,"sawtooth",0.22,i*0.16));noise(0.9,0.3,0.2,0.93)},
 die(){[392,349,311,262,196].forEach((f,i)=>tone(f,f*0.97,0.25,"square",0.2,i*0.18))},
 win(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,f,0.17,"square",0.17,i*0.12))},
 zap(){tone(1500,300,0.11,"sawtooth",0.09);noise(0.06,0.09)},
 click(){tone(1100,780,0.04,"square",0.07)},
};
// Three dungeon themes, one per floor: a minor crawl, a loping cave march and
// a fast, nasty descent. Scheduled a beat ahead of the clock so the phone
// throttling a timer does not make it stutter.
const TRACKS=[
 {bpm:112,lead:[64,0,67,0,71,0,67,0, 65,0,69,0,72,0,69,0, 64,0,67,0,71,72,74,0, 71,0,67,0,64,0,0,0],
        bass:[40,0,40,0,40,0,47,0, 41,0,41,0,41,0,48,0, 40,0,40,0,40,0,43,0, 45,0,43,0,40,0,0,0]},
 {bpm:126,lead:[69,0,72,76,0,72,69,0, 67,0,71,74,0,71,67,0, 69,72,76,79,0,76,72,0, 71,0,69,0,67,0,0,0],
        bass:[45,0,45,52,0,45,0,45, 43,0,43,50,0,43,0,43, 45,0,45,52,0,45,0,45, 47,0,45,0,43,0,0,0]},
 {bpm:142,lead:[72,0,75,0,79,0,75,0, 74,0,77,0,81,0,77,0, 72,75,79,82,84,82,79,75, 74,0,72,0,70,0,0,0],
        bass:[36,36,0,36,43,0,36,0, 38,38,0,38,45,0,38,0, 36,36,0,36,43,0,36,0, 41,0,40,0,38,0,0,0]},
];
function musicTick(){if(!AC||!musicOn)return;const T=TRACKS[musicSet%TRACKS.length],spb=60/T.bpm/2;
 while(musicNext<AC.currentTime+0.3){const i=musicStep%T.lead.length,t=musicNext,l=T.lead[i],b=T.bass[i];
  if(l){const f=440*Math.pow(2,(l-69)/12),o=AC.createOscillator(),g=AC.createGain();
   o.type="square";o.frequency.value=f;g.gain.setValueAtTime(0.032,t);
   g.gain.exponentialRampToValueAtTime(0.001,t+spb*0.85);o.connect(g);g.connect(master);o.start(t);o.stop(t+spb)}
  if(b){const f=440*Math.pow(2,(b-69)/12),o=AC.createOscillator(),g=AC.createGain();
   o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0.085,t);
   g.gain.exponentialRampToValueAtTime(0.001,t+spb*1.5);o.connect(g);g.connect(master);o.start(t);o.stop(t+spb*1.6)}
  if(i%8===0)noise(0.05,0.05,t-AC.currentTime,0.5);
  if(i%4===2)noise(0.03,0.028,t-AC.currentTime,0.2);
  musicStep++;musicNext+=spb}}
function musicStart(){if(!AC||musicTimer||!musicOn)return;musicNext=AC.currentTime+0.1;musicTimer=setInterval(musicTick,110)}
function musicStop(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
// One owner for the switch. Flipping a flag and leaving the track running is
// how a music button ends up doing nothing.
function musicToggle(){musicOn=!musicOn;store.set("music",musicOn);
 if(musicOn){audioInit();if(scene==="play")musicStart()}else musicStop()}

// ---------------------------------------------------------------- input
const keys={};
window.addEventListener("keydown",e=>{keys[e.code]=true;
 if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();onKey(e.code)});
window.addEventListener("keyup",e=>{keys[e.code]=false});
// A finger is only a game coordinate once it has been measured against the
// canvas. Assuming the window and the canvas agree breaks every tap on the
// day they stop agreeing, and the game keeps drawing perfectly while it does.
function rectPos(x0,y0){const r=cv.getBoundingClientRect();
 return{x:r.width?(x0-r.left)*(W/r.width):x0,y:r.height?(y0-r.top)*(H/r.height):y0}}
function pos(e){return rectPos(e.clientX,e.clientY)}
function onMenu(el){for(;el;el=el.parentNode)if(el.id&&String(el.id).indexOf("shelf-menu")===0)return true;return false}
// A tap on a touch screen is followed by a synthetic mouse event a moment
// later. Both reach the canvas, so without this guard every button fires
// twice on one tap - which is invisible until a toggle flips straight back.
let lastTouchAt=0;
const ghostMouse=()=>performance.now()-lastTouchAt<900;
const stick={id:-1,ox:0,oy:0,x:0,y:0};
let mouseDown=false;
const STICK_R=62;
function stickVec(){let x=0,y=0;
 if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;
 if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;
 if(stick.id>=0){const dx=stick.x-stick.ox,dy=stick.y-stick.oy,d=Math.hypot(dx,dy);
  if(d>7){const m=Math.min(d,STICK_R)/STICK_R;x=dx/d*m;y=dy/d*m}}
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
 return{x,y,l:Math.min(l,1)}}
let buttons=[];
function btn(x,y,w,h,label,cb,opt){buttons.push({x,y,w,h,label,cb,opt:opt||{}})}
function uiTap(p){for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];
 if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){SFX.click();b.cb();return true}}return false}
// The action pads live on the right of the screen and are not buttons: they
// need to know when the finger lifts, so they track an id of their own.
const pads={dash:{id:-1,down:false,hit:0},fury:{id:-1,down:false,hit:0}};
let padRects={dash:null,fury:null};
function padAt(p){for(const k in padRects){const r=padRects[k];if(!r)continue;
 if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)return k}return null}
function pressPad(k){const q=pads[k];if(q.down)return;q.down=true;q.hit=1}
function releasePad(k){pads[k].down=false}
window.addEventListener("touchstart",e=>{lastTouchAt=performance.now();audioInit();
 for(const t of e.changedTouches){if(onMenu(t.target))continue;
  const p=rectPos(t.clientX,t.clientY);
  if(uiTap(p))continue;
  const k=padAt(p);
  if(k){pads[k].id=t.identifier;pressPad(k);continue}
  if(stick.id<0){stick.id=t.identifier;stick.ox=stick.x=p.x;stick.oy=stick.y=p.y}}},{passive:false});
window.addEventListener("touchmove",e=>{lastTouchAt=performance.now();
 for(const t of e.changedTouches)if(t.identifier===stick.id){
  const p=rectPos(t.clientX,t.clientY);stick.x=p.x;stick.y=p.y;
  // Let the thumb wander: if it drags past the ring, the ring follows it,
  // so a long swipe never runs out of travel.
  const dx=stick.x-stick.ox,dy=stick.y-stick.oy,d=Math.hypot(dx,dy);
  if(d>STICK_R){stick.ox=stick.x-dx/d*STICK_R;stick.oy=stick.y-dy/d*STICK_R}}},{passive:false});
function tend(e){lastTouchAt=performance.now();
 for(const t of e.changedTouches){if(t.identifier===stick.id)stick.id=-1;
  for(const k in pads)if(pads[k].id===t.identifier){pads[k].id=-1;releasePad(k)}}
 let held=false;for(const t of e.touches)if(t.identifier===stick.id)held=true;
 if(stick.id>=0&&stick.id!==99&&!held)stick.id=-1}
window.addEventListener("touchend",tend);window.addEventListener("touchcancel",tend);
function letGo(){if(stick.id!==99)stick.id=-1;for(const k in pads){pads[k].id=-1;releasePad(k)}}
window.addEventListener("blur",letGo);
document.addEventListener("visibilitychange",()=>{if(document.hidden)letGo()});
cv.addEventListener("mousedown",e=>{if(ghostMouse())return;audioInit();const p=pos(e);
 if(uiTap(p))return;const k=padAt(p);if(k){pads[k].id=99;pressPad(k);return}
 mouseDown=true;stick.id=99;stick.ox=stick.x=p.x;stick.oy=stick.y=p.y});
window.addEventListener("mousemove",e=>{if(!mouseDown)return;const p=pos(e);stick.x=p.x;stick.y=p.y;
 const dx=stick.x-stick.ox,dy=stick.y-stick.oy,d=Math.hypot(dx,dy);
 if(d>STICK_R){stick.ox=stick.x-dx/d*STICK_R;stick.oy=stick.y-dy/d*STICK_R}});
window.addEventListener("mouseup",()=>{mouseDown=false;if(stick.id===99)stick.id=-1;
 for(const k in pads)if(pads[k].id===99){pads[k].id=-1;releasePad(k)}});
window.__shelfInput=()=>"stick "+(stick.id<0?"free":"held#"+stick.id)+" pads "+(pads.dash.down?"D":"-")+(pads.fury.down?"F":"-");

// ---------------------------------------------------------------- art
// Everything is baked once into offscreen canvases at start-up and then
// blitted. Drawing a skeleton out of forty path calls is fine once; sixty
// times a frame on a phone it is not.
function hash(x,y){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263);
 h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function bake(w,h,fn){const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));fn(c.getContext("2d"),c.width,c.height);return c}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
 return "rgb("+f(r)+","+f(g)+","+f(b)+")"}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"}
const ART={glow:{},hero:{},wep:{},en:{},boss:{},prop:{},tile:{},pat:{},pick:{},ic:{}};
// Callers pass an rgba() string; the sprite fades that same colour to nothing.
function glowSprite(col,soft){const k=col+"|"+(soft?1:0);let sp=ART.glow[k];if(sp)return sp;
 const fade=a=>col.replace(/[\d.]+\)$/,a+")");
 sp=bake(128,128,(g,w)=>{const gr=g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);
  gr.addColorStop(0,col);gr.addColorStop(soft?0.48:0.22,fade(0.36));
  gr.addColorStop(0.72,fade(0.09));gr.addColorStop(1,fade(0));
  g.fillStyle=gr;g.fillRect(0,0,w,w)});
 ART.glow[k]=sp;return sp}
function glow(x,y,r,col,soft){const sp=glowSprite(col,soft);cx.drawImage(sp,x-r,y-r,r*2,r*2)}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
 g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.closePath()}

// Three floors, three looks. The palette drives the tiles, the walls, the
// torches and the fog, so one entry here changes the whole floor.
const THEMES=[
 {id:"catacombs",name:"THE CATACOMBS",
  floor:"#2c3143",floor2:"#242838",grout:"#171a26",speck:"#3c4358",
  wall:"#454d63",wallTop:"#5a6480",wallDark:"#20243180",edge:"#161926",
  torch:"#ff9c3a",fog:"#0b0d18",accent:"#7fb3ff",moss:"#3f6b4a"},
 {id:"hollow",name:"THE FUNGAL HOLLOW",
  floor:"#332452",floor2:"#281c42",grout:"#160e28",speck:"#453066",
  wall:"#4a3470",wallTop:"#60438e",wallDark:"#1d162c80",edge:"#150c26",
  torch:"#3ee0a0",fog:"#0d0620",accent:"#c07bff",moss:"#3f8a6a"},
 {id:"emberforge",name:"THE EMBERFORGE",
  floor:"#312020",floor2:"#291a1a",grout:"#170e0d",speck:"#4a2f2a",
  wall:"#4a2a24",wallTop:"#63382d",wallDark:"#22110e80",edge:"#1a0c0a",
  torch:"#ff5f2a",fog:"#140605",accent:"#ffb03a",moss:"#7a3a20"},
];
// A 160px slab tile per theme, drawn once and used as a repeating pattern.
function bakeTiles(){THEMES.forEach((T,ti)=>{
 const S=160;
 const c=bake(S,S,(g)=>{
  g.fillStyle=T.grout;g.fillRect(0,0,S,S);
  // slabs, offset course to course so the joints never line up
  const RW=40,RH=40;
  for(let r=0;r<4;r++){const off=(r%2)?RW/2:0;
   for(let i=-1;i<5;i++){const x=i*RW+off,y=r*RH;
    // a little tonal wander per slab, or the floor reads as bathroom tile
    const v=hash(i+r*13,r*7);
    g.fillStyle=v<0.5?T.floor2:T.floor;g.fillRect(x+1.5,y+1.5,RW-3,RH-3);
    g.fillStyle="rgba("+(v<0.5?"0,0,0":"255,255,255")+","+(0.02+v*0.05).toFixed(3)+")";
    g.fillRect(x+1.5,y+1.5,RW-3,RH-3);
    // one light direction: lit on the top left, shadowed bottom right
    g.fillStyle="rgba(255,255,255,0.05)";g.fillRect(x+1.5,y+1.5,RW-3,1.6);g.fillRect(x+1.5,y+1.5,1.6,RH-3);
    g.fillStyle="rgba(0,0,0,0.3)";g.fillRect(x+1.5,y+RH-3,RW-3,1.6);g.fillRect(x+RW-3,y+1.5,1.6,RH-3)}}
  // speckle and a couple of cracks so it is not a flat grid
  for(let i=0;i<220;i++){const x=Math.random()*S,y=Math.random()*S;
   g.fillStyle=Math.random()<0.5?"rgba(255,255,255,0.035)":"rgba(0,0,0,0.16)";
   g.fillRect(x,y,1+Math.random()*2,1+Math.random()*2)}
  g.strokeStyle="rgba(0,0,0,0.3)";g.lineWidth=1.4;
  for(let i=0;i<3;i++){let x=Math.random()*S,y=Math.random()*S;g.beginPath();g.moveTo(x,y);
   for(let j=0;j<5;j++){x+=rnd(-16,16);y+=rnd(-16,16);g.lineTo(x,y)}g.stroke()}
  if(ti===1){ // the hollow has faint glowing spores in the stone
   for(let i=0;i<14;i++){g.fillStyle=hexA("#66ffc8",0.12);
    g.beginPath();g.arc(Math.random()*S,Math.random()*S,rnd(1.5,3.5),0,TAU);g.fill()}}
  if(ti===2){ // the forge has cracks with light in them
   g.strokeStyle=hexA("#ff5f2a",0.35);g.lineWidth=2;
   for(let i=0;i<3;i++){let x=Math.random()*S,y=Math.random()*S;g.beginPath();g.moveTo(x,y);

// -------------------------------------------------------- dungeon layout
// A random walk from the start room, then the specials get handed out: the
// boss goes furthest from the door you came in by, and the shop, the shrine
// and the treasure go to dead ends where they will not be missed.
function buildFloor(fi){
 const F=FLOORS[fi],GW=7,GH=7;
 const key=(x,y)=>x+","+y;
 const map={};
 let cx0=3,cy0=3;
 const start={gx:cx0,gy:cy0,type:"start",doors:{},cleared:true,seen:true,visited:true};
 map[key(cx0,cy0)]=start;
 const order=[start];
 let guard=0;
 while(order.length<F.rooms&&guard++<900){
  const from=order[Math.floor(Math.random()*order.length)];
  const d=DIRS[Math.floor(Math.random()*4)];
  const nx=from.gx+d.dx,ny=from.gy+d.dy;
  if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
  if(map[key(nx,ny)])continue;
  // keep it from turning into a blob: a new room may only touch one existing
  let touch=0;
  for(const dd of DIRS)if(map[key(nx+dd.dx,ny+dd.dy)])touch++;
  if(touch>1&&Math.random()<0.82)continue;
  const room={gx:nx,gy:ny,type:"fight",doors:{},cleared:false,seen:false,visited:false};
  map[key(nx,ny)]=room;order.push(room);
 }
 // connect every neighbouring pair
 order.forEach(r=>{for(const d of DIRS){const n=map[key(r.gx+d.dx,r.gy+d.dy)];
  if(n){r.doors[d.n]=true;n.doors[OPP[d.n]]=true}}});
 // walking distance from the start
 const dists={};dists[key(cx0,cy0)]=0;
 let frontier=[start];
 while(frontier.length){const nxt=[];
  for(const r of frontier)for(const d of DIRS){const n=map[key(r.gx+d.dx,r.gy+d.dy)];
   if(n&&dists[key(n.gx,n.gy)]==null){dists[key(n.gx,n.gy)]=dists[key(r.gx,r.gy)]+1;nxt.push(n)}}
  frontier=nxt}
 const deg=r=>Object.keys(r.doors).length;
 const rest=order.slice(1);
 rest.sort((a,b)=>dists[key(b.gx,b.gy)]-dists[key(a.gx,a.gy)]);
 const boss=rest[0];boss.type="boss";
 const spare=rest.slice(1);
 const ends=shuffle(spare.filter(r=>deg(r)===1));
 const others=shuffle(spare.filter(r=>deg(r)>1));
 const queue=ends.concat(others);
 const give=t=>{const r=queue.shift();if(r)r.type=t;return r};
 give("treasure");give("shrine");give("shop");
 if(F.rooms>11)give("treasure");
 // one locked vault, and one elite carrying its key
 const vault=give("vault");
 const fights=spare.filter(r=>r.type==="fight");
 if(vault&&fights.length)shuffle(fights)[0].type="elite";
 else if(vault)vault.type="fight";
 order.forEach(r=>{r.dist=dists[key(r.gx,r.gy)];
  if(r.type==="start"||r.type==="treasure"||r.type==="shop"||r.type==="shrine")r.cleared=true});
 return {rooms:order,map,key,start,gw:GW,gh:GH,theme:THEMES[F.theme],cfg:F,index:fi,
         hasKey:!!vault&&order.some(r=>r.type==="elite")};
}

function newRun(heroId){

// Every relic is a multiplier or a count, so the whole build is one pass.
function stats(){
 const h=G.hero,r=G.relics,n=k=>r[k]||0;
 return{
  dmg:h.dmg*(1+0.20*n("fang")),
  rate:h.rate/(1+0.16*n("gloves")),
  speed:236*h.speed*(1+0.12*n("boots")),
  shotSp:h.shotSp*(1+0.25*n("barrel")),
  range:(h.bullet==="boomerang"?360:520)*(1+0.25*n("barrel")),
  pierce:h.pierce+n("pierce"),
  extra:n("twin"),
  size:1+0.35*n("giant"),
  dashLen:0.19+0.035*n("cloak"),
  dashCd:Math.max(0.34,0.86-0.16*n("cloak")),
  thorn:n("thorn")*9,
  magnet:112+70*n("magnet"),
  goldMul:1+0.5*n("coin"),
  ember:n("ember"),
  frost:n("frost")*0.22,
  orbs:n("orb"),
  furyMul:1+0.45*n("core"),
  splash:h.splash||0,
 };
}
let ST=null;
function restat(){ST=stats();const p=G.p;const want=G.hero.hp+(G.relics.heart||0);
 if(p.maxHp!==want){const d=want-p.maxHp;p.maxHp=want;if(d>0)p.hp=Math.min(p.maxHp,p.hp+d)}}

function nextFloor(){
 G.floorIdx++;G.pendingRelics=null;
 if(G.floorIdx>=FLOORS.length){scene="won";SFX.win();musicStop();saveBest();return}
 G.floor=buildFloor(G.floorIdx);
 G.depth=G.floorIdx+1;
 musicSet=G.floorIdx;if(musicOn&&AC){musicStop();musicStart()}
 enterRoom(G.floor.start,null);
 restat();
 say(G.floor.cfg.name,G.floor.cfg.sub,3.2);
 SFX.stairs();
}
// A room is filled in the first time you open its door and then remembered,
// so backing out of a fight and coming back does not hand you a fresh one.
function populate(room){
 if(room.built)return;room.built=true;
 room.obst=[];room.ents=[];room.picks=[];room.props=[];
 const F=G.floor.cfg,th=G.floor.theme;
 const inside=(x,y,pad)=>x>pad&&x<ROOM_W-pad&&y>pad&&y<ROOM_H-pad;
 const clearOfDoors=(x,y)=>{
  for(const d of DIRS){if(!room.doors[d.n])continue;
   const dp=doorPos(d.n);if(dist(x,y,dp.x,dp.y)<150)return false}
  return true};
 const spot=(pad,minD)=>{for(let i=0;i<40;i++){
   const x=rnd(pad,ROOM_W-pad),y=rnd(pad,ROOM_H-pad);
   if(!clearOfDoors(x,y))continue;
   let ok=true;for(const o of room.obst)if(dist(x,y,o.x,o.y)<(minD||70)){ok=false;break}
   if(ok)return{x,y}}
  return null};
 // scenery
 const nProps=room.type==="boss"?rint(1,3):rint(2,5);
 for(let i=0;i<nProps;i++){const s=spot(90,88);if(!s)continue;
  const kind=Math.random()<0.45?"pillar":"barrel";
  room.obst.push({x:s.x,y:s.y,r:kind==="pillar"?24:19,kind,
   hp:kind==="barrel"?1:0,sx:kind==="pillar"?56:44,sy:kind==="pillar"?90:50,hit:0})}
 if(room.type==="boss"){
  const B=BOSSES[F.boss];
  room.boss={kind:F.boss,x:ROOM_W/2,y:ROOM_H*0.34,hp:B.hp,max:B.hp,r:B.rad,furyVal:260,
   phase:0,t:0,act:"idle",actT:0,vx:0,vy:0,hit:0,a:0,spin:0,dead:false,tele:0,sub:[]};
 }else if(room.type!=="start"&&room.type!=="shop"&&room.type!=="shrine"&&room.type!=="treasure"){
  // fight rooms, elite rooms and the vault all come with company
  const elite=room.type==="elite";
  const count=elite?rint(5,7):Math.min(16,rint(5,8)+Math.floor(G.floorIdx*1.6)+Math.floor(room.dist*0.6));
  // deal from a shuffled deck rather than rolling each one, so a room is
  // never three of the same thing
  const deck=[];while(deck.length<count)deck.push.apply(deck,shuffle(F.mix.slice()));
  for(let i=0;i<count;i++){
   const s=spot(96,54)||{x:rnd(120,ROOM_W-120),y:rnd(120,ROOM_H-120)};
   room.ents.push(makeEnemy(deck[i],s.x,s.y))}
  if(elite){const e=makeEnemy(F.elite,ROOM_W/2,ROOM_H/2);
   e.elite=true;e.hp*=3.2;e.max=e.hp;e.scale=1.45;e.gold*=4;e.hasKey=G.floor.hasKey;
   room.ents.push(e)}
 }
 if(room.type==="treasure")room.chest={x:ROOM_W/2,y:ROOM_H/2-10,open:false,locked:false};
 if(room.type==="vault")room.chest={x:ROOM_W/2,y:ROOM_H/2-10,open:false,locked:true};
 if(room.type==="shrine")room.shrine={x:ROOM_W/2,y:ROOM_H/2-6,used:false};
 if(room.type==="shop"){room.shop={x:ROOM_W/2,y:ROOM_H/2-30};room.stock=makeStock()}
 if(room.ents.length===0&&room.type!=="boss")room.cleared=true;
}
function makeEnemy(kind,x,y){
 const d=ENEMIES[kind],F=G.floor.cfg;
 const hp=Math.round(d.hp*F.hpMul);
 return{kind,x,y,vx:0,vy:0,hp,max:hp,r:d.rad,sp:d.sp*F.spMul,dmg:d.dmg,kb:d.kb,
  gold:d.gold,furyVal:d.fury,hit:0,t:Math.random()*9,cd:rnd(0.6,2.2),state:"walk",
  stateT:0,slow:0,flip:1,bob:Math.random()*9,scale:1,dead:false,elite:false,
  touch:d.touch,shoots:d.shoots,charge:d.charge,slam:d.slam,split:d.split,art:d.art,spawnT:0.45}
}
function makeStock(){
 const owned=id=>(G.relics[id]||0);
 const pool=shuffle(RELICS.filter(r=>owned(r.id)<r.max)).slice(0,2);
 const items=pool.map((r,i)=>({kind:"relic",relic:r,cost:28+i*10+G.floorIdx*10,bought:false}));
 items.push({kind:"heal",cost:16+G.floorIdx*6,bought:false});
 return items;
}
function doorPos(dir){
 if(dir==="N")return{x:ROOM_W/2,y:0};
 if(dir==="S")return{x:ROOM_W/2,y:ROOM_H};
 if(dir==="W")return{x:0,y:ROOM_H/2};
 return{x:ROOM_W,y:ROOM_H/2};
}
function enterRoom(room,fromDir){
 G.room=room;room.seen=true;room.visited=true;
 for(const d of DIRS){const n=G.floor.map[G.floor.key(room.gx+d.dx,room.gy+d.dy)];if(n)n.seen=true}
 populate(room);
 G.ents=room.ents;G.picks=room.picks;G.boss=room.boss||null;
 G.shots.length=0;G.eshots.length=0;G.fx.length=0;G.nums.length=0;G.fires.length=0;
 const p=G.p;
 if(fromDir){const dp=doorPos(fromDir);
  const inw=fromDir==="N"?{x:0,y:1}:fromDir==="S"?{x:0,y:-1}:fromDir==="W"?{x:1,y:0}:{x:-1,y:0};
  p.x=dp.x+inw.x*64;p.y=dp.y+inw.y*64}
 else{p.x=ROOM_W/2;p.y=ROOM_H/2+60}
 p.vx=p.vy=0;p.inv=Math.max(p.inv,0.4);
 CAM.x=p.x;CAM.y=p.y;
 if(room.boss&&!room.boss.dead){const B=BOSSES[room.boss.kind];
  say(B.name,B.sub,3.0);SFX.boss();shake(9,0.5)}
 if(!room.cleared&&room.ents.length)SFX.door();
}

// ---------------------------------------------------------------- physics
function collideRoom(o,rad){
 const r=G.room;
 o.x=clamp(o.x,rad,ROOM_W-rad);o.y=clamp(o.y,rad,ROOM_H-rad);
 if(!r.obst)return;
 for(const b of r.obst){if(b.dead)continue;
  const dx=o.x-b.x,dy=o.y-b.y,d=Math.hypot(dx,dy),m=rad+b.r;
  if(d<m&&d>0.01){o.x=b.x+dx/d*m;o.y=b.y+dy/d*m}}
}
function blocked(x,y,rad){
 if(x<rad||x>ROOM_W-rad||y<rad||y>ROOM_H-rad)return true;
 for(const b of G.room.obst||[])if(!b.dead&&dist(x,y,b.x,b.y)<rad+b.r)return true;
 return false;
}
function nearestEnemy(x,y,maxD){
 let best=null,bd=maxD||1e9;
 for(const e of G.ents){if(e.dead||e.spawnT>0)continue;
  const d=dist(x,y,e.x,e.y);if(d<bd){bd=d;best=e}}
 const b=G.boss;
 if(b&&!b.dead&&b.tele<=0){const d=dist(x,y,b.x,b.y);if(d<bd){bd=d;best=b}}
 return best;
}
// ---------------------------------------------------------------- effects
function puff(x,y,n,col,sp,life,size){
 if(!FX&&n>4)n=Math.ceil(n/3);
 for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(sp*0.35,sp);
  G.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:life||rnd(0.26,0.5),
   col,r:size||rnd(2.4,5.2),g:0})}
}
function ring(x,y,r0,r1,col,life){G.fx.push({ring:true,x,y,r0,r1,col,t:0,life:life||0.34})}
function num(x,y,v,col){if(!FX&&G.nums.length>14)return;
 G.nums.push({x,y:y-10,v:Math.round(v),col:col||"#fff",t:0,vy:-46,vx:rnd(-22,22)})}
function stepFx(dt){
 for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.t+=dt;
  if(f.t>=f.life){G.fx.splice(i,1);continue}
  if(!f.ring){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(0.03,dt);f.vy*=Math.pow(0.03,dt)}}
 for(let i=G.nums.length-1;i>=0;i--){const n=G.nums[i];n.t+=dt;n.y+=n.vy*dt;n.x+=n.vx*dt;
  n.vy+=150*dt;if(n.t>0.8)G.nums.splice(i,1)}
 for(let i=G.fires.length-1;i>=0;i--){const f=G.fires[i];f.t+=dt;
  if(f.t>f.life){G.fires.splice(i,1);continue}
  f.cd-=dt;if(f.cd<=0){f.cd=0.28;
   for(const e of G.ents)if(!e.dead&&dist(e.x,e.y,f.x,f.y)<f.r+e.r)hurtEnemy(e,ST.dmg*0.5,0,0,"#ff7a2a");
   const b=G.boss;if(b&&!b.dead&&dist(b.x,b.y,f.x,f.y)<f.r+b.r)hurtEnemy(b,ST.dmg*0.5,0,0,"#ff7a2a")}}
}
// ---------------------------------------------------------------- player
function fire(){
 const p=G.p,h=G.hero;
 const reach=h.bullet==="boomerang"?ST.range*0.86:ST.range+160;
 const tgt=nearestEnemy(p.x,p.y,reach);
 if(!tgt)return false;
 // Aim where it will be, not where it is. Firing at the spot something is
 // standing misses nearly every time when it is crossing in front of you.
 let tx=tgt.x,ty=tgt.y;
 const flight=dist(p.x,p.y,tgt.x,tgt.y)/ST.shotSp;
 tx+=(tgt.vx||0)*flight*0.85;ty+=(tgt.vy||0)*flight*0.85;
 tx=clamp(tx,10,ROOM_W-10);ty=clamp(ty,10,ROOM_H-10);
 p.aim=Math.atan2(ty-p.y,tx-p.x);
 const n=1+ST.extra,spread=n>1?0.13:0;
 for(let i=0;i<n;i++){
  const a=p.aim+(i-(n-1)/2)*spread;
  const s={x:p.x+Math.cos(a)*20,y:p.y+Math.sin(a)*20,a,
   vx:Math.cos(a)*ST.shotSp,vy:Math.sin(a)*ST.shotSp,
   kind:h.bullet,dmg:ST.dmg,pierce:ST.pierce,hitList:[],t:0,
   r:(h.bullet==="orb"?11:h.bullet==="boomerang"?13:7)*ST.size,
   life:ST.range/ST.shotSp,spin:0,back:false,ox:p.x,oy:p.y};
  if(h.bullet==="boomerang"){s.life=ST.range/ST.shotSp*2.4;s.out=ST.range*0.92}
  G.shots.push(s)}
 if(h.bullet==="arrow")SFX.arrow();else if(h.bullet==="boomerang")SFX.blade();else SFX.orb();
 return true;
}
function stepShots(dt){
 for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i];s.t+=dt;s.spin+=dt*16;
  if(s.kind==="boomerang"){
   const p=G.p,d=dist(s.x,s.y,s.ox,s.oy);
   if(!s.back&&d>s.out)s.back=true;
   if(s.back){const a=Math.atan2(p.y-s.y,p.x-s.x);
    s.vx=lerp(s.vx,Math.cos(a)*ST.shotSp*1.25,Math.min(1,dt*7));
    s.vy=lerp(s.vy,Math.sin(a)*ST.shotSp*1.25,Math.min(1,dt*7));
    if(dist(s.x,s.y,p.x,p.y)<26){G.shots.splice(i,1);continue}}
  }
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  let gone=s.t>s.life;
  if(s.x<6||s.x>ROOM_W-6||s.y<6||s.y>ROOM_H-6)gone=true;
  for(const b of G.room.obst||[])if(!b.dead&&dist(s.x,s.y,b.x,b.y)<b.r+s.r*0.5){
   if(b.kind==="barrel"){breakBarrel(b)}gone=true;break}
  if(!gone){
   const list=G.ents.slice();if(G.boss&&!G.boss.dead&&G.boss.tele<=0)list.push(G.boss);
   for(const e of list){if(e.dead||e.spawnT>0)continue;
    if(s.hitList.indexOf(e)>=0)continue;
    if(dist(s.x,s.y,e.x,e.y)>e.r+s.r)continue;
    s.hitList.push(e);
    hurtEnemy(e,s.dmg,Math.cos(s.a||Math.atan2(s.vy,s.vx)),Math.sin(Math.atan2(s.vy,s.vx)),G.hero.col);
    if(ST.splash){splash(s.x,s.y,ST.splash,s.dmg*0.62,e)}
    if(s.pierce<=0){gone=true;break}
    s.pierce--;}
  }
  if(gone){
   if(s.kind==="orb"){SFX.hit();puff(s.x,s.y,FX?12:5,"#ff9a3a",240,0.36,5);
    ring(s.x,s.y,6,ST.splash*ST.size,"rgba(255,150,60,0.5)",0.26);
    splash(s.x,s.y,ST.splash*ST.size,s.dmg*0.62,null);shake(3,0.1)}
   else puff(s.x,s.y,3,G.hero.col,120,0.2,3);
   G.shots.splice(i,1)}}
}
function splash(x,y,r,dmg,skip){
 if(!r)return;
 for(const e of G.ents){if(e.dead||e===skip)continue;
  if(dist(x,y,e.x,e.y)<r+e.r)hurtEnemy(e,dmg,0,0,"#ff9a3a")}
 const b=G.boss;if(b&&!b.dead&&b!==skip&&dist(x,y,b.x,b.y)<r+b.r)hurtEnemy(b,dmg,0,0,"#ff9a3a");
}
function stepPlayer(dt){
 const p=G.p,v=stickVec();
 p.bob+=dt;
 if(p.inv>0)p.inv-=dt;
 if(p.hurtT>0)p.hurtT-=dt;
 if(p.dashCd>0)p.dashCd-=dt;
 // dash: a burst in whichever way you are pushing, or the way you are aiming
 if(pads.dash.hit||keys.Space){pads.dash.hit=0;
  if(p.dashT<=0&&p.dashCd<=0){
   const a=v.l>0.15?Math.atan2(v.y,v.x):p.aim;
   p.dashT=ST.dashLen;p.dashCd=ST.dashCd;p.dashA=a;p.inv=Math.max(p.inv,ST.dashLen+0.1);
   SFX.dash();puff(p.x,p.y,FX?10:4,"#ffffff",160,0.3,4);}}
 if(pads.fury.hit){pads.fury.hit=0;if(G.fury>=G.furyMax)unleash()}
 if(keys.KeyF&&G.fury>=G.furyMax)unleash();
 if(p.dashT>0){p.dashT-=dt;
  const sp=ST.speed*3.3*(0.55+p.dashT/ST.dashLen*0.6);
  p.vx=Math.cos(p.dashA)*sp;p.vy=Math.sin(p.dashA)*sp;
  if(ST.ember&&Math.random()<dt*26)
   G.fires.push({x:p.x,y:p.y,r:26,t:0,life:2.2+0.6*ST.ember,cd:0});
  if(FX&&Math.random()<dt*40)G.fx.push({x:p.x+rnd(-8,8),y:p.y+rnd(-8,8),vx:0,vy:0,t:0,
   life:0.3,col:ST.ember?"#ff7a2a":hexA(G.hero.col,1),r:rnd(4,8),g:0});
 }else{
  const want=ST.speed*v.l;
  const tx=v.l>0.02?v.x/Math.max(v.l,0.001)*want:0,ty=v.l>0.02?v.y/Math.max(v.l,0.001)*want:0;
  const k=Math.min(1,dt*(v.l>0.02?15:19));
  p.vx=lerp(p.vx,tx,k);p.vy=lerp(p.vy,ty,k);}
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 collideRoom(p,PRAD);
 // the weapon aims itself; the body just faces the way the weapon points
 p.fireCd-=dt;
 if(p.fireCd<=0){if(fire())p.fireCd=ST.rate;else p.fireCd=0.05}
 if(Math.abs(Math.cos(p.aim))>0.2)p.flip=Math.cos(p.aim)<0?-1:1;
 // the guardian orbs
 p.orbA+=dt*2.4;
 if(ST.orbs){for(let i=0;i<ST.orbs;i++){
  const a=p.orbA+i*TAU/ST.orbs,ox=p.x+Math.cos(a)*58,oy=p.y+Math.sin(a)*58;
  for(const e of G.ents){if(e.dead||e.spawnT>0)continue;
   if(dist(ox,oy,e.x,e.y)<e.r+10&&(e.orbCd||0)<=0){e.orbCd=0.35;
    hurtEnemy(e,ST.dmg*0.55,Math.cos(a),Math.sin(a),"#ffe37a")}}
  const b=G.boss;if(b&&!b.dead&&dist(ox,oy,b.x,b.y)<b.r+10&&(b.orbCd||0)<=0){
   b.orbCd=0.35;hurtEnemy(b,ST.dmg*0.55,0,0,"#ffe37a")}}}
 // doors, chests, shrines and the shopkeeper all live on the same check
 touchRoom(dt);
}
function hurtPlayer(dmg,fromx,fromy){
 const p=G.p;if(p.inv>0||p.dead)return;
 p.hp-=dmg;p.inv=1.15;p.hurtT=0.4;
 const a=Math.atan2(p.y-fromy,p.x-fromx);
 p.vx+=Math.cos(a)*300;p.vy+=Math.sin(a)*300;
 SFX.hurt();shake(11,0.34);flash("rgba(220,40,60,0.34)",0.2);hitStop=Math.max(hitStop,0.07);
 puff(p.x,p.y,FX?12:5,"#ff4a6a",200,0.4,4);
 if(p.hp<=0){
  if((G.relics.wind||0)>0&&!G.revived){G.revived=true;G.relics.wind--;restat();
   p.hp=2;p.inv=2.4;flash("rgba(255,255,255,0.6)",0.4);SFX.relic();
   ring(p.x,p.y,10,220,"rgba(255,255,255,0.6)",0.5);note("SECOND WIND","#fff");return}
  p.dead=true;p.hp=0;scene="dead";SFX.die();musicStop();saveBest();shake(16,0.6)}
}
function unleash(){
 const p=G.p,h=G.hero;G.fury=0;SFX.fury();shake(13,0.45);
 flash(hexA(h.col,0.35),0.24);ring(p.x,p.y,10,260,hexA(h.col,0.55),0.5);
 if(h.bullet==="arrow"){
  for(let w=0;w<2;w++)for(let i=0;i<16;i++){const a=i*TAU/16+w*0.19;
   G.shots.push({x:p.x,y:p.y,a,vx:Math.cos(a)*ST.shotSp*1.1,vy:Math.sin(a)*ST.shotSp*1.1,
    kind:"arrow",dmg:ST.dmg*1.1,pierce:9,hitList:[],t:-w*0.06,life:1.6,r:8*ST.size,spin:0,ox:p.x,oy:p.y})}}
 else if(h.bullet==="boomerang"){p.whirl=5.0}
 else{for(let i=0;i<10;i++){const a=Math.random()*TAU,d=rnd(40,290);
   G.fx.push({meteor:true,x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,t:-i*0.11,life:0.5,
    col:"#ff7a2a",r:ST.splash*1.5,vx:0,vy:0,g:0})}}
 note(h.fury,h.col);
}

// ---------------------------------------------------------------- enemies
function hurtEnemy(e,dmg,kx,ky,col){
 if(e.dead)return;
 const crit=Math.random()<0.12;
 const d=dmg*(crit?2:1);
 e.hp-=d;e.hit=0.14;
 if(e.slowable!==false&&ST.frost)e.slow=Math.max(e.slow||0,ST.frost);
 const kb=(e.kb==null?1:e.kb)*(e.boss?0:1);
 e.vx+=kx*210*kb;e.vy+=ky*210*kb;
 num(e.x,e.y-e.r,d,crit?"#ffd23f":col||"#fff");
 if(crit)SFX.crit();else SFX.hit();
 puff(e.x,e.y,crit?7:4,col||"#fff",170,0.26,3);
 // damage pays out the monster's worth over its lifetime, and killing
 // it pays the other half, so fury fills at the same rate either way
 gainFury((e.furyVal||4)*0.5*(d/Math.max(1,e.max)));
 if(e.hp<=0)killEnemy(e);
}
function gainFury(v){G.fury=Math.min(G.furyMax,G.fury+v*ST.furyMul)}
function killEnemy(e){
 if(e.dead)return;e.dead=true;
 if(e.boss){bossDown(e);return}
 SFX.kill();puff(e.x,e.y,FX?16:6,e.art==="slime"?"#7ee87e":"#c8c0d8",260,0.5,5);
 ring(e.x,e.y,4,e.r*2.4,"rgba(255,255,255,0.35)",0.26);
 G.kills++;G.killsSinceHeal++;gainFury((e.furyVal||4)*0.5);
 if((G.relics.chalice||0)>0&&G.killsSinceHeal>=Math.round(30/ (G.relics.chalice))){
  G.killsSinceHeal=0;if(G.p.hp<G.p.maxHp){G.p.hp++;SFX.heart();note("+1 HEART","#ff6a8a")}}
 const n=Math.round(e.gold*ST.goldMul*(e.elite?1:1));
 for(let i=0;i<Math.min(6,Math.max(1,Math.round(n/2)));i++)dropPick("coin",e.x,e.y,Math.ceil(n/Math.min(6,Math.max(1,Math.round(n/2)))));
 if(e.hasKey){dropPick("key",e.x,e.y,1);note("A KEY!","#ffd23f")}
 if(!e.elite&&Math.random()<0.055)dropPick("heart",e.x,e.y,1);
 if(e.split&&!e.isSplit){for(let i=0;i<2;i++){
  const c=makeEnemy("slime",e.x+rnd(-18,18),e.y+rnd(-18,18));
  c.isSplit=true;c.hp=c.max=Math.round(e.max*0.4);c.scale=0.62;c.r=e.r*0.62;c.sp*=1.3;c.gold=1;
  c.spawnT=0.2;G.ents.push(c)}}
 const idx=G.ents.indexOf(e);if(idx>=0)G.ents.splice(idx,1);
 checkCleared();
}
function checkCleared(){
 const r=G.room;
 if(r.cleared)return;
 if(G.ents.length)return;
 if(r.boss&&!r.boss.dead)return;
 r.cleared=true;SFX.clear();note("ROOM CLEAR","#8affc8");
}
function stepEnemies(dt){
 const p=G.p;
 for(let i=G.ents.length-1;i>=0;i--){
  const e=G.ents[i];
  if(e.dead){G.ents.splice(i,1);continue}
  e.t+=dt;e.bob+=dt;
  if(e.hit>0)e.hit-=dt;
  if(e.orbCd>0)e.orbCd-=dt;
  if(e.slow>0)e.slow=Math.max(0,e.slow-dt*0.6);
  if(e.spawnT>0){e.spawnT-=dt;continue}
  const slowMul=1-(e.slow||0);
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  const ux=dx/d,uy=dy/d;
  e.flip=ux<0?-1:1;
  let ax=0,ay=0,sp=e.sp*slowMul;
  switch(e.art){
   case"bat":{ // never flies straight at you; loops in and out
    const w=Math.sin(e.t*3.1+e.bob)*1.1;
    const a=Math.atan2(dy,dx)+w;
    ax=Math.cos(a)*sp;ay=Math.sin(a)*sp;
    if(d<40){ax*=-0.6;ay*=-0.6}
    break}
   case"slime":{ // hops: a shove every beat and a rest between
    e.cd-=dt;
    if(e.cd<=0){e.cd=rnd(1.0,1.5);e.hopT=0.42;e.hopA=Math.atan2(dy,dx)+rnd(-0.3,0.3)}
    if(e.hopT>0){e.hopT-=dt;ax=Math.cos(e.hopA)*sp*2.6;ay=Math.sin(e.hopA)*sp*2.6}
    break}
   case"skele":{ax=ux*sp;ay=uy*sp;
    if(d<150){const s=Math.sin(e.t*4)*0.45;const a=Math.atan2(dy,dx)+s;
     ax=Math.cos(a)*sp;ay=Math.sin(a)*sp}
    break}
   case"mage":{ // keeps its distance and throws
    const want=210;
    if(d>want+40){ax=ux*sp;ay=uy*sp}
    else if(d<want-40){ax=-ux*sp;ay=-uy*sp}
    else{ax=-uy*sp*0.7;ay=ux*sp*0.7}
    e.cd-=dt;
    if(e.cd<=0&&d<430){e.cd=rnd(1.8,2.6);e.castT=0.45}
    if(e.castT>0){e.castT-=dt;ax*=0.2;ay*=0.2;
     if(e.castT<=0){const a=Math.atan2(dy,dx);
      for(let k=-1;k<=1;k++)G.eshots.push({x:e.x+Math.cos(a)*18,y:e.y+Math.sin(a)*18,
       vx:Math.cos(a+k*0.22)*230,vy:Math.sin(a+k*0.22)*230,r:9,dmg:1,t:0,life:3.4,kind:"bolt",col:"#8affe0"});
      SFX.orb()}}
    break}
   case"spider":{ // stalks, then bolts
    e.cd-=dt;
    if(e.state==="walk"){ax=ux*sp*0.8;ay=uy*sp*0.8;
     if(e.cd<=0&&d<300){e.state="wind";e.stateT=0.4;e.cd=rnd(1.8,2.8)}}
    else if(e.state==="wind"){e.stateT-=dt;ax=-ux*sp*0.3;ay=-uy*sp*0.3;
     if(e.stateT<=0){e.state="dash";e.stateT=0.42;e.dashA=Math.atan2(dy,dx)}}
    else{e.stateT-=dt;ax=Math.cos(e.dashA)*sp*5.2;ay=Math.sin(e.dashA)*sp*5.2;
     if(e.stateT<=0)e.state="walk"}
    break}
   case"brute":{ // walks you down, then slams
    e.cd-=dt;
    if(e.state==="walk"){ax=ux*sp;ay=uy*sp;
     if(d<110&&e.cd<=0){e.state="raise";e.stateT=0.6;e.cd=rnd(2.4,3.4)}}
    else if(e.state==="raise"){e.stateT-=dt;
     if(e.stateT<=0){e.state="slam";e.stateT=0.3;
      ring(e.x,e.y,10,140,"rgba(255,180,80,0.5)",0.3);shake(8,0.3);SFX.kill();
      if(dist(p.x,p.y,e.x,e.y)<130)hurtPlayer(e.dmg,e.x,e.y);
      puff(e.x,e.y,FX?18:6,"#c8a060",340,0.5,6)}}
    else{e.stateT-=dt;if(e.stateT<=0)e.state="walk"}
    break}
   default:{ax=ux*sp;ay=uy*sp}
  }
  const k=Math.min(1,dt*7);
  e.vx=lerp(e.vx,ax,k);e.vy=lerp(e.vy,ay,k);
  e.x+=e.vx*dt;e.y+=e.vy*dt;
  e.vx*=Math.pow(0.24,dt);e.vy*=Math.pow(0.24,dt);
  collideRoom(e,e.r*0.8);
  // they shove each other apart instead of stacking into one fat enemy
  for(let j=i-1;j>=0;j--){const o=G.ents[j];if(o.dead||o.spawnT>0)continue;
   const ddx=e.x-o.x,ddy=e.y-o.y,dd=Math.hypot(ddx,ddy),m=(e.r+o.r)*0.78;
   if(dd<m&&dd>0.01){const push=(m-dd)/2,nx=ddx/dd,ny=ddy/dd;
    e.x+=nx*push;e.y+=ny*push;o.x-=nx*push;o.y-=ny*push}}
  if(e.touch&&d<e.r+PRAD-2){
   hurtPlayer(e.dmg,e.x,e.y);
   e.vx-=ux*260;e.vy-=uy*260;
   if(ST.thorn)hurtEnemy(e,ST.thorn,-ux,-uy,"#7ee87e")}
 }
 // Rory's whirlwind
 if(G.p.whirl>0){G.p.whirl-=dt;
  for(let i=0;i<4;i++){const a=G.p.orbA*3+i*TAU/4,wx=p.x+Math.cos(a)*72,wy=p.y+Math.sin(a)*72;
   for(const e of G.ents){if(e.dead||e.spawnT>0)continue;
    if(dist(wx,wy,e.x,e.y)<e.r+16&&(e.whirlCd||0)<=0){e.whirlCd=0.2;
     hurtEnemy(e,ST.dmg*0.8,Math.cos(a),Math.sin(a),"#eef4ff")}}
   const b=G.boss;if(b&&!b.dead&&dist(wx,wy,b.x,b.y)<b.r+16&&(b.whirlCd||0)<=0){
    b.whirlCd=0.2;hurtEnemy(b,ST.dmg*0.8,0,0,"#eef4ff")}}}
 for(const e of G.ents)if(e.whirlCd>0)e.whirlCd-=dt;
}
function stepEnemyShots(dt){
 const p=G.p;
 for(let i=G.eshots.length-1;i>=0;i--){const s=G.eshots[i];s.t+=dt;
  if(s.grav)s.vy+=s.grav*dt;
  if(s.home&&s.t<s.home){const a=Math.atan2(p.y-s.y,p.x-s.x),sp=Math.hypot(s.vx,s.vy);
   const ca=Math.atan2(s.vy,s.vx)+clamp(angDiff(a,Math.atan2(s.vy,s.vx)),-2.4*dt,2.4*dt);
   s.vx=Math.cos(ca)*sp;s.vy=Math.sin(ca)*sp}
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  let gone=s.t>s.life||s.x<4||s.x>ROOM_W-4||s.y<4||s.y>ROOM_H-4;
  if(!gone&&dist(s.x,s.y,p.x,p.y)<s.r+PRAD-3){hurtPlayer(s.dmg,s.x,s.y);gone=true}
  if(gone){puff(s.x,s.y,4,s.col||"#8affe0",130,0.24,3);G.eshots.splice(i,1)}}
}

// ---------------------------------------------------------------- bosses
// Each one is a small state machine on a timer: pick a move, wind it up so
// you can see it coming, do it, recover. Nothing is random enough to feel
// unfair - the tell is always there.
function stepBoss(dt){
 const b=G.boss;if(!b||b.dead)return;
 b.boss=true;b.t+=dt;b.actT-=dt;
 if(b.hit>0)b.hit-=dt;
 if(b.orbCd>0)b.orbCd-=dt;
 if(b.whirlCd>0)b.whirlCd-=dt;
 if(b.slow>0)b.slow=Math.max(0,b.slow-dt*0.6);
 const p=G.p,dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
 const frac=b.hp/b.max;
 b.phase=frac<0.35?2:frac<0.7?1:0;
 const hard=1+b.phase*0.35;
 if(b.kind==="bonelord")stepBonelord(b,dt,ux,uy,d,hard);
 else if(b.kind==="widow")stepWidow(b,dt,ux,uy,d,hard);
 else stepLich(b,dt,ux,uy,d,hard);
 b.x+=b.vx*dt;b.y+=b.vy*dt;
 b.vx*=Math.pow(0.2,dt);b.vy*=Math.pow(0.2,dt);
 b.x=clamp(b.x,b.r+10,ROOM_W-b.r-10);b.y=clamp(b.y,b.r+10,ROOM_H-b.r-10);
 if(b.tele<=0&&d<b.r+PRAD-6)hurtPlayer(b.kind==="lich"?1:2,b.x,b.y);
}
function pickAct(b,list){const a=pick(list);b.act=a.k;b.actT=a.t;return a}
function stepBonelord(b,dt,ux,uy,d,hard){
 b.spin+=dt*(b.act==="spin"?9:1.6);
 if(b.actT<=0){
  if(b.act==="charge"||b.act==="spin"||b.act==="summon"){b.act="idle";b.actT=rnd(0.7,1.1)/hard}
  else{
   const r=Math.random();
   if(r<0.36){b.act="windup";b.actT=0.65;b.chargeA=Math.atan2(uy,ux)}
   else if(r<0.7){b.act="spin";b.actT=2.4}
   else{b.act="summon";b.actT=1.0}
   if(b.act==="summon"){
    const n=2+b.phase;
    for(let i=0;i<n;i++){const a=Math.random()*TAU,dd=rnd(90,220);
     const e=makeEnemy("skele",clamp(b.x+Math.cos(a)*dd,60,ROOM_W-60),clamp(b.y+Math.sin(a)*dd,60,ROOM_H-60));
     e.spawnT=0.8;G.ents.push(e);ring(e.x,e.y,4,44,"rgba(255,140,60,0.55)",0.6)}
    SFX.door()}}
 }
 if(b.act==="windup"){b.vx*=0.9;b.vy*=0.9;
  if(b.actT<0.06){b.act="charge";b.actT=0.7;
   b.vx=Math.cos(b.chargeA)*720;b.vy=Math.sin(b.chargeA)*720;SFX.boss();shake(7,0.3)}}
 else if(b.act==="charge"){
  if(FX&&Math.random()<dt*40)G.fx.push({x:b.x+rnd(-30,30),y:b.y+rnd(-20,30),vx:0,vy:0,t:0,life:0.35,col:"#ff7a2a",r:rnd(4,9),g:0});}
 else if(b.act==="spin"){ // the cleavers come off and sweep the room
  b.vx=lerp(b.vx,ux*70,dt*2);b.vy=lerp(b.vy,uy*70,dt*2);
  b.sweep=(b.sweep||0)+dt;
  if(b.sweep>0.42/hard){b.sweep=0;
   const a=b.spin;
   for(let k=0;k<2;k++){const aa=a+k*Math.PI;
    G.eshots.push({x:b.x+Math.cos(aa)*50,y:b.y+Math.sin(aa)*50,vx:Math.cos(aa)*300,vy:Math.sin(aa)*300,
     r:16,dmg:1,t:0,life:2.6,kind:"cleaver",col:"#cfd6e2",spin:0})}
   SFX.blade()}}
 else{b.vx=lerp(b.vx,ux*90,dt*2);b.vy=lerp(b.vy,uy*90,dt*2)}
}

function stepPicks(dt){
 const p=G.p;
 for(let i=G.picks.length-1;i>=0;i--){const k=G.picks[i];k.t+=dt;k.bob+=dt*4;
  const d=dist(k.x,k.y,p.x,p.y);
  if(k.t>0.25&&d<ST.magnet){const a=Math.atan2(p.y-k.y,p.x-k.x),pull=520*(1-d/ST.magnet)+150;
   k.vx=lerp(k.vx,Math.cos(a)*pull,dt*7);k.vy=lerp(k.vy,Math.sin(a)*pull,dt*7)}
  else{k.vx*=Math.pow(0.06,dt);k.vy*=Math.pow(0.06,dt)}
  k.x+=k.vx*dt;k.y+=k.vy*dt;
  k.x=clamp(k.x,14,ROOM_W-14);k.y=clamp(k.y,14,ROOM_H-14);
  if(d<PRAD+16){
   if(k.kind==="coin"){G.gold+=k.val;SFX.coin()}
   else if(k.kind==="key"){G.keys+=1;SFX.key()}
   else if(k.kind==="heart"){if(p.hp<p.maxHp){p.hp++;SFX.heart()}else{G.gold+=4;SFX.coin()}}
   puff(k.x,k.y,4,k.kind==="heart"?"#ff6a8a":"#ffd23f",110,0.24,3);
   G.picks.splice(i,1)}}
}

function touchRoom(dt){
 const p=G.p,r=G.room;
 // barrels break when you dash through them
 if(p.dashT>0)for(const b of r.obst||[])
  if(!b.dead&&b.kind==="barrel"&&dist(p.x,p.y,b.x,b.y)<b.r+PRAD+4)breakBarrel(b);
 if(r.chest&&!r.chest.open&&dist(p.x,p.y,r.chest.x,r.chest.y)<44){
  if(r.chest.locked&&G.keys<1){if(!r.chest.warned){r.chest.warned=true;note("LOCKED - FIND THE KEY","#ff8a5a")}}
  else{if(r.chest.locked)G.keys--;
   r.chest.open=true;SFX.relic();openChest(r.chest)}}
 if(r.shrine&&!r.shrine.used&&dist(p.x,p.y,r.shrine.x,r.shrine.y)<50){
  r.shrine.used=true;SFX.relic();offerRelics(3)}
 if(r.stairs&&dist(p.x,p.y,r.stairs.x,r.stairs.y)<44){r.stairs=null;nextFloor();return}
 if(r.reward&&!r.reward.taken&&dist(p.x,p.y,r.reward.x,r.reward.y)<44){
  r.reward.taken=true;SFX.relic();offerRelics(3)}
 if(r.shop){for(let i=0;i<r.stock.length;i++){const it=r.stock[i];
  if(it.bought)continue;
  const bx=r.shop.x+(i-1)*96,by=r.shop.y+82;
  if(dist(p.x,p.y,bx,by)<38){
   if(it.cd>0)continue;
   if(G.gold>=it.cost){G.gold-=it.cost;it.bought=true;SFX.buy();
    if(it.kind==="heal"){G.p.hp=Math.min(G.p.maxHp,G.p.hp+2);note("+2 HEARTS","#ff6a8a")}
    else takeRelic(it.relic)}
   else{it.cd=0.8;SFX.deny();note("NOT ENOUGH GOLD","#ff8a5a")}}}
  for(const it of r.stock)if(it.cd>0)it.cd-=dt}
 // doors: only once the room is quiet
 if(r.cleared&&!G.pendingRelics){
  for(const d of DIRS){
   if(!r.doors[d.n])continue;
   const dp=doorPos(d.n);
   if(dist(p.x,p.y,dp.x,dp.y)<58){
    const n=G.floor.map[G.floor.key(r.gx+d.dx,r.gy+d.dy)];
    if(n){SFX.door();enterRoom(n,OPP[d.n]);return}}}}
}

function drawWalls(th){
 const sp=ART.prop["wall_"+th.id],segW=Math.round(96*(WALL/64));
 const gaps={N:[],S:[],E:[],W:[]};
 // the top and bottom run horizontally, the sides use the same strip turned
 const strip=(x0,x1,y,flip)=>{
  for(let x=x0;x<x1;x+=segW){const w=Math.min(segW,x1-x);
   cx.save();cx.translate(x,y);if(flip)cx.scale(1,-1);
   cx.drawImage(sp,0,0,Math.round(96*w/segW),64,0,flip?-WALL:0,w,WALL);cx.restore()}};
 const vstrip=(y0,y1,x,flip)=>{
  for(let y=y0;y<y1;y+=segW){const h=Math.min(segW,y1-y);
   cx.save();cx.translate(x,y);cx.rotate(Math.PI/2);if(flip)cx.scale(1,-1);
   cx.drawImage(sp,0,0,Math.round(96*h/segW),64,0,flip?-WALL:0,h,WALL);cx.restore()}};
 const half=DOORW/2,mx=ROOM_W/2,my=ROOM_H/2;
 const r=G.room;
 // top
 if(r.doors.N){strip(-WALL,mx-half,-WALL,false);strip(mx+half,ROOM_W+WALL,-WALL,false)}
 else strip(-WALL,ROOM_W+WALL,-WALL,false);
 // bottom
 if(r.doors.S){strip(-WALL,mx-half,ROOM_H+WALL,true);strip(mx+half,ROOM_W+WALL,ROOM_H+WALL,true)}
 else strip(-WALL,ROOM_W+WALL,ROOM_H+WALL,true);
 // sides
 if(r.doors.W){vstrip(-WALL,my-half,0,false);vstrip(my+half,ROOM_H+WALL,0,false)}
 else vstrip(-WALL,ROOM_H+WALL,0,false);
 if(r.doors.E){vstrip(-WALL,my-half,ROOM_W+WALL,true);vstrip(my+half,ROOM_H+WALL,ROOM_W+WALL,true)}
 else vstrip(-WALL,ROOM_H+WALL,ROOM_W+WALL,true);
 // a dark lip where the floor meets the wall
 cx.strokeStyle="rgba(0,0,0,0.4)";cx.lineWidth=3;
 cx.strokeRect(0,0,ROOM_W,ROOM_H);
}
function drawDoors(th){
 const r=G.room,open=r.cleared&&!G.pendingRelics;
 for(const d of DIRS){
  if(!r.doors[d.n])continue;
  const dp=doorPos(d.n),half=DOORW/2;
  const horiz=d.n==="N"||d.n==="S";
  cx.save();cx.translate(dp.x,dp.y);
  if(!horiz)cx.rotate(Math.PI/2);
  const out=(d.n==="N"||d.n==="W")?-1:1;
  // the passage beyond
  cx.fillStyle="#05060a";cx.fillRect(-half,out<0?-WALL:0,DOORW,WALL);
  if(open){
   cx.save();cx.beginPath();cx.rect(-half,out<0?-WALL:0,DOORW,WALL);cx.clip();
   cx.translate(-dp.x,-dp.y);if(!horiz)cx.rotate(-Math.PI/2);
   cx.fillStyle=ART.pat[th.id];cx.fillRect(dp.x-200,dp.y-200,400,400);cx.restore();
   cx.fillStyle="rgba(0,0,0,0.45)";cx.fillRect(-half,out<0?-WALL:0,DOORW,WALL);

   cx.fillRect(half-2,out<0?-WALL:0,4,WALL);
  }else{
   // a barred gate: you can see through it, which is the point

   for(let i=0;i<7;i++){const x=-half+9+i*((DOORW-18)/6);

    cx.fillStyle="#8b94a8";cx.fillRect(x-3,out<0?-WALL:0,2,WALL);cx.fillStyle="#6a7386"}

  }
  cx.restore();
 }
}

// ---------------------------------------------------------------- text
function text(s,x,y,size,color,align,weight){cx.font=(weight||"bold")+" "+size+"px sans-serif";
 cx.textAlign=align||"center";cx.textBaseline="middle";
 cx.lineWidth=Math.max(3,size/7);cx.strokeStyle="rgba(0,0,0,0.75)";cx.lineJoin="round";
 cx.strokeText(s,x,y);cx.fillStyle=color||"#fff";cx.fillText(s,x,y)}
// A long name on a narrow phone used to run off both edges. Shrink, do not clip.
function textFit(s,x,y,size,color,maxw,align,weight){cx.font=(weight||"bold")+" "+size+"px sans-serif";
 const w=cx.measureText(s).width;
 text(s,x,y,w>maxw?Math.max(9,Math.floor(size*maxw/w)):size,color,align,weight)}
function wrapLines(s,size,maxw,weight){cx.font=(weight||"bold")+" "+size+"px sans-serif";
 const out=[];let line="";
 for(const wd of String(s).split(" ")){const t=line?line+" "+wd:wd;
  if(cx.measureText(t).width>maxw&&line){out.push(line);line=wd}else line=t}
 if(line)out.push(line);return out}
// A sentence should wrap, not shrink to 9px and run off the card. Shrink only
// when even the wrap needs more lines than the space allows.
function wrapFit(s,x,y,size,color,maxw,maxLines,lineH,align,weight){
 let z=size,ls=wrapLines(s,z,maxw,weight);
 while(z>8&&ls.length>maxLines){z-=1;ls=wrapLines(s,z,maxw,weight)}
 const lh=lineH||Math.round(z*1.3);
 ls=ls.slice(0,maxLines);
 ls.forEach((l,i)=>textFit(l,x,y+i*lh,z,color,maxw,align,weight));
 return ls.length*lh}
function panel(x,y,w,h,r,fill,stroke){rr(cx,x,y,w,h,r==null?16:r);
 cx.fillStyle=fill||"rgba(14,12,22,0.88)";cx.fill();
 cx.lineWidth=3;cx.strokeStyle=stroke||"rgba(255,255,255,0.22)";cx.stroke()}
function drawButtons(){for(const b of buttons){const o=b.opt;
 cx.save();rr(cx,b.x,b.y,b.w,b.h,o.r==null?14:o.r);
 cx.fillStyle=o.fill||"rgba(255,255,255,0.12)";cx.fill();
 cx.lineWidth=3;cx.strokeStyle=o.stroke||"rgba(255,255,255,0.5)";cx.stroke();
 textFit(b.label,b.x+b.w/2,b.y+b.h/2,o.size||22,o.color||"#fff",b.w-18);
 cx.restore()}}

 // The floor and room label used to be centred on the screen, which on a

const MAPRECT={x:0,y:0,w:0,h:0};
let BOSSBARY=-1;
function drawMinimap(){
 const f=G.floor,cell=15,gap=3;
 MAPRECT.w=0;
 let minx=99,miny=99,maxx=-1,maxy=-1;
 for(const r of f.rooms){if(!r.seen)continue;
  minx=Math.min(minx,r.gx);maxx=Math.max(maxx,r.gx);
  miny=Math.min(miny,r.gy);maxy=Math.max(maxy,r.gy)}
 if(maxx<0)return;
 const gw=(maxx-minx+1),gh=(maxy-miny+1);
 const w=gw*(cell+gap)+10,h=gh*(cell+gap)+10;
 const x0=W-14-SAFE.r-w,y0=12+SAFE.t;
 MAPRECT.x=x0;MAPRECT.y=y0;MAPRECT.w=w;MAPRECT.h=h;
 panel(x0,y0,w,h,8,"rgba(8,7,14,0.62)","rgba(255,255,255,0.16)");
 for(const r of f.rooms){if(!r.seen)continue;
  const x=x0+5+(r.gx-minx)*(cell+gap),y=y0+5+(r.gy-miny)*(cell+gap);
  const here=r===G.room;
  let col=r.visited?"rgba(150,160,190,0.85)":"rgba(90,96,120,0.6)";
  if(r.type==="boss")col=r.cleared?"rgba(150,160,190,0.85)":"rgba(230,60,80,0.9)";
  else if(r.type==="shop")col="rgba(90,200,255,0.9)";
  else if(r.type==="shrine")col="rgba(200,130,255,0.9)";
  else if(r.type==="treasure"||r.type==="vault")col="rgba(255,210,60,0.9)";
  else if(r.type==="elite")col="rgba(255,140,60,0.85)";
  cx.fillStyle=here?"#ffffff":col;
  rr(cx,x,y,cell,cell,3);cx.fill();
  if(!r.visited&&!here){cx.fillStyle="rgba(0,0,0,0.35)";rr(cx,x,y,cell,cell,3);cx.fill()}
  // the corridors between them
  cx.strokeStyle=here?"rgba(255,255,255,0.8)":"rgba(150,160,190,0.45)";cx.lineWidth=2.5;
  for(const d of DIRS){if(!r.doors[d.n])continue;
   const n=f.map[f.key(r.gx+d.dx,r.gy+d.dy)];if(!n||!n.seen)continue;
   cx.beginPath();cx.moveTo(x+cell/2,y+cell/2);
   cx.lineTo(x+cell/2+d.dx*(cell/2+gap/2+1),y+cell/2+d.dy*(cell/2+gap/2+1));cx.stroke()}}
}
function drawPads(){
 const R=44,bot=H-30-SAFE.b,rt=W-24-SAFE.r;
 const p=G.p;
 const dx=rt-R,dy=bot-R;
 const fx2=rt-R-R*2.25,fy2=bot-R*0.42;
 padRects.dash={x:dx-R-8,y:dy-R-8,w:R*2+16,h:R*2+16};
 padRects.fury={x:fx2-R-8,y:fy2-R-8,w:R*2+16,h:R*2+16};
 // dash
 const ready=p.dashCd<=0&&p.dashT<=0;
 cx.save();
 cx.fillStyle=pads.dash.down?"rgba(255,255,255,0.28)":"rgba(255,255,255,0.13)";
 cx.beginPath();cx.arc(dx,dy,R,0,TAU);cx.fill();
 cx.lineWidth=4;cx.strokeStyle=ready?"rgba(255,255,255,0.75)":"rgba(255,255,255,0.28)";
 cx.beginPath();cx.arc(dx,dy,R,0,TAU);cx.stroke();
 if(!ready){cx.lineWidth=5;cx.strokeStyle="rgba(120,220,255,0.85)";
  const fr=1-clamp(p.dashCd/ST.dashCd,0,1);
  cx.beginPath();cx.arc(dx,dy,R,-Math.PI/2,-Math.PI/2+TAU*fr);cx.stroke()}
 text("DASH",dx,dy+1,16,ready?"#fff":"rgba(255,255,255,0.5)");
 // fury
 const full=G.fury>=G.furyMax,fr=clamp(G.fury/G.furyMax,0,1);
 cx.fillStyle=full?hexA(G.hero.col,0.34):"rgba(255,255,255,0.10)";
 cx.beginPath();cx.arc(fx2,fy2,R,0,TAU);cx.fill();
 cx.lineWidth=4;cx.strokeStyle=full?hexA(G.hero.col,0.95):"rgba(255,255,255,0.22)";
 cx.beginPath();cx.arc(fx2,fy2,R,0,TAU);cx.stroke();
 cx.lineWidth=6;cx.strokeStyle=hexA(G.hero.col,0.9);
 cx.beginPath();cx.arc(fx2,fy2,R-1,-Math.PI/2,-Math.PI/2+TAU*fr);cx.stroke();
 if(full){cx.save();cx.globalAlpha=0.4+Math.sin(T*8)*0.25;
  glow(fx2,fy2,R*1.5,hexA(G.hero.col,0.8));cx.restore()}
 text("FURY",fx2,fy2+1,15,full?"#fff":"rgba(255,255,255,0.5)");
 cx.restore();
}

function drawShopLabels(){

function drawBanner(){

 if(banner.sub)textFit(banner.sub,W/2,y+sz*0.55,sz*0.47,"rgba(255,255,255,0.8)",W*0.9);

 textFit(toast.txt,W/2,base-toast.t*14,Math.min(24,W*0.055),toast.col,W*0.8);

function saveBest(){
 const b=store.get("best",{floor:0,gold:0,kills:0,wins:0});
 const f=G?(G.floorIdx+1):0;
 b.floor=Math.max(b.floor||0,scene==="won"?3:Math.min(3,f));
 b.gold=Math.max(b.gold||0,G?G.gold:0);
 b.kills=Math.max(b.kills||0,G?G.kills:0);
 if(scene==="won")b.wins=(b.wins||0)+1;
 store.set("best",b);
 if(G){const h=store.get("heroWins",{});if(scene==="won"){h[G.hero.id]=(h[G.hero.id]||0)+1;store.set("heroWins",h)}}
}
// ------------------------------------------------------------- title art
let embers=[];
function stepEmbers(dt){
 if(embers.length<(FX?42:14))embers.push({x:Math.random()*W,y:H+10,
  vy:-rnd(16,52),vx:rnd(-14,14),r:rnd(1.4,3.4),a:rnd(0.2,0.7),t:0,life:rnd(5,11)});
 for(let i=embers.length-1;i>=0;i--){const e=embers[i];e.t+=dt;
  e.x+=e.vx*dt+Math.sin(e.t*1.5)*8*dt;e.y+=e.vy*dt;
  if(e.t>e.life||e.y<-20)embers.splice(i,1)}}
function drawEmbers(){
 for(const e of embers){cx.globalAlpha=e.a*clamp(1-e.t/e.life,0,1);
  cx.fillStyle="#ff9a3a";cx.beginPath();cx.arc(e.x,e.y,e.r,0,TAU);cx.fill()}
 cx.globalAlpha=1}
function drawBackdrop(){
 const g=cx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#0c0812");g.addColorStop(0.55,"#150d18");g.addColorStop(1,"#080509");
 cx.fillStyle=g;cx.fillRect(0,0,W,H);
 if(FX){cx.save();cx.globalCompositeOperation="lighter";
  glow(W*0.18,H*0.82,W*0.4,"rgba(255,120,40,0.07)");
  glow(W*0.84,H*0.7,W*0.34,"rgba(140,90,255,0.06)");cx.restore()}
 drawEmbers();
}

 cx.restore();
 textFit("Three floors. One thumb. Do not stop moving.",W/2,cy+84,17,"rgba(255,255,255,0.72)",W*0.86);
 buttons=[];

 btn(W/2-bw/2,H*0.62,bw,64,"ENTER THE DUNGEON",()=>{scene="heroes"},

 const bw=Math.min(180,W*0.5);
 btn(W/2-bw/2,H-56-SAFE.b,bw,42,"BACK",()=>{scene="title"},{size:18});
 drawButtons();

 drawBackdrop();
 const b=store.get("best",{});
 textFit(won?"YOU GOT OUT":"YOU FELL",W/2,H*0.22,Math.min(52,W*0.12),won?"#ffd23f":"#ff5a6a",W*0.86);

 ];
 lines.forEach((l,i)=>textFit(l,W/2,H*0.44+i*30,19,"rgba(255,255,255,0.88)",W*0.8));

 btn(W/2-bw/2,H*0.72,bw,58,"GO AGAIN",()=>{scene="heroes"},
  {fill:"rgba(255,122,42,0.9)",stroke:"rgba(255,220,160,0.9)",size:22});
 btn(W/2-bw/2,H*0.72+70,bw,44,"TITLE",()=>{scene="title"},{size:18});

// ---------------------------------------------------------------- loop
function onKey(code){
 if(code==="Enter"||code==="Space"){
  if(scene==="title")scene="heroes";
  else if(scene==="dead"||scene==="won")scene="heroes"}
 if(code==="KeyM")musicToggle();
}
function step(dt){
 T+=dt;
 if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null}
 if(toast){toast.t+=dt;if(toast.t>1.6)toast=null}
 if(shakeT>0){shakeT-=dt;if(shakeT<=0)shakeMag=0}
 if(flashT>0)flashT-=dt;
 if(scene!=="play"){stepEmbers(dt);return}
 if(G.pendingRelics)return;
 if(hitStop>0){hitStop-=dt;return}
 G.time+=dt;
 stepPlayer(dt);
 stepEnemies(dt);
 stepBoss(dt);
 stepShots(dt);
 stepEnemyShots(dt);
 stepPicks(dt);
 stepFx(dt);
 // meteors from Dylan's fury land where they were marked
 for(const f of G.fx){if(f.meteor&&!f.hit&&f.t>=0){f.hit=true;
  splash(f.x,f.y,f.r,ST.dmg*1.7,null);SFX.kill();shake(6,0.2);
  ring(f.x,f.y,6,f.r,"rgba(255,150,60,0.6)",0.3);
  puff(f.x,f.y,FX?14:5,"#ff9a3a",280,0.45,6)}}
 camUpdate(dt);
 checkCleared();
}
function render(){
 cx.setTransform(DPR,0,0,DPR,0,0);
 if(scene==="title"){drawTitle();return}
 if(scene==="heroes"){drawHeroSelect();return}
 if(scene==="dead"){drawEnd(false);return}
 if(scene==="won"){drawEnd(true);return}
 const th=G.floor.theme;
 cx.fillStyle=th.fog;cx.fillRect(0,0,W,H);
 const sx=shakeT>0?rnd(-shakeMag,shakeMag)*Math.min(1,shakeT*4):0;
 const sy=shakeT>0?rnd(-shakeMag,shakeMag)*Math.min(1,shakeT*4):0;
 cx.setTransform(DPR*CAM.sc,0,0,DPR*CAM.sc,
  DPR*(W/2-CAM.x*CAM.sc+sx),DPR*(H/2-CAM.y*CAM.sc+sy));
 drawRoom();
 if(G.room.shop)drawShopLabels();
 cx.setTransform(DPR,0,0,DPR,0,0);
 buttons=[];
 drawHUD();
 // the floor banner would otherwise sit across the top of the relic cards
 if(!G.pendingRelics){drawBanner();drawToast()}
 if(G.pendingRelics)drawRelicChoice();
 if(flashT>0){cx.save();cx.globalAlpha=clamp(flashT*5,0,1);
  cx.fillStyle=flashCol;cx.fillRect(0,0,W,H);cx.restore()}
 if(G.p.hp<=1&&!G.p.dead){cx.save();cx.globalAlpha=0.22+Math.sin(T*5)*0.1;
  const gr=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.62);
  gr.addColorStop(0,"rgba(200,20,40,0)");gr.addColorStop(1,"rgba(200,20,40,1)");
  cx.fillStyle=gr;cx.fillRect(0,0,W,H);cx.restore()}
}
let last=0;
function frame(ts){
 requestAnimationFrame(frame);
 if(!last)last=ts;
 let dt=(ts-last)/1000;last=ts;
 if(dt>0.05)dt=0.05;
 if(dt<=0)dt=1/60;
 fxWatch(dt);
 step(dt);
 render();
}
function boot(){
 bakeTiles();bakeWalls();bakeProps();bakeRelicIcons();bakeWeapons();bakeEnemies();bakeBosses();bakeVignette();
 HEROES.forEach(h=>{ART.hero[h.id]=heroSprite(h.art)});
 musicOn=store.get("music",true)!==false;
 requestAnimationFrame(frame);
}
boot();
// A handle for the test harness: it can skip to a floor, drive a frame and
// read the state without a finger.
window.DD={
 get G(){return G},get scene(){return scene},set scene(v){scene=v},
 get fx(){return FX},set fx(v){FX=v?1:0},
 get safe(){return SAFE},get cam(){return CAM},
 HEROES,RELICS,ENEMIES,FLOORS,BOSSES,ART,
 start(id){newRun(id||"sophia");scene="play"},
 sim(t,d){const s=d||1/60;for(let i=0;i<Math.round(t/s);i++)step(s)},
 goto(type){if(!G)return null;
  const r=G.floor.rooms.find(x=>x.type===type);if(r)enterRoom(r,null);return r},
 floor(n){while(G.floorIdx<n)nextFloor()},
 give(id,n){for(let i=0;i<(n||1);i++)takeRelic(RELIC_BY_ID[id]);return G.relics},
 killAll(){G.ents.slice().forEach(e=>killEnemy(e));return G.room.cleared},
 stats(){return ST},
 map(){return MAPRECT},
 pads(){return padRects},
 bossBarY(){return BOSSBARY},
};
